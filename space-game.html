    showTuningScreen() {
        const w = this.cameras.main.width;
        const h = this.cameras.main.height;
        const centerX = w / 2;
        const centerY = h / 2;

        // Enlarge the panel to comfortably fit all tuning parameter rows,
        // a hint line, and the Back button without overlaps. Height scales
        // roughly with the number of parameters.
        const panelWidth = 780;
        const rowSpacing = 22;
        const paramCount = tuningParamsDefinition.length;
        const paramsBlockHeight = paramCount * rowSpacing;
        const panelHeight = paramsBlockHeight + 180; // title + hint + button margins

        const bg = this.add.rectangle(centerX, centerY, panelWidth, panelHeight, 0x000000, 0.9)
            .setScrollFactor(0)
            .setDepth(3000)
            .setStrokeStyle(2, 0x00ffff, 0.6);

        const titleY = centerY - panelHeight / 2 + 30;
        const title = this.add.text(centerX, titleY, 'Tuning Parameters', {
            fontSize: '26px',
            fill: '#0ff'
        }).setOrigin(0.5).setScrollFactor(0).setDepth(3001);

        const rowsStartY = titleY + 35;

        const paramRows = [];
        const sliderWidthPx = 300;

        tuningParamsDefinition.forEach((def, idx) => {
            const y = rowsStartY + idx * rowSpacing;

            const labelText = this.add.text(centerX - 370, y, def.label + ':', {
                fontSize: '14px',
                fill: '#0ff'
            }).setOrigin(0, 0.5).setScrollFactor(0).setDepth(3001);

            // Live value display, right-aligned just left of the slider.
            const valueText = this.add.text(centerX - 20, y, '', {
                fontSize: '14px',
                fill: '#0f0'
            }).setOrigin(1, 0.5).setScrollFactor(0).setDepth(3001);

            const initialValue = activeTuningParams[def.key];
            const stepAttr = (typeof def.step === 'number' && def.step > 0) ? def.step : 'any';

            // HTML range slider as a Phaser DOM element.
            const slider = this.add.dom(centerX + 150, y).createFromHTML(
                `<input type="range" min="${def.min}" max="${def.max}" step="${stepAttr}" value="${initialValue}" style="width:${sliderWidthPx}px; accent-color:#0ff;" />`
            );
            slider.setOrigin(0.5, 0.5).setScrollFactor(0).setDepth(3001);

            const sliderEl = slider.node && slider.node.querySelector('input');
            const commit = () => {
                if (!sliderEl) return;
                let v = parseFloat(sliderEl.value);
                if (Number.isNaN(v)) return;
                if (typeof def.min === 'number') v = Math.max(v, def.min);
                if (typeof def.max === 'number') v = Math.min(v, def.max);
                activeTuningParams[def.key] = v;
                valueText.setText(v.toFixed(def.decimals));
                saveTuningToStorage();
            };
            if (sliderEl) {
                sliderEl.addEventListener('input', commit);
                sliderEl.addEventListener('change', commit);
            }

            paramRows.push({ def, labelText, valueText, slider });
        });

        const updateValueTexts = () => {
            paramRows.forEach(entry => {
                const def = entry.def;
                const v = activeTuningParams[def.key];
                entry.valueText.setText(v.toFixed(def.decimals));
            });
        };
        updateValueTexts();

        const lastRow = paramRows[paramRows.length - 1];
        const lastRowY = lastRow ? lastRow.labelText.y : centerY;
        const hintY = lastRowY + 28;
        const backY = hintY + 40;

        const hint = this.add.text(
            centerX,
            hintY,
            'Drag a slider to live-update. Isp trades thrust for fuel economy (power-limited engine).',
            {
                fontSize: '13px',
                fill: '#ccc',
                align: 'center'
            }
        ).setOrigin(0.5).setScrollFactor(0).setDepth(3001);

        const makeButton = (label, y, handler) => {
            const btnBg = this.add.rectangle(centerX, y, 220, 36, 0x003344, 0.9)
                .setScrollFactor(0)
                .setDepth(3001)
                .setStrokeStyle(1, 0x00ffff, 0.5)
                .setInteractive({ useHandCursor: true });
            const btnText = this.add.text(centerX, y, label, {
                fontSize: '18px',
                fill: '#0ff'
            }).setOrigin(0.5).setScrollFactor(0).setDepth(3002);
            btnBg.on('pointerdown', handler);
            return { btnBg, btnText };
        };

        const btnBack = makeButton('Back to Menu', backY, () => {
            bg.destroy();
            title.destroy();
            hint.destroy();
            paramRows.forEach(p => {
                p.labelText.destroy();
                p.valueText.destroy();
                if (p.slider) p.slider.destroy();
            });
            btnBack.btnBg.destroy();
            btnBack.btnText.destroy();

            globalMode = 'MENU';
            experimentConfig.enabled = false;
            this.scene.restart();
        });
    }

    update(time, delta) {
        if (this.gameOver) return;
        // Keep instance mode in sync with global mode (except during TEST runs)
        if (!experimentConfig.enabled) {
            this.mode = globalMode;
        }
        
        // MANUAL-mode autopilot toggle removed: MANUAL play no longer runs
        // the slingshot planner, so there is no plan for the autopilot to
        // follow. Autopilot is now only active in AUTOPILOT / TEST modes.
        
        // Draw background
        this.drawBackground();
        
        // For AUTOPILOT and TEST modes, run the numerical slingshot sweep
        // first (if applicable), then enable and update autopilot.
        if (this.mode === 'AUTOPILOT' || this.mode === 'TEST') {
            this.updateSlingshotSweep(delta / 1000);
            // Enable autopilot only once the sweep has finished AND a viable
            // trajectory was found. If no massive objects are present the
            // sweep is never started (slingshotSweepFailed stays false), so
            // autopilot is enabled immediately and flies straight to Earth.
            if (this.slingshotSweepActive || this.slingshotSweepFailed) {
                this.autopilot.enabled = false;
            } else {
                this.autopilot.enabled = true;
            }
        }

        // Kick off star (mass) motion the moment the sweep is done in
        // AUTOPILOT / TEST modes, or immediately in MANUAL mode. This aligns
        // "star t=0" with "ship launch time", matching the sweep's
        // assumptions.
        if (!this.starMotionStarted && !this.slingshotSweepActive) {
            this.startStarMotion();
        }

        // Per-frame pairwise star-on-star gravity (N-body). No-op until
        // startStarMotion has run.
        this.updateStarGravity(delta);

        // Update autopilot (if enabled, it will override manual controls)
        if (this.autopilot.enabled) {
            this.autopilot.update(delta / 1000);
        }
        
        // Handle input (manual controls, ignored if autopilot active)
        if (!this.autopilot.enabled) {
            this.handleInput(delta);
        }
        
        // Apply gravity
        this.applyGravity(delta);
        
        // Update time
        this.updateTime(delta);
        
        // Redraw ship visuals aligned with physics body & angle
        this.drawShip();
        
        // Draw slingshot planning debug overlay (if any)
        this.drawSlingshotDebug();

        // Bottom-left trajectory minimap.
        this.drawMinimap();

        // Draw predicted free-fall trajectory ghost (thrust-free forecast).
        this.drawTrajectoryGhost();
        
        // Update gravity object glows
        this.gravityObjects.forEach(obj => {
            const glow = obj.getData('glow');
            if (glow) {
                glow.x = obj.x;
                glow.y = obj.y;
            }
        });
        
        // Update UI
        this.updateUI();
        
        // Update bullets
        this.updateBullets(delta);
    }

    drawShip() {
        if (!this.shipBody) return;
        this.shipBody.clear();

        // Move ship body to physics position
        this.shipBody.x = this.player.x;
        this.shipBody.y = this.player.y;

        // Main hull - pointed along +X
        this.shipBody.fillStyle(0x00ffff, 1);
        this.shipBody.beginPath();
        this.shipBody.moveTo(22, 0);      // nose
        this.shipBody.lineTo(-14, -9);    // rear top
        this.shipBody.lineTo(-14, 9);     // rear bottom
        this.shipBody.closePath();
        this.shipBody.fillPath();

        // Cockpit
        this.shipBody.fillStyle(0x0088aa, 1);
        this.shipBody.fillTriangle(0, -5, 0, 5, 8, 0);

        // Outline
        this.shipBody.lineStyle(2, 0xffffff, 1);
        this.shipBody.strokeTriangle(22, 0, -14, -9, -14, 9);

        // Engine glow
        this.shipBody.fillStyle(0xffaa00, 0.8);
        this.shipBody.fillEllipse(-18, 0, 6, 10);

        // Thrust flame when accelerating
        if (this.isThrusting) {
            this.shipBody.fillStyle(0xff6600, 1);
            this.shipBody.beginPath();
            this.shipBody.moveTo(-14, -7);
            this.shipBody.lineTo(-26, 0);
            this.shipBody.lineTo(-14, 7);
            this.shipBody.closePath();
            this.shipBody.fillPath();
        }

        // Side thruster flames (in ship-local frame before rotation)
        if (this.sideThrustLeft) {
            this.shipBody.fillStyle(0xffcc00, 1);
            this.shipBody.beginPath();
            this.shipBody.moveTo(-2, 9);
            this.shipBody.lineTo(-2, 15);
            this.shipBody.lineTo(4, 9);
            this.shipBody.closePath();
            this.shipBody.fillPath();
        }

        if (this.sideThrustRight) {
            this.shipBody.fillStyle(0xffcc00, 1);
            this.shipBody.beginPath();
            this.shipBody.moveTo(-2, -9);
            this.shipBody.lineTo(-2, -15);
            this.shipBody.lineTo(4, -9);
            this.shipBody.closePath();
            this.shipBody.fillPath();
        }

        // Apply rotation based on current ship angle
        this.shipBody.rotation = this.playerAngle;
    }

    drawBackground() {
        this.bg.clear();
        this.bgStars.forEach(star => {
            this.bg.fillStyle(0xffffff, star.alpha);
            this.bg.fillCircle(star.x, star.y, star.size);
        });
    }

    handleInput(delta) {
        const dt = delta / 1000;
        
        // Rotation
        const angularAccel = 4.0;
        if (this.cursors.left.isDown) {
            this.angularVelocity -= angularAccel * dt;
        }
        if (this.cursors.right.isDown) {
            this.angularVelocity += angularAccel * dt;
        }
        const maxAngularSpeed = 4.0;
        this.angularVelocity = Phaser.Math.Clamp(this.angularVelocity, -maxAngularSpeed, maxAngularSpeed);

        this.playerAngle += this.angularVelocity * dt;
        
        // Thrust (manual main engine) using the rocket equation with a
        // power-limited engine: F = 2 * P_jet / v_e at the current Isp.
        // Acceleration = F / m(t); fuel (propellant mass) burns at F / v_e.
        if (this.cursors.up.isDown && this.fuel > 0) {
            const F = currentMainThrustForce();
            const mass = currentShipMass(this);
            const accel = F / mass;
            const thrustX = Math.cos(this.playerAngle) * accel;
            const thrustY = Math.sin(this.playerAngle) * accel;
            this.player.body.setAcceleration(thrustX, thrustY);
            this.isThrusting = true;

            const vExhaust = currentExhaustVelocity();
            const fuelUse = F * dt / vExhaust;
            this.fuel = Math.max(0, this.fuel - fuelUse);
        } else {
            this.player.body.setAcceleration(0, 0);
            this.isThrusting = false;
        }
        
        // Shoot
        if (Phaser.Input.Keyboard.JustDown(this.spaceKey) && this.ammo > 0) {
            this.shoot();
        }
    }

    shoot() {
        const bulletX = this.player.x + Math.cos(this.playerAngle) * 25;
        const bulletY = this.player.y + Math.sin(this.playerAngle) * 25;
        
        const bullet = this.add.circle(bulletX, bulletY, 6, 0xffff00);
        bullet.setStrokeStyle(3, 0xffffff);
        
        const speed = 600;
        bullet.vx = Math.cos(this.playerAngle) * speed + this.player.body.velocity.x;
        bullet.vy = Math.sin(this.playerAngle) * speed + this.player.body.velocity.y;
        const bulletMass = 1;
        const shipMass = currentShipMass(this);
        const recoilFactor = bulletMass / shipMass;
        this.player.body.velocity.x -= Math.cos(this.playerAngle) * speed * recoilFactor;
        this.player.body.velocity.y -= Math.sin(this.playerAngle) * speed * recoilFactor;
        
        this.bullets.add(bullet);
        this.ammo -= 1;
        
        // Auto-destroy after 3 seconds
        this.time.delayedCall(3000, () => {
            if (bullet.active) bullet.destroy();
        });
    }

    applyGravity(delta) {
        // Gravity from stars / black holes
        this.gravityObjects.forEach(obj => {
            const dx = obj.x - this.player.x;
            const dy = obj.y - this.player.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            if (dist > 1) {
                const gravityStrength = obj.getData('gravityStrength');
                const schwarzschildRadius = obj.getData('schwarzschildRadius');
                
                let force = gravityStrength / (dist * dist);
                
                // Increase force dramatically when close
                if (dist < schwarzschildRadius) {
                }
                
                const forceX = (dx / dist) * force;
                const forceY = (dy / dist) * force;
                
                this.player.body.velocity.x += forceX * (delta / 1000);
                this.player.body.velocity.y += forceY * (delta / 1000);
            }
        });

        // Gravity pull from Earth to make capture/landing realistic and decisive
        if (this.earth) {
            const dxE = this.earth.x - this.player.x;
            const dyE = this.earth.y - this.player.y;
            const distE = Math.sqrt(dxE * dxE + dyE * dyE);
            if (distE > 1) {
                // Earth gravity strength scaled up by 5x to keep gravity strong
                // in the enlarged world while remaining weaker than the massive
                // star.
                const earthGravityStrength = 40000 * 5;
                const gE = earthGravityStrength / (distE * distE);
                const fxE = (dxE / distE) * gE;
                const fyE = (dyE / distE) * gE;
                this.player.body.velocity.x += fxE * (delta / 1000);
                this.player.body.velocity.y += fyE * (delta / 1000);
            }
        }
    }

    updateTime(delta) {
        let gravitationalPotential = 0;
        
        this.gravityObjects.forEach(obj => {
            const dx = obj.x - this.player.x;
            const dy = obj.y - this.player.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const mass = obj.getData('mass');
            const schwarzschildRadius = obj.getData('schwarzschildRadius');
            
            const potential = mass / Math.max(dist, schwarzschildRadius * 0.5);
            gravitationalPotential += potential;
        });
        
        // Clamp gravitational potential to avoid extreme values
        gravitationalPotential = Math.min(gravitationalPotential, 200000);
        let gravitationalDilation = 1 / Math.sqrt(1 + gravitationalPotential / 50000);
        if (!Number.isFinite(gravitationalDilation) || gravitationalDilation <= 0) {
            gravitationalDilation = 0.1;
        }
        
        const speed = Math.sqrt(
            this.player.body.velocity.x ** 2 + 
            this.player.body.velocity.y ** 2
        );
        const c = 800;
        let beta2 = (speed / c) * (speed / c);
        if (!Number.isFinite(beta2) || beta2 < 0) {
            beta2 = 0;
        }
        beta2 = Math.min(beta2, 0.99);
        const velocityDilation = Math.sqrt(1 - beta2);
        
        const timeDilation = Math.max(0.05, gravitationalDilation * velocityDilation);
        
        this.shipTime += (delta / 1000) * timeDilation;
        this.earthTime += delta / 1000;
    }

    updateUI() {
        const distToEarth = Phaser.Math.Distance.Between(
            this.player.x, this.player.y,
            this.earth.x, this.earth.y
        );

        // Compute radial/tangential velocity components relative to Earth
        const vx = this.player.body.velocity.x;
        const vy = this.player.body.velocity.y;
        const dx = this.player.x - this.earth.x;
        const dy = this.player.y - this.earth.y;

        let radialV = 0;
        let tangentialV = 0;
        if (distToEarth > 1e-3) {
            const rx = dx / distToEarth;
            const ry = dy / distToEarth;
            radialV = vx * rx + vy * ry;
            const vtX = vx - radialV * rx;
            const vtY = vy - radialV * ry;
            const tx = -ry;
            const ty = rx;
            tangentialV = vtX * tx + vtY * ty;
        }

        // Attitude error relative to Earthward (radial inward) direction
        const bearingToEarth = Math.atan2(
            this.earth.y - this.player.y,
            this.earth.x - this.player.x
        );
        const attitudeErrorRad = Phaser.Math.Angle.Wrap(bearingToEarth - this.playerAngle);
        const attitudeErrorDeg = Phaser.Math.RadToDeg(attitudeErrorRad);

        const lines = [
            `Fuel: ${Math.max(0, this.fuel).toFixed(1)}`,
            `Ammo: ${this.ammo}`,
            `Ship Time: ${this.shipTime.toFixed(1)}s`,
            `Earth Time: ${this.earthTime.toFixed(1)}s`,
            `Distance: ${distToEarth.toFixed(0)}`,
            `v_r: ${radialV.toFixed(2)}`,
            `v_tan: ${tangentialV.toFixed(2)}`,
            `AttitudeErr: ${attitudeErrorDeg.toFixed(1)}°`
        ];

        if (typeof bestEarthTime === 'number') {
            lines.push(`Best Earth Time: ${bestEarthTime.toFixed(1)}s`);
        } else {
            lines.push('Best Earth Time: --');
        }
        
        // Autopilot status
        if (this.autopilot.enabled) {
            lines.push(`Autopilot: ON [${this.autopilot.getPhaseString()}]`);
        } else {
            lines.push('Autopilot: OFF (Press A)');
        }

        this.statsText.setText(lines);

        // Clear HUD graphics before drawing overlays
        if (this.radar) {
            this.radar.clear();
        }

        // Draw autopilot control indicators
        if (this.autopilot.enabled) {
            this.drawAutopilotControls();
        }
        
        // Draw radar
        this.drawRadar();
    }
    
    drawAutopilotControls() {
        try {
            // Use cached control state from last update
            const control = this.autopilot.lastControl;
            if (!control || !this.radar) return;
            
            const indicatorX = 100;
            const indicatorY = 700;
            const arrowSize = 30;
            
            // Draw control panel background
            this.radar.fillStyle(0x000000, 0.5);
            this.radar.fillRect(indicatorX - 50, indicatorY - 50, 200, 100);
            this.radar.lineStyle(2, 0x00ffff, 1);
            this.radar.strokeRect(indicatorX - 50, indicatorY - 50, 200, 100);
            
            // Draw rotation arrows
            if (control.angularControl < -0.1) {
                // Left arrow (turning left)
                this.radar.fillStyle(0xffff00, 1);
                this.radar.fillTriangle(
                    indicatorX - arrowSize, indicatorY,
                    indicatorX, indicatorY - arrowSize/2,
                    indicatorX, indicatorY + arrowSize/2
                );
            } else if (control.angularControl > 0.1) {
                // Right arrow (turning right)
                this.radar.fillStyle(0xffff00, 1);
                this.radar.fillTriangle(
                    indicatorX + arrowSize, indicatorY,
                    indicatorX, indicatorY - arrowSize/2,
                    indicatorX, indicatorY + arrowSize/2
                );
            }
            
            // Draw thrust indicator
            if (control.thrust) {
                this.radar.fillStyle(0xff6600, 1);
                this.radar.fillTriangle(
                    indicatorX + 80, indicatorY - 20,
                    indicatorX + 80, indicatorY + 20,
                    indicatorX + 120, indicatorY
                );
            }
        } catch (error) {
            console.error('Error drawing autopilot controls:', error);
        }
    }

    drawRadar() {
        // Radar sits near the bottom-right corner of the current viewport so
        // it tracks the enlarged canvas without needing hard-coded offsets.
        const width = this.cameras.main.width;
        const height = this.cameras.main.height;
        const radarSize = 180;
        const radarRadius = radarSize / 2;
        const margin = 30;
        const radarX = width - radarRadius - margin;
        const radarY = height - radarRadius - margin;
        // Local radar range in world units: ~1.5x the larger screen dimension.
        const radarRange = 1.5 * Math.max(width, height);
        // World-to-radar scale factor (px per world-px).
        const worldToRadar = (radarRadius - 6) / radarRange;

        this.radar.clear();
        
        // Background
        this.radar.fillStyle(0x000000, 0.7);
        this.radar.fillCircle(radarX, radarY, radarRadius);
        
        // Border
        this.radar.lineStyle(2, 0x00ff00, 0.8);
        this.radar.strokeCircle(radarX, radarY, radarRadius);
        
        // Player (center)
        this.radar.fillStyle(0x00ffff, 1);
        this.radar.fillCircle(radarX, radarY, 4);

        const step = Math.PI / 18; // ~10 degrees
        const radiusEdge = radarRadius - 6;

        // Helper to draw a local radar marker. If `worldRadius` is provided,
        // the marker's radar-space radius is scaled from the object's true
        // world radius so that Earth and the star appear at their actual
        // sizes relative to the radar range. Otherwise a fixed dot size is
        // used for point-like targets (asteroids, pickups).
        const drawLocalMarker = (tx, ty, color, size = 4, worldRadius = null) => {
            const dx = tx - this.player.x;
            const dy = ty - this.player.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > radarRange) return; // Too far: not shown on local radar

            const angle = Math.atan2(dy, dx);
            const quantizedAngle = Math.round(angle / step) * step;
            // Map distance [0, radarRange] -> [0, radiusEdge]
            const r = (dist / radarRange) * radiusEdge;
            const mx = radarX + Math.cos(quantizedAngle) * r;
            const my = radarY + Math.sin(quantizedAngle) * r;
            this.radar.fillStyle(color, 1);
            let markerRadius = size;
            if (typeof worldRadius === 'number' && worldRadius > 0) {
                markerRadius = Math.max(1, worldRadius * worldToRadar);
            }
            this.radar.fillCircle(mx, my, markerRadius);
        };

        // Earth direction arrow (always same length, only angle matters)
        const dxEarth = this.earth.x - this.player.x;
        const dyEarth = this.earth.y - this.player.y;
        const distEarth = Math.sqrt(dxEarth * dxEarth + dyEarth * dyEarth);
        const angleToEarth = Math.atan2(dyEarth, dxEarth);
        const quantizedAngle = Math.round(angleToEarth / step) * step;

        // Local Earth marker when within radar range: size scales with the
        // real Earth radius (400 px world = 80 * 5, from createEarth).
        if (distEarth <= radarRange) {
            const earthWorldRadius = (this.earth && this.earth.radius) || (80 * 5);
            drawLocalMarker(this.earth.x, this.earth.y, 0x0088ff, 5, earthWorldRadius);
        }

        // Earth marker: global direction only (not distance-limited)
        if (distEarth > radarRange) {
            this.radar.lineStyle(3, 0x00aaff, 0.6);
            this.radar.lineBetween(
                radarX,
                radarY,
                radarX + Math.cos(quantizedAngle) * radiusEdge,
                radarY + Math.sin(quantizedAngle) * radiusEdge
            );
            const earthMarkerX = radarX + Math.cos(quantizedAngle) * radiusEdge;
            const earthMarkerY = radarY + Math.sin(quantizedAngle) * radiusEdge;
            this.radar.fillStyle(0x00aaff, 1);
            this.radar.fillCircle(earthMarkerX, earthMarkerY, 4);
        }

        // Gravity objects (stars / black holes): size scales with the true
        // world radius so the star appears at its actual size on the radar.
        this.gravityObjects.forEach(obj => {
            const isStar = obj.getData('isStar');
            const color = isStar ? 0xffff00 : 0xaa00ff;
            const worldR = (typeof obj.radius === 'number' && obj.radius > 0)
                ? obj.radius
                : null;
            drawLocalMarker(obj.x, obj.y, color, 3, worldR);
        });

        // Asteroids
        this.asteroids.children.entries.forEach(asteroid => {
            if (!asteroid.active) return;
            drawLocalMarker(asteroid.x, asteroid.y, 0xaaaaaa, 2);
        });

        // Fuel pickups
        this.fuelPickups.children.entries.forEach(fuel => {
            if (!fuel.active) return;
            drawLocalMarker(fuel.x, fuel.y, 0x00ff00, 3);
        });

        // Ammo pickups
        this.ammoPickups.children.entries.forEach(ammo => {
            if (!ammo.active) return;
            drawLocalMarker(ammo.x, ammo.y, 0xff6600, 3);
        });
    }

    updateBullets(delta) {
        const dt = delta / 1000;
        this.bullets.children.entries.forEach(bullet => {
            if (!bullet || !bullet.active) return;

            // Integrate bullet motion manually
            if (typeof bullet.vx === 'number' && typeof bullet.vy === 'number') {
                bullet.x += bullet.vx * dt;
                bullet.y += bullet.vy * dt;
            }
            
            // Check asteroid collisions
            this.asteroids.children.entries.forEach(asteroid => {
                if (!asteroid || !asteroid.active) return;
                
                const dist = Phaser.Math.Distance.Between(
                    bullet.x, bullet.y,
                    asteroid.x, asteroid.y
                );
                
                if (dist < asteroid.body.radius + 5) {
                    bullet.destroy();
                    asteroid.destroy();
                }
            });
            
            // Destroy if out of bounds
            if (bullet.x < 0 || bullet.x > this.worldWidth || 
                bullet.y < 0 || bullet.y > this.worldHeight) {
                bullet.destroy();
            }
        });
    }

    collectFuel(player, fuel) {
        fuel.destroy();
        this.fuel = Math.min(this.fuel + 30, 100);
    }

    collectAmmo(player, ammo) {
        ammo.destroy();
        this.ammo = Math.min(this.ammo + 20, 50);
    }

    loseGame() {
        if (this.gameOver) return;
        this.gameOver = true;

        // Record experiment failure if enabled
        if (experimentConfig.enabled && !experimentConfig.finished) {
            const idx = experimentConfig.angleIndex;
            experimentConfig.attempts[idx]++;
            // Show a quick failure indicator for TEST runs
            const cam = this.cameras.main;
            const failText = this.add.text(cam.width / 2, cam.height / 2, '✗', {
                fontSize: '72px',
                fill: '#f00'
            }).setOrigin(0.5).setScrollFactor(0).setDepth(2500);
            this.tweens.add({
                targets: failText,
                alpha: 0,
                duration: 250,
                onComplete: () => failText.destroy()
            });
            this.advanceExperimentTrial();
            return;
        }

        this.player.body.setVelocity(0, 0);
        
        const msg = this.add.text(600, 400, 'COLLISION!\n\nPress R to Restart', {
            fontSize: '48px',
            fill: '#f00',
            align: 'center',
            backgroundColor: '#000c',
            padding: { x: 20, y: 10 }
        }).setOrigin(0.5).setScrollFactor(0).setDepth(2000);
        
        const restartKey = this.input.keyboard.addKey('R');
        restartKey.once('down', () => {
            this.scene.restart();
        });

        this.showRetryPanel();
    }

    winGame() {
        if (this.gameOver) return;
        const vx = this.player.body.velocity.x;
        const vy = this.player.body.velocity.y;
        const speed = Math.sqrt(vx * vx + vy * vy);

        const angleToEarth = Math.atan2(
            this.earth.y - this.player.y,
            this.earth.x - this.player.x
        );
        const thrusterAngle = this.playerAngle + Math.PI;
        let angleDiff = Phaser.Math.Angle.Wrap(thrusterAngle - angleToEarth);
        angleDiff = Math.abs(angleDiff);

        const maxLandingSpeed = 100;
        const maxLandingAngle = Phaser.Math.DegToRad(10);

        if (speed > maxLandingSpeed || angleDiff > maxLandingAngle) {
            this.loseGame();
            return;
        }

        this.gameOver = true;

        // Record experiment success if enabled
        if (experimentConfig.enabled && !experimentConfig.finished) {
            const idx = experimentConfig.angleIndex;
            experimentConfig.attempts[idx]++;
            experimentConfig.successes[idx]++;
            // Show a quick success indicator for TEST runs
            const cam = this.cameras.main;
            const successText = this.add.text(cam.width / 2, cam.height / 2, '✓', {
                fontSize: '72px',
                fill: '#0f0'
            }).setOrigin(0.5).setScrollFactor(0).setDepth(2500);
            this.tweens.add({
                targets: successText,
                alpha: 0,
                duration: 250,
                onComplete: () => successText.destroy()
            });
            this.advanceExperimentTrial();
            return;
        }
        
        this.player.body.setVelocity(0, 0);
        
        const timeLost = this.earthTime - this.shipTime;

        let isNewBest = false;
        if (bestEarthTime === null || this.earthTime < bestEarthTime) {
            bestEarthTime = this.earthTime;
            isNewBest = true;
        }

        let bestLine = '';
        if (typeof bestEarthTime === 'number') {
            bestLine = `Best Earth Time: ${bestEarthTime.toFixed(1)}s`;
            if (isNewBest) {
                bestLine += ' (NEW RECORD)';
            }
        }

        const messageLines = [
            `EARTH REACHED!`,
            '',
            `Earth Time: ${this.earthTime.toFixed(1)}s`,
            `Ship Time: ${this.shipTime.toFixed(1)}s`,
            `Time Lost: ${timeLost.toFixed(1)}s`
        ];
        if (bestLine) {
            messageLines.push('', bestLine);
        }
        messageLines.push('', 'Press R to Restart');

        const msg = this.add.text(600, 400, messageLines.join('\n'), {
            fontSize: '32px',
            fill: '#0f0',
            align: 'center',
            backgroundColor: '#000c',
            padding: { x: 20, y: 10 }
        }).setOrigin(0.5).setScrollFactor(0).setDepth(2000);
        
        const restartKey = this.input.keyboard.addKey('R');
        restartKey.once('down', () => {
            this.scene.restart();
        });

        this.showRetryPanel();
    }

    showRetryPanel() {
        // Top-right overlay panel with two retry buttons. Kept separate from
        // the existing end-game message so both can coexist. Hidden during
        // TEST/experiment runs (they auto-advance).
        const cam = this.cameras.main;
        const pad = 12;
        const pw = 200;
        const ph = 110;
        const px = cam.width - pw - pad;
        const py = pad;

        const panel = this.add.graphics()
            .setScrollFactor(0)
            .setDepth(2100);
        panel.fillStyle(0x000000, 0.7);
        panel.fillRect(px, py, pw, ph);
        panel.lineStyle(1, 0x888888, 1.0);
        panel.strokeRect(px, py, pw, ph);

        this.add.text(px + pw / 2, py + 12, 'Run Complete', {
            fontSize: '14px',
            fill: '#ffffff',
            fontStyle: 'bold'
        }).setOrigin(0.5, 0).setScrollFactor(0).setDepth(2101);

        const makeButton = (label, cy, onClick) => {
            const bw = pw - 20;
            const bh = 28;
            const bx = px + 10;
            const by = py + cy;
            const bg = this.add.graphics()
                .setScrollFactor(0)
                .setDepth(2101);
            const draw = (color) => {
                bg.clear();
                bg.fillStyle(color, 1.0);
                bg.fillRect(bx, by, bw, bh);
                bg.lineStyle(1, 0xffffff, 1.0);
                bg.strokeRect(bx, by, bw, bh);
            };
            draw(0x2255aa);
            const txt = this.add.text(bx + bw / 2, by + bh / 2, label, {
                fontSize: '13px',
                fill: '#ffffff'
            }).setOrigin(0.5).setScrollFactor(0).setDepth(2102);
            // Hit-area zone for input.
            const zone = this.add.zone(bx, by, bw, bh)
                .setOrigin(0, 0)
                .setScrollFactor(0)
                .setDepth(2103)
                .setInteractive({ useHandCursor: true });
            zone.on('pointerover', () => draw(0x3377cc));
            zone.on('pointerout',  () => draw(0x2255aa));
            zone.on('pointerdown', () => draw(0x1a4488));
            zone.on('pointerup',   () => { draw(0x2255aa); onClick(); });
        };

        makeButton('Retry Same Seed', 38, () => {
            this.replayRequested = true;
            this.scene.restart();
        });
        makeButton('New Seed', 72, () => {
            this.replayRequested = false;
            this.worldSnapshot = null;
            this.scene.restart();
        });
    }

    advanceExperimentTrial() {
        const angles = experimentConfig.anglesDeg;
        const trialsPerAngle = experimentConfig.trialsPerAngle;

        experimentConfig.trialIndex++;
        if (experimentConfig.trialIndex >= trialsPerAngle) {
            experimentConfig.trialIndex = 0;
            experimentConfig.angleIndex++;
        }

        if (experimentConfig.angleIndex >= angles.length) {
            experimentConfig.finished = true;
            this.showExperimentResults();
            return;
        }

        this.scene.restart();
    }

    showExperimentResults() {
        const lines = ['Experiment results (success rate vs angle):'];
        for (let i = 0; i < experimentConfig.anglesDeg.length; i++) {
            const angle = experimentConfig.anglesDeg[i];
            const attempts = experimentConfig.attempts[i];
            const successes = experimentConfig.successes[i];
            const rate = attempts > 0 ? (successes / attempts) : 0;
            lines.push(
                `${angle.toFixed(0)}°: ${successes}/${attempts} ` +
                `(${(rate * 100).toFixed(0)}%)`
            );
        }

        // Overall success statistics
        let totalAttempts = 0;
        let totalSuccesses = 0;
        for (let i = 0; i < experimentConfig.anglesDeg.length; i++) {
            totalAttempts += experimentConfig.attempts[i];
            totalSuccesses += experimentConfig.successes[i];
        }
        const overallRate = totalAttempts > 0 ? (totalSuccesses / totalAttempts) : 0;
        const overallPercent = (overallRate * 100).toFixed(1);

        lines.push('');
        lines.push(`Overall: ${totalSuccesses}/${totalAttempts} (${overallPercent}%)`);
        if (lastAdoptedSuccessRate !== null) {
            const lastPercent = (lastAdoptedSuccessRate * 100).toFixed(1);
            lines.push(`Previous adopted success: ${lastPercent}%`);
        } else {
            lines.push('Previous adopted success: (none)');
        }
        lines.push('');
        lines.push('Adopt new parameters for Autopilot/Manual?');

        const text = this.add.text(600, 300, lines.join('\n'), {
            fontSize: '18px',
            fill: '#0f0',
            align: 'left',
            backgroundColor: '#000c',
            padding: { x: 20, y: 10 }
        }).setOrigin(0.5).setScrollFactor(0).setDepth(2000);

        const makeButton = (label, offsetX, handler) => {
            const btnBg = this.add.rectangle(600 + offsetX, 520, 140, 40, 0x003344, 0.9)
                .setScrollFactor(0)
                .setDepth(2001)
                .setInteractive({ useHandCursor: true });
            const btnText = this.add.text(600 + offsetX, 520, label, {
                fontSize: '18px',
                fill: '#0ff'
            }).setOrigin(0.5).setScrollFactor(0).setDepth(2002);
            btnBg.on('pointerdown', handler);
            return { btnBg, btnText };
        };

        const adoptBtn = makeButton('Adopt', -90, () => {
            defaultTuningParams = cloneTuningParams(activeTuningParams);
            lastAdoptedSuccessRate = overallRate;
            text.destroy();
            adoptBtn.btnBg.destroy();
            adoptBtn.btnText.destroy();
            keepBtn.btnBg.destroy();
            keepBtn.btnText.destroy();
            saveTuningToStorage();
            globalMode = 'MENU';
            experimentConfig.enabled = false;
            this.scene.restart();
        });

        const keepBtn = makeButton('Keep', 90, () => {
            text.destroy();
            adoptBtn.btnBg.destroy();
            adoptBtn.btnText.destroy();
            keepBtn.btnBg.destroy();
            keepBtn.btnText.destroy();
            globalMode = 'MENU';
            experimentConfig.enabled = false;
            this.scene.restart();
        });
    }
}

const config = {
    type: Phaser.AUTO,
    width: 1800,
    height: 1200,
    parent: 'game-container',
    backgroundColor: '#000814',
    dom: {
        createContainer: true
    },
    physics: {
        default: 'arcade',
        arcade: {
            gravity: { y: 0 },
            debug: false
        }
    },
    scene: [GameScene]
};

const game = new Phaser.Game(config);
console.log('Game initialized');
    </script>
</body>
</html>

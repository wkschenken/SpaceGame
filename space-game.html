    showTuningScreen() {
        const w = this.cameras.main.width;
        const h = this.cameras.main.height;
        const centerX = w / 2;
        const centerY = h / 2;

        // Enlarge the panel to comfortably fit all tuning parameter rows,
        // a hint line, and the Back button without overlaps. Height scales
        // roughly with the number of parameters.
        const panelWidth = 780;
        const rowSpacing = 22;
        const paramCount = tuningParamsDefinition.length;
        const paramsBlockHeight = paramCount * rowSpacing;
        const panelHeight = paramsBlockHeight + 180; // title + hint + button margins

        const bg = this.add.rectangle(centerX, centerY, panelWidth, panelHeight, 0x000000, 0.9)
            .setScrollFactor(0)
            .setDepth(3000)
            .setStrokeStyle(2, 0x00ffff, 0.6);

        const titleY = centerY - panelHeight / 2 + 30;
        const title = this.add.text(centerX, titleY, 'Tuning Parameters', {
            fontSize: '26px',
            fill: '#0ff'
        }).setOrigin(0.5).setScrollFactor(0).setDepth(3001);

        const rowsStartY = titleY + 35;

        const paramRows = [];
        const sliderWidthPx = 300;

        tuningParamsDefinition.forEach((def, idx) => {
            const y = rowsStartY + idx * rowSpacing;

            const labelText = this.add.text(centerX - 370, y, def.label + ':', {
                fontSize: '14px',
                fill: '#0ff'
            }).setOrigin(0, 0.5).setScrollFactor(0).setDepth(3001);

            // Live value display, right-aligned just left of the slider.
            const valueText = this.add.text(centerX - 20, y, '', {
                fontSize: '14px',
                fill: '#0f0'
            }).setOrigin(1, 0.5).setScrollFactor(0).setDepth(3001);

            const initialValue = activeTuningParams[def.key];
            const stepAttr = (typeof def.step === 'number' && def.step > 0) ? def.step : 'any';

            // HTML range slider as a Phaser DOM element.
            const slider = this.add.dom(centerX + 150, y).createFromHTML(
                `<input type="range" min="${def.min}" max="${def.max}" step="${stepAttr}" value="${initialValue}" style="width:${sliderWidthPx}px; accent-color:#0ff;" />`
            );
            slider.setOrigin(0.5, 0.5).setScrollFactor(0).setDepth(3001);

            const sliderEl = slider.node && slider.node.querySelector('input');
            const commit = () => {
                if (!sliderEl) return;
                let v = parseFloat(sliderEl.value);
                if (Number.isNaN(v)) return;
                if (typeof def.min === 'number') v = Math.max(v, def.min);
                if (typeof def.max === 'number') v = Math.min(v, def.max);
                activeTuningParams[def.key] = v;
                valueText.setText(v.toFixed(def.decimals));
                saveTuningToStorage();
            };
            if (sliderEl) {
                sliderEl.addEventListener('input', commit);
                sliderEl.addEventListener('change', commit);
            }

            paramRows.push({ def, labelText, valueText, slider });
        });

        const updateValueTexts = () => {
            paramRows.forEach(entry => {
                const def = entry.def;
                const v = activeTuningParams[def.key];
                entry.valueText.setText(v.toFixed(def.decimals));
            });
        };
        updateValueTexts();

        const lastRow = paramRows[paramRows.length - 1];
        const lastRowY = lastRow ? lastRow.labelText.y : centerY;
        const hintY = lastRowY + 28;
        const backY = hintY + 40;

        const hint = this.add.text(
            centerX,
            hintY,
            'Drag a slider to live-update. Isp trades thrust for fuel economy (power-limited engine).',
            {
                fontSize: '13px',
                fill: '#ccc',
                align: 'center'
            }
        ).setOrigin(0.5).setScrollFactor(0).setDepth(3001);

        const makeButton = (label, y, handler) => {
            const btnBg = this.add.rectangle(centerX, y, 220, 36, 0x003344, 0.9)
                .setScrollFactor(0)
                .setDepth(3001)
                .setStrokeStyle(1, 0x00ffff, 0.5)
                .setInteractive({ useHandCursor: true });
            const btnText = this.add.text(centerX, y, label, {
                fontSize: '18px',
                fill: '#0ff'
            }).setOrigin(0.5).setScrollFactor(0).setDepth(3002);
            btnBg.on('pointerdown', handler);
            return { btnBg, btnText };
        };

        const btnBack = makeButton('Back to Menu', backY, () => {
            bg.destroy();
            title.destroy();
            hint.destroy();
            paramRows.forEach(p => {
                p.labelText.destroy();
                p.valueText.destroy();
                if (p.slider) p.slider.destroy();
            });
            btnBack.btnBg.destroy();
            btnBack.btnText.destroy();

            globalMode = 'MENU';
            experimentConfig.enabled = false;
            this.scene.restart();
        });
    }

    update(time, delta) {
        if (this.gameOver) return;
        // Keep instance mode in sync with global mode (except during TEST runs)
        if (!experimentConfig.enabled) {
            this.mode = globalMode;
        }
        
        // MANUAL-mode autopilot toggle removed: MANUAL play no longer runs
        // the slingshot planner, so there is no plan for the autopilot to
        // follow. Autopilot is now only active in AUTOPILOT / TEST modes.
        
        // Background starfield is rendered once at scene setup and left
        // untouched thereafter (bgStars are screen-fixed and non-animated).
        
        // For AUTOPILOT / TEST / COMPARE modes, run the numerical slingshot
        // sweep first (if applicable), then enable and update autopilot.
        if (this.mode === 'AUTOPILOT' || this.mode === 'TEST' || this.mode === 'COMPARE') {
            this.updateSlingshotSweep(delta / 1000);
            // Enable autopilot only once the sweep has finished AND a viable
            // trajectory was found. If no massive objects are present the
            // sweep is never started (slingshotSweepFailed stays false), so
            // autopilot is enabled immediately and flies straight to Earth.
            if (this.slingshotSweepActive || this.slingshotSweepFailed) {
                this.autopilot.enabled = false;
            } else {
                this.autopilot.enabled = true;
            }
        }

        // Kick off star (mass) motion the moment the sweep is done in
        // AUTOPILOT / TEST modes, or immediately in MANUAL mode. This aligns
        // "star t=0" with "ship launch time", matching the sweep's
        // assumptions.
        if (!this.starMotionStarted && !this.slingshotSweepActive) {
            this.startStarMotion();
        }

        // Per-frame pairwise star-on-star gravity (N-body). No-op until
        // startStarMotion has run.
        this.updateStarGravity(delta);

        // Update autopilot (if enabled, it will override manual controls)
        if (this.autopilot.enabled) {
            this.autopilot.update(delta / 1000);
        }
        
        // Handle input (manual controls, ignored if autopilot active)
        if (!this.autopilot.enabled) {
            this.handleInput(delta);
        }
        
        // Apply gravity
        this.applyGravity(delta);
        
        // Update time
        this.updateTime(delta);
        
        // Redraw ship visuals aligned with physics body & angle
        this.drawShip();
        
        // Draw slingshot planning debug overlay (if any)
        this.drawSlingshotDebug();

        // Bottom-left trajectory minimap.
        // Relativistic background re-render (aberration + Doppler shift by
        // current ship velocity). Static when the ship is stationary.
        this.drawBackground();

        this.drawMinimap();

        // Draw predicted free-fall trajectory ghost (thrust-free forecast).
        this.drawTrajectoryGhost();
        
        // Update gravity-object visual effects each frame: move each star's
        // sprite with its body, then redraw the additive-blend corona with
        // three layers of jitter'd prominences, a shimmering Einstein-ring
        // annulus at ~1.6R, and six radial flame tongues.
        const tNow = this.time.now * 0.001;
        this.gravityObjects.forEach(obj => {
            const sprite = obj.getData('sprite');
            if (sprite) {
                sprite.x = obj.x;
                sprite.y = obj.y;
            }
            // Black holes take a different overlay: a rotating asymmetric
            // brightness arc on the accretion disk (Doppler-beaming hint),
            // rather than the star corona / flame tongues.
            if (obj.getData('isBlackHole')) {
                const overlay = obj.getData('accretionOverlay');
                if (!overlay) return;
                overlay.clear();
                overlay.setPosition(obj.x, obj.y);
                const Rbh = obj.radius || 280;
                const bhSeed = obj.getData('accretionSeed') || 0;
                const spin = tNow * 0.8 + bhSeed;
                // Draw a series of short bright arc segments along the disk,
                // brightest on the "approaching" side of the rotation.
                const segments = 24;
                const rInner = Rbh * 1.05;
                const rOuter = Rbh * 2.2;
                for (let k = 0; k < segments; k++) {
                    const a0 = (k / segments) * Math.PI * 2 + spin;
                    // Beaming: cosine of angle relative to the +x tangent
                    // yields a bright half and a dim half.
                    const beam = 0.5 + 0.5 * Math.cos(a0);
                    const alpha = 0.05 + 0.35 * Math.pow(beam, 3);
                    const rMid = rInner + (rOuter - rInner) * (0.15 + 0.35 * beam);
                    const x1 = Math.cos(a0) * rMid;
                    // Squish vertically to match the inclined-disk texture.
                    const y1 = Math.sin(a0) * rMid * 0.55;
                    overlay.fillStyle(0xffcc66, alpha);
                    overlay.fillCircle(x1, y1, Math.max(2, Rbh * 0.08));
                }
                // Thin bright shimmer on the photon sphere.
                const phShim = 0.4 + 0.25 * Math.sin(tNow * 3.0 + bhSeed);
                overlay.lineStyle(Math.max(1, Rbh * 0.02), 0xffffff, phShim);
                overlay.strokeCircle(0, 0, Rbh * 1.02);
                return;
            }

            const corona = obj.getData('corona');
            if (!corona) return;
            corona.clear();
            corona.setPosition(obj.x, obj.y);
            const R = obj.radius || 700;
            const seed = obj.getData('coronaSeed') || 0;

            // Three concentric prominence layers, additive.
            for (let k = 0; k < 3; k++) {
                const phase = tNow * (0.7 + k * 0.4) + seed;
                const rr = R * (1.02 + 0.10 * (k + 1) / 3 + 0.02 * Math.sin(phase));
                const a = 0.10 * (1 - k / 3) + 0.03 * Math.sin(phase * 1.3);
                corona.fillStyle(0xff8833, Math.max(0.02, a));
                corona.fillCircle(0, 0, rr);
            }

            // Bright thin Einstein-ring shimmer at ~1.6R.
            const shimmer = 0.55 + 0.15 * Math.sin(tNow * 2.0 + seed);
            corona.lineStyle(Math.max(1, R * 0.03), 0xffe0a0, shimmer);
            corona.strokeCircle(0, 0, R * 1.6);

            // Six radial flame tongues extending from the limb.
            for (let k = 0; k < 6; k++) {
                const ang = (k / 6) * Math.PI * 2 + tNow * 0.15 + seed;
                const cosA = Math.cos(ang);
                const sinA = Math.sin(ang);
                const x1 = cosA * R * 1.02;
                const y1 = sinA * R * 1.02;
                const flameLen = R * (0.20 + 0.15 * Math.sin(tNow * 1.5 + seed + k));
                const x2 = cosA * (R * 1.02 + flameLen);
                const y2 = sinA * (R * 1.02 + flameLen);
                corona.lineStyle(
                    Math.max(2, R * 0.05),
                    0xffaa44,
                    0.35 + 0.15 * Math.sin(tNow * 2 + seed + k)
                );
                corona.beginPath();
                corona.moveTo(x1, y1);
                corona.lineTo(x2, y2);
                corona.strokePath();
            }
        });
        
        // Update UI
        this.updateUI();
        
        // Update bullets
        this.updateBullets(delta);
    }

    drawShip() {
        if (!this.shipBody) return;
        this.shipBody.clear();

        // Move ship body to physics position
        this.shipBody.x = this.player.x;
        this.shipBody.y = this.player.y;

        // Main hull - pointed along +X
        this.shipBody.fillStyle(0x00ffff, 1);
        this.shipBody.beginPath();
        this.shipBody.moveTo(22, 0);      // nose
        this.shipBody.lineTo(-14, -9);    // rear top
        this.shipBody.lineTo(-14, 9);     // rear bottom
        this.shipBody.closePath();
        this.shipBody.fillPath();

        // Cockpit
        this.shipBody.fillStyle(0x0088aa, 1);
        this.shipBody.fillTriangle(0, -5, 0, 5, 8, 0);

        // Outline
        this.shipBody.lineStyle(2, 0xffffff, 1);
        this.shipBody.strokeTriangle(22, 0, -14, -9, -14, 9);

        // Engine glow
        this.shipBody.fillStyle(0xffaa00, 0.8);
        this.shipBody.fillEllipse(-18, 0, 6, 10);

        // Thrust flame when accelerating
        if (this.isThrusting) {
            this.shipBody.fillStyle(0xff6600, 1);
            this.shipBody.beginPath();
            this.shipBody.moveTo(-14, -7);
            this.shipBody.lineTo(-26, 0);
            this.shipBody.lineTo(-14, 7);
            this.shipBody.closePath();
            this.shipBody.fillPath();
        }

        // Side thruster flames (in ship-local frame before rotation)
        if (this.sideThrustLeft) {
            this.shipBody.fillStyle(0xffcc00, 1);
            this.shipBody.beginPath();
            this.shipBody.moveTo(-2, 9);
            this.shipBody.lineTo(-2, 15);
            this.shipBody.lineTo(4, 9);
            this.shipBody.closePath();
            this.shipBody.fillPath();
        }

        if (this.sideThrustRight) {
            this.shipBody.fillStyle(0xffcc00, 1);
            this.shipBody.beginPath();
            this.shipBody.moveTo(-2, -9);
            this.shipBody.lineTo(-2, -15);
            this.shipBody.lineTo(4, -9);
            this.shipBody.closePath();
            this.shipBody.fillPath();
        }

        // Apply rotation based on current ship angle
        this.shipBody.rotation = this.playerAngle;
    }

    drawBackground() {
        // Per-frame render with relativistic aberration and Doppler shift:
        // when the ship is moving, background stars appear compressed toward
        // the direction of motion (aberration / "headlight effect") and are
        // color-shifted by the observer's velocity (blueshift ahead, redshift
        // behind, plus intensity beaming). At beta ~= 0 the render reduces
        // to the original static starfield.
        this.bg.clear();

        // Read ship velocity to derive beta and the velocity direction (v_hat).
        let vx = 0, vy = 0;
        if (this.player && this.player.body) {
            vx = this.player.body.velocity.x;
            vy = this.player.body.velocity.y;
        }
        const speed = Math.sqrt(vx * vx + vy * vy);
        const cLight = 400;                             // must match updateTime
        let beta = Math.min(0.995, speed / cLight);
        if (!Number.isFinite(beta) || beta < 0) beta = 0;
        const gamma = 1 / Math.sqrt(Math.max(1e-6, 1 - beta * beta));
        const oneMinusBeta2Sqrt = Math.sqrt(1 - beta * beta);
        const vHatX = speed > 1e-6 ? vx / speed : 1;
        const vHatY = speed > 1e-6 ? vy / speed : 0;

        const camW = this.cameras.main.width;
        const camH = this.cameras.main.height;
        const cx = camW / 2, cy = camH / 2;

        // 2D relativistic aberration: transform a rest-frame unit direction
        // (from ship to star) into the moving-observer frame. Star angular
        // positions get pulled toward v_hat (Terrell rotation in 2D).
        //   u'_parallel      = (u_par + beta) / (1 + beta * u_par)
        //   u'_perp          = u_perp * sqrt(1 - beta^2) / (1 + beta * u_par)
        // Doppler factor (blueshift forward, redshift behind):
        //   D = gamma * (1 + beta * u'_par)
        const aberrate = (px, py) => {
            const dx = px - cx;
            const dy = py - cy;
            const r = Math.sqrt(dx * dx + dy * dy);
            if (r < 1e-6 || beta < 1e-4) {
                return { x: px, y: py, D: 1 };
            }
            const ux = dx / r;
            const uy = dy / r;
            // Decompose into v_hat parallel + perpendicular components.
            const uPar = ux * vHatX + uy * vHatY;
            const perpX = ux - uPar * vHatX;
            const perpY = uy - uPar * vHatY;
            const denom = 1 + beta * uPar;
            const uParNew = (uPar + beta) / denom;
            const scalePerp = oneMinusBeta2Sqrt / denom;
            const uxNew = uParNew * vHatX + perpX * scalePerp;
            const uyNew = uParNew * vHatY + perpY * scalePerp;
            // Reconstruct screen position at the same radial distance from
            // screen center (a reasonable simplification for a 2D projection).
            const D = gamma * (1 + beta * uParNew);
            return { x: cx + uxNew * r, y: cy + uyNew * r, D };
        };

        // Nebula clouds (behind stars). Aberrated but not Doppler-tinted:
        // gas clouds are broad-spectrum and would washing-out any tint.
        for (const n of this.bgNebulas) {
            const ab = aberrate(n.x, n.y);
            for (let ring = 3; ring >= 1; ring--) {
                const rr = n.r * (ring / 3);
                const a = n.alpha * (ring === 1 ? 1.5 : (ring === 2 ? 0.8 : 0.35));
                const c = (ring === 1) ? n.colorInner : n.colorOuter;
                this.bg.fillStyle(c, a);
                this.bg.fillCircle(ab.x, ab.y, rr);
            }
        }

        // Bg stars: aberrated positions, Doppler-tinted colors and intensities.
        for (const star of this.bgStars) {
            const ab = aberrate(star.baseX, star.baseY);
            let r255 = star.baseR;
            let g255 = star.baseG;
            let b255 = star.baseB;
            let alpha = star.alpha;
            if (beta >= 1e-4) {
                // Color temperature shift: exaggerated by ^1.2 for visibility.
                // D > 1 (blueshift): boost B, drop R. D < 1: reverse.
                const D = ab.D;
                const p = 1.2;
                const bScale = Math.pow(D, p);
                const rScale = 1 / bScale;
                r255 = Math.max(0, Math.min(255, star.baseR * rScale));
                g255 = Math.max(0, Math.min(255, star.baseG));
                b255 = Math.max(0, Math.min(255, star.baseB * bScale));
                // Relativistic beaming: forward-boosted stars brighter, aft
                // stars dimmer. I ~ D^3 (softer than the true D^4 bolometric
                // scaling so faint stars don't vanish entirely astern).
                alpha = Math.max(0.02, Math.min(1.0, star.alpha * Math.pow(D, 3)));
            }
            const packedColor = (Math.round(r255) << 16) | (Math.round(g255) << 8) | Math.round(b255);
            this.bg.fillStyle(packedColor, alpha);
            this.bg.fillCircle(ab.x, ab.y, star.size);

            if (star.bright) {
                const spikeLen = star.size * 5;
                this.bg.lineStyle(1, packedColor, alpha * 0.35);
                this.bg.beginPath();
                this.bg.moveTo(ab.x - spikeLen, ab.y);
                this.bg.lineTo(ab.x + spikeLen, ab.y);
                this.bg.moveTo(ab.x, ab.y - spikeLen);
                this.bg.lineTo(ab.x, ab.y + spikeLen);
                this.bg.strokePath();
            }
        }
    }

    handleInput(delta) {
        const dt = delta / 1000;
        
        // Rotation
        const angularAccel = 4.0;
        if (this.cursors.left.isDown) {
            this.angularVelocity -= angularAccel * dt;
        }
        if (this.cursors.right.isDown) {
            this.angularVelocity += angularAccel * dt;
        }
        const maxAngularSpeed = 4.0;
        this.angularVelocity = Phaser.Math.Clamp(this.angularVelocity, -maxAngularSpeed, maxAngularSpeed);

        this.playerAngle += this.angularVelocity * dt;
        
        // Thrust (manual main engine) using the rocket equation with a
        // power-limited engine: F = 2 * P_jet / v_e at the current Isp.
        // Acceleration = F / m(t); fuel (propellant mass) burns at F / v_e.
        if (this.cursors.up.isDown && this.fuel > 0) {
            const F = currentMainThrustForce();
            const mass = currentShipMass(this);
            // Lab-frame thrust vector along the ship's current heading.
            // Apply relativistic F = dp/dt: acceleration decreases with
            // gamma (transversely) or gamma^3 (longitudinally), so the
            // ship asymptotes to c instead of exceeding it. Applied as a
            // per-frame velocity impulse (Phaser's setAcceleration would
            // assume the acceleration is constant across the physics
            // sub-step, which is not true under SR because a depends on
            // the instantaneous velocity).
            const Fx = Math.cos(this.playerAngle) * F;
            const Fy = Math.sin(this.playerAngle) * F;
            const vNow = this.player.body.velocity;
            const aRel = relativisticThrustAccel(Fx, Fy, mass, vNow.x, vNow.y);
            this.player.body.setAcceleration(0, 0);
            this.player.body.velocity.x += aRel.ax * dt;
            this.player.body.velocity.y += aRel.ay * dt;
            this.isThrusting = true;

            const vExhaust = currentExhaustVelocity();
            const fuelUse = F * dt / vExhaust;
            this.fuel = Math.max(0, this.fuel - fuelUse);
        } else {
            this.player.body.setAcceleration(0, 0);
            this.isThrusting = false;
        }
        
        // Shoot
        if (Phaser.Input.Keyboard.JustDown(this.spaceKey) && this.ammo > 0) {
            this.shoot();
        }
    }

    shoot() {
        const bulletX = this.player.x + Math.cos(this.playerAngle) * 25;
        const bulletY = this.player.y + Math.sin(this.playerAngle) * 25;
        
        const bullet = this.add.circle(bulletX, bulletY, 6, 0xffff00);
        bullet.setStrokeStyle(3, 0xffffff);
        
        const speed = 600;
        bullet.vx = Math.cos(this.playerAngle) * speed + this.player.body.velocity.x;
        bullet.vy = Math.sin(this.playerAngle) * speed + this.player.body.velocity.y;
        const bulletMass = 1;
        const shipMass = currentShipMass(this);
        const recoilFactor = bulletMass / shipMass;
        this.player.body.velocity.x -= Math.cos(this.playerAngle) * speed * recoilFactor;
        this.player.body.velocity.y -= Math.sin(this.playerAngle) * speed * recoilFactor;
        
        this.bullets.add(bullet);
        this.ammo -= 1;
        
        // Auto-destroy after 3 seconds
        this.time.delayedCall(3000, () => {
            if (bullet.active) bullet.destroy();
        });
    }

    applyGravity(delta) {
        const dtSec = delta / 1000;

        // Accumulate the total gravitational acceleration the ship WOULD
        // feel this frame. We tally it into (axTot, ayTot) either to apply
        // it (normal flight) or to fuel-cost it (station-keeping active).
        let axTot = 0, ayTot = 0;

        // Gravity from stars / black holes
        this.gravityObjects.forEach(obj => {
            const dx = obj.x - this.player.x;
            const dy = obj.y - this.player.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > 1) {
                const gravityStrength = obj.getData('gravityStrength');
                const force = gravityStrength / (dist * dist);
                axTot += (dx / dist) * force;
                ayTot += (dy / dist) * force;
            }
        });

        // Gravity pull from Earth to make capture/landing realistic and decisive
        if (this.earth) {
            const dxE = this.earth.x - this.player.x;
            const dyE = this.earth.y - this.player.y;
            const distE = Math.sqrt(dxE * dxE + dyE * dyE);
            if (distE > 1) {
                // Earth gravity strength scaled up by 5x to keep gravity strong
                // in the enlarged world while remaining weaker than the massive
                // star.
                const earthGravityStrength = 40000 * 5;
                const gE = earthGravityStrength / (distE * distE);
                axTot += (dxE / distE) * gE;
                ayTot += (dyE / distE) * gE;
            }
        }

        if (this._stationKeepingActive) {
            // Station-keeping = gravity-cancellation. We thrust opposite the
            // net gravitational acceleration with just enough force to zero
            // it out; ship velocity is not touched (it coasts inertially in
            // the resulting force-free frame). Fuel is drawn at the ideal
            // rocket-equation rate for that equivalent thrust:
            //   F = m * a_grav ;   m_dot = F / v_exhaust
            const gMag = Math.sqrt(axTot * axTot + ayTot * ayTot);
            if (gMag > 0 && this.fuel > 0) {
                const mass = currentShipMass(this);
                const F = mass * gMag;
                const ve = currentExhaustVelocity();
                const burn = (F / ve) * dtSec;
                const actual = Math.min(burn, this.fuel);
                this.fuel -= actual;
                this._stationKeepingFuelSpent += actual;
                if (this.fuel <= 0) {
                    // Out of fuel: station-keeping fails. Fall through to
                    // normal gravity so the ship starts falling and the
                    // player sees the consequence. Also flip the flag so
                    // subsequent frames stop trying to cancel gravity.
                    this._stationKeepingActive = false;
                    this.player.body.velocity.x += axTot * dtSec;
                    this.player.body.velocity.y += ayTot * dtSec;
                }
            }
            return;
        }

        // Normal flight: apply the accumulated gravitational acceleration.
        this.player.body.velocity.x += axTot * dtSec;
        this.player.body.velocity.y += ayTot * dtSec;
    }

    updateTime(delta) {
        let gravitationalPotential = 0;
        
        this.gravityObjects.forEach(obj => {
            const dx = obj.x - this.player.x;
            const dy = obj.y - this.player.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const mass = obj.getData('mass');
            const schwarzschildRadius = obj.getData('schwarzschildRadius');
            
            const potential = mass / Math.max(dist, schwarzschildRadius * 0.5);
            gravitationalPotential += potential;
        });
        
        // Clamp gravitational potential to avoid extreme values
        gravitationalPotential = Math.min(gravitationalPotential, 200000);
        // Denominator scaled with c^2 (halved c => quartered c^2 => quartered
        // scale). Together with the c=400 change below, close-approach passes
        // to stars and grazing black holes now produce visible dilation
        // (gamma factors of 2-5+) instead of ambient decoration.
        let gravitationalDilation = 1 / Math.sqrt(1 + gravitationalPotential / 12500);
        if (!Number.isFinite(gravitationalDilation) || gravitationalDilation <= 0) {
            gravitationalDilation = 0.1;
        }
        
        const speed = Math.sqrt(
            this.player.body.velocity.x ** 2 + 
            this.player.body.velocity.y ** 2
        );
        // Speed of light in game units. Lowered from 800 to 400 to bring the
        // relativistic regime into normal play: at vCruise=200, beta=0.5
        // (gamma ~1.15); at vCruise max 390, beta=0.975 (gamma ~4.5).
        const c = 400;
        let beta2 = (speed / c) * (speed / c);
        if (!Number.isFinite(beta2) || beta2 < 0) {
            beta2 = 0;
        }
        beta2 = Math.min(beta2, 0.99);
        const velocityDilation = Math.sqrt(1 - beta2);
        
        const timeDilation = Math.max(0.05, gravitationalDilation * velocityDilation);
        this.currentDilation = timeDilation;

        // Frame convention: ship-frame is the "wall clock" here -- shipTime
        // ticks at exactly the game delta, matching what an observer aboard
        // the ship would read on their watch. Earth-frame elapsed time then
        // runs FASTER by 1/timeDilation (= Lorentz gamma including
        // gravitational potential), which is the Earth-frame duration that
        // corresponds to the ship's proper-time interval. This preserves
        // the physics ratio earthTime/shipTime == gamma; only the choice of
        // "which frame is real time" has flipped.
        const dtShip = delta / 1000;
        this.shipTime += dtShip;
        this.earthTime += dtShip / timeDilation;

        // Earth-time deadline (only when the global toggle is on and the
        // game isn't already over). Arm the countdown the first time the
        // ship exceeds a small speed threshold, then track elapsed Earth
        // time after arming and hard-fail if it exceeds the budget.
        if (globalEarthDeadlineEnabled && !this.gameOver && !this.earthDeadlineFired) {
            if (!this.earthDeadlineArmed) {
                if (speed > 5) {
                    this.earthDeadlineArmed = true;
                    this.earthTimeAfterArm = 0;
                }
            } else {
                this.earthTimeAfterArm += dtShip / timeDilation;
                if (this.earthTimeAfterArm > this.earthDeadline) {
                    this.earthDeadlineFired = true;
                    this.loseGame('DEADLINE');
                }
            }
        }
    }

    updateUI() {
        const distToEarth = Phaser.Math.Distance.Between(
            this.player.x, this.player.y,
            this.earth.x, this.earth.y
        );

        // Compute radial/tangential velocity components relative to Earth
        const vx = this.player.body.velocity.x;
        const vy = this.player.body.velocity.y;
        const dx = this.player.x - this.earth.x;
        const dy = this.player.y - this.earth.y;

        let radialV = 0;
        let tangentialV = 0;
        if (distToEarth > 1e-3) {
            const rx = dx / distToEarth;
            const ry = dy / distToEarth;
            radialV = vx * rx + vy * ry;
            const vtX = vx - radialV * rx;
            const vtY = vy - radialV * ry;
            const tx = -ry;
            const ty = rx;
            tangentialV = vtX * tx + vtY * ty;
        }

        // Attitude error relative to Earthward (radial inward) direction
        const bearingToEarth = Math.atan2(
            this.earth.y - this.player.y,
            this.earth.x - this.player.x
        );
        const attitudeErrorRad = Phaser.Math.Angle.Wrap(bearingToEarth - this.playerAngle);
        const attitudeErrorDeg = Phaser.Math.RadToDeg(attitudeErrorRad);

        const lines = [
            `Fuel: ${Math.max(0, this.fuel).toFixed(1)}`,
            `Ammo: ${this.ammo}`,
            `Distance: ${distToEarth.toFixed(0)}`,
            `v_r: ${radialV.toFixed(2)}`,
            `v_tan: ${tangentialV.toFixed(2)}`,
            `AttitudeErr: ${attitudeErrorDeg.toFixed(1)}°`
        ];

        if (typeof bestEarthTime === 'number') {
            lines.push(`Best Earth Time: ${bestEarthTime.toFixed(1)}s`);
        } else {
            lines.push('Best Earth Time: --');
        }
        
        // Autopilot status
        if (this.autopilot.enabled) {
            lines.push(`Autopilot: ON [${this.autopilot.getPhaseString()}]`);
        } else {
            lines.push('Autopilot: OFF (Press A)');
        }

        this.statsText.setText(lines);

        // Dual-clock time-dilation widget (below statsText).
        this.updateTimeDilationHUD();

        // Clear HUD graphics before drawing overlays
        if (this.radar) {
            this.radar.clear();
        }

        // Draw autopilot control indicators
        if (this.autopilot.enabled) {
            this.drawAutopilotControls();
        }
        
        // Draw radar
        this.drawRadar();
    }
    
    updateTimeDilationHUD() {
        // Layout: 380-wide panel below the top-left statsText. The panel is
        // split vertically into two clock columns (ship left, Earth right)
        // with a dilation-factor readout below, plus an optional Earth-time
        // budget bar when the deadline toggle is on.
        const px = 10;
        const py = 260;
        const pw = 380;
        const showBudget = !!globalEarthDeadlineEnabled;
        const ph = showBudget ? 128 : 84;

        const dil = this.currentDilation || 1.0;
        // Gamma: how much faster the Earth clock runs vs. the ship clock.
        const gamma = 1 / Math.max(0.05, dil);

        // Color-code the panel border and dilation-factor text by severity.
        let borderColor = 0x66aa66;
        let dilFill = '#aaffaa';
        if (gamma >= 3) {
            borderColor = 0xff4444;
            dilFill = '#ff6666';
        } else if (gamma >= 1.5) {
            borderColor = 0xffaa44;
            dilFill = '#ffbb66';
        } else if (gamma >= 1.1) {
            borderColor = 0xffff44;
            dilFill = '#ffff88';
        }

        const g = this.timeDilationPanel;
        g.clear();
        g.fillStyle(0x000000, 0.75);
        g.fillRect(px, py, pw, ph);
        g.lineStyle(2, borderColor, 0.9);
        g.strokeRect(px, py, pw, ph);
        // Vertical divider between the two clock columns.
        g.lineStyle(1, 0x666666, 0.5);
        g.beginPath();
        g.moveTo(px + pw / 2, py + 8);
        g.lineTo(px + pw / 2, py + 52);
        g.strokePath();

        const fmtTime = (t) => {
            if (t < 60) return `${t.toFixed(1)}s`;
            const m = Math.floor(t / 60);
            const s = t - m * 60;
            return `${m}m ${s.toFixed(1)}s`;
        };

        const leftCx = px + pw * 0.25;
        const rightCx = px + pw * 0.75;
        this.shipClockLabel.setPosition(leftCx, py + 8);
        this.shipClockText.setPosition(leftCx, py + 24).setText(fmtTime(this.shipTime));
        this.earthClockLabel.setPosition(rightCx, py + 8);
        this.earthClockText.setPosition(rightCx, py + 24).setText(fmtTime(this.earthTime));

        this.dilationText
            .setPosition(px + pw / 2, py + 60)
            .setText(`γ = ${gamma.toFixed(2)}×   ship / earth clock rate = ${dil.toFixed(3)}`)
            .setFill(dilFill);

        if (!showBudget) {
            if (this.earthBudgetText) this.earthBudgetText.setText('');
            return;
        }

        // Earth-time budget bar: filled proportion = used / total. Colored
        // by remaining fraction (green > 50%, yellow > 25%, orange > 10%,
        // flashing red < 10%).
        const total = Math.max(0.001, this.earthDeadline || 0);
        const used = Math.min(total, Math.max(0, this.earthTimeAfterArm || 0));
        const remaining = Math.max(0, total - used);
        const frac = used / total;
        const remainFrac = 1 - frac;

        let barColor = 0x66cc66;
        let textFill = '#aaffaa';
        if (remainFrac < 0.10) {
            const flash = (Math.sin(this.time.now * 0.012) > 0);
            barColor = flash ? 0xff2222 : 0xaa0000;
            textFill = '#ff5555';
        } else if (remainFrac < 0.25) {
            barColor = 0xff8844;
            textFill = '#ffaa66';
        } else if (remainFrac < 0.50) {
            barColor = 0xdddd44;
            textFill = '#ffff88';
        }

        // Bar geometry: full width inside panel padding, sits at py+82.
        const barX = px + 16;
        const barY = py + 92;
        const barW = pw - 32;
        const barH = 12;
        g.fillStyle(0x222222, 0.9);
        g.fillRect(barX, barY, barW, barH);
        g.fillStyle(barColor, 0.95);
        g.fillRect(barX, barY, barW * frac, barH);
        g.lineStyle(1, 0xffffff, 0.4);
        g.strokeRect(barX, barY, barW, barH);

        const armed = !!this.earthDeadlineArmed;
        const label = armed
            ? `EARTH BUDGET  ${used.toFixed(1)}s / ${total.toFixed(1)}s   (${remaining.toFixed(1)}s left)`
            : `EARTH BUDGET  ${total.toFixed(1)}s  (starts on first move)`;
        this.earthBudgetText
            .setPosition(px + pw / 2, py + 108)
            .setText(label)
            .setFill(textFill);
    }

    drawAutopilotControls() {
        try {
            // Use cached control state from last update
            const control = this.autopilot.lastControl;
            if (!control || !this.radar) return;
            
            const indicatorX = 100;
            const indicatorY = 700;
            const arrowSize = 30;
            
            // Draw control panel background
            this.radar.fillStyle(0x000000, 0.5);
            this.radar.fillRect(indicatorX - 50, indicatorY - 50, 200, 100);
            this.radar.lineStyle(2, 0x00ffff, 1);
            this.radar.strokeRect(indicatorX - 50, indicatorY - 50, 200, 100);
            
            // Draw rotation arrows
            if (control.angularControl < -0.1) {
                // Left arrow (turning left)
                this.radar.fillStyle(0xffff00, 1);
                this.radar.fillTriangle(
                    indicatorX - arrowSize, indicatorY,
                    indicatorX, indicatorY - arrowSize/2,
                    indicatorX, indicatorY + arrowSize/2
                );
            } else if (control.angularControl > 0.1) {
                // Right arrow (turning right)
                this.radar.fillStyle(0xffff00, 1);
                this.radar.fillTriangle(
                    indicatorX + arrowSize, indicatorY,
                    indicatorX, indicatorY - arrowSize/2,
                    indicatorX, indicatorY + arrowSize/2
                );
            }
            
            // Draw thrust indicator
            if (control.thrust) {
                this.radar.fillStyle(0xff6600, 1);
                this.radar.fillTriangle(
                    indicatorX + 80, indicatorY - 20,
                    indicatorX + 80, indicatorY + 20,
                    indicatorX + 120, indicatorY
                );
            }
        } catch (error) {
            console.error('Error drawing autopilot controls:', error);
        }
    }

    drawRadar() {
        // Radar sits near the bottom-right corner of the current viewport so
        // it tracks the enlarged canvas without needing hard-coded offsets.
        const width = this.cameras.main.width;
        const height = this.cameras.main.height;
        const radarSize = 180;
        const radarRadius = radarSize / 2;
        const margin = 30;
        const radarX = width - radarRadius - margin;
        const radarY = height - radarRadius - margin;
        // Local radar range in world units: ~1.5x the larger screen dimension.
        const radarRange = 1.5 * Math.max(width, height);
        // World-to-radar scale factor (px per world-px).
        const worldToRadar = (radarRadius - 6) / radarRange;

        this.radar.clear();
        
        // Background
        this.radar.fillStyle(0x000000, 0.7);
        this.radar.fillCircle(radarX, radarY, radarRadius);
        
        // Border
        this.radar.lineStyle(2, 0x00ff00, 0.8);
        this.radar.strokeCircle(radarX, radarY, radarRadius);
        
        // Player (center)
        this.radar.fillStyle(0x00ffff, 1);
        this.radar.fillCircle(radarX, radarY, 4);

        const step = Math.PI / 18; // ~10 degrees
        const radiusEdge = radarRadius - 6;

        // Helper to draw a local radar marker. If `worldRadius` is provided,
        // the marker's radar-space radius is scaled from the object's true
        // world radius so that Earth and the star appear at their actual
        // sizes relative to the radar range. Otherwise a fixed dot size is
        // used for point-like targets (asteroids, pickups).
        const drawLocalMarker = (tx, ty, color, size = 4, worldRadius = null) => {
            const dx = tx - this.player.x;
            const dy = ty - this.player.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > radarRange) return; // Too far: not shown on local radar

            const angle = Math.atan2(dy, dx);
            const quantizedAngle = Math.round(angle / step) * step;
            // Map distance [0, radarRange] -> [0, radiusEdge]
            const r = (dist / radarRange) * radiusEdge;
            const mx = radarX + Math.cos(quantizedAngle) * r;
            const my = radarY + Math.sin(quantizedAngle) * r;
            this.radar.fillStyle(color, 1);
            let markerRadius = size;
            if (typeof worldRadius === 'number' && worldRadius > 0) {
                markerRadius = Math.max(1, worldRadius * worldToRadar);
            }
            this.radar.fillCircle(mx, my, markerRadius);
        };

        // Earth direction arrow (always same length, only angle matters)
        const dxEarth = this.earth.x - this.player.x;
        const dyEarth = this.earth.y - this.player.y;
        const distEarth = Math.sqrt(dxEarth * dxEarth + dyEarth * dyEarth);
        const angleToEarth = Math.atan2(dyEarth, dxEarth);
        const quantizedAngle = Math.round(angleToEarth / step) * step;

        // Local Earth marker when within radar range: size scales with the
        // real Earth radius (400 px world = 80 * 5, from createEarth).
        if (distEarth <= radarRange) {
            const earthWorldRadius = (this.earth && this.earth.radius) || (80 * 5);
            drawLocalMarker(this.earth.x, this.earth.y, 0x0088ff, 5, earthWorldRadius);
        }

        // Earth marker: global direction only (not distance-limited)
        if (distEarth > radarRange) {
            this.radar.lineStyle(3, 0x00aaff, 0.6);
            this.radar.lineBetween(
                radarX,
                radarY,
                radarX + Math.cos(quantizedAngle) * radiusEdge,
                radarY + Math.sin(quantizedAngle) * radiusEdge
            );
            const earthMarkerX = radarX + Math.cos(quantizedAngle) * radiusEdge;
            const earthMarkerY = radarY + Math.sin(quantizedAngle) * radiusEdge;
            this.radar.fillStyle(0x00aaff, 1);
            this.radar.fillCircle(earthMarkerX, earthMarkerY, 4);
        }

        // Gravity objects (stars / black holes): size scales with the true
        // world radius so the object appears at its actual size on the radar.
        // Stars render as a filled yellow disk; black holes get a distinct
        // treatment (black center + stroked purple annulus) so the two are
        // instantly distinguishable at a glance.
        this.gravityObjects.forEach(obj => {
            const isBH = obj.getData('isBlackHole');
            const worldR = (typeof obj.radius === 'number' && obj.radius > 0)
                ? obj.radius
                : null;
            if (!isBH) {
                drawLocalMarker(obj.x, obj.y, 0xffff00, 3, worldR);
                return;
            }
            // Black-hole annulus marker: inlined instead of extending
            // drawLocalMarker so the ring/fill can be styled independently.
            const dx = obj.x - this.player.x;
            const dy = obj.y - this.player.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > radarRange) return;
            const angleObj = Math.atan2(dy, dx);
            const quantAng = Math.round(angleObj / step) * step;
            const rMap = (dist / radarRange) * radiusEdge;
            const mx2 = radarX + Math.cos(quantAng) * rMap;
            const my2 = radarY + Math.sin(quantAng) * rMap;
            const markerR = (worldR !== null)
                ? Math.max(3, worldR * worldToRadar)
                : 4;
            this.radar.fillStyle(0x000000, 1);
            this.radar.fillCircle(mx2, my2, markerR);
            this.radar.lineStyle(2, 0xaa00ff, 1);
            this.radar.strokeCircle(mx2, my2, markerR);
        });

        // Asteroids
        this.asteroids.children.entries.forEach(asteroid => {
            if (!asteroid.active) return;
            drawLocalMarker(asteroid.x, asteroid.y, 0xaaaaaa, 2);
        });

        // Fuel pickups
        this.fuelPickups.children.entries.forEach(fuel => {
            if (!fuel.active) return;
            drawLocalMarker(fuel.x, fuel.y, 0x00ff00, 3);
        });

        // Ammo pickups
        this.ammoPickups.children.entries.forEach(ammo => {
            if (!ammo.active) return;
            drawLocalMarker(ammo.x, ammo.y, 0xff6600, 3);
        });
    }

    updateBullets(delta) {
        const dt = delta / 1000;
        this.bullets.children.entries.forEach(bullet => {
            if (!bullet || !bullet.active) return;

            // Integrate bullet motion manually
            if (typeof bullet.vx === 'number' && typeof bullet.vy === 'number') {
                bullet.x += bullet.vx * dt;
                bullet.y += bullet.vy * dt;
            }
            
            // Check asteroid collisions
            this.asteroids.children.entries.forEach(asteroid => {
                if (!asteroid || !asteroid.active) return;
                
                const dist = Phaser.Math.Distance.Between(
                    bullet.x, bullet.y,
                    asteroid.x, asteroid.y
                );
                
                if (dist < asteroid.body.radius + 5) {
                    bullet.destroy();
                    asteroid.destroy();
                }
            });
            
            // Destroy if out of bounds
            if (bullet.x < 0 || bullet.x > this.worldWidth || 
                bullet.y < 0 || bullet.y > this.worldHeight) {
                bullet.destroy();
            }
        });
    }

    collectFuel(player, fuel) {
        fuel.destroy();
        this.fuel = Math.min(this.fuel + 30, 100);
    }

    collectAmmo(player, ammo) {
        ammo.destroy();
        this.ammo = Math.min(this.ammo + 20, 50);
    }

    loseGame(reason) {
        if (this.gameOver) return;
        this.gameOver = true;
        this.lastLoseReason = reason || 'COLLISION';

        // Compare-test routing on failure.
        if (this.mode === 'COMPARE' && compareTestState) {
            this._recordCompareResult(false);
            this._advanceCompareTest();
            return;
        }

        // Record experiment failure if enabled
        if (experimentConfig.enabled && !experimentConfig.finished) {
            experimentConfig.results.push({
                success: false,
                reason: this.lastLoseReason || 'COLLISION',
                earthTime: this.earthTime || 0,
                shipTime: this.shipTime || 0,
                lostTime: (this.earthTime || 0) - (this.shipTime || 0),
                fuelUsed: 100 - (this.fuel || 0)
            });
            // Show a quick failure indicator for TEST runs
            const cam = this.cameras.main;
            const failText = this.add.text(cam.width / 2, cam.height / 2, '✗', {
                fontSize: '72px',
                fill: '#f00'
            }).setOrigin(0.5).setScrollFactor(0).setDepth(2500);
            this.tweens.add({
                targets: failText,
                alpha: 0,
                duration: 250,
                onComplete: () => failText.destroy()
            });
            this.advanceExperimentTrial();
            return;
        }

        this.player.body.setVelocity(0, 0);
        
        const headline = (this.lastLoseReason === 'DEADLINE')
            ? 'EARTH DEADLINE EXCEEDED'
            : 'COLLISION!';
        const msg = this.add.text(600, 400, headline + '\n\nPress R to Restart', {
            fontSize: '48px',
            fill: '#f00',
            align: 'center',
            backgroundColor: '#000c',
            padding: { x: 20, y: 10 }
        }).setOrigin(0.5).setScrollFactor(0).setDepth(2000);
        
        const restartKey = this.input.keyboard.addKey('R');
        restartKey.once('down', () => {
            this.scene.restart();
        });

        this.showRetryPanel();
    }

    winGame() {
        if (this.gameOver) return;
        const vx = this.player.body.velocity.x;
        const vy = this.player.body.velocity.y;
        const speed = Math.sqrt(vx * vx + vy * vy);

        const angleToEarth = Math.atan2(
            this.earth.y - this.player.y,
            this.earth.x - this.player.x
        );
        const thrusterAngle = this.playerAngle + Math.PI;
        let angleDiff = Phaser.Math.Angle.Wrap(thrusterAngle - angleToEarth);
        angleDiff = Math.abs(angleDiff);

        const maxLandingSpeed = 100;
        const maxLandingAngle = Phaser.Math.DegToRad(10);

        if (speed > maxLandingSpeed || angleDiff > maxLandingAngle) {
            this.loseGame();
            return;
        }

        this.gameOver = true;

        // Compare-test routing on success.
        if (this.mode === 'COMPARE' && compareTestState) {
            this._recordCompareResult(true);
            this._advanceCompareTest();
            return;
        }

        // Record experiment success if enabled
        if (experimentConfig.enabled && !experimentConfig.finished) {
            experimentConfig.results.push({
                success: true,
                reason: null,
                earthTime: this.earthTime || 0,
                shipTime: this.shipTime || 0,
                lostTime: (this.earthTime || 0) - (this.shipTime || 0),
                fuelUsed: 100 - (this.fuel || 0)
            });
            // Show a quick success indicator for TEST runs
            const cam = this.cameras.main;
            const successText = this.add.text(cam.width / 2, cam.height / 2, '✓', {
                fontSize: '72px',
                fill: '#0f0'
            }).setOrigin(0.5).setScrollFactor(0).setDepth(2500);
            this.tweens.add({
                targets: successText,
                alpha: 0,
                duration: 250,
                onComplete: () => successText.destroy()
            });
            this.advanceExperimentTrial();
            return;
        }
        
        this.player.body.setVelocity(0, 0);
        
        const timeLost = this.earthTime - this.shipTime;

        let isNewBest = false;
        if (bestEarthTime === null || this.earthTime < bestEarthTime) {
            bestEarthTime = this.earthTime;
            isNewBest = true;
        }

        let bestLine = '';
        if (typeof bestEarthTime === 'number') {
            bestLine = `Best Earth Time: ${bestEarthTime.toFixed(1)}s`;
            if (isNewBest) {
                bestLine += ' (NEW RECORD)';
            }
        }

        const messageLines = [
            `EARTH REACHED!`,
            '',
            `You experienced: ${this.shipTime.toFixed(1)}s`,
            `Earth experienced: ${this.earthTime.toFixed(1)}s`,
            `Time Lost: ${timeLost.toFixed(1)}s`
        ];
        if (bestLine) {
            messageLines.push('', bestLine);
        }
        messageLines.push('', 'Press R to Restart');

        const msg = this.add.text(600, 400, messageLines.join('\n'), {
            fontSize: '32px',
            fill: '#0f0',
            align: 'center',
            backgroundColor: '#000c',
            padding: { x: 20, y: 10 }
        }).setOrigin(0.5).setScrollFactor(0).setDepth(2000);
        
        const restartKey = this.input.keyboard.addKey('R');
        restartKey.once('down', () => {
            this.scene.restart();
        });

        this.showRetryPanel();
    }

    showRetryPanel(opts = {}) {
        // Top-right overlay panel with retry buttons. Kept separate from
        // the existing end-game message so both can coexist. Hidden during
        // TEST/experiment runs (they auto-advance).
        //
        // opts.includeReplan: if true, adds a third "Retune & Replan (live)"
        //   button that opens the in-scene tuning overlay instead of
        //   restarting. Used when planning failed and station-keeping is
        //   still holding the ship so the player can retune parameters
        //   against the live evolving world.
        const includeReplan = !!opts.includeReplan;

        // Idempotent: if a retry panel is already up, tear it down first
        // so successive fail-then-retune-then-fail cycles don't stack
        // panels on top of each other.
        this._destroyRetryPanel();
        const created = [];
        this._retryPanelObjects = created;

        const cam = this.cameras.main;
        const pad = 12;
        const pw = 220;
        const buttonCount = includeReplan ? 3 : 2;
        const ph = 44 + buttonCount * 34 + 10;
        const px = cam.width - pw - pad;
        const py = pad;

        const panel = this.add.graphics()
            .setScrollFactor(0)
            .setDepth(2100);
        panel.fillStyle(0x000000, 0.7);
        panel.fillRect(px, py, pw, ph);
        panel.lineStyle(1, 0x888888, 1.0);
        panel.strokeRect(px, py, pw, ph);
        created.push(panel);

        const titleText = includeReplan ? 'Plan Failed' : 'Run Complete';
        const titleColor = includeReplan ? '#ffcc66' : '#ffffff';
        const title = this.add.text(px + pw / 2, py + 12, titleText, {
            fontSize: '14px',
            fill: titleColor,
            fontStyle: 'bold'
        }).setOrigin(0.5, 0).setScrollFactor(0).setDepth(2101);
        created.push(title);

        const makeButton = (label, cy, onClick) => {
            const bw = pw - 20;
            const bh = 28;
            const bx = px + 10;
            const by = py + cy;
            const bg = this.add.graphics()
                .setScrollFactor(0)
                .setDepth(2101);
            const draw = (color) => {
                bg.clear();
                bg.fillStyle(color, 1.0);
                bg.fillRect(bx, by, bw, bh);
                bg.lineStyle(1, 0xffffff, 1.0);
                bg.strokeRect(bx, by, bw, bh);
            };
            draw(0x2255aa);
            const txt = this.add.text(bx + bw / 2, by + bh / 2, label, {
                fontSize: '13px',
                fill: '#ffffff'
            }).setOrigin(0.5).setScrollFactor(0).setDepth(2102);
            const zone = this.add.zone(bx, by, bw, bh)
                .setOrigin(0, 0)
                .setScrollFactor(0)
                .setDepth(2103)
                .setInteractive({ useHandCursor: true });
            zone.on('pointerover', () => draw(0x3377cc));
            zone.on('pointerout',  () => draw(0x2255aa));
            zone.on('pointerdown', () => draw(0x1a4488));
            zone.on('pointerup',   () => { draw(0x2255aa); onClick(); });
            created.push(bg, txt, zone);
        };

        let nextY = 38;
        if (includeReplan) {
            makeButton('Retune & Replan (live)', nextY, () => {
                this._showInPlaceTuningPanel();
            });
            nextY += 34;
        }
        makeButton('Retry Same Seed', nextY, () => {
            this.replayRequested = true;
            this.scene.restart();
        });
        nextY += 34;
        makeButton('New Seed', nextY, () => {
            this.replayRequested = false;
            this.worldSnapshot = null;
            this.scene.restart();
        });
    }

    // In-scene tuning overlay used only after a plan failure. Draws the
    // same slider set as the full-screen Tuning menu, but Apply triggers
    // an in-place replan (no scene restart) so the world's current live
    // star state feeds the new sweep. Cancel dismisses without replanning.
    _showInPlaceTuningPanel() {
        // Idempotent -- if the overlay is already up, do nothing.
        if (this._inPlaceTuningObjects && this._inPlaceTuningObjects.length > 0) {
            return;
        }
        const created = [];
        this._inPlaceTuningObjects = created;

        const w = this.cameras.main.width;
        const h = this.cameras.main.height;
        const centerX = w / 2;
        const centerY = h / 2;

        const panelWidth = 780;
        const rowSpacing = 22;
        const paramCount = tuningParamsDefinition.length;
        const panelHeight = paramCount * rowSpacing + 200;

        const bg = this.add.rectangle(centerX, centerY, panelWidth, panelHeight, 0x000000, 0.92)
            .setScrollFactor(0)
            .setDepth(3000)
            .setStrokeStyle(2, 0xffcc66, 0.75);
        created.push(bg);

        const titleY = centerY - panelHeight / 2 + 24;
        const title = this.add.text(centerX, titleY,
            'Retune Parameters (world continues to evolve in real time)', {
            fontSize: '20px',
            fill: '#ffcc66',
            fontStyle: 'bold'
        }).setOrigin(0.5).setScrollFactor(0).setDepth(3001);
        created.push(title);

        const rowsStartY = titleY + 34;
        const sliderWidthPx = 300;
        const paramRows = [];

        tuningParamsDefinition.forEach((def, idx) => {
            const y = rowsStartY + idx * rowSpacing;

            const labelText = this.add.text(centerX - 370, y, def.label + ':', {
                fontSize: '14px',
                fill: '#ffddaa'
            }).setOrigin(0, 0.5).setScrollFactor(0).setDepth(3001);
            created.push(labelText);

            const valueText = this.add.text(centerX - 20, y, '', {
                fontSize: '14px',
                fill: '#0f0'
            }).setOrigin(1, 0.5).setScrollFactor(0).setDepth(3001);
            created.push(valueText);

            const initialValue = activeTuningParams[def.key];
            const stepAttr = (typeof def.step === 'number' && def.step > 0) ? def.step : 'any';

            const slider = this.add.dom(centerX + 150, y).createFromHTML(
                `<input type="range" min="${def.min}" max="${def.max}" step="${stepAttr}" value="${initialValue}" style="width:${sliderWidthPx}px; accent-color:#ffcc66;" />`
            );
            slider.setOrigin(0.5, 0.5).setScrollFactor(0).setDepth(3001);
            created.push(slider);

            const sliderEl = slider.node && slider.node.querySelector('input');
            const commit = () => {
                if (!sliderEl) return;
                let v = parseFloat(sliderEl.value);
                if (Number.isNaN(v)) return;
                if (typeof def.min === 'number') v = Math.max(v, def.min);
                if (typeof def.max === 'number') v = Math.min(v, def.max);
                activeTuningParams[def.key] = v;
                valueText.setText(v.toFixed(def.decimals));
                saveTuningToStorage();
            };
            if (sliderEl) {
                sliderEl.addEventListener('input', commit);
                sliderEl.addEventListener('change', commit);
            }
            valueText.setText(initialValue.toFixed(def.decimals));
            paramRows.push({ def, valueText });
        });

        const lastY = rowsStartY + (paramCount - 1) * rowSpacing;
        const hint = this.add.text(centerX, lastY + 28,
            'Stars keep moving. Fuel keeps burning against station-keeping. Apply to run a fresh sweep against the world as it is right now.', {
            fontSize: '12px',
            fill: '#bbbbbb',
            align: 'center',
            wordWrap: { width: panelWidth - 60 }
        }).setOrigin(0.5).setScrollFactor(0).setDepth(3001);
        created.push(hint);

        const makeButton = (label, cx, cy, color, onClick) => {
            const btnBg = this.add.rectangle(cx, cy, 220, 36, color, 0.9)
                .setScrollFactor(0)
                .setDepth(3001)
                .setStrokeStyle(1, 0xffffff, 0.6)
                .setInteractive({ useHandCursor: true });
            const btnText = this.add.text(cx, cy, label, {
                fontSize: '17px',
                fill: '#ffffff',
                fontStyle: 'bold'
            }).setOrigin(0.5).setScrollFactor(0).setDepth(3002);
            btnBg.on('pointerdown', onClick);
            created.push(btnBg, btnText);
        };

        const btnY = lastY + 78;
        makeButton('Apply & Replan', centerX - 130, btnY, 0x226644, () => {
            this._destroyInPlaceTuningPanel();
            this._replanInPlace();
        });
        makeButton('Cancel', centerX + 130, btnY, 0x552222, () => {
            this._destroyInPlaceTuningPanel();
        });
    }

    _destroyInPlaceTuningPanel() {
        if (this._inPlaceTuningObjects) {
            for (const o of this._inPlaceTuningObjects) {
                if (o && typeof o.destroy === 'function') {
                    try { o.destroy(); } catch (e) { /* already gone */ }
                }
            }
            this._inPlaceTuningObjects = null;
        }
    }

    // Tear down all plan-failure UI, reset slingshot sweep state, and
    // re-invoke refineSlingshotPlanNumerically() so it runs a fresh sweep
    // against the world's current live star state (via
    // _buildTrajectorySimContext, which snapshots live positions/velocities).
    // Station-keeping was left engaged when the plan failed, so the ship
    // is still holding position and the ship velocity is still 0 -- no
    // hand-off discontinuity. Fuel spent so far is preserved.
    _replanInPlace() {
        // Tear down failure UI.
        this._destroyRetryPanel();
        this._destroyInPlaceTuningPanel();
        if (this.slingshotSweepFailMsg) {
            try { this.slingshotSweepFailMsg.destroy(); } catch (e) { /* gone */ }
            this.slingshotSweepFailMsg = null;
        }
        // Reset slingshot sweep state so refineSlingshotPlanNumerically
        // starts from a clean slate.
        this.slingshotPlan = null;
        this.slingshotSweepActive = false;
        this.slingshotSweepFailed = false;
        this.slingshotSweepData = null;
        this.slingshotSweepResults = [];
        this.slingshotSweepFineBest = null;
        this.slingshotSweepPosBest = null;
        this.slingshotSweepNegBest = null;
        this.slingshotSweepLastResult = null;
        if (this.slingshotSweepCurrentGraphics) {
            this.slingshotSweepCurrentGraphics.clear();
        }
        if (this.slingshotDebug) {
            this.slingshotDebug.clear();
        }
        // Ensure station-keeping is engaged for the new sweep. If fuel
        // ran out before the user clicked Retune, applyGravity() will
        // have already cleared the flag; in that case turning it back
        // on here does nothing useful (fuel = 0 -> no thrust in the
        // controller), but it doesn't hurt either.
        this._stationKeepingActive = true;
        // Re-invoke the planner. It snapshots live star state via
        // _buildTrajectorySimContext({ useLiveShipState: true }), so the
        // new sweep sees exactly the world the ship is currently in.
        this.refineSlingshotPlanNumerically();
    }

    _destroyRetryPanel() {
        if (this._retryPanelObjects) {
            for (const o of this._retryPanelObjects) {
                if (o && typeof o.destroy === 'function') {
                    try { o.destroy(); } catch (e) { /* already gone */ }
                }
            }
            this._retryPanelObjects = null;
        }
    }

    // Compare-ensemble helpers ------------------------------------------
    _recordCompareResult(success) {
        const result = {
            success,
            reason: success ? null : (this.lastLoseReason || 'COLLISION'),
            earthTime: this.earthTime || 0,
            shipTime: this.shipTime || 0,
            lostTime: (this.earthTime || 0) - (this.shipTime || 0),
            fuelUsed: 100 - (this.fuel || 0),
            fellBack: !!this._compareLegUsedFallback
        };
        if (compareTestState.phase === 'slingshot') {
            compareTestState.slingshotResults.push(result);
        } else {
            compareTestState.straightResults.push(result);
        }
    }

    _advanceCompareTest() {
        if (compareTestState.phase === 'slingshot') {
            // Same seed, second leg (straight-line).
            compareTestState.phase = 'straight';
            this.replayRequested = true;
            this.scene.restart();
            return;
        }
        // Straight-line leg just finished. Roll to next seed or finish.
        compareTestState.seedIndex++;
        if (compareTestState.seedIndex >= compareTestState.totalSeeds) {
            this._showCompareResults();
            return;
        }
        // Fresh seed, back to slingshot leg.
        compareTestState.phase = 'slingshot';
        this.replayRequested = false;
        this.worldSnapshot = null;
        this.scene.restart();
    }

    _statsFrom(results) {
        // successes-only mean/sd across a per-run field, matching the
        // ensemble-test statistics helper.
        const stats = (values) => {
            const n = values.length;
            if (n === 0) return { n: 0, mean: 0, sd: 0 };
            let sum = 0;
            for (const v of values) sum += v;
            const mean = sum / n;
            if (n < 2) return { n, mean, sd: 0 };
            let sq = 0;
            for (const v of values) sq += (v - mean) * (v - mean);
            return { n, mean, sd: Math.sqrt(sq / (n - 1)) };
        };
        const successes = results.filter(r => r.success);
        const failures  = results.filter(r => !r.success);
        return {
            totalCompleted: results.length,
            successCount: successes.length,
            failureCount: failures.length,
            collisions: failures.filter(r => r.reason === 'COLLISION').length,
            deadlines:  failures.filter(r => r.reason === 'DEADLINE').length,
            fallbackCount: results.filter(r => r.fellBack).length,
            successRate: results.length ? successes.length / results.length : 0,
            earthTime: stats(successes.map(r => r.earthTime)),
            shipTime:  stats(successes.map(r => r.shipTime)),
            lostTime:  stats(successes.map(r => r.lostTime)),
            fuelUsed:  stats(successes.map(r => r.fuelUsed))
        };
    }

    _showCompareResults() {
        const A = this._statsFrom(compareTestState.slingshotResults);   // slingshot cohort
        const B = this._statsFrom(compareTestState.straightResults);    // straight cohort
        const N = compareTestState.totalSeeds;
        const fmt = (x) => x.toFixed(2);
        const pct = (x) => (x * 100).toFixed(1);
        const cell = (st) => (st.n > 0)
            ? `${fmt(st.mean).padStart(7)} \u00b1 ${fmt(st.sd).padStart(6)}  (n=${String(st.n).padStart(2)})`
            : `      -   \u00b1      -   (n= 0)`;
        const row = (label, a, b) =>
            `  ${label.padEnd(24)}${cell(a)}    ${cell(b)}`;

        const lines = [];
        lines.push(`COMPARE ENSEMBLE  ${N} seeds  (${2 * N} total trials)`);
        lines.push('');
        lines.push(`                          ${'SLINGSHOT'.padEnd(28)}   ${'STRAIGHT-LINE'.padEnd(28)}`);
        lines.push(`  successes             ${(`${A.successCount}/${A.totalCompleted}  (${pct(A.successRate)}%)`).padEnd(28)}   ${(`${B.successCount}/${B.totalCompleted}  (${pct(B.successRate)}%)`).padEnd(28)}`);
        const failLine = (s) => {
            if (s.failureCount === 0) return '(none)';
            const parts = [];
            if (s.collisions > 0) parts.push(`${s.collisions} coll`);
            if (s.deadlines  > 0) parts.push(`${s.deadlines} dead`);
            return `${s.failureCount}  (${parts.join(', ')})`;
        };
        lines.push(`  failures              ${failLine(A).padEnd(28)}   ${failLine(B).padEnd(28)}`);
        const fbLine = (s) => `${s.fallbackCount} of ${s.totalCompleted}`;
        lines.push(`  chord-guard fallbacks ${'(n/a)'.padEnd(28)}   ${fbLine(B).padEnd(28)}`);
        lines.push('');
        lines.push('  Successful-run statistics (mean \u00b1 sd):');
        lines.push(row('Earth flight time (s):', A.earthTime, B.earthTime));
        lines.push(row('Ship  flight time (s):', A.shipTime,  B.shipTime));
        lines.push(row('Time lost to dilation:', A.lostTime,  B.lostTime));
        lines.push(row('Fuel used (of 100):   ', A.fuelUsed,  B.fuelUsed));

        const text = this.add.text(600, 320, lines.join('\n'), {
            fontSize: '16px',
            fill: '#ffdd66',
            align: 'left',
            backgroundColor: '#000d',
            padding: { x: 20, y: 12 },
            fontFamily: 'monospace'
        }).setOrigin(0.5).setScrollFactor(0).setDepth(3000);

        const makeBtn = (label, offsetX, handler) => {
            const bg = this.add.rectangle(600 + offsetX, 620, 220, 44, 0x003344, 0.95)
                .setScrollFactor(0).setDepth(3001)
                .setStrokeStyle(1, 0x00ffff, 0.6)
                .setInteractive({ useHandCursor: true });
            const t = this.add.text(600 + offsetX, 620, label, {
                fontSize: '18px', fill: '#0ff'
            }).setOrigin(0.5).setScrollFactor(0).setDepth(3002);
            bg.on('pointerdown', () => { text.destroy(); bg.destroy(); t.destroy(); handler(); });
        };
        makeBtn('Run again (same N)', -140, () => {
            compareTestState = {
                totalSeeds: N,
                seedIndex: 0,
                phase: 'slingshot',
                slingshotResults: [],
                straightResults: []
            };
            this.replayRequested = false;
            this.worldSnapshot = null;
            this.scene.restart();
        });
        makeBtn('Back to menu', 140, () => {
            compareTestState = null;
            globalMode = 'MENU';
            this.replayRequested = false;
            this.worldSnapshot = null;
            this.scene.restart();
        });
    }
    // --------------------------------------------------------------------

    advanceExperimentTrial() {
        experimentConfig.runIndex++;
        if (experimentConfig.runIndex >= experimentConfig.totalRuns) {
            experimentConfig.finished = true;
            this.showExperimentResults();
            return;
        }
        this.scene.restart();
    }

    _computeExperimentStats() {
        // Compute mean and (sample) standard deviation of `values`.
        const stats = (values) => {
            const n = values.length;
            if (n === 0) return { n: 0, mean: 0, sd: 0 };
            let sum = 0;
            for (const v of values) sum += v;
            const mean = sum / n;
            if (n < 2) return { n, mean, sd: 0 };
            let sq = 0;
            for (const v of values) sq += (v - mean) * (v - mean);
            const sd = Math.sqrt(sq / (n - 1));
            return { n, mean, sd };
        };
        const results = experimentConfig.results;
        const successes = results.filter(r => r.success);
        const failures = results.filter(r => !r.success);
        const collisions = failures.filter(r => r.reason === 'COLLISION').length;
        const deadlines = failures.filter(r => r.reason === 'DEADLINE').length;
        return {
            totalCompleted: results.length,
            successCount: successes.length,
            failureCount: failures.length,
            collisions,
            deadlines,
            successRate: results.length ? successes.length / results.length : 0,
            earthTime: stats(successes.map(r => r.earthTime)),
            shipTime: stats(successes.map(r => r.shipTime)),
            lostTime: stats(successes.map(r => r.lostTime)),
            fuelUsed: stats(successes.map(r => r.fuelUsed))
        };
    }

    showExperimentResults() {
        const s = this._computeExperimentStats();
        const fmt = (x) => x.toFixed(2);
        const pct = (x) => (x * 100).toFixed(1);
        const line = (label, st) => (st.n > 0)
            ? `${label}  ${fmt(st.mean)} ± ${fmt(st.sd)}  (n=${st.n})`
            : `${label}  (no successful runs)`;

        const lines = [];
        lines.push(`Ensemble test results: ${experimentConfig.totalRuns} runs`);
        lines.push('');
        lines.push(`Successes:  ${s.successCount}/${s.totalCompleted}  (${pct(s.successRate)}%)`);
        if (s.failureCount > 0) {
            const parts = [];
            if (s.collisions > 0) parts.push(`${s.collisions} collision`);
            if (s.deadlines  > 0) parts.push(`${s.deadlines} deadline`);
            lines.push(`Failures:   ${s.failureCount}  (${parts.join(', ')})`);
        }
        lines.push('');
        lines.push('Successful-run statistics (mean ± sd):');
        lines.push(line('  Earth flight time (s): ', s.earthTime));
        lines.push(line('  Ship  flight time (s): ', s.shipTime));
        lines.push(line('  Time lost to dilation: ', s.lostTime));
        lines.push(line('  Fuel used (of 100):    ', s.fuelUsed));

        if (lastAdoptedSuccessRate !== null) {
            lines.push('');
            lines.push(`Previous adopted success rate: ${pct(lastAdoptedSuccessRate)}%`);
        }
        lines.push('');
        lines.push('Adopt current tuning as the new Autopilot/Manual defaults?');

        const overallRate = s.successRate;

        const text = this.add.text(600, 300, lines.join('\n'), {
            fontSize: '18px',
            fill: '#0f0',
            align: 'left',
            backgroundColor: '#000c',
            padding: { x: 20, y: 10 },
            fontFamily: 'monospace'
        }).setOrigin(0.5).setScrollFactor(0).setDepth(2000);

        const makeButton = (label, offsetX, handler) => {
            const btnBg = this.add.rectangle(600 + offsetX, 520, 140, 40, 0x003344, 0.9)
                .setScrollFactor(0)
                .setDepth(2001)
                .setInteractive({ useHandCursor: true });
            const btnText = this.add.text(600 + offsetX, 520, label, {
                fontSize: '18px',
                fill: '#0ff'
            }).setOrigin(0.5).setScrollFactor(0).setDepth(2002);
            btnBg.on('pointerdown', handler);
            return { btnBg, btnText };
        };

        const adoptBtn = makeButton('Adopt', -90, () => {
            defaultTuningParams = cloneTuningParams(activeTuningParams);
            lastAdoptedSuccessRate = overallRate;
            text.destroy();
            adoptBtn.btnBg.destroy();
            adoptBtn.btnText.destroy();
            keepBtn.btnBg.destroy();
            keepBtn.btnText.destroy();
            saveTuningToStorage();
            globalMode = 'MENU';
            experimentConfig.enabled = false;
            this.scene.restart();
        });

        const keepBtn = makeButton('Keep', 90, () => {
            text.destroy();
            adoptBtn.btnBg.destroy();
            adoptBtn.btnText.destroy();
            keepBtn.btnBg.destroy();
            keepBtn.btnText.destroy();
            globalMode = 'MENU';
            experimentConfig.enabled = false;
            this.scene.restart();
        });
    }
}

const config = {
    type: Phaser.AUTO,
    width: 1800,
    height: 1200,
    parent: 'game-container',
    backgroundColor: '#000814',
    dom: {
        createContainer: true
    },
    physics: {
        default: 'arcade',
        arcade: {
            gravity: { y: 0 },
            debug: false
        }
    },
    scene: [GameScene]
};

const game = new Phaser.Game(config);
console.log('Game initialized');
    </script>

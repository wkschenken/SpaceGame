        // safety margin over the star's physical radius as the coarse filter.
        const sunRadius = this.slingshotSweepData.sunRadius || 0;
        const clipRadius = sunRadius * 1.05;
        const isValidFine = (res) => {
            if (!res || res.miss) return false;
            if (typeof res.crossX !== 'number' || typeof res.crossY !== 'number') return false;
            if ((res.minDistToStar || 0) <= clipRadius) return false;
            return true;
        };

        // Process a small number of candidates per frame so the UI can update.
        const anglesPerFrame = 2;
        for (let i = 0; i < anglesPerFrame && this.slingshotSweepActive; i++) {
            if (this.slingshotSweepMode === 'coarse') {
                // ---- Coarse adaptive sweep ----
                // Expand outward in the current direction while trajectories
                // still intercept the S->E baseline. Flip to the other side
                // on a miss; finish when both sides have been swept.
                const angle = this.slingshotSweepAngle;

                // Hard angular cap. Without this, low-vCruise sweeps run
                // unbounded: maxTime = 2*lenSE/vCruise grows and every
                // simulated candidate eventually curves back to cross the
                // S->E baseline (miss:false with garbage distToEarth), so
                // the consecutive-miss termination logic never triggers.
                // 60 deg is well beyond any useful slingshot departure.
                const MAX_SWEEP_HALF_ANGLE = Math.PI / 3;
                if (Math.abs(angle) > MAX_SWEEP_HALF_ANGLE) {
                    // Force the same handling as "consecutive-miss tolerance
                    // exceeded": flip to the other side, or finalize if
                    // both sides have been capped.
                    if (this.slingshotSweepDirection > 0) {
                        this.slingshotSweepDirection = -1;
                        this.slingshotSweepAngle = -this.slingshotSweepStep;
                        this.slingshotSweepConsecMisses = 0;
                        continue;
                    }
                    this.setupFineSweepAroundWinner();
                    if (this.slingshotSweepMode !== 'fine') {
                        this.slingshotSweepActive = false;
                    }
                    break;
                }

                const result = simulateForAngle(angle);
                this.slingshotSweepLastResult = result;

                // A "viable" crossing is one that both (a) crossed the
                // S->E baseline at least once and (b) did so within a
                // sane distance of Earth. Wild off-target crossings --
                // where a chaotic gravity-slingshot loops the ship back
                // across the baseline thousands of units from Earth --
                // are what previously kept the consecutive-miss counter
                // from accumulating past ~90 deg. They still get pushed
                // to slingshotSweepResults as fallbacks in case nothing
                // viable is found, but they no longer reset consecMisses.
                //
                // Threshold: lenSE (the total S->E distance). Any crossing
                // further from Earth than that is definitively not a
                // rescuable candidate. A tighter threshold was tried
                // (10 * lineHitThreshold) but was too strict -- it caused
                // premature side-termination on normal seeds where the
                // real best coarse candidate sits at wider angles and
                // intermediate angles produce mid-range chaotic crossings.
                const viableCrossingThreshold = this.slingshotSweepData.lenSE || Number.POSITIVE_INFINITY;
                const isViableCrossing = !result.miss
                    && result.distToEarth <= viableCrossingThreshold;

                if (!result.miss) {
                    // Record every crossing (viable or not) so the
                    // post-sweep fallback picker has something to work
                    // with when no viable candidate exists.
                    this.slingshotSweepResults.push({ angle, result });
                    this.slingshotSweepMaxAbsAngle = Math.max(
                        this.slingshotSweepMaxAbsAngle, Math.abs(angle)
                    );
                }

                if (isViableCrossing) {
                    this.slingshotSweepConsecMisses = 0;
                    this.slingshotSweepAngle += this.slingshotSweepDirection * this.slingshotSweepStep;
                } else {
                    // Either a genuine miss (didn't cross in time) or a
                    // wildly off-target crossing. Both count toward the
                    // consecutive-miss termination gate.
                    this.slingshotSweepConsecMisses++;
                    if (this.slingshotSweepConsecMisses < this.slingshotSweepMissTolerance) {
                        this.slingshotSweepAngle += this.slingshotSweepDirection * this.slingshotSweepStep;
                    } else if (this.slingshotSweepDirection > 0) {
                        // Positive side exhausted; flip to negative side.
                        this.slingshotSweepDirection = -1;
                        this.slingshotSweepAngle = -this.slingshotSweepStep;
                        this.slingshotSweepConsecMisses = 0;
                    } else {
                        // Both sides exhausted. Coarse sweep done: pick each
                        // cone's best by min distToEarth, choose winner cone
                        // by smaller crossTime, and set up the fine sweep
                        // around the winner's angle.
                        this.setupFineSweepAroundWinner();
                        if (this.slingshotSweepMode !== 'fine') {
                            // No valid candidates in either cone -> finalize
                            // (will fail with banner).
                            this.slingshotSweepActive = false;
                        }
                        break;
                    }
                }
            } else if (this.slingshotSweepMode === 'fine') {
                // ---- Fine linear sweep around the winning-cone angle ----
                // Steps at coarseStep/10 across +/- one coarse step around
                // the winner. Keeps the sample with the smallest Euclidean
                // distToEarth. Early-terminates if a sample is inside the
                // 10%-earthRadius circle around Earth's center.
                const a = this.slingshotSweepFineAngle;
                if (a > this.slingshotSweepFineEndAngle + 1e-9) {
                    this.slingshotSweepActive = false;
                    break;
                }
                const result = simulateForAngle(a);
                this.slingshotSweepLastResult = result;
                this.slingshotSweepResults.push({ angle: a, result });

                if (isValidFine(result)) {
                    const currentBestDist = this.slingshotSweepFineBest
                        ? this.slingshotSweepFineBest.result.distToEarth
                        : Number.POSITIVE_INFINITY;
                    if (result.distToEarth < currentBestDist) {
                        this.slingshotSweepFineBest = { angle: a, result };
                    }
                    // Early exit if we're inside the tolerance circle.
                    if (result.distToEarth <= circleTol) {
                        this.slingshotSweepActive = false;
                        break;
                    }
                }
                this.slingshotSweepFineAngle += this.slingshotSweepFineStep;
            } else {
                this.slingshotSweepActive = false;
                break;
            }
        }

        // Draw only the "currently being tested" trajectory as a single
        // bright yellow polyline. Previously-tested trajectories are not
        // retained on screen.
        const gCurrent = this.slingshotSweepCurrentGraphics;
        if (gCurrent) {
            gCurrent.clear();
            const last = this.slingshotSweepLastResult;
            const lastPts = last && last.trajectoryPoints;
            if (this.slingshotSweepActive && lastPts && lastPts.length >= 2) {
                gCurrent.lineStyle(2, 0xffff00, 1.0);
                gCurrent.beginPath();
                gCurrent.moveTo(lastPts[0].x, lastPts[0].y);
                for (let p = 1; p < lastPts.length; p++) {
                    gCurrent.lineTo(lastPts[p].x, lastPts[p].y);
                }
                gCurrent.strokePath();
            }
        }

        // Update status text.
        if (this.slingshotSweepText && this.slingshotSweepActive) {
            if (this.slingshotSweepMode === 'coarse') {
                const angDeg = Phaser.Math.RadToDeg(this.slingshotSweepAngle);
                const side = this.slingshotSweepDirection > 0 ? '+' : '-';
                this.slingshotSweepText.setText(
                    `Computing slingshot (${side} sweep): ${angDeg.toFixed(2)} deg`
                );
            } else if (this.slingshotSweepMode === 'fine') {
                const angDeg = Phaser.Math.RadToDeg(this.slingshotSweepFineAngle);
                const best = this.slingshotSweepFineBest;
                const bestD = best ? best.result.distToEarth : Number.NaN;
                this.slingshotSweepText.setText(
                    `Fine sweep: ${angDeg.toFixed(3)} deg, best distToEarth ${bestD.toFixed(1)} px`
                );
            }
        }

        // If the sweep has just finished, finalize the plan.
        if (!this.slingshotSweepActive) {
            if (this.slingshotSweepText) {
                this.slingshotSweepText.setVisible(false);
            }
            // Clear the current-line sweep layer; the final red plan (or,
            // on failure, the red banner) replaces it.
            if (this.slingshotSweepCurrentGraphics) {
                this.slingshotSweepCurrentGraphics.clear();
            }

            // Post-sweep selection.
            //   posBest / negBest: best coarse candidate per cone
            //     (filtered sun-safe AND cross-beyond-star, chosen by min
            //     distToEarth). Winner cone was picked by smaller crossTime.
            //   fineBest: result of the fine linear sweep around the winner.
            // Final chosen = fineBest (falls back to the coarse cone winner
            // if the fine sweep didn't run, e.g. no valid coarse candidates).
            const sunRadius = this.slingshotSweepData.sunRadius || 0;
            const posBest = this.slingshotSweepPosBest;
            const negBest = this.slingshotSweepNegBest;

            const circleTolFinal = 0.1 * (this.slingshotSweepData.earthRadius || 0);
            const posT = (posBest && posBest.result && typeof posBest.result.crossTime === 'number')
                ? posBest.result.crossTime : Number.POSITIVE_INFINITY;
            const negT = (negBest && negBest.result && typeof negBest.result.crossTime === 'number')
                ? negBest.result.crossTime : Number.POSITIVE_INFINITY;
            const posDF = posBest ? posBest.result.distToEarth : Number.POSITIVE_INFINITY;
            const negDF = negBest ? negBest.result.distToEarth : Number.POSITIVE_INFINITY;
            const posInCircleF = posBest && posDF <= circleTolFinal;
            const negInCircleF = negBest && negDF <= circleTolFinal;

            let coneWinner = null;
            if (posInCircleF && negInCircleF) {
                coneWinner = (posT <= negT) ? posBest : negBest;
            } else if (posInCircleF) {
                coneWinner = posBest;
            } else if (negInCircleF) {
                coneWinner = negBest;
            } else if (posBest && negBest) {
                coneWinner = (posDF <= negDF) ? posBest : negBest;
            } else {
                coneWinner = posBest || negBest;
            }

            const chosen = this.slingshotSweepFineBest || coneWinner;

            if (!chosen) {
                if (typeof console !== 'undefined' && console && console.warn) {
                    console.warn(
                        'Slingshot numeric sweep found no viable trajectory.',
                        'posBest=', !!posBest, 'negBest=', !!negBest
                    );
                }

                this.slingshotSweepFailed = true;
                // Keep station-keeping ENGAGED so the ship holds position
                // while the player either retunes parameters (fuel keeps
                // burning against the local gravity gradient in real time)
                // or clicks a scene-restart option. Fuel will eventually
                // run out and applyGravity() will release station-keeping
                // and let the ship fall -- a natural pressure to decide.
                this._sweepStartWallMs = null;

                const cam = this.cameras.main;
                const cx = cam.width / 2;
                const cy = cam.height - 80;
                const msg = this.add.text(
                    cx,
                    cy,
                    'No viable slingshot trajectory found.\nRetune parameters live (ship is holding position on thrusters) or respawn below.',
                    {
                        fontSize: '18px',
                        fill: '#ff8080',
                        backgroundColor: '#000000',
                        align: 'center',
                        padding: { x: 10, y: 6 }
                    }
                ).setOrigin(0.5).setScrollFactor(0).setDepth(3002);
                this.slingshotSweepFailMsg = msg;

                if (this.autopilot) {
                    this.autopilot.enabled = false;
                }

                // Give the player a one-click respawn path (same seed or new
                // seed) in addition to the live-retune workflow.
                this.showRetryPanel({ includeReplan: true });

                return;
            }

            let bestResult = chosen.result;
            let bestAngle = chosen.angle;

            // ---- Hand-off reconciliation ----
            // The sweep's bestResult was computed against pre-rolled star
            // state (estimated for wall-time T_plan_est). Reality is that
            // stars have actually evolved for T_plan_actual seconds. Two
            // things can go wrong when we swap in "the sweep's winning
            // angle, re-flown against live stars":
            //   (a) the exact same angle may no longer be the local
            //       best -- small star drift shifts the optimum by a few
            //       hundredths of a degree; and
            //   (b) a naive swap that only checks .miss (crossed the
            //       baseline?) can accept a trajectory that crossed but
            //       sailed right past Earth.
            // So instead of a single re-sim of bestAngle, run a small
            // local mini-sweep around it against the live ctx and pick
            // whichever angle actually gets closest to Earth. Cost is
            // ~2*windowSteps live sims (typically <1 ms total).
            // Estimate how long this mini-sweep will take from the rolling
            // buffer of past durations (default 50 ms). Pre-roll liveCtx by
            // that amount so its t=0 star state represents the world as it
            // will exist when the mini-sweep completes and the plan is
            // installed -- not the state at the moment we snapshot. Without
            // this, stars drift ~50 ms during the mini-sweep and the
            // installed plan's t=0 is already stale by BOOST ignition.
            let miniSweepEstSec = DEFAULT_MINISWEEP_TIME_ESTIMATE_SEC;
            if (RECENT_MINISWEEP_TIMES_SEC.length > 0) {
                let s = 0;
                for (const t of RECENT_MINISWEEP_TIMES_SEC) s += t;
                miniSweepEstSec = s / RECENT_MINISWEEP_TIMES_SEC.length;
            }
            const miniSweepStartMs = (typeof performance !== 'undefined' && performance.now)
                ? performance.now()
                : Date.now();
            const liveCtx = this._buildTrajectorySimContext({
                preRollSec: miniSweepEstSec,
                useLiveShipState: true
            });
            let liveBest = null;      // best live result
            let liveBestAngle = bestAngle;
            if (liveCtx) {
                const dAngleRad = Phaser.Math.DegToRad(0.025);
                // +/- 3 deg local window. Was +/- 0.75 deg but that's too
                // narrow to rescue plans when pre-roll misprediction moves
                // the true live-optimal angle by more than a degree from
                // the pre-rolled winner (common when T_plan_est is off).
                // 3 deg covers realistic misprediction envelopes at the
                // cost of ~240 live sims (~30 ms) at hand-off.
                const windowSteps = 120;
                // Same 5%-margin star-clip filter used by the coarse and
                // fine sweeps. Without it the mini-sweep could pick a
                // live-refit trajectory that clips a star simply because
                // it crosses the baseline slightly closer to Earth --
                // installing a plan the earlier sweeps would have rejected.
                const liveClipRadius = (this.slingshotSweepData.sunRadius || 0) * 1.05;
                for (let k = -windowSteps; k <= windowSteps; k++) {
                    const trial = bestAngle + k * dAngleRad;
                    const r = this._simulateShipTrajectoryNBody(trial, liveCtx);
                    if (!r || r.miss || !r.trajectoryPoints
                        || r.trajectoryPoints.length < 2) continue;
                    if ((r.minDistToStar || 0) <= liveClipRadius) continue;
                    if (!liveBest || r.distToEarth < liveBest.distToEarth) {
                        liveBest = r;
                        liveBestAngle = trial;
                    }
                }
                if (liveBest) {
                    // Only swap the plan in if the live-refit actually
                    // reaches Earth (per lineHitThreshold). Otherwise stick
                    // with the pre-rolled bestResult -- it'll be caught by
                    // the acceptance gate below and turned into a proper
                    // sweep-failure if IT also misses.
                    if (liveBest.distToEarth <= lineHitThreshold
                        || liveBest.distToEarth < bestResult.distToEarth) {
                        bestResult = liveBest;
                        bestAngle = liveBestAngle;
                    }
                }
            }
            // Record the mini-sweep's actual wall-time so the next hand-off
            // can pre-roll its liveCtx more accurately.
            {
                const miniSweepEndMs = (typeof performance !== 'undefined' && performance.now)
                    ? performance.now()
                    : Date.now();
                const miniSweepActualSec = (miniSweepEndMs - miniSweepStartMs) / 1000;
                if (miniSweepActualSec >= 0 && Number.isFinite(miniSweepActualSec)) {
                    RECENT_MINISWEEP_TIMES_SEC.push(miniSweepActualSec);
                    while (RECENT_MINISWEEP_TIMES_SEC.length > RECENT_MINISWEEP_TIMES_MAX) {
                        RECENT_MINISWEEP_TIMES_SEC.shift();
                    }
                }
            }

            // Release station-keeping: applyGravity resumes normal physics
            // on the ship on the next frame, and BOOST engages via the
            // autopilot enable-gate immediately after this function returns.
            this._stationKeepingActive = false;

            // Record planning wall-time for the rolling pre-roll estimate.
            if (this._sweepStartWallMs !== null) {
                const nowMs = (typeof performance !== 'undefined' && performance.now)
                    ? performance.now()
                    : Date.now();
                const tPlan = (nowMs - this._sweepStartWallMs) / 1000;
                RECENT_PLAN_TIMES_SEC.push(tPlan);
                while (RECENT_PLAN_TIMES_SEC.length > RECENT_PLAN_TIMES_MAX) {
                    RECENT_PLAN_TIMES_SEC.shift();
                }
                this._lastPlanTimeSec = tPlan;   // for HUD
                this._sweepStartWallMs = null;
            }
            // Acceptance gate is deliberately looser than the "great plan"
            // threshold (lineHitThreshold = 0.5 earth-radii = 200 units).
            // Plans in the 200-800 unit range (up to 2 earth-radii) are
            // still routinely flown to Earth by CRUISE PID cross-track
            // correction + BRAKE + landing controller. Rejecting them
            // outright would fail nearly every real seed. The gate exists
            // only to catch catastrophic multi-thousand-unit misses that
            // no downstream controller can rescue.
            const acceptThreshold = 4 * lineHitThreshold;
            const accepted = bestResult.distToEarth <= acceptThreshold;
            const winnerSide = (chosen.angle >= 0) ? '+' : '-';

            // Hard acceptance gate: don't hand the autopilot a plan that
            // doesn't actually reach Earth. Prior code computed `accepted`
            // only for logging; combined with the pre-roll-driven hand-off
            // reconciliation this could silently install miss-plans. Fail
            // out through the same path as "no viable candidate found" so
            // the player sees the retry panel instead of a ship that
            // confidently flies past Earth.
            if (!accepted) {
                if (typeof console !== 'undefined' && console && console.warn) {
                    console.warn(
                        'Slingshot plan rejected at hand-off: distToEarth',
                        bestResult.distToEarth.toFixed(2),
                        '> acceptThreshold', acceptThreshold,
                        '(pre-roll est', (this._lastPlanTimeEstimateSec || 0).toFixed(2),
                        's, actual', ((this._lastPlanTimeSec || 0)).toFixed(2), 's)'
                    );
                }
                this.slingshotSweepFailed = true;
                // Keep station-keeping engaged (see equivalent block in
                // the "no viable candidate" branch above for rationale).
                const cam = this.cameras.main;
                const msg = this.add.text(
                    cam.width / 2, cam.height - 80,
                    'No viable slingshot trajectory found.\nRetune parameters live (ship is holding position on thrusters) or respawn below.',
                    {
                        fontSize: '18px',
                        fill: '#f88',
                        backgroundColor: '#200',
                        align: 'center',
                        padding: { x: 10, y: 6 }
                    }
                ).setOrigin(0.5).setScrollFactor(0).setDepth(3002);
                this.slingshotSweepFailMsg = msg;
                if (this.autopilot) this.autopilot.enabled = false;
                this.showRetryPanel({ includeReplan: true });
                return;
            }
            const fineImproved = (this.slingshotSweepFineBest && coneWinner &&
                this.slingshotSweepFineBest.result.distToEarth < coneWinner.result.distToEarth);
            if (typeof console !== 'undefined' && console && console.log) {
                console.log(
                    'Slingshot numeric sweep complete.',
                    'winner=', winnerSide, 'cone',
                    'chosenAngleDeg=', Phaser.Math.RadToDeg(bestAngle).toFixed(3),
                    'distToEarth=', bestResult.distToEarth.toFixed(2),
                    'crossTime=', (bestResult.crossTime || 0).toFixed(2),
                    'minDistToStar=', (bestResult.minDistToStar || 0).toFixed(2),
                    'sunRadius=', sunRadius.toFixed(2),
                    'posCone=', posBest ? { angleDeg: Phaser.Math.RadToDeg(posBest.angle).toFixed(3), t: posT.toFixed(2) } : null,
                    'negCone=', negBest ? { angleDeg: Phaser.Math.RadToDeg(negBest.angle).toFixed(3), t: negT.toFixed(2) } : null,
                    'coneBestDistToEarth=', coneWinner ? coneWinner.result.distToEarth.toFixed(2) : 'n/a',
                    'fineImproved=', fineImproved,
                    'threshold=', lineHitThreshold,
                    'accepted=', accepted
                );
            }

            const angleOffset = bestAngle;
            const cosA = Math.cos(angleOffset);
            const sinA = Math.sin(angleOffset);
            const dirInX = uxBase * cosA - uyBase * sinA;
            const dirInY = uxBase * sinA + uyBase * cosA;

            const lenIn = Math.sqrt(dirInX * dirInX + dirInY * dirInY) || 1;
            const normDirX = dirInX / lenIn;
            const normDirY = dirInY / lenIn;

            const tangentX = bestResult.periX;
            const tangentY = bestResult.periY;

            const dxTE = Ex - tangentX;
            const dyTE = Ey - tangentY;
            const lenTE = Math.sqrt(dxTE * dxTE + dyTE * dyTE) || 1;
            const outDirX = dxTE / lenTE;
            const outDirY = dyTE / lenTE;

            const impactParameter = bestResult.minDistToStar;

            const dotIO = Phaser.Math.Clamp(normDirX * outDirX + normDirY * outDirY, -1, 1);
            const deflectionAngle = Math.acos(dotIO);

            // Use the nearest massive object along the best trajectory as the
            // representative object for debug visualization.
            const dominantObj = bestResult.closestObj || null;

            this.slingshotPlan = {
                startX: Sx,
                startY: Sy,
                earthX: Ex,
                earthY: Ey,
                baseUx: uxBase,
                baseUy: uyBase,
                object: dominantObj,
                impactParameter,
                deflectionAngle,
                dirX: normDirX,
                dirY: normDirY,
                tangentX,
                tangentY,
                outDirX,
                outDirY,
                // Actual curved trajectory the sweep simulated under gravity.
                // Used by getSlingshotPathFrame as the true reference path so
                // the cross-track PID does not fight the intended
                // gravitational deflection.
                trajectoryPoints: bestResult.trajectoryPoints || null,
                periIndex: typeof bestResult.periIndex === 'number' ? bestResult.periIndex : 0
            };

            // Debug graphics layer already exists from the top of
            // refineSlingshotPlanNumerically(); the per-frame
            // drawSlingshotDebug() call will pick up the new plan and
            // render the red trajectory automatically.

            // Planning-latency HUD banner: shows how long computing the
            // plan actually took and how much fuel station-keeping burned
            // to hold the ship in place during that window.
            if (this.mode === 'AUTOPILOT' && typeof this._showPlannerBanner === 'function') {
                const tPlan = (typeof this._lastPlanTimeSec === 'number')
                    ? this._lastPlanTimeSec.toFixed(2) : '?';
                const tEst = (typeof this._lastPlanTimeEstimateSec === 'number')
                    ? this._lastPlanTimeEstimateSec.toFixed(2) : '?';
                const fuelHeld = (typeof this._stationKeepingFuelSpent === 'number')
                    ? this._stationKeepingFuelSpent.toFixed(2) : '?';
                this._showPlannerBanner(
                    `Plan ready in ${tPlan} s (est ${tEst} s) -- station-keeping fuel: ${fuelHeld} kg`,
                    '#66ccff'
                );
            }
        }
    }

    drawMinimap() {
        // Bottom-left minimap: shows the trajectory extent from the ship's
        // starting point to Earth, the planned trajectory (if any), the
        // star, Earth, start point, and the ship's current position.
        // Coordinates in world space are mapped into a fixed screen-space
        // rectangle at the bottom-left of the viewport.
        const cam = this.cameras.main;
        if (!cam) return;

        // Minimap panel geometry (screen-space).
        const pad = 12;
        const mw = 480;
        const mh = 320;
        const mx = pad;
        const my = cam.height - mh - pad;

        // Lazy-create the graphics layer + label the first time we render.
        if (!this.minimapGraphics) {
            this.minimapGraphics = this.add.graphics()
                .setScrollFactor(0)
                .setDepth(3050);
            this.minimapLabel = this.add.text(mx + 6, my + 4, 'Trajectory Map', {
                fontSize: '12px',
                fill: '#ffffff'
            }).setScrollFactor(0).setDepth(3051);
        }
        // Keep the label anchored (in case camera resizes).
        if (this.minimapLabel) {
            this.minimapLabel.setPosition(mx + 6, my + 4);
        }

        const g = this.minimapGraphics;
        g.clear();

        // Background panel.
        g.fillStyle(0x000000, 0.55);
        g.fillRect(mx, my, mw, mh);
        g.lineStyle(1, 0x888888, 1.0);
        g.strokeRect(mx, my, mw, mh);

        // Gather points of interest in world space.
        const Sx = this.startX;
        const Sy = this.startY;
        const Ex = this.earthX;
        const Ey = this.earthY;
        const stars = (this.gravityObjects || []).filter(o => o);
        const shipX = this.player ? this.player.x : null;
        const shipY = this.player ? this.player.y : null;

        // Compute world-space bounds spanning ONLY the fixed geometry of
        // this run: the start point, Earth, and (once planning finishes)
        // the planned trajectory polyline. Deliberately excludes live stars
        // and the ship so the map's domain never re-scales when a star
        // drifts off-screen or the ship strays outside the plan envelope.
        // Off-map stars / ship are simply clipped by the minimap panel.
        let minX = Math.min(Sx, Ex);
        let maxX = Math.max(Sx, Ex);
        let minY = Math.min(Sy, Ey);
        let maxY = Math.max(Sy, Ey);
        const plan = this.slingshotPlan;
        const pts = plan && plan.trajectoryPoints;
        if (pts && pts.length > 0) {
            for (const p of pts) {
                if (p.x < minX) minX = p.x;
                if (p.x > maxX) maxX = p.x;
                if (p.y < minY) minY = p.y;
                if (p.y > maxY) maxY = p.y;
            }
        }

        // Add a small world-space margin so nothing sits exactly on the edge.
        const worldW = Math.max(1, maxX - minX);
        const worldH = Math.max(1, maxY - minY);
        const marginW = 0.05 * worldW;
        const marginH = 0.05 * worldH;
        minX -= marginW; maxX += marginW;
        minY -= marginH; maxY += marginH;

        // Uniform-scale mapping from world -> minimap rectangle, preserving
        // aspect ratio and centering the content.
        const inset = 18; // leave space at top for the label
        const drawW = mw - 2 * 8;
        const drawH = mh - inset - 8;
        const drawX0 = mx + 8;
        const drawY0 = my + inset;
        const scale = Math.min(
            drawW / (maxX - minX),
            drawH / (maxY - minY)
        );
        const contentW = (maxX - minX) * scale;
        const contentH = (maxY - minY) * scale;
        const offX = drawX0 + 0.5 * (drawW - contentW);
        const offY = drawY0 + 0.5 * (drawH - contentH);
        const toMap = (wx, wy) => ({
            x: offX + (wx - minX) * scale,
            y: offY + (wy - minY) * scale
        });

        // Straight start->Earth baseline (dim green, for reference).
        {
            const a = toMap(Sx, Sy);
            const b = toMap(Ex, Ey);
            g.lineStyle(1, 0x008800, 0.9);
            g.beginPath();
            g.moveTo(a.x, a.y);
            g.lineTo(b.x, b.y);
            g.strokePath();
        }

        // Planned trajectory polyline (red).
        if (pts && pts.length >= 2) {
            g.lineStyle(1.5, 0xff3030, 1.0);
            g.beginPath();
            const first = toMap(pts[0].x, pts[0].y);
            g.moveTo(first.x, first.y);
            for (let i = 1; i < pts.length; i++) {
                const p = toMap(pts[i].x, pts[i].y);
                g.lineTo(p.x, p.y);
            }
            g.strokePath();
        }

        // Clip test: mapped point must lie inside the minimap panel to draw.
        const inPanel = (p) => (
            p.x >= mx && p.x <= mx + mw &&
            p.y >= my && p.y <= my + mh
        );

        // Stars (yellow filled circles, scaled physical radius clamped).
        // Black holes get a distinct look: black filled disk with a purple
        // annulus stroked around it, so they're immediately distinguishable
        // from stars even at small radar-marker sizes.
        // Off-domain objects are simply omitted; the map keeps its fixed extent.
        for (const s of stars) {
            const sp = toMap(s.x, s.y);
            if (!inPanel(sp)) continue;
            const sr = Math.max(3, Math.min(10, (s.radius || 0) * scale));
            const isBH = s.getData ? !!s.getData('isBlackHole') : false;
            if (isBH) {
                g.fillStyle(0x000000, 1.0);
                g.fillCircle(sp.x, sp.y, sr);
                g.lineStyle(2, 0xaa00ff, 1.0);
                g.strokeCircle(sp.x, sp.y, sr);
            } else {
                g.fillStyle(0xffdd33, 1.0);
                g.fillCircle(sp.x, sp.y, sr);
            }
        }

        // Earth (blue filled circle).
        {
            const ep = toMap(Ex, Ey);
            const er = Math.max(3, Math.min(8, 400 * scale));
            g.fillStyle(0x3388ff, 1.0);
            g.fillCircle(ep.x, ep.y, er);
        }

        // Start point (small green square marker).
        {
            const sp = toMap(Sx, Sy);
            g.fillStyle(0x00ff00, 1.0);
            g.fillRect(sp.x - 3, sp.y - 3, 6, 6);
        }

        // Ship (white dot with black outline). Clipped to the minimap so a
        // ship that wanders outside the fixed domain is simply hidden rather
        // than drawn over the main game view.
        if (shipX !== null) {
            const shp = toMap(shipX, shipY);
            if (inPanel(shp)) {
                g.fillStyle(0xffffff, 1.0);
                g.fillCircle(shp.x, shp.y, 3);
                g.lineStyle(1, 0x000000, 1.0);
                g.strokeCircle(shp.x, shp.y, 3);
            }
        }
    }

    drawSlingshotDebug() {
        if (!this.slingshotDebug) {
            return;
        }

        const g = this.slingshotDebug;
        g.clear();

        // Always draw baseline straight path from start to Earth, even if no
        // slingshot plan exists.
        const Sx = this.startX;
        const Sy = this.startY;
        const Ex = this.earthX;
        const Ey = this.earthY;

        g.lineStyle(3, 0x00ff00, 0.9);
        g.beginPath();
        g.moveTo(Sx, Sy);
        g.lineTo(Ex, Ey);
        g.strokePath();

        // Suppress the red plan drawing while the numeric sweep is still
        // running. The sweep-shading layer and the "currently being tested"
        // yellow line (both managed by updateSlingshotSweep) handle the
        // in-progress visualization.
        if (this.slingshotSweepActive) {
            return;
        }

        // If we have a slingshot plan, overlay its details (corridor, impact
        // circle, and red trajectory) on top of the green baseline.
        const plan = this.slingshotPlan;
        if (!plan) {
            return;
        }

        const obj = plan.object;
        if (obj) {
            const Cx = obj.x;
            const Cy = obj.y;

            // Draw impact parameter circle
            g.lineStyle(1, 0xff8800, 0.8);
            g.strokeCircle(Cx, Cy, plan.impactParameter);
        }

        const Tx = plan.tangentX;
        const Ty = plan.tangentY;

        // If the sweep produced a polyline, draw it as the true reference
        // path (curved by gravity). Segments before the peri-approach point
        // are drawn in bright red, segments after in a lighter red.
        const pts = plan.trajectoryPoints;
        if (pts && pts.length >= 2) {
            const periIdx = typeof plan.periIndex === 'number' ? plan.periIndex : pts.length - 1;

            g.lineStyle(2, 0xff0000, 0.9);
            g.beginPath();
            g.moveTo(pts[0].x, pts[0].y);
            for (let i = 1; i <= Math.min(periIdx, pts.length - 1); i++) {
                g.lineTo(pts[i].x, pts[i].y);
            }
            g.strokePath();

            if (periIdx < pts.length - 1) {
                g.lineStyle(2, 0xff8888, 0.9);
                g.beginPath();
                g.moveTo(pts[periIdx].x, pts[periIdx].y);
                for (let i = periIdx + 1; i < pts.length; i++) {
                    g.lineTo(pts[i].x, pts[i].y);
                }
                g.strokePath();
            }

            // Peri marker
            g.fillStyle(0xffffff, 0.9);
            g.fillCircle(Tx, Ty, 4);
        } else {
            // Fallback (no polyline): two straight chords S->T->E.
            g.lineStyle(2, 0xff0000, 0.8);
            g.beginPath();
            g.moveTo(Sx, Sy);
            g.lineTo(Tx, Ty);
            g.strokePath();

            g.lineStyle(2, 0xff4444, 0.8);
            g.beginPath();
            g.moveTo(Tx, Ty);
            g.lineTo(Ex, Ey);
            g.strokePath();
        }
    }

    drawTrajectoryGhost() {
        // Free-fall prediction: integrate the ship's current position and
        // velocity forward under gravity alone (no thrust) for a fixed
        // horizon, and draw the result as a dashed cyan line. Recomputed
        // every frame so it stays live with parameter and course changes.
        if (!this.player || !this.player.body) {
            return;
        }

        if (!this.trajectoryGhost) {
            this.trajectoryGhost = this.add.graphics();
            // Below the slingshot debug overlay (depth 500) so the planned
            // red/green lines remain visually dominant.
            this.trajectoryGhost.setDepth(499);
        }

        const g = this.trajectoryGhost;
        g.clear();

        // Only build a masses list if there are any; otherwise the prediction
        // is a straight line and we can skip the per-step gravity sum.
        const masses = (this.gravityObjects || [])
            .map(o => ({
                x: o.x,
                y: o.y,
                vx: (o.body && typeof o.body.velocity.x === 'number') ? o.body.velocity.x : 0,
                vy: (o.body && typeof o.body.velocity.y === 'number') ? o.body.velocity.y : 0,
                mu: o.getData('gravityStrength')
            }))
            .filter(m => typeof m.mu === 'number' && m.mu > 0);

        // Prediction horizon and integration step. 10 s horizon at 20 ms
        // per step = 500 steps; cheap even with several masses.
        const horizonSeconds = 10;
        const dt = 0.02;
        const steps = Math.floor(horizonSeconds / dt);

        // Dash pattern: draw N steps, skip M steps, repeat.
        const dashOn = 6;
        const dashOff = 4;

        let x = this.player.x;
        let y = this.player.y;
        let vx = this.player.body.velocity.x;
        let vy = this.player.body.velocity.y;

        g.lineStyle(2, 0x00ffff, 0.7);

        let segmentActive = false;
        let phase = 0; // counts within the current on/off block
        let onPhase = true;

        for (let i = 0; i < steps; i++) {
            // Gravity integration
            let ax = 0;
            let ay = 0;
            for (let m = 0; m < masses.length; m++) {
                const M = masses[m];
                const dxG = M.x - x;
                const dyG = M.y - y;
                const r2 = dxG * dxG + dyG * dyG;
                const r = Math.sqrt(r2);
                if (r > 1) {
                    const gAcc = M.mu / r2;
                    ax += (dxG / r) * gAcc;
                    ay += (dyG / r) * gAcc;
                }
            }

            // Advance each mass by its own velocity so the prediction accounts
            // for star drift over the 10 s horizon.
            for (let m = 0; m < masses.length; m++) {
                masses[m].x += masses[m].vx * dt;
                masses[m].y += masses[m].vy * dt;
            }

            vx += ax * dt;
            vy += ay * dt;
            const nx = x + vx * dt;
            const ny = y + vy * dt;

            if (onPhase) {
                if (!segmentActive) {
                    g.beginPath();
                    g.moveTo(x, y);
                    segmentActive = true;
                }
                g.lineTo(nx, ny);
            } else if (segmentActive) {
                g.strokePath();
                segmentActive = false;
            }

            x = nx;
            y = ny;

            phase++;
            if (onPhase && phase >= dashOn) {
                onPhase = false;
                phase = 0;
            } else if (!onPhase && phase >= dashOff) {
                onPhase = true;
                phase = 0;
            }
        }

        if (segmentActive) {
            g.strokePath();
        }
    }

            .setScrollFactor(0)
            .setDepth(1000);
        const mkText = (fontSize, color, bold) => this.add.text(0, 0, '', {
            fontSize: `${fontSize}px`,

        // is on. Sits below the dilationText.
        this.earthBudgetText = mkText(13, '#88bbff', true);

        // Running TEST-progress readout (top-right). Only populated when an
        // ensemble test is active. Left-aligned monospaced text so mean/sd
        // columns line up. Cumulative stats are computed from
        // experimentConfig.results, which persists across scene restarts.
        if (experimentConfig.enabled) {
            const camW = this.cameras.main.width;
            const s = this._computeExperimentStats();
            const pct = (x) => (x * 100).toFixed(1);
            const fmt = (x) => x.toFixed(2);
            const line = (label, st) => (st.n > 0)
                ? `${label}${fmt(st.mean).padStart(6)} \u00b1 ${fmt(st.sd).padStart(5)}`
                : `${label}    -   \u00b1   -  `;
            const totalRuns = experimentConfig.totalRuns;
            const currentRun = Math.min(experimentConfig.runIndex + 1, totalRuns);

            const lines = [];
            lines.push(`ENSEMBLE TEST  run ${currentRun}/${totalRuns}`);
            lines.push(`Successes: ${s.successCount}/${doneRuns}` +
                (doneRuns > 0 ? `  (${pct(s.successRate)}%)` : ''));
            if (s.failureCount > 0) {
                const parts = [];
                if (s.collisions > 0) parts.push(`${s.collisions} coll`);
                if (s.deadlines  > 0) parts.push(`${s.deadlines} dead`);
                lines.push(`Failures:  ${s.failureCount}  (${parts.join(', ')})`);
            }
            lines.push('');
            lines.push('Successful runs (mean \u00b1 sd):');
            lines.push(line('  Earth t (s): ', s.earthTime));
            lines.push(line('  Ship  t (s): ', s.shipTime));
            lines.push(line('  Lost  t (s): ', s.lostTime));
            lines.push(line('  Fuel used  : ', s.fuelUsed));

            const rate = (s) => (s.totalCompleted > 0)

                fontSize: '14px',
                fill: '#ffdd66',
                backgroundColor: '#000a',
                padding: { x: 10, y: 6 },
                fontFamily: 'monospace',
                align: 'left'
            }).setOrigin(1, 0).setScrollFactor(0).setDepth(1001);
        }

        
        // Instructions
        this.add.text(

            10,
            'Arrow Keys: Move   |   Space: Shoot\n' +
            'Navigate to Earth in the least possible time.\n' +
            'Avoid excessive time dilation.\n' +
            'Avoid or shoot down asteroids.\n' +

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relativistic Space Race</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        #game-container {
            border: 3px solid #0af;
            box-shadow: 0 0 30px rgba(0, 170, 255, 0.6);
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script>
    let bestEarthTime = null;

    const experimentConfig = {
        enabled: false,           // only enabled when "Test" mode is selected
        radius: 3000,             // radial distance from start to Earth
        // 0, 40, 80, ..., 320 (9 angles total)
        anglesDeg: Array.from({ length: 9 }, (_, i) => i * 40),
        trialsPerAngle: 4,
        successes: new Array(9).fill(0),
        attempts: new Array(9).fill(0),
        angleIndex: 0,
        trialIndex: 0,
        finished: false
    };

    const baseTuningParams = {
        vCruise: 250,
        brakeDistScale: 1.25,
        kpAngle: 35,
        kdAngle: 10.1,
        kiAngle: 1,
        kpAngleCruise: 2.2,
        kdAngleCruise: 3.0,
        kiAngleCruise: 0.2,
        kpAngleLand: 35,
        kdAngleLand: 2,
        kiAngleLand: 0.2,
        brakeTargetVr: -60,
        kpLateral: 0.7,
        kiLateral: 0.13,
        kdLateral: 0.44,
        maxLateralAccel: 100,
        Isp: 250
    };

    // Rocket-equation constants, power-limited engine model.
    //
    // We model the main engine as delivering a fixed jet power P_jet. Starting
    // from the two standard rocket identities
    //     F     = m_dot * v_e                       (thrust = momentum flux)
    //     P_jet = 0.5 * m_dot * v_e^2               (exhaust kinetic power)
    // eliminating m_dot gives P_jet = 0.5 * F * v_e, hence for fixed P_jet:
    //     F     = 2 * P_jet / v_e
    //     m_dot = F / v_e = 2 * P_jet / v_e^2
    // Both thrust and mass flow rate fall as v_e (equivalently Isp) grows,
    // reproducing the real chemical-vs-ion tradeoff without ad-hoc physics.
    //
    // Calibration: at the reference Isp = 300 s, v_e = 10000 (game units),
    // giving F = 22500 (peak accel 150 at full tank) and m_dot = 2.25 fuel/s,
    // which matches the previous constant-thrust behavior exactly.
    const SHIP_DRY_MASS = 50;
    const INITIAL_FUEL_MASS = 100;
    const ISP_REF = 300;
    const ISP_TO_VE = 10000 / ISP_REF; // so v_e(Isp=300) = 10000
    const REFERENCE_THRUST_FORCE = 150 * (SHIP_DRY_MASS + INITIAL_FUEL_MASS); // 22500
    const REFERENCE_EXHAUST_VELOCITY = ISP_REF * ISP_TO_VE; // 10000
    // Jet power chosen so F(Isp = ISP_REF) = REFERENCE_THRUST_FORCE.
    const MAIN_JET_POWER = 0.5 * REFERENCE_THRUST_FORCE * REFERENCE_EXHAUST_VELOCITY;
    // Gameplay tuning: propellant is consumed 50% faster than the ideal
    // rocket-equation mass-flow rate F/v_e would predict, applied uniformly
    // to both the main engine and the side thrusters so their fuel usage
    // stays in the same proportion as their thrust.
    const FUEL_BURN_MULTIPLIER = 1.5;

    function currentShipMass(scene) {
        return SHIP_DRY_MASS + Math.max(0, scene.fuel);
    }

    function currentExhaustVelocity() {
        return Math.max(1e-3, activeTuningParams.Isp) * ISP_TO_VE;
    }

    function currentMainThrustForce() {
        // Power-limited: F = 2 * P_jet / v_e. Higher Isp -> lower F AND
        // lower mass flow rate, self-consistently.
        return 2 * MAIN_JET_POWER / currentExhaustVelocity();
    }

    function currentMainThrustAccel(scene) {
        return currentMainThrustForce() / currentShipMass(scene);
    }

    function cloneTuningParams(src) {
        return {
            vCruise: src.vCruise,
            brakeDistScale: src.brakeDistScale,
            kpAngle: src.kpAngle,
            kdAngle: src.kdAngle,
            kiAngle: src.kiAngle,
            kpAngleCruise: src.kpAngleCruise,
            kdAngleCruise: src.kdAngleCruise,
            kiAngleCruise: src.kiAngleCruise,
            kpAngleLand: src.kpAngleLand,
            kdAngleLand: src.kdAngleLand,
            kiAngleLand: src.kiAngleLand,
            brakeTargetVr: src.brakeTargetVr,
            kpLateral: src.kpLateral,
            kiLateral: src.kiLateral,
            kdLateral: src.kdLateral,
            maxLateralAccel: src.maxLateralAccel,
            Isp: (typeof src.Isp === 'number' ? src.Isp : 300)
        };
    }

    let defaultTuningParams = cloneTuningParams(baseTuningParams);
    let activeTuningParams = cloneTuningParams(defaultTuningParams);
    let lastAdoptedSuccessRate = null;

    // Persistent mode across scene restarts: 'MENU', 'TEST', 'AUTOPILOT', 'MANUAL'
    let globalMode = 'MENU';

    // Global feature toggles for world content
    let globalEnableMassiveObjects = false;
    let globalEnableAsteroids = false;
    let globalEnableTokens = false;

    const TUNING_STORAGE_KEY = 'spaceGameTuning_v1';

    function saveTuningToStorage() {
        try {
            const data = {
                defaultParams: defaultTuningParams,
                activeParams: activeTuningParams,
                lastSuccess: lastAdoptedSuccessRate
            };
            window.localStorage.setItem(TUNING_STORAGE_KEY, JSON.stringify(data));
        } catch (e) {
        }
    }

    function loadTuningFromStorage() {
        try {
            const raw = window.localStorage.getItem(TUNING_STORAGE_KEY);
            if (!raw) return;
            const data = JSON.parse(raw);
            if (data && data.defaultParams) {
                defaultTuningParams = cloneTuningParams(data.defaultParams);
                if (data.activeParams) {
                    activeTuningParams = cloneTuningParams(data.activeParams);
                } else {
                    activeTuningParams = cloneTuningParams(defaultTuningParams);
                }
                if (typeof data.lastSuccess === 'number') {
                    lastAdoptedSuccessRate = data.lastSuccess;
                }
            }
        } catch (e) {
        }
    }

    loadTuningFromStorage();

    const tuningParamsDefinition = [
        { key: 'vCruise',       label: 'Cruise speed',                 step: 20,   min: 50,   max: 800,  decimals: 0 },
        { key: 'brakeDistScale',label: 'Brake distance scale',         step: 0.05, min: 0.1,  max: 5.0,  decimals: 2 },
        { key: 'kpAngle',       label: 'ORIENT kp',                    step: 0.2,  min: 0.0,  max: 50.0, decimals: 2 },
        { key: 'kdAngle',       label: 'ORIENT kd',                    step: 0.1,  min: 0.0,  max: 50.0, decimals: 2 },
        { key: 'kiAngle',       label: 'ORIENT ki',                    step: 0.05, min: 0.0,  max: 50.0, decimals: 2 },
        { key: 'kpAngleCruise', label: 'CRUISE kp',                    step: 0.2,  min: 0.0,  max: 50.0, decimals: 2 },
        { key: 'kdAngleCruise', label: 'CRUISE kd',                    step: 0.1,  min: 0.0,  max: 50.0, decimals: 2 },
        { key: 'kiAngleCruise', label: 'CRUISE ki',                    step: 0.05, min: 0.0,  max: 50.0, decimals: 2 },
        { key: 'kpAngleLand',   label: 'LAND kp',                      step: 0.2,  min: 0.0,  max: 50.0, decimals: 2 },
        { key: 'kdAngleLand',   label: 'LAND kd',                      step: 0.1,  min: 0.0,  max: 50.0, decimals: 2 },
        { key: 'kiAngleLand',   label: 'LAND ki',                      step: 0.05, min: 0.0,  max: 50.0, decimals: 2 },
        { key: 'brakeTargetVr', label: 'BRAKE target v_r (negative)',  step: 5,    min: -400, max: -1,   decimals: 0 },
        { key: 'kpLateral',     label: 'Lateral kp',                   step: 0.01, min: 0.0,  max: 1.0,  decimals: 3 },
        { key: 'kiLateral',     label: 'Lateral ki',                   step: 0.01, min: 0.0,  max: 1.0,  decimals: 3 },
        { key: 'kdLateral',     label: 'Lateral kd',                   step: 0.01, min: 0.0,  max: 1.0,  decimals: 3 },
        { key: 'maxLateralAccel', label: 'Max lateral accel',          step: 10,   min: 0.0,  max: 500,  decimals: 0 },
        { key: 'Isp',           label: 'Specific impulse Isp (s)',     step: 25,   min: 100,  max: 1000, decimals: 0 }
    ];

// Autopilot Controller with EKF and 5-phase state machine
class AutopilotController {
    constructor(scene) {
        this.scene = scene;
        this.enabled = false;
        
        // Phase state machine (simplified)
        this.phases = {
            ORIENT: 0,
            BOOST: 1,
            CRUISE: 2,
            BRAKE: 3,
            LAND: 4
        };
        this.currentPhase = this.phases.ORIENT;
        
        // Control parameters
        this.vCruise = activeTuningParams.vCruise;
        // NOTE: with the rocket equation in effect, actual thrust acceleration
        // grows as fuel is spent. These values are the reference (full-tank)
        // magnitudes; live values are read via this.getCurrentThrustAccel().
        this.aMax = 150;      // reference max decel used in braking distance calc
        this.shipMass = 1.0;  // effective ship mass for analytic impulse calc (unitless in impulse space)
        this.thrustAccel = 150; // reference thrust acceleration magnitude at full tank
        this.kBrake = 2.0;    // braking distance factor (safety margin)
        this.maxLandingSpeed = 100;
        this.maxLandingAngle = Phaser.Math.DegToRad(10);

        // Attitude dynamics parameters (must match applyControl)
        this.angularAccel = 3.0; // was 4.0, slightly softer turns
        this.maxAngularSpeed = 3.5; // was 4.0

        // Estimate turn time for a 180° reorientation using bang-bang angular accel.
        const alpha = this.angularAccel;
        // Symmetric bang-bang profile: turn π radians; approximate total time.
        this.tTurnEst = 2 * Math.sqrt(Math.PI / Math.max(alpha, 1e-3));
        
        // Cached control state for visualization
        this.lastControl = { angularControl: 0, thrust: false };

        // State for tangential-velocity impulse corrections during CRUISE
        this.vTanCorrectionActive = false;
        this.timeSinceLastVTanCorrection = 9999; // seconds since last correction ended
        this.vTanCorrectionBurnTime = 0;   // retained for debugging, not used for termination
        this.vTanCorrectionElapsed = 0;    // time spent actually burning in current correction
        this.vTanCorrectionRemainingImpulse = 0; // remaining desired impulse m*|v_tan|
        this.vTanImpulseGain = 1.25;       // over-impulse factor to reduce undercorrection
        
        // State for ORIENT-phase bang-bang + fine PID control
        this.orientBangActive = false;
        this.orientBangSign = 0;
        this.orientBangHalfDuration = 0;
        this.orientBangElapsed = 0;
        this.orientBangUsed = false; // true after the initial bang-bang schedule has completed
        
        // Attitude PID gains (tuned for faster convergence with damping)
        // ORIENT/BOOST: more aggressive (higher P, I; lower D)
        this.kpAngle = activeTuningParams.kpAngle;
        this.kdAngle = activeTuningParams.kdAngle;
        this.kiAngle = activeTuningParams.kiAngle;
        this.angleErrorInt = 0;

        // CRUISE/BRAKE (and early LAND) attitude PID: smoother, more damped
        this.kpAngleCruise = activeTuningParams.kpAngleCruise;
        this.kdAngleCruise = activeTuningParams.kdAngleCruise;
        this.kiAngleCruise = activeTuningParams.kiAngleCruise;
        this.angleErrorIntCruise = 0;

        // LAND-phase fine attitude PID (used when speed is already low)
        this.kpAngleLand = activeTuningParams.kpAngleLand;
        this.kdAngleLand = activeTuningParams.kdAngleLand;
        this.kiAngleLand = activeTuningParams.kiAngleLand;
        this.angleErrorIntLand = 0;

        this.kpLateral = activeTuningParams.kpLateral;
        this.kiLateral = activeTuningParams.kiLateral;
        this.kdLateral = activeTuningParams.kdLateral;
        this.maxLateralAccel = activeTuningParams.maxLateralAccel;
        this.lateralErrorInt = 0;
        this.lateralLookaheadTime = 2.0;
    }

    // Live main-engine acceleration magnitude under the rocket equation.
    getCurrentThrustAccel() {
        return currentMainThrustAccel(this.scene);
    }
    
    getSensorVector() {
        const player = this.scene.player;
        const earth = this.scene.earth;
        
        // IMU: attitude and angular velocity
        const theta = this.scene.playerAngle;
        const omega = this.scene.angularVelocity;
        
        // Earth beacon: bearing and distance
        const dx = earth.x - player.x;
        const dy = earth.y - player.y;
        const distToEarth = Math.sqrt(dx * dx + dy * dy);
        const bearingToEarth = Math.atan2(dy, dx);
        // Distance to Earth's SURFACE (not center). Earth radius here must
        // match createEarth (80 * 5 = 400 px). Phase transition logic uses
        // surface distance, which is the physically meaningful quantity for
        // "how much runway remains before impact".
        const EARTH_RADIUS_PX = 80 * 5;
        const distToEarthSurface = Math.max(0, distToEarth - EARTH_RADIUS_PX);
        
        // Velocity (from IMU integration)
        const vx = player.body.velocity.x;
        const vy = player.body.velocity.y;
        
        // Resources
        const fuelFrac = this.scene.fuel / 100;
        const ammo = this.scene.ammo;
        
        return {
            theta, omega,
            bearingToEarth, distToEarth, distToEarthSurface,
            vx, vy,
            fuelFrac, ammo
        };
    }

    getSlingshotPathFrame() {
        const plan = this.scene.slingshotPlan;
        if (!plan) {
            return null;
        }

        const Px = this.scene.player.x;
        const Py = this.scene.player.y;
        const Tx = plan.tangentX;
        const Ty = plan.tangentY;

        // If the sweep produced a full polyline, use it as the reference path
        // (the actual curved trajectory the sim predicted under gravity). This
        // is what the ship should follow, because the plan was constructed
        // assuming gravity would bend the flight; measuring cross-track error
        // against the straight S->T chord instead would tell the controller
        // to fight the very deflection that makes the slingshot work.
        const pts = plan.trajectoryPoints;
        if (pts && pts.length >= 2) {
            // Walk all segments to find the one whose perpendicular foot is
            // closest to the ship. Cost is O(N) with N ~ 100 waypoints per
            // frame; negligible.
            let bestIdx = 0;
            let bestDist2 = Number.POSITIVE_INFINITY;
            let bestProjX = pts[0].x;
            let bestProjY = pts[0].y;
            let bestTx = 1;
            let bestTy = 0;

            for (let i = 0; i < pts.length - 1; i++) {
                const A = pts[i];
                const B = pts[i + 1];
                const dxSeg = B.x - A.x;
                const dySeg = B.y - A.y;
                const segLen2 = dxSeg * dxSeg + dySeg * dySeg;
                if (segLen2 < 1e-6) continue;
                const t = ((Px - A.x) * dxSeg + (Py - A.y) * dySeg) / segLen2;
                const tc = Phaser.Math.Clamp(t, 0, 1);
                const px = A.x + tc * dxSeg;
                const py = A.y + tc * dySeg;
                const dx = Px - px;
                const dy = Py - py;
                const d2 = dx * dx + dy * dy;
                if (d2 < bestDist2) {
                    bestDist2 = d2;
                    bestIdx = i;
                    bestProjX = px;
                    bestProjY = py;
                    const segLen = Math.sqrt(segLen2);
                    bestTx = dxSeg / segLen;
                    bestTy = dySeg / segLen;
                }
            }

            const offPosX = Px - bestProjX;
            const offPosY = Py - bestProjY;
            const offPosMag = Math.sqrt(bestDist2);

            const periIdx = typeof plan.periIndex === 'number' ? plan.periIndex : pts.length - 1;
            const beforeT = bestIdx < periIdx;

            const dxToT = Tx - Px;
            const dyToT = Ty - Py;
            const distToT = Math.sqrt(dxToT * dxToT + dyToT * dyToT);

            return {
                pathX: bestTx,
                pathY: bestTy,
                projX: bestProjX,
                projY: bestProjY,
                offPosX,
                offPosY,
                offPosMag,
                beforeT,
                distToT,
                tangentX: Tx,
                tangentY: Ty,
                polyline: true
            };
        }

        // ---- Fallback: no polyline available. Use the straight-chord logic
        // (S -> T before apex, T -> E after apex). Only relevant when the
        // sweep did not run or did not produce a trajectory (e.g., analytic
        // plan only).
        const Sx = plan.startX;
        const Sy = plan.startY;

        const dInX = plan.dirX;
        const dInY = plan.dirY;

        const dxPS = Px - Sx;
        const dyPS = Py - Sy;
        const s = dxPS * dInX + dyPS * dInY;

        const dxST = Tx - Sx;
        const dyST = Ty - Sy;
        const sT = dxST * dInX + dyST * dInY;

        const dxToT = Tx - Px;
        const dyToT = Ty - Py;
        const distToT = Math.sqrt(dxToT * dxToT + dyToT * dyToT);

        const beforeT = s < (sT - 5);

        const Ex = plan.earthX;
        const Ey = plan.earthY;

        let pathX;
        let pathY;
        let baseX;
        let baseY;

        if (beforeT && distToT > 1e-3) {
            const lenIn = Math.sqrt(dInX * dInX + dInY * dInY) || 1;
            pathX = dInX / lenIn;
            pathY = dInY / lenIn;
            baseX = Sx;
            baseY = Sy;
        } else {
            const dxTE = Ex - Tx;
            const dyTE = Ey - Ty;
            const lenOut = Math.sqrt(dxTE * dxTE + dyTE * dyTE);
            if (lenOut < 1e-3) {
                return null;
            }
            pathX = dxTE / lenOut;
            pathY = dyTE / lenOut;
            baseX = Tx;
            baseY = Ty;
        }

        // Project ship position onto the current reference chord.
        const dxPB = Px - baseX;
        const dyPB = Py - baseY;
        const sPar = dxPB * pathX + dyPB * pathY;
        const projX = baseX + sPar * pathX;
        const projY = baseY + sPar * pathY;
        const offPosX = Px - projX;
        const offPosY = Py - projY;
        const offPosMag = Math.sqrt(offPosX * offPosX + offPosY * offPosY);

        return {
            pathX,
            pathY,
            projX,
            projY,
            offPosX,
            offPosY,
            offPosMag,
            beforeT,
            distToT,
            tangentX: Tx,
            tangentY: Ty,
            polyline: false
        };
    }
    
    computeDesiredHeading(sensors) {
        const vx = sensors.vx;
        const vy = sensors.vy;

        // Base direction: from ship to Earth (radial inward)
        const bearing = sensors.bearingToEarth;
        const ex = Math.cos(bearing);
        const ey = Math.sin(bearing);

        // Decompose velocity into radial/tangential components relative to Earth
        const radialAngleOut = bearing + Math.PI; // radial outward from Earth
        const ux = Math.cos(radialAngleOut);
        const uy = Math.sin(radialAngleOut);
        const radialV = vx * ux + vy * uy;
        const vtX = vx - radialV * ux;
        const vtY = vy - radialV * uy;
        const tangentialV = Math.sqrt(Math.max(0, vtX * vtX + vtY * vtY));

        let vtCorrX = vtX;
        let vtCorrY = vtY;
        let tangentialCorr = tangentialV;

        const planForV = this.scene.slingshotPlan;
        if (planForV) {
            const frameV = this.getSlingshotPathFrame();
            if (frameV && frameV.beforeT) {
                const pathX = frameV.pathX;
                const pathY = frameV.pathY;
                const vPar = vx * pathX + vy * pathY;
                const vParX = vPar * pathX;
                const vParY = vPar * pathY;
                const offX = vx - vParX;
                const offY = vy - vParY;
                const offMag = Math.sqrt(Math.max(0, offX * offX + offY * offY));
                vtCorrX = offX;
                vtCorrY = offY;
                tangentialCorr = offMag;
            }
        }

        // Default desired direction: directly toward Earth
        let nx = ex;
        let ny = ey;

        // If we have a slingshot plan and we're in ORIENT / BOOST / CRUISE,
        // follow the planned red trajectory. The base desired heading is the
        // local path tangent, with a small lateral bias to drive cross-track
        // position error toward zero, instead of aiming directly at the apex T.
        const plan = this.scene.slingshotPlan;
        const inSlingshotPhase =
            this.currentPhase === this.phases.ORIENT ||
            this.currentPhase === this.phases.BOOST ||
            this.currentPhase === this.phases.CRUISE;

        if (plan && inSlingshotPhase) {
            const frame = this.getSlingshotPathFrame();
            if (frame && frame.beforeT) {
                const pathX = frame.pathX;
                const pathY = frame.pathY;

                // Base heading: along the local path tangent (from the
                // polyline reference when available).
                nx = pathX;
                ny = pathY;

                const offPosX = frame.offPosX;
                const offPosY = frame.offPosY;
                const offPosMag = frame.offPosMag;

                // Tighter reference scale so the heading bias saturates at
                // relatively small cross-track errors and produces a strong
                // corrective tilt even when impact parameters are huge in
                // pixel units. 200 px is roughly one ship-length at cruise.
                const maxOff = 200;

                if (offPosMag > 1e-3 && maxOff > 0) {
                    // Cross-track error in screen coords (y-down). For path
                    // direction (pathX,pathY) and offset (offPosX,offPosY),
                    //   cross = pathX*offPosY - pathY*offPosX
                    // is positive when the ship lies to the RIGHT of the path
                    // (using the right-hand rule in a y-down screen frame).
                    // To pull the ship back onto the line we must rotate the
                    // heading toward the LEFT when cross > 0 (negative delta
                    // in screen coords), and toward the RIGHT when cross < 0
                    // (positive delta). The previous sign was inverted, which
                    // caused the ship to steer away from the red line instead
                    // of toward it.
                    const cross = pathX * offPosY - pathY * offPosX;
                    const sign = cross >= 0 ? -1 : 1;

                    const maxAngle = Phaser.Math.DegToRad(12); // max heading tilt for correction
                    const scale = Phaser.Math.Clamp(offPosMag / maxOff, 0, 1);
                    const delta = sign * maxAngle * scale;

                    const cosD = Math.cos(delta);
                    const sinD = Math.sin(delta);
                    const adjX = pathX * cosD - pathY * sinD;
                    const adjY = pathX * sinD + pathY * cosD;
                    nx = adjX;
                    ny = adjY;
                }
            }
        }

        // During CRUISE, if a v_tan correction is active, point exactly opposite v_tan.
        if (this.currentPhase === this.phases.CRUISE && this.vTanCorrectionActive && tangentialCorr > 1e-3) {
            const tx = vtCorrX / tangentialCorr;
            const ty = vtCorrY / tangentialCorr;
            nx = -tx;
            ny = -ty;
        }

        let targetAngle = Math.atan2(ny, nx);
        if (!Number.isFinite(targetAngle)) {
            targetAngle = bearing;
        }

        // BRAKE: nose radially outward so braking thrust is purely radial
        if (this.currentPhase === this.phases.BRAKE) {
            targetAngle = Phaser.Math.Angle.Wrap(bearing + Math.PI);
        }

        // LAND: same radial-outward attitude for final approach
        if (this.currentPhase === this.phases.LAND) {
            targetAngle = Phaser.Math.Angle.Wrap(bearing + Math.PI);
        }
        
        return targetAngle;
    }
    
    updatePhase(sensors) {
        const speed = Math.sqrt(sensors.vx * sensors.vx + sensors.vy * sensors.vy);
        // Use SURFACE distance (not center-to-center) for phase transitions.
        // This is the physically meaningful "runway remaining before impact".
        const dist = sensors.distToEarthSurface;

        // Decompose velocity into radial/tangential components relative to Earth
        const radialAngle = sensors.bearingToEarth + Math.PI; // radial outward from Earth
        const radialV = sensors.vx * Math.cos(radialAngle) + sensors.vy * Math.sin(radialAngle);

        // Use radial speed magnitude to determine braking distance (from the
        // Earth's surface, not its center).
        const vRadialMag = Math.max(Math.abs(radialV), 1);
        const aBrake = Math.max(1e-3, this.getCurrentThrustAccel());
        const brakeBase = this.kBrake * (vRadialMag * vRadialMag) / (2 * aBrake) + this.vCruise * this.tTurnEst;
        const brakeDist = activeTuningParams.brakeDistScale * brakeBase;

        switch (this.currentPhase) {
            case this.phases.ORIENT:
                // Transition as soon as the initial bang-bang attitude
                // schedule has completed. Any residual attitude error is
                // handled by the CRUISE/BOOST PID controller along the path,
                // so we no longer wait for a tight angle+rate convergence
                // here.
                if (this.orientBangUsed) {
                    // Only go straight to BRAKE if we're close enough, generally inward,
                    // and moving at a reasonable inward speed; otherwise BOOST toward cruise.
                    const vRadInwardEnough = radialV < -0.3 * this.vCruise;
                    if (dist <= brakeDist && vRadInwardEnough) {
                        console.log('Phase: ORIENT -> BRAKE');
                        this.currentPhase = this.phases.BRAKE;
                    } else {
                        console.log('Phase: ORIENT -> BOOST');
                        this.currentPhase = this.phases.BOOST;
                    }
                }
                break;
                
            case this.phases.BOOST:
                // Accelerate to cruise speed
                if (speed >= this.vCruise) {
                    this.currentPhase = this.phases.CRUISE;
                }
                break;
                
            case this.phases.CRUISE: {
                // Prefer to enter BRAKE once we're within the braking distance and moving inward.
                const vRadInwardEnough = radialV < -0.3 * this.vCruise;
                if (dist <= brakeDist && vRadInwardEnough) {
                    this.currentPhase = this.phases.BRAKE;
                } else if (speed > 20) {
                    // Require a sizeable inward (toward Earth) component of velocity
                    const radialFraction = radialV / speed; // radialV < 0 means inward
                    if (radialFraction > -0.1 && dist > brakeDist * 0.5) {
                        // Not making good progress toward Earth and not yet deep in the
                        // braking region; re-orient to improve trajectory.
                        this.currentPhase = this.phases.ORIENT;
                    }
                }
                break;
            }

            case this.phases.BRAKE: {
                // Two exits:
                //   BRAKE -> ORIENT if we've been pushed back outward (radialV > 0).
                //   BRAKE -> LAND when we are within the braking distance of the
                //   surface AND the radial velocity is within +/-30% of the
                //   desired brake target.
                if (radialV > 0) {
                    this.currentPhase = this.phases.ORIENT;
                    break;
                }
                const target = activeTuningParams.brakeTargetVr; // negative (inward)
                const tol = 0.3 * Math.abs(target);
                const vrOnTarget = Math.abs(radialV - target) <= tol;
                if (dist <= brakeDist && vrOnTarget) {
                    this.currentPhase = this.phases.LAND;
                }
                break;
            }

            case this.phases.LAND:
                // Final approach - stay in this phase until touchdown
                break;
        }
    }
    
    computeControl(sensors, dt) {
        // PID controller for attitude
        const desiredHeading = this.computeDesiredHeading(sensors);
        const angleError = Phaser.Math.Angle.Wrap(desiredHeading - sensors.theta);
        const speed = Math.sqrt(sensors.vx * sensors.vx + sensors.vy * sensors.vy);
        const landTrimSpeed = this.maxLandingSpeed * 0.5;
        const inLandPhase = this.currentPhase === this.phases.LAND;
        const landTrimActive = inLandPhase && speed <= landTrimSpeed;

        if (this.currentPhase !== this.phases.ORIENT) {
            if (this.orientBangActive) {
                this.orientBangActive = false;
                this.orientBangElapsed = 0;
            }
            // Reset ORIENT bang-bang usage when leaving ORIENT so that a new
            // phase can perform a fresh initial bang-bang maneuver.
            this.orientBangUsed = false;
        }

        let angularControl;
        if (inLandPhase) {
            // LAND-phase attitude PID: always active while in LAND.
            this.angleErrorIntLand += angleError * dt;
            this.angleErrorIntLand = Phaser.Math.Clamp(this.angleErrorIntLand, -1.0, 1.0);
            angularControl =
                this.kpAngleLand * angleError +
                this.kiAngleLand * this.angleErrorIntLand -
                this.kdAngleLand * sensors.omega;
            // Reset other integrators while in LAND
            this.angleErrorIntCruise = 0;
            this.angleErrorInt = 0;
        } else {
            // Phase-specific attitude PID and ORIENT bang-bang control
            let kp = this.kpAngle;
            let ki = this.kiAngle;
            let kd = this.kdAngle;

            const isCruiseLike =
                this.currentPhase === this.phases.CRUISE ||
                this.currentPhase === this.phases.BRAKE;

            if (isCruiseLike) {
                kp = this.kpAngleCruise;
                ki = this.kiAngleCruise;
                kd = this.kdAngleCruise;
                this.angleErrorIntCruise += angleError * dt;
                this.angleErrorIntCruise = Phaser.Math.Clamp(this.angleErrorIntCruise, -2.0, 2.0);
                this.angleErrorInt = 0;
                angularControl =
                    kp * angleError +
                    ki * this.angleErrorIntCruise -
                    kd * sensors.omega;
            } else if (this.currentPhase === this.phases.ORIENT) {
                // In ORIENT, we perform a single bang-bang schedule to remove
                // most of the initial error, then hand off to a sensitive PID
                // controller to smoothly drive the residual error to zero.
                this.angleErrorIntCruise = 0;

                if (!this.orientBangUsed) {
                    // Run the initial bang-bang schedule once.
                    this.angleErrorInt = 0;

                    if (!this.orientBangActive) {
                        const errMag = Math.abs(angleError);
                        const alpha = Math.max(this.angularAccel, 1e-3);
                        const halfDuration = Math.sqrt(errMag / alpha);
                        if (halfDuration > 0 && errMag > Phaser.Math.DegToRad(0.01)) {
                            const sign = angleError >= 0 ? 1 : -1;
                            this.orientBangActive = true;
                            this.orientBangSign = sign;
                            this.orientBangHalfDuration = halfDuration;
                            this.orientBangElapsed = 0;
                        } else {
                            // If the error is already tiny, skip bang-bang and
                            // immediately fall back to fine PID below.
                            this.orientBangUsed = true;
                        }
                    }

                    if (this.orientBangActive) {
                        this.orientBangElapsed += dt;
                        const totalDuration = 2 * this.orientBangHalfDuration;
                        if (this.orientBangElapsed < this.orientBangHalfDuration) {
                            angularControl = this.orientBangSign;
                        } else if (this.orientBangElapsed < totalDuration) {
                            angularControl = -this.orientBangSign;
                        } else {
                            // Bang-bang schedule completed; mark as used and
                            // switch to the fine PID controller.
                            this.orientBangActive = false;
                            this.orientBangElapsed = 0;
                            this.orientBangUsed = true;
                        }
                    }
                }

                if (this.orientBangUsed && !this.orientBangActive) {
                    // Fine ORIENT PID: make it very sensitive to small errors
                    // with tight integrator clamping so that the final error
                    // decays smoothly to zero.
                    const kpFine = this.kpAngle * 1.5;
                    const kiFine = this.kiAngle;
                    const kdFine = this.kdAngle;

                    this.angleErrorInt += angleError * dt;
                    this.angleErrorInt = Phaser.Math.Clamp(this.angleErrorInt, -0.2, 0.2);

                    angularControl =
                        kpFine * angleError +
                        kiFine * this.angleErrorInt -
                        kdFine * sensors.omega;
                }
            } else {
                this.angleErrorInt += angleError * dt;
                this.angleErrorInt = Phaser.Math.Clamp(this.angleErrorInt, -2.0, 2.0);
                this.angleErrorIntCruise = 0;
                angularControl =
                    kp * angleError +
                    ki * this.angleErrorInt -
                    kd * sensors.omega;
            }

            // Reset LAND integral when not in final-trim mode
            this.angleErrorIntLand = 0;
        }
        
        // Thrust control based on phase
        let thrust = false;
        let thrustScale = 1.0;
        let lateralThrust = 0;
        
        switch (this.currentPhase) {
            case this.phases.ORIENT:
                // No thrust during orientation
                thrust = false;
                break;
                
            case this.phases.BOOST: {
                // In BOOST, apply continuous full thrust while the attitude
                // controller keeps us aligned. ORIENT->BOOST already enforces
                // a reasonably tight alignment (~0.5°), so additional gating
                // here risks stalling at low speed. Simply burn until vCruise
                // is reached, at which point updatePhase switches to CRUISE.
                thrust = true;
                thrustScale = 1.0;
                break;
            }
                
            case this.phases.CRUISE: {
                // Radial-speed maintenance during cruise. The discrete v_tan
                // impulse controller has been removed: lateral corrections are
                // now handled continuously by the unified side-thruster PID at
                // the bottom of computeControl.
                const bearing = sensors.bearingToEarth;
                const radialAngleOut = bearing + Math.PI;
                const ux = Math.cos(radialAngleOut);
                const uy = Math.sin(radialAngleOut);
                const radialV = sensors.vx * ux + sensors.vy * uy;

                // Path-relative velocity decomposition (for the radial-speed
                // maintenance rule below). When a slingshot plan exists we use
                // the local path tangent from the polyline path frame; else we
                // fall back to Earth-radial.
                let radialForControl = radialV;

                const planCruise = this.scene.slingshotPlan;
                let frameCruise = null;
                if (planCruise) {
                    frameCruise = this.getSlingshotPathFrame();
                }
                if (frameCruise) {
                    radialForControl =
                        sensors.vx * frameCruise.pathX + sensors.vy * frameCruise.pathY;
                }

                // Radial-velocity maintenance: keep the along-path (or Earth-
                // radial when no plan) component of velocity near vCruise while
                // the ship is nose-aligned with its desired heading.
                if (!thrust) {
                    const vRadMinMag = this.vCruise;
                    let needMoreInward;
                    if (frameCruise) {
                        needMoreInward = radialForControl < vRadMinMag;
                    } else {
                        needMoreInward =
                            (radialForControl >= 0) ||
                            (Math.abs(radialForControl) < vRadMinMag);
                    }
                    if (needMoreInward) {
                        const alignedRadialInward = Math.abs(angleError) < 0.3;
                        if (alignedRadialInward) {
                            thrust = true;
                        }
                    }
                }

                break;
            }

            case this.phases.BRAKE: {
                // Thrust to decelerate until inward radial speed is reduced to ~50 units,
                // but only once we're aligned with the radial-outward heading.
                const bearing = sensors.bearingToEarth;
                const radialAngleOut = bearing + Math.PI;
                const ux = Math.cos(radialAngleOut);
                const uy = Math.sin(radialAngleOut);
                const radialV = sensors.vx * ux + sensors.vy * uy; // outward > 0, inward < 0

                const alignedForBrake = Math.abs(angleError) < 0.2; // wider window to reduce pulsing
                const targetInwardSpeed = activeTuningParams.brakeTargetVr; // desired inward radial velocity after braking
                const needMoreBrake = radialV < targetInwardSpeed; // still too fast inward

                thrust = alignedForBrake && needMoreBrake;
                if (thrust) {
                    // Slightly reduced thrust during BRAKE
                    thrustScale = 0.95;
                }
                break;
            }

            case this.phases.LAND: {
                // Hold the inward radial velocity near brakeTargetVr - the
                // same target that gated the BRAKE -> LAND transition. Fire
                // the main thruster (which points radially outward here) any
                // time the ship is falling faster than that target and the
                // nose is close to the radial-outward heading.
                const bearing = sensors.bearingToEarth;
                const radialOut = bearing + Math.PI;
                const ux = Math.cos(radialOut);
                const uy = Math.sin(radialOut);
                const radialV = sensors.vx * ux + sensors.vy * uy; // outward > 0, inward < 0

                const alignedForLand = Math.abs(angleError) < 0.2;
                const targetInwardSpeed = activeTuningParams.brakeTargetVr;
                const fallingTooFast = radialV < targetInwardSpeed;

                thrust = alignedForLand && fallingTooFast;
                if (thrust) {
                    thrustScale = 0.95;
                }
                break;
            }
        }

        // ---- Unified lateral (side-thruster) control ----
        // Side thrusters are computed for CRUISE / BRAKE / LAND (see the
        // phase gating below). They minimize the ship's cross-track distance
        // from the polyline reference path in CRUISE, and null Earth-
        // tangential velocity in BRAKE / LAND.
        if (this.currentPhase !== this.phases.ORIENT) {
            lateralThrust = this.computeLateralThrust(sensors, dt);
        }

        // ---- Actuator availability by phase ----
        // Main thruster: BOOST, BRAKE, and LAND (LAND uses it to hold the
        // inward radial velocity near brakeTargetVr).
        // Side thrusters: CRUISE, BRAKE, and LAND.
        // (ORIENT rotates in place with neither thruster active.)
        const phase = this.currentPhase;
        const mainAllowed =
            phase === this.phases.BOOST ||
            phase === this.phases.BRAKE ||
            phase === this.phases.LAND;
        const lateralAllowed =
            phase === this.phases.CRUISE ||
            phase === this.phases.BRAKE ||
            phase === this.phases.LAND;

        if (!mainAllowed) {
            thrust = false;
            thrustScale = 0;
        }
        if (!lateralAllowed) {
            lateralThrust = 0;
        }

        return { angularControl, thrust, thrustScale, lateralThrust };
    }

    computeLateralThrust(sensors, dt) {
        // In BRAKE and LAND, ignore the polyline reference entirely. The
        // sweep polyline ends near the star, so once we are on Earth
        // approach it produces stale cross-track errors that push the ship
        // sideways during braking. Instead, null the Earth-tangential
        // velocity component so the descent stays purely radial and all of
        // the braking thrust decelerates inward motion.
        if (this.currentPhase === this.phases.BRAKE ||
            this.currentPhase === this.phases.LAND) {
            const bearing = sensors.bearingToEarth;
            const radialOut = bearing + Math.PI;
            const ux = Math.cos(radialOut);
            const uy = Math.sin(radialOut);
            // Perpendicular to Earth-radial (rotate radialOut by +90 deg).
            const px = -uy;
            const py = ux;
            const vTanEarth = sensors.vx * px + sensors.vy * py;
            const aLatCmd = -this.kpLateral * vTanEarth;
            return Phaser.Math.Clamp(aLatCmd, -this.maxLateralAccel, this.maxLateralAccel);
        }

        const plan = this.scene.slingshotPlan;
        const frame = plan ? this.getSlingshotPathFrame() : null;

        // Deadband: skip side-thruster firing when the ship is already
        // essentially on the reference path and its velocity is essentially
        // tangent to it. Position tolerance = 5% of ~22 px ship length;
        // angle tolerance = 0.1 deg.
        const shipLenPx = 22;
        const posDeadband = 0.05 * shipLenPx;
        const angleDeadband = Phaser.Math.DegToRad(0.1);

        if (frame) {
            const pathX = frame.pathX;
            const pathY = frame.pathY;
            const offPosX = frame.offPosX;
            const offPosY = frame.offPosY;
            const offPosMag = frame.offPosMag;

            // Signed cross-track position error (screen y-down convention).
            const crossPos = pathX * offPosY - pathY * offPosX;
            // Cross-track velocity component (lateral speed in path frame).
            const vLat = sensors.vx * (-pathY) + sensors.vy * pathX;

            // Reference scale so PID saturates for modest deviations.
            const maxOff = 200;
            const lookahead = this.lateralLookaheadTime;
            const predictedErr = crossPos + vLat * lookahead;
            const clampedPosErr = Phaser.Math.Clamp(predictedErr, -maxOff, maxOff);

            this.lateralErrorInt = Phaser.Math.Clamp(
                this.lateralErrorInt + clampedPosErr * dt,
                -maxOff, maxOff
            );

            const aLatCmd =
                -this.kpLateral * clampedPosErr +
                -this.kiLateral * this.lateralErrorInt +
                -this.kdLateral * vLat;

            let cmd = Phaser.Math.Clamp(aLatCmd, -this.maxLateralAccel, this.maxLateralAccel);

            const spd = Math.sqrt(sensors.vx * sensors.vx + sensors.vy * sensors.vy);
            if (spd > 1e-3) {
                const vDotPath = (sensors.vx * pathX + sensors.vy * pathY) / spd;
                const vCrossPath = (sensors.vx * pathY - sensors.vy * pathX) / spd;
                const velAngleErr = Math.abs(Math.atan2(vCrossPath, vDotPath));
                if (offPosMag < posDeadband && velAngleErr < angleDeadband) {
                    cmd = 0;
                    this.lateralErrorInt = 0;
                }
            }

            return cmd;
        }

        // Fallback (no plan available): null the ship-frame lateral velocity.
        const perpX = -Math.sin(sensors.theta);
        const perpY = Math.cos(sensors.theta);
        const vLat = sensors.vx * perpX + sensors.vy * perpY;
        const aLatCmd = -this.kpLateral * vLat;
        return Phaser.Math.Clamp(aLatCmd, -this.maxLateralAccel, this.maxLateralAccel);
    }
    
    update(dt) {
        if (!this.enabled) {
            this.lastControl = { angularControl: 0, thrust: false };
            return;
        }
        
        try {
            // Advance timers
            this.timeSinceLastVTanCorrection += dt;

            // Get sensor readings
            const sensors = this.getSensorVector();
            
            // Update phase
            this.updatePhase(sensors);
            
            // Compute control commands
            const control = this.computeControl(sensors, dt);
            
            // Debug: log control state occasionally
            if (!this.debugCounter) this.debugCounter = 0;
            this.debugCounter++;
            if (this.debugCounter % 60 === 0) {
                console.log('Autopilot active - Phase:', this.getPhaseString(), 
                           'Angular:', control.angularControl.toFixed(2), 
                           'Thrust:', control.thrust);
            }
            
            // Cache for visualization
            this.lastControl = control;
            
            // Apply controls to game
            this.applyControl(control, dt);
            
            // Asteroid defense system (independent of main control)
            this.asteroidDefense(dt);
        } catch (error) {
            console.error('Autopilot error:', error);
            this.enabled = false;
        }
    }
    
    asteroidDefense(dt) {
        // Auto-aim and fire at threatening asteroids
        const player = this.scene.player;
        
        if (!this.scene.asteroids) return;
        const asteroids = this.scene.asteroids.getChildren();
        
        const threatRange = 400;
        const fireRate = 0.2; // seconds between shots
        
        if (!this.lastFireTime) this.lastFireTime = 0;
        this.lastFireTime += dt;
        
        if (this.lastFireTime < fireRate || this.scene.ammo <= 0) return;
        
        // Find closest threatening asteroid
        let closestThreat = null;
        let closestDist = Infinity;
        
        asteroids.forEach(asteroid => {
            const dx = asteroid.x - player.x;
            const dy = asteroid.y - player.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            if (dist < threatRange && dist < closestDist) {
                // Check if asteroid is approaching (dot product with relative velocity)
                const relVx = asteroid.body.velocity.x - player.body.velocity.x;
                const relVy = asteroid.body.velocity.y - player.body.velocity.y;
                const approaching = (dx * relVx + dy * relVy) < 0;
                
                if (approaching) {
                    closestThreat = asteroid;
                    closestDist = dist;
                }
            }
        });
        
        // Fire at the threat with lead angle calculation
        if (closestThreat) {
            const dx = closestThreat.x - player.x;
            const dy = closestThreat.y - player.y;
            
            // Calculate lead angle for moving target
            const bulletSpeed = 600;
            const relVx = closestThreat.body.velocity.x - player.body.velocity.x;
            const relVy = closestThreat.body.velocity.y - player.body.velocity.y;
            
            // Simple lead: estimate time to impact and aim ahead
            const timeToImpact = closestDist / bulletSpeed;
            const leadX = dx + relVx * timeToImpact;
            const leadY = dy + relVy * timeToImpact;
            const aimAngle = Math.atan2(leadY, leadX);
            
            // Fire bullet in calculated direction
            this.fireDefensiveBullet(aimAngle);
            this.lastFireTime = 0;
        }
    }
    
    fireDefensiveBullet(angle) {
        const player = this.scene.player;
        const speed = 600;
        
        const bullet = this.scene.bullets.create(player.x, player.y, null);
        bullet.setCircle(5);
        bullet.displayWidth = 10;
        bullet.displayHeight = 10;
        bullet.setTint(0xff0000);
        
        bullet.vx = Math.cos(angle) * speed + player.body.velocity.x;
        bullet.vy = Math.sin(angle) * speed + player.body.velocity.y;
        
        this.scene.ammo--;
    }
    
    applyControl(control, dt) {
        // Track total fuel usage this frame (main + lateral thrusters)
        let totalFuelUse = 0;

        // Apply angular control
        if (control.angularControl > 0) {
            // Turn right
            this.scene.angularVelocity += this.angularAccel * dt;
        } else if (control.angularControl < 0) {
            // Turn left
            this.scene.angularVelocity -= this.angularAccel * dt;
        }
        
        this.scene.angularVelocity = Phaser.Math.Clamp(
            this.scene.angularVelocity,
            -this.maxAngularSpeed,
            this.maxAngularSpeed
        );
        
        // Integrate angular velocity to update angle
        this.scene.playerAngle += this.scene.angularVelocity * dt;
        
        // Apply thrust using the rocket equation with a power-limited engine.
        // At the current Isp, thrust F = 2 * P_jet / v_e (scaled by throttle);
        // acceleration is F / m(t), where m(t) depends on remaining fuel;
        // propellant mass (fuel) is consumed at rate F / v_e.
        if (control.thrust && this.scene.fuel > 0) {
            const scale = typeof control.thrustScale === 'number' ? control.thrustScale : 1.0;
            const F = currentMainThrustForce() * scale;
            const mass = currentShipMass(this.scene);
            const accel = F / mass;
            const vx = Math.cos(this.scene.playerAngle) * accel * dt;
            const vy = Math.sin(this.scene.playerAngle) * accel * dt;
            this.scene.player.body.velocity.x += vx;
            this.scene.player.body.velocity.y += vy;
            this.scene.isThrusting = true;

            const vExhaust = currentExhaustVelocity();
            totalFuelUse += FUEL_BURN_MULTIPLIER * F * dt / vExhaust;
        } else {
            this.scene.isThrusting = false;
        }

        // Apply lateral thrust (side boosters) without changing attitude.
        if (control.lateralThrust && this.scene.fuel > 0) {
            const aLat = Phaser.Math.Clamp(control.lateralThrust, -this.maxLateralAccel, this.maxLateralAccel);
            const perpX = -Math.sin(this.scene.playerAngle);
            const perpY = Math.cos(this.scene.playerAngle);
            const dvx = perpX * aLat * dt;
            const dvy = perpY * aLat * dt;
            this.scene.player.body.velocity.x += dvx;
            this.scene.player.body.velocity.y += dvy;

            // Rocket-equation fuel burn for lateral thrusters. To produce a
            // commanded acceleration aLat on the current ship mass, the
            // required force is F_lat = m * |aLat|; fuel consumed is
            // FUEL_BURN_MULTIPLIER * F_lat * dt / v_e. The multiplier is the
            // same one used for the main engine, so main-vs-side fuel usage
            // stays in exact proportion to their instantaneous thrust.
            const vExhaust = currentExhaustVelocity();
            const mass = currentShipMass(this.scene);
            const F_lat = Math.abs(aLat) * mass;
            totalFuelUse += FUEL_BURN_MULTIPLIER * F_lat * dt / vExhaust;

            // Visual flags for side thrusters. Positive lateral acceleration
            // pushes the ship to its left (in the ship's local frame), which
            // corresponds to a thruster firing on the right-hand side, and
            // vice-versa.
            this.scene.sideThrustLeft = aLat < 0;
            this.scene.sideThrustRight = aLat > 0;
        } else {
            this.scene.sideThrustLeft = false;
            this.scene.sideThrustRight = false;
        }

        // Apply accumulated fuel usage from this frame's thrust commands.
        if (totalFuelUse > 0) {
            this.scene.fuel = Math.max(0, this.scene.fuel - totalFuelUse);
        }
    }
    
    getPhaseString() {
        const phaseNames = ['ORIENT', 'BOOST', 'CRUISE', 'BRAKE', 'LAND'];
        return phaseNames[this.currentPhase];
    }
}

class GameScene extends Phaser.Scene {
    constructor() {
        super({ key: 'GameScene' });
    }

    create() {
        const width = this.cameras.main.width;
        const height = this.cameras.main.height;
        
        // Fixed large square world: scaled up so that start/Earth distances are
        // larger relative to the ship. Original was 10000; use 50000 to make
        // typical separations ~5x larger.
        this.worldSize = 50000;
        this.worldWidth = this.worldSize;
        this.worldHeight = this.worldSize;
        this.physics.world.setBounds(0, 0, this.worldWidth, this.worldHeight);

        // Game state
        this.shipTime = 0;
        this.earthTime = 0;
        this.fuel = 100;
        this.ammo = 50;
        this.gameOver = false;
        this.sideThrustLeft = false;
        this.sideThrustRight = false;

        // State for numerical slingshot refinement sweep (adaptive)
        this.slingshotSweepActive = false;
        this.slingshotSweepMode = 'coarse';  // 'coarse' | 'fine'
        this.slingshotSweepAngle = 0;
        this.slingshotSweepDirection = +1;
        this.slingshotSweepStep = 0;
        this.slingshotSweepResults = [];
        this.slingshotSweepLastResult = null;
        this.slingshotSweepMaxAbsAngle = 0;
        this.slingshotSweepPosBest = null;      // best candidate on + cone (from coarse)
        this.slingshotSweepNegBest = null;      // best candidate on - cone (from coarse)
        this.slingshotSweepFineAngle = 0;       // current fine-sweep test angle
        this.slingshotSweepFineEndAngle = 0;    // fine-sweep upper bound (inclusive)
        this.slingshotSweepFineStep = 0;        // fine-sweep angle increment
        this.slingshotSweepFineBest = null;     // best candidate seen during fine sweep
        this.slingshotSweepText = null;
        // Set true when the numeric sweep completes without finding a viable
        // trajectory; consumed by the main update loop to keep autopilot
        // disabled instead of chasing Earth in a straight line.
        this.slingshotSweepFailed = false;

        // Mode selection for this scene instance
        this.mode = globalMode;
        this.testOverallSuccess = null;

        // Create background stars
        this.createBackground();
        
        // Initialize start and destination positions.
        if (experimentConfig.enabled) {
            this.mode = 'TEST';
            this.initializeExperimentStartAndDestination();
        } else {
            this.initializeStartAndDestination();
        }
        this.createPlayer();
        this.createEarth();
        
        // Create obstacles
        this.createAsteroids();
        this.createGravityObjects();
        this.createPickups();
        
        // Null out references to any per-scene graphics from a prior scene
        // run so the lazy-init paths below (and inside drawMinimap) create
        // fresh objects attached to this scene's display list. Phaser has
        // already destroyed the underlying GameObjects on scene restart,
        // but the JS references on `this` persist across restarts.
        this.slingshotDebug = null;
        this.slingshotPlan = null;
        this.minimapGraphics = null;
        this.minimapLabel = null;
        this.starMotionStarted = false;

        // Plan a slingshot path only in AUTOPILOT / TEST modes. MANUAL play
        // has no planning phase and no autopilot.
        if (this.mode === 'AUTOPILOT' || this.mode === 'TEST') {
            this.refineSlingshotPlanNumerically();
        }
        
        // Setup camera (locked to ship center)
        this.cameras.main.startFollow(this.player, false, 1, 1);
        this.cameras.main.setBounds(0, 0, this.worldWidth, this.worldHeight);
        
        // UI
        this.createUI();
        if (!experimentConfig.enabled && this.mode === 'MENU') {
            this.createStartMenu();
        }
        
        // Controls
        this.cursors = this.input.keyboard.createCursorKeys();
        this.spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
        this.autopilotKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.A);
        
        // Autopilot controller
        this.autopilot = new AutopilotController(this);
        this.autopilot.enabled = false;
        
        // Bullets
        this.bullets = this.physics.add.group();
        
        // Collisions
        this.physics.add.overlap(this.player, this.earth, this.winGame, null, this);
        this.physics.add.collider(this.player, this.asteroids, this.loseGame, null, this);
        this.physics.add.overlap(this.player, this.fuelPickups, this.collectFuel, null, this);
        this.physics.add.overlap(this.player, this.ammoPickups, this.collectAmmo, null, this);
        
        console.log('Game created! Player at:', this.player.x, this.player.y, 'Earth at:', this.earth.x, this.earth.y);
    }

    createBackground() {
        // Create scrolling starfield. The starfield is fixed to the screen
        // (setScrollFactor(0)) so it must cover the full camera viewport,
        // whatever its size. Star count scales with viewport area so density
        // stays roughly constant: 600 stars filled the old 1200x800 = 960000
        // px^2 viewport, so we keep the same 600 / 960000 density here.
        this.bg = this.add.graphics();
        this.bg.setScrollFactor(0);

        const camW = this.cameras.main.width;
        const camH = this.cameras.main.height;
        const density = 600 / (1200 * 800);
        const count = Math.max(1, Math.round(density * camW * camH));

        this.bgStars = [];
        for (let i = 0; i < count; i++) {
            this.bgStars.push({
                x: Math.random() * camW,
                y: Math.random() * camH,
                size: Math.random() * 2 + 0.5,
                alpha: Math.random() * 0.7 + 0.3
            });
        }
    }

    initializeStartAndDestination() {
        // If a snapshot from a prior run exists and the user asked to
        // "Retry Same Seed", reuse those exact coordinates verbatim.
        if (this.replayRequested && !experimentConfig.enabled && this.worldSnapshot && this.worldSnapshot.startEarth) {
            const s = this.worldSnapshot.startEarth;
            this.startX = s.startX;
            this.startY = s.startY;
            this.earthX = s.earthX;
            this.earthY = s.earthY;
            return;
        }

        const worldSize = this.worldSize;
        const marginStart = 200;
        const marginEarth = 200;
        const minFactor = 0.8;
        const maxFactor = 1.2;
        const maxAttempts = 100;

        let attempt = 0;
        while (attempt < maxAttempts) {
            attempt++;

            const startX = Phaser.Math.Between(marginStart, worldSize - marginStart);
            const startY = Phaser.Math.Between(marginStart, worldSize - marginStart);

            const angle = Math.random() * Math.PI * 2;
            const distanceFactor = minFactor + Math.random() * (maxFactor - minFactor);
            const distance = worldSize * distanceFactor;

            const earthX = startX + Math.cos(angle) * distance;
            const earthY = startY + Math.sin(angle) * distance;

            if (
                earthX > marginEarth && earthX < worldSize - marginEarth &&
                earthY > marginEarth && earthY < worldSize - marginEarth
            ) {
                this.startX = startX;
                this.startY = startY;
                this.earthX = earthX;
                this.earthY = earthY;
                this._captureStartEarthSnapshot();
                return;
            }
        }

        // Fallback to deterministic positions if randomization fails
        this.startX = this.worldWidth * 0.25;
        this.startY = this.worldHeight * 0.5;
        this.earthX = this.worldWidth * 0.75;
        this.earthY = this.worldHeight * 0.5;
        this._captureStartEarthSnapshot();
    }

    _captureStartEarthSnapshot() {
        if (!this.worldSnapshot) this.worldSnapshot = {};
        this.worldSnapshot.startEarth = {
            startX: this.startX,
            startY: this.startY,
            earthX: this.earthX,
            earthY: this.earthY
        };
    }

    initializeExperimentStartAndDestination() {
        // Use the same S->E distance range and world geometry as normal
        // Autopilot mode, but constrain the *direction* of the S->E vector
        // to the current experiment angle. This makes TEST runs comparable
        // to real Autopilot runs while still sweeping approach angles.

        // First, generate a reasonable start/Earth pair using the normal
        // initializer (random position, distance in [0.8, 1.2] * worldSize,
        // and within margins).
        this.initializeStartAndDestination();

        const baseSx = this.startX;
        const baseSy = this.startY;
        const baseEx = this.earthX;
        const baseEy = this.earthY;

        const dx = baseEx - baseSx;
        const dy = baseEy - baseSy;
        const len = Math.sqrt(dx * dx + dy * dy) || 1;

        // Preserve the original S->E distance but rotate its direction to
        // match the current experiment angle, while ensuring that both the
        // start and Earth positions remain inside the world margins.
        const angleDeg = experimentConfig.anglesDeg[experimentConfig.angleIndex];
        const angleRad = Phaser.Math.DegToRad(angleDeg);
        const ux = Math.cos(angleRad);
        const uy = Math.sin(angleRad);

        const worldSize = this.worldSize;
        const marginStart = 200;
        const marginEarth = 200;
        const maxAttempts = 200;

        let placed = false;
        for (let attempt = 0; attempt < maxAttempts; attempt++) {
            const candidateStartX = Phaser.Math.Between(marginStart, worldSize - marginStart);
            const candidateStartY = Phaser.Math.Between(marginStart, worldSize - marginStart);
            const candidateEarthX = candidateStartX + ux * len;
            const candidateEarthY = candidateStartY + uy * len;

            if (
                candidateEarthX > marginEarth && candidateEarthX < worldSize - marginEarth &&
                candidateEarthY > marginEarth && candidateEarthY < worldSize - marginEarth
            ) {
                this.startX = candidateStartX;
                this.startY = candidateStartY;
                this.earthX = candidateEarthX;
                this.earthY = candidateEarthY;
                placed = true;
                break;
            }
        }

        if (!placed) {
            // If we cannot find a placement that fits the requested angle and
            // distance within the world, fall back to the original Autopilot
            // geometry for this trial.
            this.startX = baseSx;
            this.startY = baseSy;
            this.earthX = baseEx;
            this.earthY = baseEy;
        }
    }

    createPlayer() {
        // Start player near left side of world
        const startX = this.startX;
        const startY = this.startY;
        
        // Physics body (invisible circle for collisions & motion)
        this.player = this.add.circle(startX, startY, 15, 0x000000);
        this.player.setVisible(false);
        this.physics.add.existing(this.player);
        this.player.body.setCircle(15);
        this.player.body.setDrag(0);
        this.player.body.setMaxVelocity(400);
        this.player.body.setCollideWorldBounds(false);
        
        // Ship orientation: 0 rad points along +X (to the right). Initialize
        // pointing along the S->E baseline so the autopilot's ORIENT phase
        // completes essentially immediately at launch. This also minimizes
        // the time the star drifts while the ship is still re-orienting,
        // reducing the mismatch between the sweep's assumed launch state
        // and reality.
        this.playerAngle = Math.atan2(this.earthY - startY, this.earthX - startX);
        this.angularVelocity = 0;
        
        // Visual ship body, drawn as a sleek triangular craft
        this.shipBody = this.add.graphics();
    }

    createEarth() {
        // Place Earth at right side, ensuring it's visible from start
        const earthX = this.earthX;
        const earthY = this.earthY;

        // Earth radius scaled up 5x relative to the original 80.
        const earthRadius = 80 * 5;
        const earthGlowRadius = 120 * 5;

        this.earth = this.add.circle(earthX, earthY, earthRadius, 0x0088ff);
        this.earth.setStrokeStyle(4, 0x00aaff);

        // Add glow effect scaled with Earth radius.
        this.earthGlow = this.add.circle(earthX, earthY, earthGlowRadius, 0x0088ff, 0.3);

        this.physics.add.existing(this.earth);
        this.earth.body.setCircle(earthRadius);
        this.earth.body.setImmovable(true);
        
        console.log('Earth created at:', earthX, earthY);
    }

    createAsteroids() {
        // Keep an empty asteroid group so other systems can safely reference it,
        // but do not spawn any actual asteroids while focusing on takeoff/landing.
        this.asteroids = this.physics.add.group();

        if (!globalEnableAsteroids) {
            return;
        }

        const worldSize = this.worldSize;
        const count = 20; // reduced density compared to original field

        for (let i = 0; i < count; i++) {
            const x = Math.random() * worldSize;
            const y = Math.random() * worldSize;
            const radius = Phaser.Math.Between(8, 18);

            const asteroid = this.add.circle(x, y, radius, 0x666666);
            this.physics.add.existing(asteroid);
            asteroid.body.setCircle(radius);
            asteroid.body.setBounce(1, 1);
            asteroid.body.setCollideWorldBounds(false);
            asteroid.body.setVelocity(
                Phaser.Math.Between(-50, 50),
                Phaser.Math.Between(-50, 50)
            );

            this.asteroids.add(asteroid);
        }
    }

    createGravityObjects() {
        this.gravityObjects = [];

        if (!globalEnableMassiveObjects) {
            return;
        }

        // Every star shares the same physical parameters.
        const Sx = this.startX;
        const Sy = this.startY;
        const Ex = this.earthX;
        const Ey = this.earthY;
        const dxSE = Ex - Sx;
        const dySE = Ey - Sy;
        const lenSE = Math.sqrt(dxSE * dxSE + dySE * dySE) || 1;

        const numStars       = 8;
        const starRadius     = 35 * 20;                 // 700
        const starMu         = 153600 * 5 * 10;         // gravitational parameter
        const starMass       = 80;
        // Clearances (all in world units).
        //   earthClear : star must never come within this radius of Earth
        //                over the gameplay horizon, so we can neglect
        //                Earth-star gravitational interactions.
        //   shipClear  : t=0 position must be at least this far from the
        //                ship's spawn (avoid spawning on top of the player).
        //   starSep    : minimum t=0 separation between any two stars, to
        //                avoid pathological close encounters that would
        //                destabilize the symplectic-Euler N-body integrator.
        const earthClear     = 10 * starRadius;         // ~ 7000
        const earthClear2    = earthClear * earthClear;
        const shipClear      = 5  * starRadius;
        const shipClear2     = shipClear * shipClear;
        const starSep        = 4  * starRadius;
        const starSep2       = starSep * starSep;

        // Straight-line Earth-clearance horizon: same generous window used
        // elsewhere for trajectory-relevant checks.
        const vCruiseClear   = (activeTuningParams && activeTuningParams.vCruise) || 200;
        const clearHorizon   = 2.0 * lenSE / vCruiseClear;

        // Gaussian sampler (Box-Muller).
        const sampleGaussian = () => {
            let u1 = Math.random();
            let u2 = Math.random();
            u1 = u1 < 1e-8 ? 1e-8 : u1;
            return Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
        };

        // Isotropic direction, Gaussian(mean=200, sd=50) speed clamped positive.
        const sampleVelocity = () => {
            const a = Math.random() * Math.PI * 2;
            const speed = Math.max(1, 200 + sampleGaussian() * 50);
            return { vx: Math.cos(a) * speed, vy: Math.sin(a) * speed };
        };

        // Closed-form min distance from Earth to the straight-line ray
        // (px + vx*t, py + vy*t) for t in [0, clearHorizon]. Returns true
        // iff that minimum is >= earthClear.
        const clearsEarth = (pxStar, pyStar, vxStar, vyStar) => {
            const v2 = vxStar * vxStar + vyStar * vyStar;
            let tOpt;
            if (v2 < 1e-9) {
                tOpt = 0;
            } else {
                tOpt = -((pxStar - Ex) * vxStar + (pyStar - Ey) * vyStar) / v2;
                if (tOpt < 0) tOpt = 0;
                else if (tOpt > clearHorizon) tOpt = clearHorizon;
            }
            const rx = pxStar + vxStar * tOpt - Ex;
            const ry = pyStar + vyStar * tOpt - Ey;
            return (rx * rx + ry * ry) >= earthClear2;
        };

        // Sample a velocity that clears Earth, or fall back to a velocity
        // pointing directly away from Earth.
        const sampleVelocityClearingEarth = (posX, posY) => {
            for (let attempt = 0; attempt < 200; attempt++) {
                const v = sampleVelocity();
                if (clearsEarth(posX, posY, v.vx, v.vy)) return v;
            }
            const dxA = posX - Ex;
            const dyA = posY - Ey;
            const rA  = Math.sqrt(dxA * dxA + dyA * dyA) || 1;
            const speed = Math.max(1, 200 + sampleGaussian() * 50);
            return { vx: (dxA / rA) * speed, vy: (dyA / rA) * speed };
        };

        // Load or generate the full star list. On replay of the same seed
        // we reproduce the exact (x0, y0, vx, vy) captured last time.
        let starList;
        const snap = this.worldSnapshot && this.worldSnapshot.stars;
        const snapUsable = Array.isArray(snap) && snap.length > 0
            && snap.every(s => typeof s.vx === 'number');
        if (this.replayRequested && !experimentConfig.enabled && snapUsable) {
            starList = snap;
        } else {
            starList = [];
            const maxAttempts = 500;
            for (let i = 0; i < numStars; i++) {
                let placed = false;
                for (let attempt = 0; attempt < maxAttempts; attempt++) {
                    // Uniform position within the world.
                    const cx = Math.random() * this.worldWidth;
                    const cy = Math.random() * this.worldHeight;

                    // Earth clearance: t=0 position must be outside the
                    // clearance disk.
                    const dxE = cx - Ex, dyE = cy - Ey;
                    if (dxE * dxE + dyE * dyE < earthClear2) continue;

                    // Ship-start clearance: don't spawn on the player.
                    const dxS = cx - Sx, dyS = cy - Sy;
                    if (dxS * dxS + dyS * dyS < shipClear2) continue;

                    // Star-star separation.
                    let overlap = false;
                    for (const s of starList) {
                        const dxSS = cx - s.x0, dySS = cy - s.y0;
                        if (dxSS * dxSS + dySS * dySS < starSep2) {
                            overlap = true; break;
                        }
                    }
                    if (overlap) continue;

                    // Velocity must also keep the trajectory clear of Earth.
                    const v = sampleVelocityClearingEarth(cx, cy);
                    starList.push({ x0: cx, y0: cy, vx: v.vx, vy: v.vy });
                    placed = true;
                    break;
                }
                if (!placed) break;
            }
            if (!this.worldSnapshot) this.worldSnapshot = {};
            this.worldSnapshot.stars = starList;
        }

        // Instantiate every star with identical physical parameters.
        for (const s of starList) {
            const obj = this.add.circle(s.x0, s.y0, starRadius, 0xffaa00, 0.6);
            this.physics.add.existing(obj);
            obj.body.setCircle(starRadius);
            obj.body.setImmovable(true);
            obj.setData('gravityStrength', starMu);
            obj.setData('schwarzschildRadius', starRadius * 1.5);
            obj.setData('mass', starMass);
            obj.setData('x0', s.x0);
            obj.setData('y0', s.y0);
            obj.setData('vx', s.vx);
            obj.setData('vy', s.vy);
            this.gravityObjects.push(obj);
        }
    }

    startStarMotion() {
        // Apply stored velocities to each gravity object's physics body so
        // Phaser advances their positions each frame. Idempotent (guarded by
        // this.starMotionStarted).
        if (this.starMotionStarted) return;
        if (!this.gravityObjects || this.gravityObjects.length === 0) return;
        for (const obj of this.gravityObjects) {
            const vx = obj.getData('vx');
            const vy = obj.getData('vy');
            if (typeof vx === 'number' && typeof vy === 'number' && obj.body) {
                obj.body.setVelocity(vx, vy);
            }
        }
        this.starMotionStarted = true;
    }

    updateStarGravity(deltaMs) {
        // Per-frame N-body update: accumulate pairwise gravitational
        // accelerations between every pair of massive objects (stars) and
        // apply them to each star's Phaser body velocity. Phaser then
        // advances each star's position from its (now-updated) velocity.
        // Runs only after startStarMotion (i.e., after the sweep completes,
        // or immediately in MANUAL mode). Mirrors the N-body loop inside
        // simulateForAngle so runtime motion tracks what the sweep planned.
        if (!this.starMotionStarted) return;
        const stars = this.gravityObjects;
        if (!stars || stars.length < 2) return;

        const dt = deltaMs / 1000;
        const N = stars.length;

        // Precompute mu, x, y per star (avoid repeated getData calls).
        const sx = new Array(N);
        const sy = new Array(N);
        const mu = new Array(N);
        for (let i = 0; i < N; i++) {
            sx[i] = stars[i].x;
            sy[i] = stars[i].y;
            mu[i] = stars[i].getData('gravityStrength') || 0;
        }

        // Symmetric pairwise sum: accel on i from j uses mu[j], and by
        // Newton's third law the accel on j from i uses mu[i] along the
        // opposite direction.
        const ax = new Array(N).fill(0);
        const ay = new Array(N).fill(0);
        for (let i = 0; i < N; i++) {
            for (let j = i + 1; j < N; j++) {
                const dxij = sx[j] - sx[i];
                const dyij = sy[j] - sy[i];
                const r2 = dxij * dxij + dyij * dyij;
                const r  = Math.sqrt(r2);
                if (r > 1) {
                    const gj = mu[j] / r2;
                    const gi = mu[i] / r2;
                    const ux = dxij / r;
                    const uy = dyij / r;
                    ax[i] += ux * gj;
                    ay[i] += uy * gj;
                    ax[j] -= ux * gi;
                    ay[j] -= uy * gi;
                }
            }
        }

        // Apply velocity changes. (Positions are integrated by Phaser from
        // body.velocity on the next physics step.)
        for (let i = 0; i < N; i++) {
            const body = stars[i].body;
            if (!body) continue;
            body.velocity.x += ax[i] * dt;
            body.velocity.y += ay[i] * dt;
        }
    }

    createPickups() {
        // Create empty pickup groups so collision handlers still work, but do not
        // spawn any fuel or ammo tokens during guidance tuning.

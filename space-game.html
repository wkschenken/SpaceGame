        this.fuelPickups = this.physics.add.group();
        this.ammoPickups = this.physics.add.group();

        if (!globalEnableTokens) {
            return;
        }

        const worldSize = this.worldSize;

        const fuelCount = 6;  // reduced density
        const ammoCount = 6;  // reduced density

        for (let i = 0; i < fuelCount; i++) {
            const x = Math.random() * worldSize;
            const y = Math.random() * worldSize;
            const fuel = this.add.rectangle(x, y, 10, 14, 0x00ff00);
            this.physics.add.existing(fuel);
            fuel.body.setImmovable(true);
            this.fuelPickups.add(fuel);
        }

        for (let i = 0; i < ammoCount; i++) {
            const x = Math.random() * worldSize;
            const y = Math.random() * worldSize;
            const ammo = this.add.rectangle(x, y, 10, 10, 0xffff00);
            this.physics.add.existing(ammo);
            ammo.body.setImmovable(true);
            this.ammoPickups.add(ammo);
        }
    }

    refineSlingshotPlanNumerically() {
        // Initialize the incremental numerical sweep state. The actual work is
        // performed in updateSlingshotSweep() so we can display progress and
        // avoid blocking the main thread.

        // Create the debug graphics layer up front so the S->E baseline,
        // sweep preview, and final red plan all have somewhere to render.
        // (Stale per-scene references are already cleared in create().)
        this.slingshotDebug = this.add.graphics();
        this.slingshotDebug.setDepth(500);

        if (!this.gravityObjects || this.gravityObjects.length === 0) {
            return;
        }

        // Build a list of massive objects with valid gravity strengths.
        // Each entry snapshots the mass's kinematic state at t=0 so the
        // sweep integrator can compute its position at sim time t as
        // (x0 + vx*t, y0 + vy*t). Static masses have vx = vy = 0.
        const masses = this.gravityObjects
            .map(o => ({
                obj: o,
                mu: o.getData('gravityStrength'),
                x0: (typeof o.getData('x0') === 'number') ? o.getData('x0') : o.x,
                y0: (typeof o.getData('y0') === 'number') ? o.getData('y0') : o.y,
                vx: (typeof o.getData('vx') === 'number') ? o.getData('vx') : 0,
                vy: (typeof o.getData('vy') === 'number') ? o.getData('vy') : 0
            }))
            .filter(m => typeof m.mu === 'number' && m.mu > 0);
        if (masses.length === 0) {
            return;
        }

        const Sx = this.startX;
        const Sy = this.startY;
        const Ex = this.earthX;
        const Ey = this.earthY;

        // Preserve the original green S->E baseline for crossing detection and
        // as the reference direction for the sweep.
        const dxSE = Ex - Sx;
        const dySE = Ey - Sy;
        const lenSE = Math.sqrt(dxSE * dxSE + dySE * dySE);
        if (lenSE < 1e-3) {
            return;
        }

        const uxBase = dxSE / lenSE;
        const uyBase = dySE / lenSE;

        const vCruise = activeTuningParams.vCruise;
        if (typeof vCruise !== 'number' || vCruise <= 0) {
            return;
        }

        // Simulation time per candidate: enough for a trajectory travelling
        // at vCruise to traverse the S->E distance twice (once outbound past
        // the star, once inbound back toward Earth), which is comfortably
        // more than needed for any candidate whose deflection stays modest.
        const maxTime = 2 * lenSE / vCruise;

        // Adaptive angle sweep. Instead of a fixed +/- range we expand
        // outward from 0 in each direction until the simulated trajectory
        // no longer intercepts the S->E baseline (miss). Successful
        // candidates are collected and post-filtered for sun-radius safety.
        const dAngleDeg = 0.025;
        const dAngleRad = Phaser.Math.DegToRad(dAngleDeg);

        this.slingshotSweepActive = true;
        this.slingshotSweepMode = 'coarse';     // switch to 'fine' after coarse pass
        this.slingshotSweepAngle = 0;           // current signed test angle
        this.slingshotSweepDirection = +1;      // +1 growing positive, -1 growing negative
        this.slingshotSweepStep = dAngleRad;
        this.slingshotSweepResults = [];        // successful (miss:false) candidates
        this.slingshotSweepMaxAbsAngle = 0;     // largest |angle| reached, for progress display
        this.slingshotSweepPosBest = null;      // best coarse candidate on + cone
        this.slingshotSweepNegBest = null;      // best coarse candidate on - cone
        this.slingshotSweepFineAngle = 0;
        this.slingshotSweepFineEndAngle = 0;
        this.slingshotSweepFineStep = 0;
        this.slingshotSweepFineBest = null;
        // Consecutive-miss tolerance per direction. A single miss (e.g. from
        // a trajectory that gets flung off by the star and never crosses back
        // in time) must NOT prematurely terminate that side of the sweep.
        // Sized geometrically: dAngleRad * missTolerance * distSStar ~=
        // starRadius. That is, we allow enough missed angular steps to span
        // roughly one star radius (as an arc) at the star's distance from S,
        // so isolated non-crossings inside the star's shadow don't kill the
        // sweep prematurely. Floored at 5 for degeneracies (no star, very
        // near star).
        this.slingshotSweepConsecMisses = 0;
        let missTol = 10;
        if (this.gravityObjects && this.gravityObjects[0]) {
            const star = this.gravityObjects[0];
            const dxStar = star.x - Sx;
            const dyStar = star.y - Sy;
            const distSStar = Math.sqrt(dxStar * dxStar + dyStar * dyStar);
            const starRadius = star.radius || 0;
            if (distSStar > 1 && starRadius > 0 && dAngleRad > 0) {
                missTol = Math.round(starRadius / (dAngleRad * distSStar));
            }
        }
        this.slingshotSweepMissTolerance = Math.max(5, missTol);

        // Cache geometry and parameters for use in updateSlingshotSweep.
        // sunRadius is the geometric radius of the star; used to reject
        // trajectories that clip the star.
        let sunRadius = 0;
        if (this.gravityObjects && this.gravityObjects[0]) {
            const star = this.gravityObjects[0];
            sunRadius = star.radius || 0;
        }
        this.slingshotSweepData = {
            Sx, Sy, Ex, Ey,
            dxSE, dySE, lenSE,
            uxBase, uyBase,
            vCruise,
            masses,
            sunRadius,
            // Earth radius in the planner must match the scaled physical
            // Earth radius used in createEarth (80 * 5).
            earthRadius: 80 * 5,
            lineHitThreshold: 0.5 * (80 * 5),
            dt: 0.04,
            maxTime
        };

        // Only one graphics layer during the sweep: the "current" line
        // showing the trajectory presently being tested. Previously-tested
        // trajectories are not retained on screen.
        if (!this.slingshotSweepCurrentGraphics) {
            this.slingshotSweepCurrentGraphics = this.add.graphics();
            this.slingshotSweepCurrentGraphics.setDepth(499);
        }
        this.slingshotSweepCurrentGraphics.clear();
        this.slingshotSweepLastResult = null;

        // Create or update the on-screen sweep status text (bottom of screen).
        const cam = this.cameras.main;
        const cx = cam.width / 2;
        const cy = cam.height - 40;
        if (!this.slingshotSweepText) {
            this.slingshotSweepText = this.add.text(cx, cy, 'Computing slingshot...', {
                fontSize: '20px',
                fill: '#ff0'
            }).setOrigin(0.5).setScrollFactor(0).setDepth(3002);
        } else {
            this.slingshotSweepText.setText('Computing slingshot...');
        }
        this.slingshotSweepText.setVisible(true);
    }

    setupFineSweepAroundWinner() {
        // Called once the coarse sweep completes. Splits coarse results into
        // the two "cones" (positive-angle and negative-angle sides of the
        // ship's initial S->E heading) and filters each cone to trajectories
        // that do not clip any star (with a 5% safety margin over each
        // star's physical radius).
        // Picks each cone's best by minimum Euclidean distToEarth (i.e.
        // whose baseline crossing lies closest to Earth's center), then
        // compares the two cones' bests by expected transit time (crossTime)
        // and picks the smaller as the winner. Finally, initializes a fine
        // linear sweep around the winner's angle at one-tenth the coarse
        // step size to hone the final trajectory even closer to Earth.
        const results = this.slingshotSweepResults || [];
        if (results.length === 0) {
            return;
        }

        // Star-clip threshold with a 5% safety margin over the star's
        // physical radius, so live-gameplay star drift (from N-body deflection)
        // can't turn a barely-safe planned trajectory into a real clip.
        const sunRadius = this.slingshotSweepData.sunRadius || 0;
        const clipRadius = sunRadius * 1.05;

        const isValid = (res) => {
            if (!res || res.miss) return false;
            if (typeof res.crossX !== 'number' || typeof res.crossY !== 'number') return false;
            if ((res.minDistToStar || 0) <= clipRadius) return false;
            return true;
        };

        // Best per cone by minimum Euclidean distToEarth.
        let posBest = null;
        let negBest = null;
        for (const r of results) {
            if (!isValid(r.result)) continue;
            const cand = { angle: r.angle, result: r.result };
            if (r.angle >= 0) {
                if (!posBest || r.result.distToEarth < posBest.result.distToEarth) {
                    posBest = cand;
                }
            } else {
                if (!negBest || r.result.distToEarth < negBest.result.distToEarth) {
                    negBest = cand;
                }
            }
        }

        this.slingshotSweepPosBest = posBest;
        this.slingshotSweepNegBest = negBest;

        // Pick the winner cone. Priority:
        //   1. Cones whose best coarse intercept already lies inside the
        //      10%-earthRadius circle around Earth beat cones that don't.
        //   2. Among cones that both make the circle, smaller crossTime wins.
        //   3. If neither cone makes the circle, pick the cone with the
        //      smaller distToEarth so the fine sweep has the best chance
        //      of pulling the intercept inside the circle.
        const circleTol = 0.1 * (this.slingshotSweepData.earthRadius || 0);
        const posT = (posBest && typeof posBest.result.crossTime === 'number')
            ? posBest.result.crossTime : Number.POSITIVE_INFINITY;
        const negT = (negBest && typeof negBest.result.crossTime === 'number')
            ? negBest.result.crossTime : Number.POSITIVE_INFINITY;
        const posD = posBest ? posBest.result.distToEarth : Number.POSITIVE_INFINITY;
        const negD = negBest ? negBest.result.distToEarth : Number.POSITIVE_INFINITY;
        const posInCircle = posBest && posD <= circleTol;
        const negInCircle = negBest && negD <= circleTol;

        let winner = null;
        if (posInCircle && negInCircle) {
            winner = (posT <= negT) ? posBest : negBest;
        } else if (posInCircle) {
            winner = posBest;
        } else if (negInCircle) {
            winner = negBest;
        } else if (posBest && negBest) {
            winner = (posD <= negD) ? posBest : negBest;
        } else {
            winner = posBest || negBest;
        }
        if (!winner) {
            return; // no valid candidates in either cone
        }

        // Set up the fine linear sweep centered on the winner's angle.
        // Range: +/- one coarse step; step size: one-tenth the coarse step.
        // This tests 20 intermediate angles between the winner's coarse
        // neighbours and keeps the one with the smallest distToEarth.
        const coarseStep = this.slingshotSweepStep;
        const fineStep = coarseStep / 10;
        this.slingshotSweepFineStep = fineStep;
        this.slingshotSweepFineAngle = winner.angle - coarseStep;
        this.slingshotSweepFineEndAngle = winner.angle + coarseStep;
        this.slingshotSweepFineBest = winner;   // start with the winner as fallback
        this.slingshotSweepMode = 'fine';
    }

    updateSlingshotSweep(dtFrame) {
        if (!this.slingshotSweepActive) {
            return;
        }

        const data = this.slingshotSweepData;
        if (!data) {
            this.slingshotSweepActive = false;
            if (this.slingshotSweepText) {
                this.slingshotSweepText.setVisible(false);
            }
            return;
        }

        const {
            Sx, Sy, Ex, Ey,
            dxSE, dySE, lenSE,
            uxBase, uyBase,
            vCruise,
            masses,
            earthRadius,
            lineHitThreshold,
            dt,
            maxTime
        } = data;

        const maxSteps = Math.floor(maxTime / dt);

        // Helper to simulate a single trajectory for a given heading angle
        const simulateForAngle = (angleOffset) => {
            let x = Sx;
            let y = Sy;
            const cosA = Math.cos(angleOffset);
            const sinA = Math.sin(angleOffset);
            let vx = vCruise * (uxBase * cosA - uyBase * sinA);
            let vy = vCruise * (uxBase * sinA + uyBase * cosA);

            // Per-trial mutable star state. Each trial starts the stars back
            // at their t=0 initial conditions and evolves them under mutual
            // gravity alongside the rocket.
            const N = masses.length;
            const starX  = new Array(N);
            const starY  = new Array(N);
            const starVX = new Array(N);
            const starVY = new Array(N);
            const starAX = new Array(N);
            const starAY = new Array(N);
            for (let i = 0; i < N; i++) {
                starX[i]  = masses[i].x0;
                starY[i]  = masses[i].y0;
                starVX[i] = masses[i].vx;
                starVY[i] = masses[i].vy;
            }

            // Crossing detection remains relative to the original green S->E
            // baseline so we can measure distance to Earth where the trajectory
            // re-crosses that line.
            const baselineSign = (px, py) => (px - Sx) * dySE - (py - Sy) * dxSE;

            let t = 0;
            let minDist2 = Number.POSITIVE_INFINITY;
            let periX = x;
            let periY = y;
            let periIndex = 0;
            let closestObj = null;

            let prevSign = baselineSign(x, y);
            let crossings = 0;
            let bestCrossX = null;
            let bestCrossY = null;
            let bestCrossT = null;
            let bestDistToEarth = Number.POSITIVE_INFINITY;
            // Time at which to stop the integration. Latched on the first
            // baseline crossing so the trajectory can coast past the Earth-
            // interception region. Null until then.
            let stopT = null;

            // Downsampled trajectory polyline. Every recordEvery integration
            // steps we push a waypoint; the controller and visualization later
            // treat this polyline as the actual reference path (not the straight
            // S->T->E chord). Storing every 5th step of a 500-step sim gives
            // ~100 waypoints, cheap in memory and smooth enough to follow.
            const recordEvery = 5;
            const trajectoryPoints = [{ x: Sx, y: Sy }];

            for (let step = 0; step < maxSteps; step++) {
                // 1) Accumulate rocket acceleration + track closest-approach
                //    using current star positions.
                let ax = 0;
                let ay = 0;
                for (let i = 0; i < N; i++) {
                    const dxCS = starX[i] - x;
                    const dyCS = starY[i] - y;
                    const r2 = dxCS * dxCS + dyCS * dyCS;
                    const r = Math.sqrt(r2);
                    if (r > 1) {
                        const g = masses[i].mu / r2;
                        ax += (dxCS / r) * g;
                        ay += (dyCS / r) * g;
                    }
                    if (r2 < minDist2) {
                        minDist2 = r2;
                        periX = x;
                        periY = y;
                        periIndex = trajectoryPoints.length - 1;
                        closestObj = masses[i].obj;
                    }
                }

                // 2) Accumulate pairwise star-on-star accelerations at the
                //    current time step. Each star's mu is the gravitational
                //    parameter (G*M) that ANOTHER body would feel from it, so
                //    star i's acceleration from star j uses masses[j].mu.
                for (let i = 0; i < N; i++) { starAX[i] = 0; starAY[i] = 0; }
                for (let i = 0; i < N; i++) {
                    for (let j = i + 1; j < N; j++) {
                        const dxij = starX[j] - starX[i];
                        const dyij = starY[j] - starY[i];
                        const r2ij = dxij * dxij + dyij * dyij;
                        const rij  = Math.sqrt(r2ij);
                        if (rij > 1) {
                            const gj = masses[j].mu / r2ij; // accel on i from j
                            const gi = masses[i].mu / r2ij; // accel on j from i
                            const ux = dxij / rij;
                            const uy = dyij / rij;
                            starAX[i] += ux * gj;
                            starAY[i] += uy * gj;
                            starAX[j] -= ux * gi;
                            starAY[j] -= uy * gi;
                        }
                    }
                }

                // 3) Symplectic-Euler update: velocities first, then positions.
                vx += ax * dt;
                vy += ay * dt;
                for (let i = 0; i < N; i++) {
                    starVX[i] += starAX[i] * dt;
                    starVY[i] += starAY[i] * dt;
                    starX[i]  += starVX[i] * dt;
                    starY[i]  += starVY[i] * dt;
                }

                x += vx * dt;
                y += vy * dt;
                t += dt;

                if ((step + 1) % recordEvery === 0) {
                    trajectoryPoints.push({ x, y });
                }

                const dxE = x - Ex;
                const dyE = y - Ey;
                const distE = Math.sqrt(dxE * dxE + dyE * dyE);
                if (distE <= earthRadius) {
                    // Ensure the final impact point is captured.
                    trajectoryPoints.push({ x, y });
                    return {
                        hit: true,
                        miss: false,
                        crossX: x,
                        crossY: y,
                        crossTime: t,
                        distToEarth: distE,
                        periX,
                        periY,
                        periIndex,
                        trajectoryPoints,
                        minDistToStar: Math.sqrt(minDist2),
                        closestObj
                    };
                }

                const s = baselineSign(x, y);
                if (t > dt * 2 && prevSign !== 0 && s !== 0 && Math.sign(s) !== Math.sign(prevSign)) {
                    crossings++;
                    const crossX = x;
                    const crossY = y;
                    const dCrossE = distE;
                    if (dCrossE < bestDistToEarth) {
                        bestDistToEarth = dCrossE;
                        bestCrossX = crossX;
                        bestCrossY = crossY;
                        bestCrossT = t;
                    }

                    // On the first baseline crossing, latch a stop time that
                    // lets the trajectory coast well past the crossing so the
                    // recorded polyline extends beyond the Earth-interception
                    // region rather than truncating right at it. Coast window
                    // = max(40% of maxTime, ~2000 px at cruise speed).
                    if (crossings === 1 && stopT === null) {
                        const coastDist = 2000;
                        const coastByTime = 0.4 * maxTime;
                        const coastByDist = coastDist / Math.max(1, vCruise);
                        stopT = t + Math.max(coastByTime, coastByDist);
                    }
                }
                prevSign = s;

                if (stopT !== null && t >= stopT) {
                    break;
                }
            }

            if (bestCrossX !== null) {
                // Ensure the last integrated point is in the polyline.
                trajectoryPoints.push({ x, y });
                return {
                    hit: false,
                    miss: false,
                    crossX: bestCrossX,
                    crossY: bestCrossY,
                    crossTime: bestCrossT,
                    distToEarth: bestDistToEarth,
                    periX,
                    periY,
                    periIndex,
                    trajectoryPoints,
                    minDistToStar: Math.sqrt(minDist2),
                    closestObj
                };
            }

            // Even for "miss" candidates (never re-crossed the S->E baseline),
            // return the trajectory polyline so the sweep visualization can
            // still draw them. Scoring code in the caller keys off miss=true
            // and ignores these for best-so-far selection.
            trajectoryPoints.push({ x, y });
            return {
                hit: false,
                miss: true,
                trajectoryPoints,
                periX,
                periY,
                periIndex,
                minDistToStar: Math.sqrt(minDist2),
                closestObj
            };
        };

        // Convergence tolerance: 10% of Earth's radius, measured as
        // Euclidean distance from the trajectory's S->E baseline crossing
        // to Earth's center. This is the "small circle around Earth" the
        // final chosen crossing should fall inside.
        const circleTol = 0.1 * this.slingshotSweepData.earthRadius;

        // Star-clip validity filter used during the fine sweep. Same 5%
        // safety margin over the star's physical radius as the coarse filter.
        const sunRadius = this.slingshotSweepData.sunRadius || 0;
        const clipRadius = sunRadius * 1.05;
        const isValidFine = (res) => {
            if (!res || res.miss) return false;
            if (typeof res.crossX !== 'number' || typeof res.crossY !== 'number') return false;
            if ((res.minDistToStar || 0) <= clipRadius) return false;
            return true;
        };

        // Process a small number of candidates per frame so the UI can update.
        const anglesPerFrame = 2;
        for (let i = 0; i < anglesPerFrame && this.slingshotSweepActive; i++) {
            if (this.slingshotSweepMode === 'coarse') {
                // ---- Coarse adaptive sweep ----
                // Expand outward in the current direction while trajectories
                // still intercept the S->E baseline. Flip to the other side
                // on a miss; finish when both sides have been swept.
                const angle = this.slingshotSweepAngle;
                const result = simulateForAngle(angle);
                this.slingshotSweepLastResult = result;

                if (!result.miss) {
                    this.slingshotSweepResults.push({ angle, result });
                    this.slingshotSweepMaxAbsAngle = Math.max(
                        this.slingshotSweepMaxAbsAngle, Math.abs(angle)
                    );
                    this.slingshotSweepConsecMisses = 0;
                    this.slingshotSweepAngle += this.slingshotSweepDirection * this.slingshotSweepStep;
                } else {
                    // Miss: tolerate isolated misses. Only terminate this
                    // side after enough consecutive misses have accumulated.
                    this.slingshotSweepConsecMisses++;
                    if (this.slingshotSweepConsecMisses < this.slingshotSweepMissTolerance) {
                        // Skip past this miss and continue in the same direction.
                        this.slingshotSweepAngle += this.slingshotSweepDirection * this.slingshotSweepStep;
                    } else if (this.slingshotSweepDirection > 0) {
                        // Positive side exhausted; flip to negative side.
                        this.slingshotSweepDirection = -1;
                        this.slingshotSweepAngle = -this.slingshotSweepStep;
                        this.slingshotSweepConsecMisses = 0;
                    } else {
                        // Both sides exhausted. Coarse sweep done: pick each
                        // cone's best by min distToEarth, choose winner cone
                        // by smaller crossTime, and set up the fine sweep
                        // around the winner's angle.
                        this.setupFineSweepAroundWinner();
                        if (this.slingshotSweepMode !== 'fine') {
                            // No valid candidates in either cone -> finalize
                            // (will fail with banner).
                            this.slingshotSweepActive = false;
                        }
                        break;
                    }
                }
            } else if (this.slingshotSweepMode === 'fine') {
                // ---- Fine linear sweep around the winning-cone angle ----
                // Steps at coarseStep/10 across +/- one coarse step around
                // the winner. Keeps the sample with the smallest Euclidean
                // distToEarth. Early-terminates if a sample is inside the
                // 10%-earthRadius circle around Earth's center.
                const a = this.slingshotSweepFineAngle;
                if (a > this.slingshotSweepFineEndAngle + 1e-9) {
                    this.slingshotSweepActive = false;
                    break;
                }
                const result = simulateForAngle(a);
                this.slingshotSweepLastResult = result;
                this.slingshotSweepResults.push({ angle: a, result });

                if (isValidFine(result)) {
                    const currentBestDist = this.slingshotSweepFineBest
                        ? this.slingshotSweepFineBest.result.distToEarth
                        : Number.POSITIVE_INFINITY;
                    if (result.distToEarth < currentBestDist) {
                        this.slingshotSweepFineBest = { angle: a, result };
                    }
                    // Early exit if we're inside the tolerance circle.
                    if (result.distToEarth <= circleTol) {
                        this.slingshotSweepActive = false;
                        break;
                    }
                }
                this.slingshotSweepFineAngle += this.slingshotSweepFineStep;
            } else {
                this.slingshotSweepActive = false;
                break;
            }
        }

        // Draw only the "currently being tested" trajectory as a single
        // bright yellow polyline. Previously-tested trajectories are not
        // retained on screen.
        const gCurrent = this.slingshotSweepCurrentGraphics;
        if (gCurrent) {
            gCurrent.clear();
            const last = this.slingshotSweepLastResult;
            const lastPts = last && last.trajectoryPoints;
            if (this.slingshotSweepActive && lastPts && lastPts.length >= 2) {
                gCurrent.lineStyle(2, 0xffff00, 1.0);
                gCurrent.beginPath();
                gCurrent.moveTo(lastPts[0].x, lastPts[0].y);
                for (let p = 1; p < lastPts.length; p++) {
                    gCurrent.lineTo(lastPts[p].x, lastPts[p].y);
                }
                gCurrent.strokePath();
            }
        }

        // Update status text.
        if (this.slingshotSweepText && this.slingshotSweepActive) {
            if (this.slingshotSweepMode === 'coarse') {
                const angDeg = Phaser.Math.RadToDeg(this.slingshotSweepAngle);
                const side = this.slingshotSweepDirection > 0 ? '+' : '-';
                this.slingshotSweepText.setText(
                    `Computing slingshot (${side} sweep): ${angDeg.toFixed(2)} deg`
                );
            } else if (this.slingshotSweepMode === 'fine') {
                const angDeg = Phaser.Math.RadToDeg(this.slingshotSweepFineAngle);
                const best = this.slingshotSweepFineBest;
                const bestD = best ? best.result.distToEarth : Number.NaN;
                this.slingshotSweepText.setText(
                    `Fine sweep: ${angDeg.toFixed(3)} deg, best distToEarth ${bestD.toFixed(1)} px`
                );
            }
        }

        // If the sweep has just finished, finalize the plan.
        if (!this.slingshotSweepActive) {
            if (this.slingshotSweepText) {
                this.slingshotSweepText.setVisible(false);
            }
            // Clear the current-line sweep layer; the final red plan (or,
            // on failure, the red banner) replaces it.
            if (this.slingshotSweepCurrentGraphics) {
                this.slingshotSweepCurrentGraphics.clear();
            }

            // Post-sweep selection.
            //   posBest / negBest: best coarse candidate per cone
            //     (filtered sun-safe AND cross-beyond-star, chosen by min
            //     distToEarth). Winner cone was picked by smaller crossTime.
            //   fineBest: result of the fine linear sweep around the winner.
            // Final chosen = fineBest (falls back to the coarse cone winner
            // if the fine sweep didn't run, e.g. no valid coarse candidates).
            const sunRadius = this.slingshotSweepData.sunRadius || 0;
            const posBest = this.slingshotSweepPosBest;
            const negBest = this.slingshotSweepNegBest;

            const circleTolFinal = 0.1 * (this.slingshotSweepData.earthRadius || 0);
            const posT = (posBest && posBest.result && typeof posBest.result.crossTime === 'number')
                ? posBest.result.crossTime : Number.POSITIVE_INFINITY;
            const negT = (negBest && negBest.result && typeof negBest.result.crossTime === 'number')
                ? negBest.result.crossTime : Number.POSITIVE_INFINITY;
            const posDF = posBest ? posBest.result.distToEarth : Number.POSITIVE_INFINITY;
            const negDF = negBest ? negBest.result.distToEarth : Number.POSITIVE_INFINITY;
            const posInCircleF = posBest && posDF <= circleTolFinal;
            const negInCircleF = negBest && negDF <= circleTolFinal;

            let coneWinner = null;
            if (posInCircleF && negInCircleF) {
                coneWinner = (posT <= negT) ? posBest : negBest;
            } else if (posInCircleF) {
                coneWinner = posBest;
            } else if (negInCircleF) {
                coneWinner = negBest;
            } else if (posBest && negBest) {
                coneWinner = (posDF <= negDF) ? posBest : negBest;
            } else {
                coneWinner = posBest || negBest;
            }

            const chosen = this.slingshotSweepFineBest || coneWinner;

            if (!chosen) {
                if (typeof console !== 'undefined' && console && console.warn) {
                    console.warn(
                        'Slingshot numeric sweep found no viable trajectory.',
                        'posBest=', !!posBest, 'negBest=', !!negBest
                    );
                }

                this.slingshotSweepFailed = true;

                const cam = this.cameras.main;
                const cx = cam.width / 2;
                const cy = cam.height - 80;
                const msg = this.add.text(
                    cx,
                    cy,
                    'Autopilot disabled: no viable slingshot trajectory found.\nAdjust Isp / vCruise and restart.',
                    {
                        fontSize: '18px',
                        fill: '#ff8080',
                        backgroundColor: '#000000',
                        align: 'center',
                        padding: { x: 10, y: 6 }
                    }
                ).setOrigin(0.5).setScrollFactor(0).setDepth(3002);
                this.slingshotSweepFailMsg = msg;

                if (this.autopilot) {
                    this.autopilot.enabled = false;
                }

                return;
            }

            const bestResult = chosen.result;
            const bestAngle = chosen.angle;
            const accepted = bestResult.distToEarth <= lineHitThreshold;
            const winnerSide = (chosen.angle >= 0) ? '+' : '-';
            const fineImproved = (this.slingshotSweepFineBest && coneWinner &&
                this.slingshotSweepFineBest.result.distToEarth < coneWinner.result.distToEarth);
            if (typeof console !== 'undefined' && console && console.log) {
                console.log(
                    'Slingshot numeric sweep complete.',
                    'winner=', winnerSide, 'cone',
                    'chosenAngleDeg=', Phaser.Math.RadToDeg(bestAngle).toFixed(3),
                    'distToEarth=', bestResult.distToEarth.toFixed(2),
                    'crossTime=', (bestResult.crossTime || 0).toFixed(2),
                    'minDistToStar=', (bestResult.minDistToStar || 0).toFixed(2),
                    'sunRadius=', sunRadius.toFixed(2),
                    'posCone=', posBest ? { angleDeg: Phaser.Math.RadToDeg(posBest.angle).toFixed(3), t: posT.toFixed(2) } : null,
                    'negCone=', negBest ? { angleDeg: Phaser.Math.RadToDeg(negBest.angle).toFixed(3), t: negT.toFixed(2) } : null,
                    'coneBestDistToEarth=', coneWinner ? coneWinner.result.distToEarth.toFixed(2) : 'n/a',
                    'fineImproved=', fineImproved,
                    'threshold=', lineHitThreshold,
                    'accepted=', accepted
                );
            }

            const angleOffset = bestAngle;
            const cosA = Math.cos(angleOffset);
            const sinA = Math.sin(angleOffset);
            const dirInX = uxBase * cosA - uyBase * sinA;
            const dirInY = uxBase * sinA + uyBase * cosA;

            const lenIn = Math.sqrt(dirInX * dirInX + dirInY * dirInY) || 1;
            const normDirX = dirInX / lenIn;
            const normDirY = dirInY / lenIn;

            const tangentX = bestResult.periX;
            const tangentY = bestResult.periY;

            const dxTE = Ex - tangentX;
            const dyTE = Ey - tangentY;
            const lenTE = Math.sqrt(dxTE * dxTE + dyTE * dyTE) || 1;
            const outDirX = dxTE / lenTE;
            const outDirY = dyTE / lenTE;

            const impactParameter = bestResult.minDistToStar;

            const dotIO = Phaser.Math.Clamp(normDirX * outDirX + normDirY * outDirY, -1, 1);
            const deflectionAngle = Math.acos(dotIO);

            // Use the nearest massive object along the best trajectory as the
            // representative object for debug visualization.
            const dominantObj = bestResult.closestObj || null;

            this.slingshotPlan = {
                startX: Sx,
                startY: Sy,
                earthX: Ex,
                earthY: Ey,
                baseUx: uxBase,
                baseUy: uyBase,
                object: dominantObj,
                impactParameter,
                deflectionAngle,
                dirX: normDirX,
                dirY: normDirY,
                tangentX,
                tangentY,
                outDirX,
                outDirY,
                // Actual curved trajectory the sweep simulated under gravity.
                // Used by getSlingshotPathFrame as the true reference path so
                // the cross-track PID does not fight the intended
                // gravitational deflection.
                trajectoryPoints: bestResult.trajectoryPoints || null,
                periIndex: typeof bestResult.periIndex === 'number' ? bestResult.periIndex : 0
            };

            // Debug graphics layer already exists from the top of
            // refineSlingshotPlanNumerically(); the per-frame
            // drawSlingshotDebug() call will pick up the new plan and
            // render the red trajectory automatically.
        }
    }

    drawMinimap() {
        // Bottom-left minimap: shows the trajectory extent from the ship's
        // starting point to Earth, the planned trajectory (if any), the
        // star, Earth, start point, and the ship's current position.
        // Coordinates in world space are mapped into a fixed screen-space
        // rectangle at the bottom-left of the viewport.
        const cam = this.cameras.main;
        if (!cam) return;

        // Minimap panel geometry (screen-space).
        const pad = 12;
        const mw = 480;
        const mh = 320;
        const mx = pad;
        const my = cam.height - mh - pad;

        // Lazy-create the graphics layer + label the first time we render.
        if (!this.minimapGraphics) {
            this.minimapGraphics = this.add.graphics()
                .setScrollFactor(0)
                .setDepth(3050);
            this.minimapLabel = this.add.text(mx + 6, my + 4, 'Trajectory Map', {
                fontSize: '12px',
                fill: '#ffffff'
            }).setScrollFactor(0).setDepth(3051);
        }
        // Keep the label anchored (in case camera resizes).
        if (this.minimapLabel) {
            this.minimapLabel.setPosition(mx + 6, my + 4);
        }

        const g = this.minimapGraphics;
        g.clear();

        // Background panel.
        g.fillStyle(0x000000, 0.55);
        g.fillRect(mx, my, mw, mh);
        g.lineStyle(1, 0x888888, 1.0);
        g.strokeRect(mx, my, mw, mh);

        // Gather points of interest in world space.
        const Sx = this.startX;
        const Sy = this.startY;
        const Ex = this.earthX;
        const Ey = this.earthY;
        const stars = (this.gravityObjects || []).filter(o => o);
        const shipX = this.player ? this.player.x : null;
        const shipY = this.player ? this.player.y : null;

        // Compute world-space bounds spanning start, Earth, and every star.
        // (Ship is included too so the ship dot stays on-map even if the
        // trajectory strays outside the S-Earth-stars bounding box.)
        let minX = Math.min(Sx, Ex);
        let maxX = Math.max(Sx, Ex);
        let minY = Math.min(Sy, Ey);
        let maxY = Math.max(Sy, Ey);
        for (const s of stars) {
            minX = Math.min(minX, s.x); maxX = Math.max(maxX, s.x);
            minY = Math.min(minY, s.y); maxY = Math.max(maxY, s.y);
        }
        if (shipX !== null) {
            minX = Math.min(minX, shipX); maxX = Math.max(maxX, shipX);
            minY = Math.min(minY, shipY); maxY = Math.max(maxY, shipY);
        }
        // Include the planned trajectory extents if a plan exists.
        const plan = this.slingshotPlan;
        const pts = plan && plan.trajectoryPoints;
        if (pts && pts.length > 0) {
            for (const p of pts) {
                if (p.x < minX) minX = p.x;
                if (p.x > maxX) maxX = p.x;
                if (p.y < minY) minY = p.y;
                if (p.y > maxY) maxY = p.y;
            }
        }

        // Add a small world-space margin so nothing sits exactly on the edge.
        const worldW = Math.max(1, maxX - minX);
        const worldH = Math.max(1, maxY - minY);
        const marginW = 0.05 * worldW;
        const marginH = 0.05 * worldH;
        minX -= marginW; maxX += marginW;
        minY -= marginH; maxY += marginH;

        // Uniform-scale mapping from world -> minimap rectangle, preserving
        // aspect ratio and centering the content.
        const inset = 18; // leave space at top for the label
        const drawW = mw - 2 * 8;
        const drawH = mh - inset - 8;
        const drawX0 = mx + 8;
        const drawY0 = my + inset;
        const scale = Math.min(
            drawW / (maxX - minX),
            drawH / (maxY - minY)
        );
        const contentW = (maxX - minX) * scale;
        const contentH = (maxY - minY) * scale;
        const offX = drawX0 + 0.5 * (drawW - contentW);
        const offY = drawY0 + 0.5 * (drawH - contentH);
        const toMap = (wx, wy) => ({
            x: offX + (wx - minX) * scale,
            y: offY + (wy - minY) * scale
        });

        // Straight start->Earth baseline (dim green, for reference).
        {
            const a = toMap(Sx, Sy);
            const b = toMap(Ex, Ey);
            g.lineStyle(1, 0x008800, 0.9);
            g.beginPath();
            g.moveTo(a.x, a.y);
            g.lineTo(b.x, b.y);
            g.strokePath();
        }

        // Planned trajectory polyline (red).
        if (pts && pts.length >= 2) {
            g.lineStyle(1.5, 0xff3030, 1.0);
            g.beginPath();
            const first = toMap(pts[0].x, pts[0].y);
            g.moveTo(first.x, first.y);
            for (let i = 1; i < pts.length; i++) {
                const p = toMap(pts[i].x, pts[i].y);
                g.lineTo(p.x, p.y);
            }
            g.strokePath();
        }

        // Stars (yellow filled circles, scaled physical radius clamped).
        for (const s of stars) {
            const sp = toMap(s.x, s.y);
            const sr = Math.max(3, Math.min(10, (s.radius || 0) * scale));
            g.fillStyle(0xffdd33, 1.0);
            g.fillCircle(sp.x, sp.y, sr);
        }

        // Earth (blue filled circle).
        {
            const ep = toMap(Ex, Ey);
            const er = Math.max(3, Math.min(8, 400 * scale));
            g.fillStyle(0x3388ff, 1.0);
            g.fillCircle(ep.x, ep.y, er);
        }

        // Start point (small green square marker).
        {
            const sp = toMap(Sx, Sy);
            g.fillStyle(0x00ff00, 1.0);
            g.fillRect(sp.x - 3, sp.y - 3, 6, 6);
        }

        // Ship (white dot with black outline).
        if (shipX !== null) {
            const shp = toMap(shipX, shipY);
            g.fillStyle(0xffffff, 1.0);
            g.fillCircle(shp.x, shp.y, 3);
            g.lineStyle(1, 0x000000, 1.0);
            g.strokeCircle(shp.x, shp.y, 3);
        }
    }

    drawSlingshotDebug() {
        if (!this.slingshotDebug) {
            return;
        }

        const g = this.slingshotDebug;
        g.clear();

        // Always draw baseline straight path from start to Earth, even if no
        // slingshot plan exists.
        const Sx = this.startX;
        const Sy = this.startY;
        const Ex = this.earthX;
        const Ey = this.earthY;

        g.lineStyle(3, 0x00ff00, 0.9);
        g.beginPath();
        g.moveTo(Sx, Sy);
        g.lineTo(Ex, Ey);
        g.strokePath();

        // Suppress the red plan drawing while the numeric sweep is still
        // running. The sweep-shading layer and the "currently being tested"
        // yellow line (both managed by updateSlingshotSweep) handle the
        // in-progress visualization.
        if (this.slingshotSweepActive) {
            return;
        }

        // If we have a slingshot plan, overlay its details (corridor, impact
        // circle, and red trajectory) on top of the green baseline.
        const plan = this.slingshotPlan;
        if (!plan) {
            return;
        }

        const obj = plan.object;
        if (obj) {
            const Cx = obj.x;
            const Cy = obj.y;

            // Draw impact parameter circle
            g.lineStyle(1, 0xff8800, 0.8);
            g.strokeCircle(Cx, Cy, plan.impactParameter);
        }

        const Tx = plan.tangentX;
        const Ty = plan.tangentY;

        // If the sweep produced a polyline, draw it as the true reference
        // path (curved by gravity). Segments before the peri-approach point
        // are drawn in bright red, segments after in a lighter red.
        const pts = plan.trajectoryPoints;
        if (pts && pts.length >= 2) {
            const periIdx = typeof plan.periIndex === 'number' ? plan.periIndex : pts.length - 1;

            g.lineStyle(2, 0xff0000, 0.9);
            g.beginPath();
            g.moveTo(pts[0].x, pts[0].y);
            for (let i = 1; i <= Math.min(periIdx, pts.length - 1); i++) {
                g.lineTo(pts[i].x, pts[i].y);
            }
            g.strokePath();

            if (periIdx < pts.length - 1) {
                g.lineStyle(2, 0xff8888, 0.9);
                g.beginPath();
                g.moveTo(pts[periIdx].x, pts[periIdx].y);
                for (let i = periIdx + 1; i < pts.length; i++) {
                    g.lineTo(pts[i].x, pts[i].y);
                }
                g.strokePath();
            }

            // Peri marker
            g.fillStyle(0xffffff, 0.9);
            g.fillCircle(Tx, Ty, 4);
        } else {
            // Fallback (no polyline): two straight chords S->T->E.
            g.lineStyle(2, 0xff0000, 0.8);
            g.beginPath();
            g.moveTo(Sx, Sy);
            g.lineTo(Tx, Ty);
            g.strokePath();

            g.lineStyle(2, 0xff4444, 0.8);
            g.beginPath();
            g.moveTo(Tx, Ty);
            g.lineTo(Ex, Ey);
            g.strokePath();
        }
    }

    drawTrajectoryGhost() {
        // Free-fall prediction: integrate the ship's current position and
        // velocity forward under gravity alone (no thrust) for a fixed
        // horizon, and draw the result as a dashed cyan line. Recomputed
        // every frame so it stays live with parameter and course changes.
        if (!this.player || !this.player.body) {
            return;
        }

        if (!this.trajectoryGhost) {
            this.trajectoryGhost = this.add.graphics();
            // Below the slingshot debug overlay (depth 500) so the planned
            // red/green lines remain visually dominant.
            this.trajectoryGhost.setDepth(499);
        }

        const g = this.trajectoryGhost;
        g.clear();

        // Only build a masses list if there are any; otherwise the prediction
        // is a straight line and we can skip the per-step gravity sum.
        const masses = (this.gravityObjects || [])
            .map(o => ({
                x: o.x,
                y: o.y,
                vx: (o.body && typeof o.body.velocity.x === 'number') ? o.body.velocity.x : 0,
                vy: (o.body && typeof o.body.velocity.y === 'number') ? o.body.velocity.y : 0,
                mu: o.getData('gravityStrength')
            }))
            .filter(m => typeof m.mu === 'number' && m.mu > 0);

        // Prediction horizon and integration step. 10 s horizon at 20 ms
        // per step = 500 steps; cheap even with several masses.
        const horizonSeconds = 10;
        const dt = 0.02;
        const steps = Math.floor(horizonSeconds / dt);

        // Dash pattern: draw N steps, skip M steps, repeat.
        const dashOn = 6;
        const dashOff = 4;

        let x = this.player.x;
        let y = this.player.y;
        let vx = this.player.body.velocity.x;
        let vy = this.player.body.velocity.y;

        g.lineStyle(2, 0x00ffff, 0.7);

        let segmentActive = false;
        let phase = 0; // counts within the current on/off block
        let onPhase = true;

        for (let i = 0; i < steps; i++) {
            // Gravity integration
            let ax = 0;
            let ay = 0;
            for (let m = 0; m < masses.length; m++) {
                const M = masses[m];
                const dxG = M.x - x;
                const dyG = M.y - y;
                const r2 = dxG * dxG + dyG * dyG;
                const r = Math.sqrt(r2);
                if (r > 1) {
                    const gAcc = M.mu / r2;
                    ax += (dxG / r) * gAcc;
                    ay += (dyG / r) * gAcc;
                }
            }

            // Advance each mass by its own velocity so the prediction accounts
            // for star drift over the 10 s horizon.
            for (let m = 0; m < masses.length; m++) {
                masses[m].x += masses[m].vx * dt;
                masses[m].y += masses[m].vy * dt;
            }

            vx += ax * dt;
            vy += ay * dt;
            const nx = x + vx * dt;
            const ny = y + vy * dt;

            if (onPhase) {
                if (!segmentActive) {
                    g.beginPath();
                    g.moveTo(x, y);
                    segmentActive = true;
                }
                g.lineTo(nx, ny);
            } else if (segmentActive) {
                g.strokePath();
                segmentActive = false;
            }

            x = nx;
            y = ny;

            phase++;
            if (onPhase && phase >= dashOn) {
                onPhase = false;
                phase = 0;
            } else if (!onPhase && phase >= dashOff) {
                onPhase = true;
                phase = 0;
            }
        }

        if (segmentActive) {
            g.strokePath();
        }
    }

            }).setOrigin(0.5).setScrollFactor(0).setDepth(3002);

            label.setInteractive({ useHandCursor: true }).on('pointerdown', toggle);

        }).setOrigin(0.5).setScrollFactor(0).setDepth(3001);

                .setScrollFactor(0)

                .setInteractive({ useHandCursor: true });

                fontSize: '20px',

            }).setOrigin(0.5).setScrollFactor(0).setDepth(3002);

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relativistic Space Race</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        #game-container {
            border: 3px solid #0af;
            box-shadow: 0 0 30px rgba(0, 170, 255, 0.6);
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script>
    let bestEarthTime = null;

    const experimentConfig = {
        enabled: false,           // only enabled when "Test" mode is selected
        radius: 3000,             // radial distance from start to Earth
        // 0, 40, 80, ..., 320 (9 angles total)
        anglesDeg: Array.from({ length: 9 }, (_, i) => i * 40),
        trialsPerAngle: 4,
        successes: new Array(9).fill(0),
        attempts: new Array(9).fill(0),
        angleIndex: 0,
        trialIndex: 0,
        finished: false
    };

    const baseTuningParams = {
        vCruise: 200,
        brakeDistScale: 1.5 * 0.75 * 1.1 * 1.1,
        kpAngle: 4.5,
        kdAngle: 1.8,
        kiAngle: 0.6,
        kpAngleCruise: 2.2,
        kdAngleCruise: 3.0,
        kiAngleCruise: 0.2,
        kpAngleLand: 4.0,
        kdAngleLand: 2.8,
        kiAngleLand: 0.2,
        brakeTargetVr: -25,
        kpLateral: 0.08,
        kiLateral: 0.0,
        kdLateral: 0.20,
        maxLateralAccel: 220
    };

    function cloneTuningParams(src) {
        return {
            vCruise: src.vCruise,
            brakeDistScale: src.brakeDistScale,
            kpAngle: src.kpAngle,
            kdAngle: src.kdAngle,
            kiAngle: src.kiAngle,
            kpAngleCruise: src.kpAngleCruise,
            kdAngleCruise: src.kdAngleCruise,
            kiAngleCruise: src.kiAngleCruise,
            kpAngleLand: src.kpAngleLand,
            kdAngleLand: src.kdAngleLand,
            kiAngleLand: src.kiAngleLand,
            brakeTargetVr: src.brakeTargetVr,
            kpLateral: src.kpLateral,
            kiLateral: src.kiLateral,
            kdLateral: src.kdLateral,
            maxLateralAccel: src.maxLateralAccel
        };
    }

    let defaultTuningParams = cloneTuningParams(baseTuningParams);
    let activeTuningParams = cloneTuningParams(defaultTuningParams);
    let lastAdoptedSuccessRate = null;

    // Persistent mode across scene restarts: 'MENU', 'TEST', 'AUTOPILOT', 'MANUAL'
    let globalMode = 'MENU';

    // Global feature toggles for world content
    let globalEnableMassiveObjects = false;
    let globalEnableAsteroids = false;
    let globalEnableTokens = false;

    const TUNING_STORAGE_KEY = 'spaceGameTuning_v1';

    function saveTuningToStorage() {
        try {
            const data = {
                defaultParams: defaultTuningParams,
                activeParams: activeTuningParams,
                lastSuccess: lastAdoptedSuccessRate
            };
            window.localStorage.setItem(TUNING_STORAGE_KEY, JSON.stringify(data));
        } catch (e) {
        }
    }

    function loadTuningFromStorage() {
        try {
            const raw = window.localStorage.getItem(TUNING_STORAGE_KEY);
            if (!raw) return;
            const data = JSON.parse(raw);
            if (data && data.defaultParams) {
                defaultTuningParams = cloneTuningParams(data.defaultParams);
                if (data.activeParams) {
                    activeTuningParams = cloneTuningParams(data.activeParams);
                } else {
                    activeTuningParams = cloneTuningParams(defaultTuningParams);
                }
                if (typeof data.lastSuccess === 'number') {
                    lastAdoptedSuccessRate = data.lastSuccess;
                }
            }
        } catch (e) {
        }
    }

    loadTuningFromStorage();

    const tuningParamsDefinition = [
        { key: 'vCruise',       label: 'Cruise speed',                 step: 20,   min: 50,   max: 800,  decimals: 0 },
        { key: 'brakeDistScale',label: 'Brake distance scale',         step: 0.05, min: 0.1,  max: 5.0,  decimals: 2 },
        { key: 'kpAngle',       label: 'ORIENT kp',                    step: 0.2,  min: 0.0,  max: 50.0, decimals: 2 },
        { key: 'kdAngle',       label: 'ORIENT kd',                    step: 0.1,  min: 0.0,  max: 50.0, decimals: 2 },
        { key: 'kiAngle',       label: 'ORIENT ki',                    step: 0.05, min: 0.0,  max: 50.0, decimals: 2 },
        { key: 'kpAngleCruise', label: 'CRUISE kp',                    step: 0.2,  min: 0.0,  max: 50.0, decimals: 2 },
        { key: 'kdAngleCruise', label: 'CRUISE kd',                    step: 0.1,  min: 0.0,  max: 50.0, decimals: 2 },
        { key: 'kiAngleCruise', label: 'CRUISE ki',                    step: 0.05, min: 0.0,  max: 50.0, decimals: 2 },
        { key: 'kpAngleLand',   label: 'LAND kp',                      step: 0.2,  min: 0.0,  max: 50.0, decimals: 2 },
        { key: 'kdAngleLand',   label: 'LAND kd',                      step: 0.1,  min: 0.0,  max: 50.0, decimals: 2 },
        { key: 'kiAngleLand',   label: 'LAND ki',                      step: 0.05, min: 0.0,  max: 50.0, decimals: 2 },
        { key: 'brakeTargetVr', label: 'BRAKE target v_r (negative)',  step: 5,    min: -400, max: -1,   decimals: 0 },
        { key: 'kpLateral',     label: 'Lateral kp',                   step: 0.01, min: 0.0,  max: 1.0,  decimals: 3 },
        { key: 'kiLateral',     label: 'Lateral ki',                   step: 0.01, min: 0.0,  max: 1.0,  decimals: 3 },
        { key: 'kdLateral',     label: 'Lateral kd',                   step: 0.01, min: 0.0,  max: 1.0,  decimals: 3 },
        { key: 'maxLateralAccel', label: 'Max lateral accel',          step: 10,   min: 0.0,  max: 500,  decimals: 0 }
    ];

// Autopilot Controller with EKF and 5-phase state machine
class AutopilotController {
    constructor(scene) {
        this.scene = scene;
        this.enabled = false;
        
        // Phase state machine (simplified)
        this.phases = {
            ORIENT: 0,
            BOOST: 1,
            CRUISE: 2,
            BRAKE: 3,
            LAND: 4
        };
        this.currentPhase = this.phases.ORIENT;
        
        // Control parameters
        this.vCruise = activeTuningParams.vCruise;
        this.aMax = 150;      // effective max decel used in braking distance calc
        this.shipMass = 1.0;  // effective ship mass for analytic impulse calc
        this.thrustAccel = 150; // base thrust acceleration magnitude (matches applyControl)
        this.kBrake = 2.0;    // braking distance factor (safety margin)
        this.maxLandingSpeed = 100;
        this.maxLandingAngle = Phaser.Math.DegToRad(10);

        // Attitude dynamics parameters (must match applyControl)
        this.angularAccel = 3.0; // was 4.0, slightly softer turns
        this.maxAngularSpeed = 3.5; // was 4.0

        // Estimate turn time for a 180° reorientation using bang-bang angular accel.
        const alpha = this.angularAccel;
        // Symmetric bang-bang profile: turn π radians; approximate total time.
        this.tTurnEst = 2 * Math.sqrt(Math.PI / Math.max(alpha, 1e-3));
        
        // Cached control state for visualization
        this.lastControl = { angularControl: 0, thrust: false };

        // State for tangential-velocity impulse corrections during CRUISE
        this.vTanCorrectionActive = false;
        this.timeSinceLastVTanCorrection = 9999; // seconds since last correction ended
        this.vTanCorrectionBurnTime = 0;   // retained for debugging, not used for termination
        this.vTanCorrectionElapsed = 0;    // time spent actually burning in current correction
        this.vTanCorrectionRemainingImpulse = 0; // remaining desired impulse m*|v_tan|
        this.vTanImpulseGain = 1.25;       // over-impulse factor to reduce undercorrection
        
        // State for ORIENT-phase bang-bang + fine PID control
        this.orientBangActive = false;
        this.orientBangSign = 0;
        this.orientBangHalfDuration = 0;
        this.orientBangElapsed = 0;
        this.orientBangUsed = false; // true after the initial bang-bang schedule has completed
        
        // Attitude PID gains (tuned for faster convergence with damping)
        // ORIENT/BOOST: more aggressive (higher P, I; lower D)
        this.kpAngle = activeTuningParams.kpAngle;
        this.kdAngle = activeTuningParams.kdAngle;
        this.kiAngle = activeTuningParams.kiAngle;
        this.angleErrorInt = 0;

        // CRUISE/BRAKE (and early LAND) attitude PID: smoother, more damped
        this.kpAngleCruise = activeTuningParams.kpAngleCruise;
        this.kdAngleCruise = activeTuningParams.kdAngleCruise;
        this.kiAngleCruise = activeTuningParams.kiAngleCruise;
        this.angleErrorIntCruise = 0;

        // LAND-phase fine attitude PID (used when speed is already low)
        this.kpAngleLand = activeTuningParams.kpAngleLand;
        this.kdAngleLand = activeTuningParams.kdAngleLand;
        this.kiAngleLand = activeTuningParams.kiAngleLand;
        this.angleErrorIntLand = 0;

        this.kpLateral = activeTuningParams.kpLateral;
        this.kiLateral = activeTuningParams.kiLateral;
        this.kdLateral = activeTuningParams.kdLateral;
        this.maxLateralAccel = activeTuningParams.maxLateralAccel;
        this.lateralErrorInt = 0;
        this.lateralLookaheadTime = 2.0;
    }
    
    getSensorVector() {
        const player = this.scene.player;
        const earth = this.scene.earth;
        
        // IMU: attitude and angular velocity
        const theta = this.scene.playerAngle;
        const omega = this.scene.angularVelocity;
        
        // Earth beacon: bearing and distance
        const dx = earth.x - player.x;
        const dy = earth.y - player.y;
        const distToEarth = Math.sqrt(dx * dx + dy * dy);
        const bearingToEarth = Math.atan2(dy, dx);
        
        // Velocity (from IMU integration)
        const vx = player.body.velocity.x;
        const vy = player.body.velocity.y;
        
        // Resources
        const fuelFrac = this.scene.fuel / 100;
        const ammo = this.scene.ammo;
        
        return {
            theta, omega,
            bearingToEarth, distToEarth,
            vx, vy,
            fuelFrac, ammo
        };
    }

    getSlingshotPathFrame() {
        const plan = this.scene.slingshotPlan;
        if (!plan) {
            return null;
        }

        const Px = this.scene.player.x;
        const Py = this.scene.player.y;
        const Sx = plan.startX;
        const Sy = plan.startY;
        const Tx = plan.tangentX;
        const Ty = plan.tangentY;

        const dInX = plan.dirX;
        const dInY = plan.dirY;

        const dxPS = Px - Sx;
        const dyPS = Py - Sy;
        const s = dxPS * dInX + dyPS * dInY;

        const dxST = Tx - Sx;
        const dyST = Ty - Sy;
        const sT = dxST * dInX + dyST * dInY;

        const dxToT = Tx - Px;
        const dyToT = Ty - Py;
        const distToT = Math.sqrt(dxToT * dxToT + dyToT * dyToT);

        const impact = typeof plan.impactParameter === 'number' ? plan.impactParameter : 0;
        const switchDist = Math.max(40, impact * 0.5);

        const beforeT = s < sT && distToT > switchDist;

        const Ex = plan.earthX;
        const Ey = plan.earthY;

        let pathX;
        let pathY;

        if (beforeT && distToT > 1e-3) {
            const lenIn = Math.sqrt(dInX * dInX + dInY * dInY) || 1;
            pathX = dInX / lenIn;
            pathY = dInY / lenIn;
        } else {
            const dxTE = Ex - Tx;
            const dyTE = Ey - Ty;
            const lenOut = Math.sqrt(dxTE * dxTE + dyTE * dyTE);
            if (lenOut < 1e-3) {
                return null;
            }
            pathX = dxTE / lenOut;
            pathY = dyTE / lenOut;
        }

        return {
            pathX,
            pathY,
            beforeT,
            distToT,
            tangentX: Tx,
            tangentY: Ty
        };
    }
    
    computeDesiredHeading(sensors) {
        const vx = sensors.vx;
        const vy = sensors.vy;

        // Base direction: from ship to Earth (radial inward)
        const bearing = sensors.bearingToEarth;
        const ex = Math.cos(bearing);
        const ey = Math.sin(bearing);

        // Decompose velocity into radial/tangential components relative to Earth
        const radialAngleOut = bearing + Math.PI; // radial outward from Earth
        const ux = Math.cos(radialAngleOut);
        const uy = Math.sin(radialAngleOut);
        const radialV = vx * ux + vy * uy;
        const vtX = vx - radialV * ux;
        const vtY = vy - radialV * uy;
        const tangentialV = Math.sqrt(Math.max(0, vtX * vtX + vtY * vtY));

        let vtCorrX = vtX;
        let vtCorrY = vtY;
        let tangentialCorr = tangentialV;

        const planForV = this.scene.slingshotPlan;
        if (planForV) {
            const frameV = this.getSlingshotPathFrame();
            if (frameV && frameV.beforeT) {
                const pathX = frameV.pathX;
                const pathY = frameV.pathY;
                const vPar = vx * pathX + vy * pathY;
                const vParX = vPar * pathX;
                const vParY = vPar * pathY;
                const offX = vx - vParX;
                const offY = vy - vParY;
                const offMag = Math.sqrt(Math.max(0, offX * offX + offY * offY));
                vtCorrX = offX;
                vtCorrY = offY;
                tangentialCorr = offMag;
            }
        }

        // Default desired direction: directly toward Earth
        let nx = ex;
        let ny = ey;

        // If we have a slingshot plan and we're in ORIENT / BOOST / CRUISE,
        // follow the planned red trajectory. The base desired heading is the
        // local path tangent, with a small lateral bias to drive cross-track
        // position error toward zero, instead of aiming directly at the apex T.
        const plan = this.scene.slingshotPlan;
        const inSlingshotPhase =
            this.currentPhase === this.phases.ORIENT ||
            this.currentPhase === this.phases.BOOST ||
            this.currentPhase === this.phases.CRUISE;

        if (plan && inSlingshotPhase) {
            const frame = this.getSlingshotPathFrame();
            if (frame && frame.beforeT) {
                const pathX = frame.pathX;
                const pathY = frame.pathY;

                // Base heading: along the local path tangent
                nx = pathX;
                ny = pathY;

                // Cross-track position error: distance from ship to the current
                // path segment (S->T before apex, T->E after apex). Use this to
                // add a small heading bias that steers the ship back toward the
                // red line instead of just pointing along the ideal asymptote.
                const Px = this.scene.player.x;
                const Py = this.scene.player.y;
                const Sx = plan.startX;
                const Sy = plan.startY;
                const Tx = frame.tangentX;
                const Ty = frame.tangentY;

                let baseX;
                let baseY;
                if (frame.beforeT) {
                    baseX = Sx;
                    baseY = Sy;
                } else {
                    baseX = Tx;
                    baseY = Ty;
                }

                const dxPB = Px - baseX;
                const dyPB = Py - baseY;
                const sPar = dxPB * pathX + dyPB * pathY;
                const projX = baseX + sPar * pathX;
                const projY = baseY + sPar * pathY;
                const offPosX = Px - projX;
                const offPosY = Py - projY;
                const offPosMag = Math.sqrt(Math.max(0, offPosX * offPosX + offPosY * offPosY));

                const impact = typeof plan.impactParameter === 'number' ? plan.impactParameter : 0;
                const maxOff = Math.max(impact * 0.5, 30);

                if (offPosMag > 1e-3 && maxOff > 0) {
                    // Sign of lateral error: positive if player is to the "left" of
                    // the path (in the path's local frame), negative if to the right.
                    const cross = pathX * offPosY - pathY * offPosX;
                    const sign = cross >= 0 ? 1 : -1;

                    const maxAngle = Phaser.Math.DegToRad(12); // max heading tilt for correction
                    const scale = Phaser.Math.Clamp(offPosMag / maxOff, 0, 1);
                    const delta = sign * maxAngle * scale;

                    const cosD = Math.cos(delta);
                    const sinD = Math.sin(delta);
                    const adjX = pathX * cosD - pathY * sinD;
                    const adjY = pathX * sinD + pathY * cosD;
                    nx = adjX;
                    ny = adjY;
                }
            }
        }

        // During CRUISE, if a v_tan correction is active, point exactly opposite v_tan.
        if (this.currentPhase === this.phases.CRUISE && this.vTanCorrectionActive && tangentialCorr > 1e-3) {
            const tx = vtCorrX / tangentialCorr;
            const ty = vtCorrY / tangentialCorr;
            nx = -tx;
            ny = -ty;
        }

        let targetAngle = Math.atan2(ny, nx);
        if (!Number.isFinite(targetAngle)) {
            targetAngle = bearing;
        }

        // BRAKE: nose radially outward so braking thrust is purely radial
        if (this.currentPhase === this.phases.BRAKE) {
            targetAngle = Phaser.Math.Angle.Wrap(bearing + Math.PI);
        }

        // LAND: same radial-outward attitude for final approach
        if (this.currentPhase === this.phases.LAND) {
            targetAngle = Phaser.Math.Angle.Wrap(bearing + Math.PI);
        }
        
        return targetAngle;
    }
    
    updatePhase(sensors) {
        const speed = Math.sqrt(sensors.vx * sensors.vx + sensors.vy * sensors.vy);
        const dist = sensors.distToEarth;

        // Decompose velocity into radial/tangential components relative to Earth
        const radialAngle = sensors.bearingToEarth + Math.PI; // radial outward from Earth
        const radialV = sensors.vx * Math.cos(radialAngle) + sensors.vy * Math.sin(radialAngle);
        const tangentialV = Math.sqrt(Math.max(0, speed * speed - radialV * radialV));

        // Use radial speed magnitude to determine braking distance.
        const vRadialMag = Math.max(Math.abs(radialV), 1);
        const brakeBase = this.kBrake * (vRadialMag * vRadialMag) / (2 * this.aMax) + this.vCruise * this.tTurnEst;
        const brakeDist = activeTuningParams.brakeDistScale * brakeBase;

        switch (this.currentPhase) {
            case this.phases.ORIENT:
                // Check if aligned with target heading
                const targetHeading = this.computeDesiredHeading(sensors);
                const angleDiff = Math.abs(Phaser.Math.Angle.Wrap(sensors.theta - targetHeading));
                const omegaSmallOrient = Math.abs(sensors.omega) < Phaser.Math.DegToRad(0.5); // <0.5 deg/s
                if (angleDiff < Phaser.Math.DegToRad(0.5) && omegaSmallOrient) { // ~0.5 degree
                    // Only go straight to BRAKE if we're close enough, generally inward,
                    // and moving at a reasonable inward speed; otherwise BOOST toward cruise.
                    const vRadInwardEnough = radialV < -0.3 * this.vCruise;
                    if (dist <= brakeDist && vRadInwardEnough) {
                        console.log('Phase: ORIENT -> BRAKE');
                        this.currentPhase = this.phases.BRAKE;
                    } else {
                        console.log('Phase: ORIENT -> BOOST');
                        this.currentPhase = this.phases.BOOST;
                    }
                }
                break;
                
            case this.phases.BOOST:
                // Accelerate to cruise speed
                if (speed >= this.vCruise) {
                    this.currentPhase = this.phases.CRUISE;
                }
                break;
                
            case this.phases.CRUISE: {
                // Prefer to enter BRAKE once we're within the braking distance and moving inward.
                const vRadInwardEnough = radialV < -0.3 * this.vCruise;
                if (dist <= brakeDist && vRadInwardEnough) {
                    this.currentPhase = this.phases.BRAKE;
                } else if (speed > 20) {
                    // Require a sizeable inward (toward Earth) component of velocity
                    const radialFraction = radialV / speed; // radialV < 0 means inward
                    if (radialFraction > -0.1 && dist > brakeDist * 0.5) {
                        // Not making good progress toward Earth and not yet deep in the
                        // braking region; re-orient to improve trajectory.
                        this.currentPhase = this.phases.ORIENT;
                    }
                }
                break;
            }

            case this.phases.BRAKE:
                // When slow enough, mostly radial (low tangential), moving toward Earth,
                // and close enough to the surface, go to LAND
                // If we start moving outward (v_r > 0), re-orient for a better braking pass.
                if (radialV > 0) {
                    this.currentPhase = this.phases.ORIENT;
                } else if (
                    dist <= 138 &&   // start LAND ~20% farther out than previous 115
                    speed <= this.maxLandingSpeed * 1.2 &&
                    Math.abs(tangentialV) <= this.maxLandingSpeed * 0.5 &&
                    radialV < 0
                ) {
                    this.currentPhase = this.phases.LAND;
                }
                break;

            case this.phases.LAND:
                // Final approach - stay in this phase until touchdown
                break;
        }
    }
    
    computeControl(sensors, dt) {
        // PID controller for attitude
        const desiredHeading = this.computeDesiredHeading(sensors);
        const angleError = Phaser.Math.Angle.Wrap(desiredHeading - sensors.theta);
        const speed = Math.sqrt(sensors.vx * sensors.vx + sensors.vy * sensors.vy);
        const landTrimSpeed = this.maxLandingSpeed * 0.5;
        const inLandPhase = this.currentPhase === this.phases.LAND;
        const landTrimActive = inLandPhase && speed <= landTrimSpeed;

        if (this.currentPhase !== this.phases.ORIENT) {
            if (this.orientBangActive) {
                this.orientBangActive = false;
                this.orientBangElapsed = 0;
            }
            // Reset ORIENT bang-bang usage when leaving ORIENT so that a new
            // phase can perform a fresh initial bang-bang maneuver.
            this.orientBangUsed = false;
        }

        let angularControl;
        if (inLandPhase) {
            // LAND-phase attitude PID: always active while in LAND.
            this.angleErrorIntLand += angleError * dt;
            this.angleErrorIntLand = Phaser.Math.Clamp(this.angleErrorIntLand, -1.0, 1.0);
            angularControl =
                this.kpAngleLand * angleError +
                this.kiAngleLand * this.angleErrorIntLand -
                this.kdAngleLand * sensors.omega;
            // Reset other integrators while in LAND
            this.angleErrorIntCruise = 0;
            this.angleErrorInt = 0;
        } else {
            // Phase-specific attitude PID and ORIENT bang-bang control
            let kp = this.kpAngle;
            let ki = this.kiAngle;
            let kd = this.kdAngle;

            const isCruiseLike =
                this.currentPhase === this.phases.CRUISE ||
                this.currentPhase === this.phases.BRAKE;

            if (isCruiseLike) {
                kp = this.kpAngleCruise;
                ki = this.kiAngleCruise;
                kd = this.kdAngleCruise;
                this.angleErrorIntCruise += angleError * dt;
                this.angleErrorIntCruise = Phaser.Math.Clamp(this.angleErrorIntCruise, -2.0, 2.0);
                this.angleErrorInt = 0;
                angularControl =
                    kp * angleError +
                    ki * this.angleErrorIntCruise -
                    kd * sensors.omega;
            } else if (this.currentPhase === this.phases.ORIENT) {
                // In ORIENT, we perform a single bang-bang schedule to remove
                // most of the initial error, then hand off to a sensitive PID
                // controller to smoothly drive the residual error to zero.
                this.angleErrorIntCruise = 0;

                if (!this.orientBangUsed) {
                    // Run the initial bang-bang schedule once.
                    this.angleErrorInt = 0;

                    if (!this.orientBangActive) {
                        const errMag = Math.abs(angleError);
                        const alpha = Math.max(this.angularAccel, 1e-3);
                        const halfDuration = Math.sqrt(errMag / alpha);
                        if (halfDuration > 0 && errMag > Phaser.Math.DegToRad(0.01)) {
                            const sign = angleError >= 0 ? 1 : -1;
                            this.orientBangActive = true;
                            this.orientBangSign = sign;
                            this.orientBangHalfDuration = halfDuration;
                            this.orientBangElapsed = 0;
                        } else {
                            // If the error is already tiny, skip bang-bang and
                            // immediately fall back to fine PID below.
                            this.orientBangUsed = true;
                        }
                    }

                    if (this.orientBangActive) {
                        this.orientBangElapsed += dt;
                        const totalDuration = 2 * this.orientBangHalfDuration;
                        if (this.orientBangElapsed < this.orientBangHalfDuration) {
                            angularControl = this.orientBangSign;
                        } else if (this.orientBangElapsed < totalDuration) {
                            angularControl = -this.orientBangSign;
                        } else {
                            // Bang-bang schedule completed; mark as used and
                            // switch to the fine PID controller.
                            this.orientBangActive = false;
                            this.orientBangElapsed = 0;
                            this.orientBangUsed = true;
                        }
                    }
                }

                if (this.orientBangUsed && !this.orientBangActive) {
                    // Fine ORIENT PID: make it very sensitive to small errors
                    // with tight integrator clamping so that the final error
                    // decays smoothly to zero.
                    const kpFine = this.kpAngle * 1.5;
                    const kiFine = this.kiAngle;
                    const kdFine = this.kdAngle;

                    this.angleErrorInt += angleError * dt;
                    this.angleErrorInt = Phaser.Math.Clamp(this.angleErrorInt, -0.2, 0.2);

                    angularControl =
                        kpFine * angleError +
                        kiFine * this.angleErrorInt -
                        kdFine * sensors.omega;
                }
            } else {
                this.angleErrorInt += angleError * dt;
                this.angleErrorInt = Phaser.Math.Clamp(this.angleErrorInt, -2.0, 2.0);
                this.angleErrorIntCruise = 0;
                angularControl =
                    kp * angleError +
                    ki * this.angleErrorInt -
                    kd * sensors.omega;
            }

            // Reset LAND integral when not in final-trim mode
            this.angleErrorIntLand = 0;
        }
        
        // Thrust control based on phase
        let thrust = false;
        let thrustScale = 1.0;
        let lateralThrust = 0;
        
        switch (this.currentPhase) {
            case this.phases.ORIENT:
                // No thrust during orientation
                thrust = false;
                break;
                
            case this.phases.BOOST: {
                // In BOOST, apply continuous full thrust while the attitude
                // controller keeps us aligned. ORIENT->BOOST already enforces
                // a reasonably tight alignment (~0.5°), so additional gating
                // here risks stalling at low speed. Simply burn until vCruise
                // is reached, at which point updatePhase switches to CRUISE.
                thrust = true;
                thrustScale = 1.0;
                break;
            }
                
            case this.phases.CRUISE: {
                // Discrete v_tan impulse correction:
                // If |v_tan| exceeds a threshold, compute an impulse with fixed
                // burn duration T_impulse and variable thrust scale so that the
                // net impulse matches m*|v_tan| (subject to thrust limits).
                const bearing = sensors.bearingToEarth;
                const dist = sensors.distToEarth;
                const radialAngleOut = bearing + Math.PI;
                const ux = Math.cos(radialAngleOut);
                const uy = Math.sin(radialAngleOut);
                const radialV = sensors.vx * ux + sensors.vy * uy;
                const vtX = sensors.vx - radialV * ux;
                const vtY = sensors.vy - radialV * uy;
                const tangentialV = Math.sqrt(Math.max(0, vtX * vtX + vtY * vtY));

                // By default, use Earth-radial decomposition. When a slingshot plan
                // exists, reinterpret these as path-parallel ("radialForControl") and
                // path-perpendicular ("tangentialForControl") components so that
                // CRUISE corrections keep the ship near the planned red trajectory.
                let tangentialForControl = tangentialV;
                let radialForControl = radialV;

                const planCruise = this.scene.slingshotPlan;
                let frameCruise = null;
                let slingshotApproach = false;
                if (planCruise) {
                    frameCruise = this.getSlingshotPathFrame();
                    if (frameCruise && frameCruise.beforeT) {
                        slingshotApproach = true;
                    }
                }

                if (slingshotApproach && frameCruise) {
                    const pathX = frameCruise.pathX;
                    const pathY = frameCruise.pathY;
                    const vPar = sensors.vx * pathX + sensors.vy * pathY;
                    const vParX = vPar * pathX;
                    const vParY = vPar * pathY;
                    const offX = sensors.vx - vParX;
                    const offY = sensors.vy - vParY;
                    const offMag = Math.sqrt(Math.max(0, offX * offX + offY * offY));

                    tangentialForControl = offMag;
                    radialForControl = vPar;

                    // Path-relative cross-track control for side thrusters.
                    const Px = this.scene.player.x;
                    const Py = this.scene.player.y;
                    const Sx = planCruise.startX;
                    const Sy = planCruise.startY;
                    const Tx = frameCruise.tangentX;
                    const Ty = frameCruise.tangentY;

                    let baseX;
                    let baseY;
                    if (frameCruise.beforeT) {
                        baseX = Sx;
                        baseY = Sy;
                    } else {
                        baseX = Tx;
                        baseY = Ty;
                    }

                    const dxPB = Px - baseX;
                    const dyPB = Py - baseY;
                    const sPar = dxPB * pathX + dyPB * pathY;
                    const projX = baseX + sPar * pathX;
                    const projY = baseY + sPar * pathY;
                    const offPosX = Px - projX;
                    const offPosY = Py - projY;

                    // Signed cross-track position error: positive if ship is to
                    // the left of the path (in path frame), negative if to the right.
                    const crossPos = pathX * offPosY - pathY * offPosX;

                    // Cross-track velocity component (lateral velocity in path frame).
                    const vLat = sensors.vx * (-pathY) + sensors.vy * pathX;

                    const impact = typeof planCruise.impactParameter === 'number' ? planCruise.impactParameter : 0;
                    const maxOff = Math.max(impact * 0.5, 30);

                    // Simple lookahead to anticipate crossing the path: predict where
                    // the cross-track error will be after a short time horizon.
                    const lookahead = this.lateralLookaheadTime;
                    const predictedErr = crossPos + vLat * lookahead;
                    const clampedPosErr = Phaser.Math.Clamp(predictedErr, -maxOff, maxOff);

                    // PID on predicted cross-track error using side thrusters as actuator.
                    this.lateralErrorInt += clampedPosErr * dt;
                    this.lateralErrorInt = Phaser.Math.Clamp(this.lateralErrorInt, -maxOff, maxOff);

                    // Use negative feedback: when crossPos is positive (ship left of
                    // path), command acceleration that pushes it right, and vice versa.
                    const aLatCmd =
                        -this.kpLateral * clampedPosErr +
                        -this.kiLateral * this.lateralErrorInt +
                        -this.kdLateral * vLat;
                    lateralThrust = Phaser.Math.Clamp(aLatCmd, -this.maxLateralAccel, this.maxLateralAccel);
                }

                // Distance-dependent thresholds: allow larger v_tan far away,
                // but tighten the requirement as we get closer to Earth.
                // Example: at dist >= 5000, tolerate up to ~2 units before correcting;
                // near Earth (~500), tolerate only ~0.5 before correcting and stop at ~0.05.
                const maxDist = 5000;
                const minDist = 500;
                const clampedDist = Phaser.Math.Clamp(dist, minDist, maxDist);
                const lerp = (clampedDist - minDist) / (maxDist - minDist); // 0 near Earth, 1 far away

                const vTanStartFar = 6.0; // require larger v_tan to trigger correction far away
                const vTanStartNear = 0.6;

                const vTanStart = vTanStartNear + (vTanStartFar - vTanStartNear) * lerp;

                // Simple cooldown: wait some time after the last correction before
                // starting a new one, to avoid back-to-back impulses.
                const cooldown = 1.5; // seconds

                // When following a slingshot path, rely on continuous heading and
                // side-thruster control to stay near the red line and skip the
                // discrete v_tan impulse corrections.
                if (!slingshotApproach &&
                    !this.vTanCorrectionActive &&
                    this.timeSinceLastVTanCorrection > cooldown &&
                    tangentialForControl > vTanStart) {
                    // Start a new analytic correction: snapshot |v_tan| and compute
                    // the desired impulse I = m*|v_tan| (with a small gain) to cancel it.
                    const vTanMag = tangentialForControl;
                    const m = this.shipMass;
                    const gain = this.vTanImpulseGain || 1.0;
                    this.vTanCorrectionRemainingImpulse = m * vTanMag * gain;
                    this.vTanCorrectionElapsed = 0;
                    this.vTanCorrectionBurnTime = 0;
                    this.vTanCorrectionActive = true;
                }

                // If a correction is active, burn until the remaining impulse is exhausted.
                if (!slingshotApproach && this.vTanCorrectionActive && this.vTanCorrectionRemainingImpulse > 0) {
                    // Thrust only while we are in correction mode and roughly aligned with
                    // the anti-v_tan heading chosen in computeDesiredHeading.
                    const aligned = Math.abs(angleError) < 0.2; // ~11.5 deg
                    if (aligned) {
                        const F0 = this.thrustAccel;
                        const maxImpulseThisFrame = F0 * dt; // full-thrust impulse this frame

                        if (this.vTanCorrectionRemainingImpulse > maxImpulseThisFrame) {
                            // Coarse phase: burn full thrust this frame
                            thrust = true;
                            thrustScale = 1.0;
                            this.vTanCorrectionRemainingImpulse -= maxImpulseThisFrame;
                        } else {
                            // Fine phase: last partial-thrust frame to hit target exactly
                            const scale = this.vTanCorrectionRemainingImpulse / maxImpulseThisFrame;
                            thrust = true;
                            thrustScale = Phaser.Math.Clamp(scale, 0, 1);
                            this.vTanCorrectionRemainingImpulse = 0;
                        }

                        // Track elapsed burn time for diagnostics
                        this.vTanCorrectionElapsed += dt;
                    } else {
                        thrust = false;
                    }

                    // If we've exhausted the desired impulse (or effectively so), end correction.
                    if (this.vTanCorrectionRemainingImpulse <= 1e-4) {
                        this.vTanCorrectionActive = false;
                        this.timeSinceLastVTanCorrection = 0;
                        this.vTanCorrectionBurnTime = 0;
                        this.vTanCorrectionRemainingImpulse = 0;
                    }
                }

                // Radial-velocity maintenance: if we're not in a v_tan correction and
                // the radial speed toward Earth has dropped too low (or become outward),
                // apply thrust while aligned to restore the controlled "radial" speed
                // toward vCruise. When no slingshot plan exists, this is Earth-radial;
                // when a plan exists, it is the path-parallel component along the red
                // trajectory.
                if (!this.vTanCorrectionActive && !thrust) {
                    const vRadMinMag = this.vCruise; // desired minimum controlled speed ~ vCruise
                    let needMoreInward;

                    if (slingshotApproach) {
                        // Path-relative: radialForControl is vPar along the red path.
                        // Thrust until the along-path speed reaches ~vCruise; do not
                        // continue accelerating once we've exceeded that.
                        needMoreInward = radialForControl < vRadMinMag;
                    } else {
                        // Original Earth-radial logic
                        needMoreInward = (radialForControl >= 0) || (Math.abs(radialForControl) < vRadMinMag);
                    }
                    if (needMoreInward) {
                        const alignedRadialInward = Math.abs(angleError) < 0.3; // slightly looser heading gate
                        if (alignedRadialInward) {
                            thrust = true;
                        }
                    }
                }

                break;
            }

            case this.phases.BRAKE: {
                // Thrust to decelerate until inward radial speed is reduced to ~50 units,
                // but only once we're aligned with the radial-outward heading.
                const bearing = sensors.bearingToEarth;
                const radialAngleOut = bearing + Math.PI;
                const ux = Math.cos(radialAngleOut);
                const uy = Math.sin(radialAngleOut);
                const radialV = sensors.vx * ux + sensors.vy * uy; // outward > 0, inward < 0

                const alignedForBrake = Math.abs(angleError) < 0.2; // wider window to reduce pulsing
                const targetInwardSpeed = activeTuningParams.brakeTargetVr; // desired inward radial velocity after braking
                const needMoreBrake = radialV < targetInwardSpeed; // still too fast inward

                thrust = alignedForBrake && needMoreBrake;
                if (thrust) {
                    // Slightly reduced thrust during BRAKE
                    thrustScale = 0.95;
                }
                break;
            }

            case this.phases.LAND: {
                // Early in LAND, allow some thrust to keep speed under control;
                // once in final-trim regime, rely on gravity only and adjust attitude.
                if (!landTrimActive) {
                    thrust = speed > this.maxLandingSpeed * 0.8;
                    if (thrust) {
                        // Slightly reduced thrust during LAND burns
                        thrustScale = 0.95;
                    }
                } else {
                    thrust = false;
                }

                // While in LAND with the nose pointed roughly away from Earth, use
                // side thrusters to damp the tangential component of velocity
                // relative to the radial-outward direction.
                const alignedForLand = Math.abs(angleError) < Phaser.Math.DegToRad(5.0);
                if (alignedForLand) {
                    const theta = sensors.theta;
                    const perpX = -Math.sin(theta);
                    const perpY = Math.cos(theta);

                    // Lateral velocity in the ship's frame (perpendicular to nose).
                    const vLat = sensors.vx * perpX + sensors.vy * perpY;

                    // Only engage side thrusters when there is a noticeable
                    // tangential component to clean up.
                    const vLatThreshold = 2.0;
                    if (Math.abs(vLat) > vLatThreshold) {
                        const aLatCmd = -this.kpLateral * vLat;
                        lateralThrust = Phaser.Math.Clamp(
                            aLatCmd,
                            -this.maxLateralAccel,
                            this.maxLateralAccel
                        );
                    }
                }
                break;
            }
        }
        
        return { angularControl, thrust, thrustScale, lateralThrust };
    }
    
    update(dt) {
        if (!this.enabled) {
            this.lastControl = { angularControl: 0, thrust: false };
            return;
        }
        
        try {
            // Advance timers
            this.timeSinceLastVTanCorrection += dt;

            // Get sensor readings
            const sensors = this.getSensorVector();
            
            // Update phase
            this.updatePhase(sensors);
            
            // Compute control commands
            const control = this.computeControl(sensors, dt);
            
            // Debug: log control state occasionally
            if (!this.debugCounter) this.debugCounter = 0;
            this.debugCounter++;
            if (this.debugCounter % 60 === 0) {
                console.log('Autopilot active - Phase:', this.getPhaseString(), 
                           'Angular:', control.angularControl.toFixed(2), 
                           'Thrust:', control.thrust);
            }
            
            // Cache for visualization
            this.lastControl = control;
            
            // Apply controls to game
            this.applyControl(control, dt);
            
            // Asteroid defense system (independent of main control)
            this.asteroidDefense(dt);
        } catch (error) {
            console.error('Autopilot error:', error);
            this.enabled = false;
        }
    }
    
    asteroidDefense(dt) {
        // Auto-aim and fire at threatening asteroids
        const player = this.scene.player;
        
        if (!this.scene.asteroids) return;
        const asteroids = this.scene.asteroids.getChildren();
        
        const threatRange = 400;
        const fireRate = 0.2; // seconds between shots
        
        if (!this.lastFireTime) this.lastFireTime = 0;
        this.lastFireTime += dt;
        
        if (this.lastFireTime < fireRate || this.scene.ammo <= 0) return;
        
        // Find closest threatening asteroid
        let closestThreat = null;
        let closestDist = Infinity;
        
        asteroids.forEach(asteroid => {
            const dx = asteroid.x - player.x;
            const dy = asteroid.y - player.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            if (dist < threatRange && dist < closestDist) {
                // Check if asteroid is approaching (dot product with relative velocity)
                const relVx = asteroid.body.velocity.x - player.body.velocity.x;
                const relVy = asteroid.body.velocity.y - player.body.velocity.y;
                const approaching = (dx * relVx + dy * relVy) < 0;
                
                if (approaching) {
                    closestThreat = asteroid;
                    closestDist = dist;
                }
            }
        });
        
        // Fire at the threat with lead angle calculation
        if (closestThreat) {
            const dx = closestThreat.x - player.x;
            const dy = closestThreat.y - player.y;
            
            // Calculate lead angle for moving target
            const bulletSpeed = 600;
            const relVx = closestThreat.body.velocity.x - player.body.velocity.x;
            const relVy = closestThreat.body.velocity.y - player.body.velocity.y;
            
            // Simple lead: estimate time to impact and aim ahead
            const timeToImpact = closestDist / bulletSpeed;
            const leadX = dx + relVx * timeToImpact;
            const leadY = dy + relVy * timeToImpact;
            const aimAngle = Math.atan2(leadY, leadX);
            
            // Fire bullet in calculated direction
            this.fireDefensiveBullet(aimAngle);
            this.lastFireTime = 0;
        }
    }
    
    fireDefensiveBullet(angle) {
        const player = this.scene.player;
        const speed = 600;
        
        const bullet = this.scene.bullets.create(player.x, player.y, null);
        bullet.setCircle(5);
        bullet.displayWidth = 10;
        bullet.displayHeight = 10;
        bullet.setTint(0xff0000);
        
        bullet.vx = Math.cos(angle) * speed + player.body.velocity.x;
        bullet.vy = Math.sin(angle) * speed + player.body.velocity.y;
        
        this.scene.ammo--;
    }
    
    applyControl(control, dt) {
        // Track total fuel usage this frame (main + lateral thrusters)
        let totalFuelUse = 0;

        // Apply angular control
        if (control.angularControl > 0) {
            // Turn right
            this.scene.angularVelocity += this.angularAccel * dt;
        } else if (control.angularControl < 0) {
            // Turn left
            this.scene.angularVelocity -= this.angularAccel * dt;
        }
        
        this.scene.angularVelocity = Phaser.Math.Clamp(
            this.scene.angularVelocity,
            -this.maxAngularSpeed,
            this.maxAngularSpeed
        );
        
        // Integrate angular velocity to update angle
        this.scene.playerAngle += this.scene.angularVelocity * dt;
        
        // Apply thrust
        if (control.thrust && this.scene.fuel > 0) {
            const thrustBase = 150;
            const scale = typeof control.thrustScale === 'number' ? control.thrustScale : 1.0;
            const thrust = thrustBase * scale;
            const vx = Math.cos(this.scene.playerAngle) * thrust * dt;
            const vy = Math.sin(this.scene.playerAngle) * thrust * dt;
            this.scene.player.body.velocity.x += vx;
            this.scene.player.body.velocity.y += vy;
            this.scene.isThrusting = true;

            // Fuel usage proportional to main thrust magnitude.
            const mainFuelRate = 0.015; // tuned so typical autopilot trip uses ~half tank
            totalFuelUse += thrust * dt * mainFuelRate;
        } else {
            this.scene.isThrusting = false;
        }

        // Apply lateral thrust (side boosters) without changing attitude.
        if (control.lateralThrust && this.scene.fuel > 0) {
            const aLat = Phaser.Math.Clamp(control.lateralThrust, -this.maxLateralAccel, this.maxLateralAccel);
            const perpX = -Math.sin(this.scene.playerAngle);
            const perpY = Math.cos(this.scene.playerAngle);
            const dvx = perpX * aLat * dt;
            const dvy = perpY * aLat * dt;
            this.scene.player.body.velocity.x += dvx;
            this.scene.player.body.velocity.y += dvy;

            // Fuel usage proportional to absolute lateral acceleration, but
            // at a lower rate than the main thruster.
            const sideFuelRate = 0.005;
            totalFuelUse += Math.abs(aLat) * dt * sideFuelRate;

            // Visual flags for side thrusters
            this.scene.sideThrustLeft = aLat > 0;
            this.scene.sideThrustRight = aLat < 0;
        } else {
            this.scene.sideThrustLeft = false;
            this.scene.sideThrustRight = false;
        }

        // Apply accumulated fuel usage from this frame's thrust commands.
        if (totalFuelUse > 0) {
            this.scene.fuel = Math.max(0, this.scene.fuel - totalFuelUse);
        }
    }
    
    getPhaseString() {
        const phaseNames = ['ORIENT', 'BOOST', 'CRUISE', 'BRAKE', 'LAND'];
        return phaseNames[this.currentPhase];
    }
}

class GameScene extends Phaser.Scene {
    constructor() {
        super({ key: 'GameScene' });
    }

    create() {
        const width = this.cameras.main.width;
        const height = this.cameras.main.height;
        
        // Fixed large square world: 10000 x 10000
        this.worldSize = 10000;
        this.worldWidth = this.worldSize;
        this.worldHeight = this.worldSize;
        this.physics.world.setBounds(0, 0, this.worldWidth, this.worldHeight);

        // Game state
        this.shipTime = 0;
        this.earthTime = 0;
        this.fuel = 100;
        this.ammo = 50;
        this.gameOver = false;
        this.sideThrustLeft = false;
        this.sideThrustRight = false;

        // State for numerical slingshot refinement sweep
        this.slingshotSweepActive = false;
        this.slingshotSweepAngle = 0;
        this.slingshotSweepMaxAngle = 0;
        this.slingshotSweepStep = 0;
        this.slingshotSweepBestAngle = null;
        this.slingshotSweepBestResult = null;
        this.slingshotSweepBestScore = Number.POSITIVE_INFINITY;
        this.slingshotSweepTotalSteps = 0;
        this.slingshotSweepDoneSteps = 0;
        this.slingshotSweepText = null;

        // Mode selection for this scene instance
        this.mode = globalMode;
        this.testOverallSuccess = null;

        // Create background stars
        this.createBackground();
        
        // Initialize start and destination positions.
        if (experimentConfig.enabled) {
            this.mode = 'TEST';
            this.initializeExperimentStartAndDestination();
        } else {
            this.initializeStartAndDestination();
        }
        this.createPlayer();
        this.createEarth();
        
        // Create obstacles
        this.createAsteroids();
        this.createGravityObjects();
        this.createPickups();
        
        // Plan an initial slingshot path (requires massive objects). If we are
        // in AUTOPILOT or TEST modes and a slingshot plan exists, kick off the
        // numerical refinement sweep. The sweep itself runs incrementally in
        // update() so we can display progress before the run begins.
        this.planSlingshotPath();
        if ((this.mode === 'AUTOPILOT' || this.mode === 'TEST') && this.slingshotPlan) {
            this.refineSlingshotPlanNumerically();
        }
        
        // Setup camera (locked to ship center)
        this.cameras.main.startFollow(this.player, true, 1, 1);
        this.cameras.main.setBounds(0, 0, this.worldWidth, this.worldHeight);
        
        // UI
        this.createUI();
        if (!experimentConfig.enabled && this.mode === 'MENU') {
            this.createStartMenu();
        }
        
        // Controls
        this.cursors = this.input.keyboard.createCursorKeys();
        this.spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
        this.autopilotKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.A);
        
        // Autopilot controller
        this.autopilot = new AutopilotController(this);
        this.autopilot.enabled = false;
        
        // Bullets
        this.bullets = this.physics.add.group();
        
        // Collisions
        this.physics.add.overlap(this.player, this.earth, this.winGame, null, this);
        this.physics.add.collider(this.player, this.asteroids, this.loseGame, null, this);
        this.physics.add.overlap(this.player, this.fuelPickups, this.collectFuel, null, this);
        this.physics.add.overlap(this.player, this.ammoPickups, this.collectAmmo, null, this);
        
        console.log('Game created! Player at:', this.player.x, this.player.y, 'Earth at:', this.earth.x, this.earth.y);
    }

    createBackground() {
        // Create scrolling starfield
        this.bg = this.add.graphics();
        this.bg.setScrollFactor(0);
        
        this.bgStars = [];
        // Increased star count (x3)
        for (let i = 0; i < 600; i++) {
            this.bgStars.push({
                x: Math.random() * 1200,
                y: Math.random() * 800,
                size: Math.random() * 2 + 0.5,
                alpha: Math.random() * 0.7 + 0.3
            });
        }
    }

    initializeStartAndDestination() {
        const worldSize = this.worldSize;
        const marginStart = 200;
        const marginEarth = 200;
        const minFactor = 0.8;
        const maxFactor = 1.2;
        const maxAttempts = 100;

        let attempt = 0;
        while (attempt < maxAttempts) {
            attempt++;

            const startX = Phaser.Math.Between(marginStart, worldSize - marginStart);
            const startY = Phaser.Math.Between(marginStart, worldSize - marginStart);

            const angle = Math.random() * Math.PI * 2;
            const distanceFactor = minFactor + Math.random() * (maxFactor - minFactor);
            const distance = worldSize * distanceFactor;

            const earthX = startX + Math.cos(angle) * distance;
            const earthY = startY + Math.sin(angle) * distance;

            if (
                earthX > marginEarth && earthX < worldSize - marginEarth &&
                earthY > marginEarth && earthY < worldSize - marginEarth
            ) {
                this.startX = startX;
                this.startY = startY;
                this.earthX = earthX;
                this.earthY = earthY;
                return;
            }
        }

        // Fallback to deterministic positions if randomization fails
        this.startX = this.worldWidth * 0.25;
        this.startY = this.worldHeight * 0.5;
        this.earthX = this.worldWidth * 0.75;
        this.earthY = this.worldHeight * 0.5;
    }

    initializeExperimentStartAndDestination() {
        // Use the same S->E distance range and world geometry as normal
        // Autopilot mode, but constrain the *direction* of the S->E vector
        // to the current experiment angle. This makes TEST runs comparable
        // to real Autopilot runs while still sweeping approach angles.

        // First, generate a reasonable start/Earth pair using the normal
        // initializer (random position, distance in [0.8, 1.2] * worldSize,
        // and within margins).
        this.initializeStartAndDestination();

        const baseSx = this.startX;
        const baseSy = this.startY;
        const baseEx = this.earthX;
        const baseEy = this.earthY;

        const dx = baseEx - baseSx;
        const dy = baseEy - baseSy;
        const len = Math.sqrt(dx * dx + dy * dy) || 1;

        // Preserve the original S->E distance but rotate its direction to
        // match the current experiment angle, while ensuring that both the
        // start and Earth positions remain inside the world margins.
        const angleDeg = experimentConfig.anglesDeg[experimentConfig.angleIndex];
        const angleRad = Phaser.Math.DegToRad(angleDeg);
        const ux = Math.cos(angleRad);
        const uy = Math.sin(angleRad);

        const worldSize = this.worldSize;
        const marginStart = 200;
        const marginEarth = 200;
        const maxAttempts = 200;

        let placed = false;
        for (let attempt = 0; attempt < maxAttempts; attempt++) {
            const candidateStartX = Phaser.Math.Between(marginStart, worldSize - marginStart);
            const candidateStartY = Phaser.Math.Between(marginStart, worldSize - marginStart);
            const candidateEarthX = candidateStartX + ux * len;
            const candidateEarthY = candidateStartY + uy * len;

            if (
                candidateEarthX > marginEarth && candidateEarthX < worldSize - marginEarth &&
                candidateEarthY > marginEarth && candidateEarthY < worldSize - marginEarth
            ) {
                this.startX = candidateStartX;
                this.startY = candidateStartY;
                this.earthX = candidateEarthX;
                this.earthY = candidateEarthY;
                placed = true;
                break;
            }
        }

        if (!placed) {
            // If we cannot find a placement that fits the requested angle and
            // distance within the world, fall back to the original Autopilot
            // geometry for this trial.
            this.startX = baseSx;
            this.startY = baseSy;
            this.earthX = baseEx;
            this.earthY = baseEy;
        }
    }

    createPlayer() {
        // Start player near left side of world
        const startX = this.startX;
        const startY = this.startY;
        
        // Physics body (invisible circle for collisions & motion)
        this.player = this.add.circle(startX, startY, 15, 0x000000);
        this.player.setVisible(false);
        this.physics.add.existing(this.player);
        this.player.body.setCircle(15);
        this.player.body.setDrag(0);
        this.player.body.setMaxVelocity(400);
        this.player.body.setCollideWorldBounds(false);
        
        // Ship orientation: 0 rad points along +X (to the right)
        this.playerAngle = 0;
        this.angularVelocity = 0;
        
        // Visual ship body, drawn as a sleek triangular craft
        this.shipBody = this.add.graphics();
    }

    createEarth() {
        // Place Earth at right side, ensuring it's visible from start
        const earthX = this.earthX;
        const earthY = this.earthY;
        
        this.earth = this.add.circle(earthX, earthY, 80, 0x0088ff);
        this.earth.setStrokeStyle(4, 0x00aaff);

        this.earth.body.setImmovable(true);
        
        console.log('Earth created at:', earthX, earthY);
    }

    createAsteroids() {
        // Keep an empty asteroid group so other systems can safely reference it,
        // but do not spawn any actual asteroids while focusing on takeoff/landing.
        this.asteroids = this.physics.add.group();

        if (!globalEnableAsteroids) {
            return;
        }

        const worldSize = this.worldSize;
        const count = 20; // reduced density compared to original field

        for (let i = 0; i < count; i++) {
            const x = Math.random() * worldSize;
            const y = Math.random() * worldSize;
            const radius = Phaser.Math.Between(8, 18);

            const asteroid = this.add.circle(x, y, radius, 0x666666);
            this.physics.add.existing(asteroid);
            asteroid.body.setCircle(radius);
            asteroid.body.setBounce(1, 1);
            asteroid.body.setCollideWorldBounds(false);

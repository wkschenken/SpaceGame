                Phaser.Math.Between(-50, 50),
                Phaser.Math.Between(-50, 50)
            );

            this.asteroids.add(asteroid);
        }
    }

    createGravityObjects() {
        // No external gravity objects while debugging pure Earth approach
        this.gravityObjects = [];

        if (!globalEnableMassiveObjects) {
            return;
        }

        // Single massive object placed near the straight start->Earth baseline.
        const Sx = this.startX;
        const Sy = this.startY;
        const Ex = this.earthX;
        const Ey = this.earthY;
        const dxSE = Ex - Sx;
        const dySE = Ey - Sy;
        const lenSE = Math.sqrt(dxSE * dxSE + dySE * dySE) || 1;
        const uxSE = dxSE / lenSE;
        const uySE = dySE / lenSE;

        // Unit perpendicular to the baseline
        const px = -uySE;
        const py = uxSE;

        // Sample a random position for the massive object from a Gaussian
        // distribution centered at the midpoint between S and E. We use a
        // 2D Gaussian expressed in the (along-baseline, perpendicular)
        // coordinate frame, with variance proportional to half the S-E
        // distance so typical samples lie of order sqrt(lenSE) from the
        // midpoint.

        // Midpoint along the baseline in world coordinates.
        const midX = Sx + uxSE * (lenSE * 0.5);
        const midY = Sy + uySE * (lenSE * 0.5);

        // One-dimensional Gaussian sampler (Box-Muller transform).
        const sampleGaussian = () => {
            let u1 = Math.random();
            let u2 = Math.random();
            u1 = u1 < 1e-8 ? 1e-8 : u1;
            return Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
        };

        // Standard deviation chosen so that variance is proportional to
        // half of the S-E distance.
        const variance = 0.5 * lenSE;
        const stdDev = Math.sqrt(Math.max(variance, 1e-3));

        const alongOffset = sampleGaussian() * stdDev;
        const perpOffset = sampleGaussian() * stdDev;

        const objX = midX + uxSE * alongOffset + px * perpOffset;
        const objY = midY + uySE * alongOffset + py * perpOffset;

        const radius = 35;
        const obj = this.add.circle(objX, objY, radius, 0xffaa00, 0.6);
        this.physics.add.existing(obj);
        obj.body.setCircle(radius);
        obj.body.setImmovable(true);

        // Gravity parameters stored on the object
        obj.setData('gravityStrength', 76800);
        obj.setData('schwarzschildRadius', radius * 1.5);
        obj.setData('mass', 80);

        this.gravityObjects.push(obj);
    }

    createPickups() {
        // Create empty pickup groups so collision handlers still work, but do not
        // spawn any fuel or ammo tokens during guidance tuning.
        this.fuelPickups = this.physics.add.group();
        this.ammoPickups = this.physics.add.group();

        if (!globalEnableTokens) {
            return;
        }

        const worldSize = this.worldSize;

        const fuelCount = 6;  // reduced density
        const ammoCount = 6;  // reduced density

        for (let i = 0; i < fuelCount; i++) {
            const x = Math.random() * worldSize;
            const y = Math.random() * worldSize;
            const fuel = this.add.rectangle(x, y, 10, 14, 0x00ff00);
            this.physics.add.existing(fuel);
            fuel.body.setImmovable(true);
            this.fuelPickups.add(fuel);
        }

        for (let i = 0; i < ammoCount; i++) {
            const x = Math.random() * worldSize;
            const y = Math.random() * worldSize;
            const ammo = this.add.rectangle(x, y, 10, 10, 0xffff00);
            this.physics.add.existing(ammo);
            ammo.body.setImmovable(true);
            this.ammoPickups.add(ammo);
        }
    }

    planSlingshotPath() {
        // Clear any previous plan and debug graphics
        if (this.slingshotDebug) {
            this.slingshotDebug.destroy();
            this.slingshotDebug = null;
        }
        this.slingshotPlan = null;

        if (!this.gravityObjects || this.gravityObjects.length === 0) {
            return;
        }

        const Sx = this.startX;
        const Sy = this.startY;
        const Ex = this.earthX;
        const Ey = this.earthY;

        const dxSE = Ex - Sx;
        const dySE = Ey - Sy;
        const lenSE = Math.sqrt(dxSE * dxSE + dySE * dySE);
        if (lenSE < 1e-3) {
            return;
        }

        const ux = dxSE / lenSE;
        const uy = dySE / lenSE;

        let bestObj = null;
        let bestT = Number.POSITIVE_INFINITY;
        let bestPerpDist = 0;
        let bestCorridorRadius = 0;

        const corridorFactor = 1.0; // R_corridor = corridorFactor * schwarzschildRadius (tighter: only very close objects impede)

        this.gravityObjects.forEach(obj => {
            const Cx = obj.x;
            const Cy = obj.y;
            const rx = Cx - Sx;
            const ry = Cy - Sy;

            const t = rx * ux + ry * uy; // projection distance along S->E direction
            if (t <= 0) {
                return; // object is effectively behind the start
            }

            const projX = Sx + t * ux;
            const projY = Sy + t * uy;
            const perpX = Cx - projX;
            const perpY = Cy - projY;
            const dPerp = Math.sqrt(perpX * perpX + perpY * perpY);

            const schwarzschildRadius = obj.getData('schwarzschildRadius') || 0;
            if (schwarzschildRadius <= 0) {
                return;
            }
            const corridorRadius = corridorFactor * schwarzschildRadius;

            if (dPerp < corridorRadius && t < bestT) {
                bestT = t;
                bestObj = obj;
                bestPerpDist = dPerp;
                bestCorridorRadius = corridorRadius;
            }
        });

        if (!bestObj) {
            return; // no interfering massive object found along initial straight path
        }

        const Cx = bestObj.x;
        const Cy = bestObj.y;

        // Incoming direction: along initial S->E line
        const dinx = ux;
        const diny = uy;

        // Desired outgoing direction: radial from object to Earth
        const dxOE = Ex - Cx;
        const dyOE = Ey - Cy;
        const lenOE = Math.sqrt(dxOE * dxOE + dyOE * dyOE);
        if (lenOE < 1e-3) {
            return;
        }
        const doutx = dxOE / lenOE;
        const douty = dyOE / lenOE;

        // Deflection angle χ between din and dout
        const dot = Phaser.Math.Clamp(dinx * doutx + diny * douty, -1, 1);
        let chi = Math.acos(dot);

        // Numerical sanity check: if chi is not finite, abort.
        if (!Number.isFinite(chi)) {
            return;
        }

        // Estimate impact parameter b from scattering formula
        const mu = bestObj.getData('gravityStrength');
        const vInf = activeTuningParams.vCruise;
        if (typeof mu !== 'number' || mu <= 0 || vInf <= 0) {
            return;
        }

        const halfChi = chi * 0.5;
        const tanHalfChi = Math.tan(halfChi);
        if (Math.abs(tanHalfChi) < 1e-3) {
            return;
        }

        // Baseline asymptotic impact parameter from scattering
        let b = mu / (vInf * vInf * tanHalfChi);

        // Simple empirical adjustment: reduce the impact parameter slightly
        // relative to the pure scattering formula to better match the
        // observed deflection in the game.
        b *= 0.9;

        // Derive a physically motivated minimum impact parameter based on the
        // midline scenario described by the user: when the object lies at the
        // center of the start->Earth baseline (distance d = lenSE), the
        // required deflection angle is approximated by
        //
        //   4b/d ≈ 2 arctan(mu / (b v^2)).
        //
        // We solve this equation numerically for b_mid and then use about half
        // of that value as a lower bound on b, to allow for objects that are
        // not exactly centered on the baseline.
        let minB = 0;
        const dSE = lenSE;
        if (dSE > 0) {
            const solveMidlineB = () => {
                const f = (bTest) => {
                    if (bTest <= 0) return Number.POSITIVE_INFINITY;
                    const left = (4 * bTest) / dSE;
                    const right = 2 * Math.atan(mu / (bTest * vInf * vInf));
                    return left - right;
                };

                let bLo = 0.001 * dSE;
                let bHi = 0.25 * dSE;
                let fLo = f(bLo);
                let fHi = f(bHi);

                if (!Number.isFinite(fLo) || !Number.isFinite(fHi) || fLo * fHi > 0) {
                    return NaN;
                }

                for (let iter = 0; iter < 40; iter++) {
                    const bMid = 0.5 * (bLo + bHi);
                    const fMid = f(bMid);
                    if (!Number.isFinite(fMid)) {
                        break;
                    }
                    if (Math.abs(fMid) < 1e-3) {
                        return bMid;
                    }
                    if (fLo * fMid <= 0) {
                        bHi = bMid;
                        fHi = fMid;
                    } else {
                        bLo = bMid;
                        fLo = fMid;
                    }
                }
                return 0.5 * (bLo + bHi);
            };

            const bMid = solveMidlineB();
            if (Number.isFinite(bMid) && bMid > 0) {
                // Use roughly half the midline solution as requested.
                minB = 0.5 * bMid;
            }
        }

        const schwarzschildRadius = bestObj.getData('schwarzschildRadius') || 0;
        if (schwarzschildRadius > 0) {
            // Ensure we do not fly inside the physical body: infer its radius
            // from the stored Schwarzschild radius.
            const physRadius = schwarzschildRadius / 1.5;
            const safeRadius = physRadius * 1.05;
            if (minB < safeRadius) {
                minB = safeRadius;
            }
        }

        if (minB > 0) {
            b = Math.max(b, minB);
        }

        // Construct a line from S that has impact parameter b relative to C.
        const dxSC = Cx - Sx;
        const dySC = Cy - Sy;
        const dSC = Math.sqrt(dxSC * dxSC + dySC * dySC);
        if (dSC <= b + 1e-3) {
            // Start is too close for this impact parameter; abort planning.
            return;
        }

        const uxSC = dxSC / dSC;
        const uySC = dySC / dSC;
        // Perpendicular to S->C
        const nxSC = -uySC;
        const nySC = uxSC;

        const h = Math.sqrt(dSC * dSC - b * b);

        const TxLeftX = Sx + uxSC * h + nxSC * b;
        const TxLeftY = Sy + uySC * h + nySC * b;
        const TxRightX = Sx + uxSC * h - nxSC * b;
        const TxRightY = Sy + uySC * h - nySC * b;

        const dLeftX = TxLeftX - Sx;
        const dLeftY = TxLeftY - Sy;
        const lenLeft = Math.sqrt(dLeftX * dLeftX + dLeftY * dLeftY);
        const dRightX = TxRightX - Sx;
        const dRightY = TxRightY - Sy;
        const lenRight = Math.sqrt(dRightX * dRightX + dRightY * dRightY);

        if (lenLeft < 1e-3 || lenRight < 1e-3) {
            return;
        }

        const uxLeft = dLeftX / lenLeft;
        const uyLeft = dLeftY / lenLeft;
        const uxRight = dRightX / lenRight;
        const uyRight = dRightY / lenRight;

        // Decide which tangent branch to use.
        // We deviate to the *opposite* side of the baseline start→Earth
        // direction from where the massive object lies. If the object is on the
        // right of the green line (as seen from the rocket), we choose the
        // branch that goes to the left, and vice versa. This corresponds to
        // the "second choice" described by the user.
        const baseDx = ux;   // baseline direction S->E
        const baseDy = uy;
        const objRx = Cx - Sx;
        const objRy = Cy - Sy;
        const objSide = baseDx * objRy - baseDy * objRx; // sign: >0 => object is "left" of baseline

        const sideLeft = baseDx * dLeftY - baseDy * dLeftX;
        const sideRight = baseDx * dRightY - baseDy * dRightX;

        let dirX = uxLeft;
        let dirY = uyLeft;
        let usedLeftBranch = true;

        const sideEps = 1e-5;
        if (Math.abs(objSide) > sideEps) {
            // Choose the branch whose side sign is opposite to the object's
            // side sign relative to the baseline.
            const leftOpposite = sideLeft * objSide < 0;
            const rightOpposite = sideRight * objSide < 0;

            if (leftOpposite && !rightOpposite) {
                dirX = uxLeft;
                dirY = uyLeft;
                usedLeftBranch = true;
            } else if (rightOpposite && !leftOpposite) {
                dirX = uxRight;
                dirY = uyRight;
                usedLeftBranch = false;
            }
        } else {
            const dotLeftOut = uxLeft * doutx + uyLeft * douty;
            const dotRightOut = uxRight * doutx + uyRight * douty;

            if (dotRightOut > dotLeftOut) {
                dirX = uxRight;
                dirY = uyRight;
                usedLeftBranch = false;
            }
        }

        const tangentX = usedLeftBranch ? TxLeftX : TxRightX;
        const tangentY = usedLeftBranch ? TxLeftY : TxRightY;

        this.slingshotPlan = {
            startX: Sx,
            startY: Sy,
            earthX: Ex,
            earthY: Ey,
            baseUx: ux,
            baseUy: uy,
            object: bestObj,
            corridorRadius: bestCorridorRadius,
            impactParameter: b,
            deflectionAngle: chi,
            dirX,
            dirY,
            tangentX,
            tangentY,
            outDirX: doutx,
            outDirY: douty,
            perpDist: bestPerpDist
        };

        if (this.slingshotPlan && bestObj) {
            const d = lenSE;
            let ell = bestT;
            if (!Number.isFinite(ell)) {
                ell = 0.5 * d;
            }

            const minEll = 0.1 * d;
            const maxEll = 0.9 * d;
            if (ell < minEll) {
                ell = minEll;
            } else if (ell > maxEll) {
                ell = maxEll;
            }

            const baseDx = ux;
            const baseDy = uy;
            const objRx = Cx - Sx;
            const objRy = Cy - Sy;
            const objSide = baseDx * objRy - baseDy * objRx;

            if (Math.abs(objSide) > 1e-6) {
                const bPerpSign = objSide > 0 ? 1 : -1;
                const bPerp = bPerpSign * bestPerpDist;
                const thetaSign = -bPerpSign; // path goes to opposite side of baseline from the mass

                const thetaMax = Phaser.Math.DegToRad(30);
                let thetaLo = 0;
                let thetaHi = thetaSign * thetaMax;
                if (thetaLo > thetaHi) {
                    const tmp = thetaLo;
                    thetaLo = thetaHi;
                    thetaHi = tmp;
                }

                const mu = bestObj.getData('gravityStrength');
                const vInf = activeTuningParams.vCruise;
                if (typeof mu === 'number' && mu > 0 && typeof vInf === 'number' && vInf > 0) {
                    const bMinAbs = 1e-3;

                    const f = (theta) => {
                        let bTot = theta * ell + bPerp;
                        if (Math.abs(bTot) < bMinAbs) {
                            bTot = (bTot >= 0 ? 1 : -1) * bMinAbs;
                        }
                        const chiTheta = 2 * Math.atan(mu / (bTot * vInf * vInf));
                        return d * theta - (d - ell) * chiTheta;
                    };

                    let fLo = f(thetaLo);
                    let fHi = f(thetaHi);
                    if (Number.isFinite(fLo) && Number.isFinite(fHi) && fLo * fHi <= 0) {
                        let theta = 0.5 * (thetaLo + thetaHi);
                        for (let iter = 0; iter < 40; iter++) {
                            theta = 0.5 * (thetaLo + thetaHi);
                            const fMid = f(theta);
                            if (!Number.isFinite(fMid) || Math.abs(fMid) < 1e-4) {
                                break;
                            }
                            if (fLo * fMid <= 0) {
                                thetaHi = theta;
                                fHi = fMid;
                            } else {
                                thetaLo = theta;
                                fLo = fMid;
                            }
                        }

                        if (Number.isFinite(theta) && Math.abs(theta) > 1e-5) {
                            let bTot = theta * ell + bPerp;
                            if (Math.abs(bTot) < bMinAbs) {
                                bTot = (bTot >= 0 ? 1 : -1) * bMinAbs;
                            }
                            const chiTheta = 2 * Math.atan(mu / (bTot * vInf * vInf));

                            const cosT = Math.cos(theta);
                            const sinT = Math.sin(theta);
                            const dirInX = cosT * ux - sinT * uy;
                            const dirInY = sinT * ux + cosT * uy;
                            const lenDir = Math.sqrt(dirInX * dirInX + dirInY * dirInY) || 1;
                            const normDirX = dirInX / lenDir;
                            const normDirY = dirInY / lenDir;

                            const tangentX = Sx + ell * normDirX;
                            const tangentY = Sy + ell * normDirY;

                            const dxTE = Ex - tangentX;
                            const dyTE = Ey - tangentY;
                            const lenTE = Math.sqrt(dxTE * dxTE + dyTE * dyTE) || 1;
                            const outDirX = dxTE / lenTE;
                            const outDirY = dyTE / lenTE;

                            // Apply the same simple empirical reduction to the
                            // stored impact parameter in the refined solution.
                            const impactParameter = Math.abs(bTot) * 0.9;

                            this.slingshotPlan = {
                                startX: Sx,
                                startY: Sy,
                                earthX: Ex,
                                earthY: Ey,
                                baseUx: ux,
                                baseUy: uy,
                                object: bestObj,
                                corridorRadius: bestCorridorRadius,
                                impactParameter,
                                deflectionAngle: chiTheta,
                                dirX: normDirX,
                                dirY: normDirY,
                                tangentX,
                                tangentY,
                                outDirX,
                                outDirY,
                                perpDist: bestPerpDist
                            };
                        }
                    }
                }
            }
        }

        // Create a graphics layer for debug drawing if not already present
        this.slingshotDebug = this.add.graphics();
        this.slingshotDebug.setDepth(500);
    }

    refineSlingshotPlanNumerically() {
        // Initialize the incremental numerical sweep state. The actual work is
        // performed in updateSlingshotSweep() so we can display progress and
        // avoid blocking the main thread.
        const plan = this.slingshotPlan;
        if (!plan) {
            return;
        }

        if (!this.gravityObjects || this.gravityObjects.length === 0) {
            return;
        }

        // Build a list of massive objects with valid gravity strengths.
        const masses = this.gravityObjects
            .map(o => ({ obj: o, mu: o.getData('gravityStrength') }))
            .filter(m => typeof m.mu === 'number' && m.mu > 0);
        if (masses.length === 0) {
            return;
        }

        const Sx = this.startX;
        const Sy = this.startY;
        const Ex = this.earthX;
        const Ey = this.earthY;

        // Preserve the original green S->E baseline for crossing detection.
        const dxSE = Ex - Sx;
        const dySE = Ey - Sy;
        const lenSE = Math.sqrt(dxSE * dxSE + dySE * dySE);
        if (lenSE < 1e-3) {
            return;
        }

        // Use the line from the rocket start to the star as the reference
        // direction for the sweep, rather than the S->E baseline.
        const primaryMass = masses[0].obj;
        const Cx = primaryMass.x;
        const Cy = primaryMass.y;

        const dxBase = Cx - Sx;
        const dyBase = Cy - Sy;
        const lenBase = Math.sqrt(dxBase * dxBase + dyBase * dyBase);
        if (lenBase < 1e-3) {
            return;
        }

        const uxBase = dxBase / lenBase;
        const uyBase = dyBase / lenBase;

        const vCruise = activeTuningParams.vCruise;
        if (typeof vCruise !== 'number' || vCruise <= 0) {
            return;
        }

        // Set the maximum simulation time so that it is 100 seconds when
        // vCruise = 100, and scale inversely with cruise speed. Increasing
        // vCruise by a factor of k reduces maxTime by a factor of 1/k.
        const refCruise = 100;
        const baseMaxTimeAtRef = 100; // seconds when vCruise === refCruise
        const speedScale = vCruise / refCruise;
        const maxTime = baseMaxTimeAtRef / speedScale;

        // Angle sweep parameters (relative to the start->star line).
        const maxAngleDeg = 20;
        const dAngleDeg = 0.1;
        const maxAngleRad = Phaser.Math.DegToRad(maxAngleDeg);
        const dAngleRad = Phaser.Math.DegToRad(dAngleDeg);

        const totalSteps = Math.floor((2 * maxAngleRad) / dAngleRad) + 1;

        this.slingshotSweepActive = true;
        this.slingshotSweepAngle = -maxAngleRad;
        this.slingshotSweepMaxAngle = maxAngleRad;
        this.slingshotSweepStep = dAngleRad;
        this.slingshotSweepBestAngle = null;
        this.slingshotSweepBestResult = null;
        this.slingshotSweepBestScore = Number.POSITIVE_INFINITY;
        this.slingshotSweepTotalSteps = totalSteps;
        this.slingshotSweepDoneSteps = 0;

        // Cache geometry and parameters for use in updateSlingshotSweep.
        this.slingshotSweepData = {
            Sx, Sy, Ex, Ey,
            dxSE, dySE, lenSE,
            dxBase, dyBase, lenBase,
            uxBase, uyBase,
            vCruise,
            masses,
            earthRadius: 80,
            lineHitThreshold: 0.5 * 80,
            dt: 0.04,
            maxTime
        };

        // Create or update the on-screen sweep status text (bottom of screen).
        const cam = this.cameras.main;
        const cx = cam.width / 2;
        const cy = cam.height - 40;
        if (!this.slingshotSweepText) {
            this.slingshotSweepText = this.add.text(cx, cy, 'Computing slingshot...', {
                fontSize: '20px',
                fill: '#ff0'
            }).setOrigin(0.5).setScrollFactor(0).setDepth(3002);
        } else {
            this.slingshotSweepText.setText('Computing slingshot...');
        }
        this.slingshotSweepText.setVisible(true);
    }

    updateSlingshotSweep(dtFrame) {
        if (!this.slingshotSweepActive) {
            return;
        }

        const data = this.slingshotSweepData;
        if (!data) {
            this.slingshotSweepActive = false;
            if (this.slingshotSweepText) {
                this.slingshotSweepText.setVisible(false);
            }
            return;
        }

        const {
            Sx, Sy, Ex, Ey,
            dxSE, dySE, lenSE,
            dxBase, dyBase, lenBase,
            uxBase, uyBase,
            vCruise,
            masses,
            earthRadius,
            lineHitThreshold,
            dt,
            maxTime
        } = data;

        const maxSteps = Math.floor(maxTime / dt);

        // Helper to simulate a single trajectory for a given heading angle
        const simulateForAngle = (angleOffset) => {
            let x = Sx;
            let y = Sy;
            const cosA = Math.cos(angleOffset);
            const sinA = Math.sin(angleOffset);
            let vx = vCruise * (uxBase * cosA - uyBase * sinA);
            let vy = vCruise * (uxBase * sinA + uyBase * cosA);

            // Crossing detection remains relative to the original green S->E
            // baseline so we can measure distance to Earth where the trajectory
            // re-crosses that line.
            const baselineSign = (px, py) => (px - Sx) * dySE - (py - Sy) * dxSE;

            let t = 0;
            let minDist2 = Number.POSITIVE_INFINITY;
            let periX = x;
            let periY = y;
            let closestObj = null;

            let prevSign = baselineSign(x, y);
            let crossings = 0;
            let bestCrossX = null;
            let bestCrossY = null;
            let bestDistToEarth = Number.POSITIVE_INFINITY;

            for (let step = 0; step < maxSteps; step++) {
                // Sum gravity from all massive objects.
                let ax = 0;
                let ay = 0;
                for (const m of masses) {
                    const Cx = m.obj.x;
                    const Cy = m.obj.y;
                    const dxCS = Cx - x;
                    const dyCS = Cy - y;
                    const r2 = dxCS * dxCS + dyCS * dyCS;
                    const r = Math.sqrt(r2);
                    if (r > 1) {
                        const g = m.mu / r2;
                        ax += (dxCS / r) * g;
                        ay += (dyCS / r) * g;
                    }

                    // Track closest approach to any mass.
                    if (r2 < minDist2) {
                        minDist2 = r2;
                        periX = x;
                        periY = y;
                        closestObj = m.obj;
                    }
                }

                vx += ax * dt;
                vy += ay * dt;

                x += vx * dt;
                y += vy * dt;
                t += dt;

                const dxE = x - Ex;
                const dyE = y - Ey;
                const distE = Math.sqrt(dxE * dxE + dyE * dyE);
                if (distE <= earthRadius) {
                    return {
                        hit: true,
                        miss: false,
                        crossX: x,
                        crossY: y,
                        distToEarth: distE,
                        periX,
                        periY,
                        minDistToStar: Math.sqrt(minDist2),
                        closestObj
                    };
                }

                const s = baselineSign(x, y);
                if (t > dt * 2 && prevSign !== 0 && s !== 0 && Math.sign(s) !== Math.sign(prevSign)) {
                    crossings++;
                    const crossX = x;
                    const crossY = y;
                    const dCrossE = distE;
                    if (dCrossE < bestDistToEarth) {
                        bestDistToEarth = dCrossE;
                        bestCrossX = crossX;
                        bestCrossY = crossY;
                    }

                    if (crossings >= 1 && t > maxTime * 0.25) {
                        break;
                    }
                }
                prevSign = s;
            }

            if (bestCrossX !== null) {
                return {
                    hit: false,
                    miss: false,
                    crossX: bestCrossX,
                    crossY: bestCrossY,
                    distToEarth: bestDistToEarth,
                    periX,
                    periY,
                    minDistToStar: Math.sqrt(minDist2),
                    closestObj
                };
            }

            return { hit: false, miss: true };
        };

        // Process a small number of angles per frame so the UI can update.
        const anglesPerFrame = 2;
        for (let i = 0; i < anglesPerFrame && this.slingshotSweepActive; i++) {
            const angle = this.slingshotSweepAngle;
            if (angle > this.slingshotSweepMaxAngle + 1e-6) {
                this.slingshotSweepActive = false;
                break;
            }

            const result = simulateForAngle(angle);
            if (!result.miss) {
                const score = result.distToEarth;
                if (score < this.slingshotSweepBestScore) {
                    this.slingshotSweepBestScore = score;
                    this.slingshotSweepBestAngle = angle;
                    this.slingshotSweepBestResult = result;
                }
            }

            this.slingshotSweepDoneSteps++;
            this.slingshotSweepAngle += this.slingshotSweepStep;

            if (this.slingshotSweepAngle > this.slingshotSweepMaxAngle + 1e-6) {
                this.slingshotSweepActive = false;
                break;
            }
        }

        // Update progress text
        if (this.slingshotSweepText && this.slingshotSweepActive) {
            const progress = Math.min(1, this.slingshotSweepDoneSteps / Math.max(1, this.slingshotSweepTotalSteps));
            const percent = Math.round(progress * 100);
            this.slingshotSweepText.setText(`Computing slingshot... ${percent}%`);
        }

        // If the sweep has just finished, finalize the plan.
        if (!this.slingshotSweepActive) {
            if (this.slingshotSweepText) {
                this.slingshotSweepText.setVisible(false);
            }

            const bestResult = this.slingshotSweepBestResult;
            const bestAngle = this.slingshotSweepBestAngle;
            if (!bestResult || bestAngle === null) {
                // No acceptable numeric trajectory was found in the sweep.
                if (typeof console !== 'undefined' && console && console.warn) {
                    console.warn('Slingshot numeric sweep found no viable trajectory. Adjust parameters and try again.');
                }

                // Show a brief on-screen notification so the user knows why the
                // run is not proceeding under autopilot.
                const cam = this.cameras.main;
                const cx = cam.width / 2;
                const cy = cam.height - 80;
                const msg = this.add.text(
                    cx,
                    cy,
                    'No viable slingshot trajectory found. Adjust parameters and restart.',
                    {
                        fontSize: '20px',
                        fill: '#ff8080',
                        backgroundColor: '#000000'
                    }
                ).setOrigin(0.5).setScrollFactor(0).setDepth(3002);

                // Fade out the message after a few seconds.
                this.tweens.add({
                    targets: msg,
                    alpha: 0,
                    duration: 2500,
                    delay: 1500,
                    onComplete: () => {
                        msg.destroy();
                    }
                });

                // Ensure autopilot does not proceed with an invalid plan in
                // this run.
                if (this.autopilot) {
                    this.autopilot.enabled = false;
                }

                return;
            }

            // Report whether the best trajectory met the line-hit threshold.
            const accepted = this.slingshotSweepBestScore <= lineHitThreshold;
            if (typeof console !== 'undefined' && console && console.log) {
                console.log(
                    'Slingshot numeric sweep complete. bestScore=',
                    this.slingshotSweepBestScore,
                    'threshold=',
                    lineHitThreshold,
                    'accepted=',
                    accepted
                );
            }

            const angleOffset = bestAngle;
            const cosA = Math.cos(angleOffset);
            const sinA = Math.sin(angleOffset);
            const dirInX = uxBase * cosA - uyBase * sinA;
            const dirInY = uxBase * sinA + uyBase * cosA;

            const lenIn = Math.sqrt(dirInX * dirInX + dirInY * dirInY) || 1;
            const normDirX = dirInX / lenIn;
            const normDirY = dirInY / lenIn;

            const tangentX = bestResult.periX;
            const tangentY = bestResult.periY;

            const dxTE = Ex - tangentX;
            const dyTE = Ey - tangentY;
            const lenTE = Math.sqrt(dxTE * dxTE + dyTE * dyTE) || 1;
            const outDirX = dxTE / lenTE;
            const outDirY = dyTE / lenTE;

            const impactParameter = bestResult.minDistToStar;

            const dotIO = Phaser.Math.Clamp(normDirX * outDirX + normDirY * outDirY, -1, 1);
            const deflectionAngle = Math.acos(dotIO);

            const plan = this.slingshotPlan;
            if (!plan) {
                return;
            }

            // Use the nearest massive object along the best trajectory as the
            // representative object for debug visualization.
            const dominantObj = bestResult.closestObj || null;

            this.slingshotPlan = {
                startX: Sx,
                startY: Sy,
                earthX: Ex,
                earthY: Ey,
                baseUx: uxBase,
                baseUy: uyBase,
                object: dominantObj,
                corridorRadius: plan.corridorRadius,
                impactParameter,
                deflectionAngle,
                dirX: normDirX,
                dirY: normDirY,
                tangentX,
                tangentY,
                outDirX,
                outDirY,
                perpDist: plan.perpDist
            };

            if (this.slingshotDebug) {
                this.slingshotDebug.destroy();
                this.slingshotDebug = null;
            }
            this.slingshotDebug = this.add.graphics();
            this.slingshotDebug.setDepth(500);
        }
    }

    drawSlingshotDebug() {
        if (!this.slingshotDebug) {
            return;
        }

        const g = this.slingshotDebug;
        g.clear();

        // Always draw baseline straight path from start to Earth, even if no
        // slingshot plan exists.
        const Sx = this.startX;
        const Sy = this.startY;
        const Ex = this.earthX;
        const Ey = this.earthY;

        g.lineStyle(1, 0x00ff00, 0.6);
        g.beginPath();
        g.moveTo(Sx, Sy);
        g.lineTo(Ex, Ey);
        g.strokePath();

        // If we have a slingshot plan, overlay its details (corridor, impact
        // circle, and red trajectory) on top of the green baseline.
        const plan = this.slingshotPlan;
        if (!plan) {
            return;
        }

        const obj = plan.object;
        if (obj) {
            const Cx = obj.x;
            const Cy = obj.y;

            // Draw safety corridor circle around object
            g.lineStyle(1, 0x00ffff, 0.5);
            g.strokeCircle(Cx, Cy, plan.corridorRadius);

            // Draw impact parameter circle
            g.lineStyle(1, 0xff8800, 0.8);
            g.strokeCircle(Cx, Cy, plan.impactParameter);
        }

        // Draw planned slingshot trajectory as two straight segments:
        // 1) Incoming from start to tangent point along the chosen tangent line.
        // 2) Outgoing from tangent point along the desired post-encounter direction.
        const Tx = plan.tangentX;
        const Ty = plan.tangentY;

        // Incoming segment: start -> tangent point
        g.lineStyle(2, 0xff0000, 0.8);
        g.beginPath();
        g.moveTo(Sx, Sy);
        g.lineTo(Tx, Ty);
        g.strokePath();

        // Outgoing (deflected) segment: tangent point -> Earth along desired outgoing direction
        const outEndX = Ex;
        const outEndY = Ey;
        g.lineStyle(2, 0xff4444, 0.8);
        g.beginPath();
        g.moveTo(Tx, Ty);
        g.lineTo(outEndX, outEndY);
        g.strokePath();
    }

    showTuningScreen() {
        const w = this.cameras.main.width;
        const h = this.cameras.main.height;
        const centerX = w / 2;
        const centerY = h / 2;

        const bg = this.add.rectangle(centerX, centerY, 700, 500, 0x000000, 0.9)
            .setScrollFactor(0)
            .setDepth(3000);

        const title = this.add.text(centerX, centerY - 210, 'Tuning Parameters', {
            fontSize: '26px',
            fill: '#0ff'
        }).setOrigin(0.5).setScrollFactor(0).setDepth(3001);

        const paramRows = [];
        tuningParamsDefinition.forEach((def, idx) => {
            const y = centerY - 150 + idx * 25;

            const labelText = this.add.text(centerX - 260, y, def.label + ':', {
                fontSize: '16px',
                fill: '#0ff'
            }).setOrigin(0, 0.5).setScrollFactor(0).setDepth(3001);

            const valueText = this.add.text(centerX + 10, y, '', {
                fontSize: '16px',
                fill: '#0f0'
            }).setOrigin(0, 0.5).setScrollFactor(0).setDepth(3001);

            // DOM input for new value
            const input = this.add.dom(centerX + 210, y).createFromHTML(
                `<input type="text" style="width:80px; font-size:14px;" />`
            );
            input.setOrigin(0.5, 0.5);
            input.setScrollFactor(0);
            input.setDepth(3001);

            // Update button
            const btnBg = this.add.rectangle(centerX + 310, y, 60, 24, 0x003344, 0.9)
                .setScrollFactor(0)
                .setDepth(3001)
                .setInteractive({ useHandCursor: true });
            const btnText = this.add.text(centerX + 310, y, 'Set', {
                fontSize: '14px',
                fill: '#0ff'
            }).setOrigin(0.5).setScrollFactor(0).setDepth(3002);

            btnBg.on('pointerdown', () => {
                const el = input.node && input.node.querySelector('input');
                if (!el) return;
                const raw = el.value.trim();
                if (!raw) return;
                const num = parseFloat(raw);
                if (Number.isNaN(num)) return;
                let clamped = num;
                if (typeof def.min === 'number') clamped = Math.max(clamped, def.min);
                if (typeof def.max === 'number') clamped = Math.min(clamped, def.max);
                activeTuningParams[def.key] = clamped;
                el.value = '';
                updateValueTexts();
                saveTuningToStorage();
            });

            paramRows.push({ def, labelText, valueText, input, btnBg, btnText });
        });

        const updateValueTexts = () => {
            paramRows.forEach(entry => {
                const def = entry.def;
                const v = activeTuningParams[def.key];
                entry.valueText.setText(v.toFixed(def.decimals));
            });
        };
        updateValueTexts();

        const hint = this.add.text(
            centerX,
            centerY + 140,
            'Parameters currently match active tuning.',
            {
                fontSize: '14px',
                fill: '#ccc',
                align: 'center'
            }
        ).setOrigin(0.5).setScrollFactor(0).setDepth(3001);

        const makeButton = (label, y, handler) => {
            const btnBg = this.add.rectangle(centerX, y, 220, 40, 0x003344, 0.9)
                .setScrollFactor(0)
                .setDepth(3001)
                .setInteractive({ useHandCursor: true });
            const btnText = this.add.text(centerX, y, label, {
                fontSize: '20px',
                fill: '#0ff'
            }).setOrigin(0.5).setScrollFactor(0).setDepth(3002);
            btnBg.on('pointerdown', handler);
            return { btnBg, btnText };
        };

        const lastRow = paramRows[paramRows.length - 1];
        const backY = lastRow ? lastRow.labelText.y + 50 : centerY + 200;
        const btnBack = makeButton('Back to Menu', backY, () => {
            bg.destroy();
            title.destroy();
            hint.destroy();
            paramRows.forEach(p => {
                p.labelText.destroy();
                p.valueText.destroy();
                if (p.input) p.input.destroy();
                p.btnBg.destroy();
                p.btnText.destroy();
            });
            btnBack.btnBg.destroy();
            btnBack.btnText.destroy();

            globalMode = 'MENU';
            experimentConfig.enabled = false;
            this.scene.restart();
        });
    }

    update(time, delta) {
        if (this.gameOver) return;
        // Keep instance mode in sync with global mode (except during TEST runs)
        if (!experimentConfig.enabled) {
            this.mode = globalMode;
        }
        
        // Toggle autopilot only in MANUAL mode
        if (!experimentConfig.enabled && this.mode === 'MANUAL') {
            if (Phaser.Input.Keyboard.JustDown(this.autopilotKey)) {
                this.autopilot.enabled = !this.autopilot.enabled;
                console.log('Autopilot:', this.autopilot.enabled ? 'ENABLED' : 'DISABLED');
            }
        }
        
        // Draw background
        this.drawBackground();
        
        // For AUTOPILOT and TEST modes, run the numerical slingshot sweep
        // first (if applicable), then enable and update autopilot.
        if (this.mode === 'AUTOPILOT' || this.mode === 'TEST') {
            this.updateSlingshotSweep(delta / 1000);
            // Enable autopilot only once the sweep has finished.
            if (!this.slingshotSweepActive) {
                this.autopilot.enabled = true;
            } else {
                this.autopilot.enabled = false;
            }
        }

        // Update autopilot (if enabled, it will override manual controls)
        if (this.autopilot.enabled) {
            this.autopilot.update(delta / 1000);
        }
        
        // Handle input (manual controls, ignored if autopilot active)
        if (!this.autopilot.enabled) {
            this.handleInput(delta);
        }
        
        // Apply gravity
        this.applyGravity(delta);
        
        // Update time
        this.updateTime(delta);
        
        // Redraw ship visuals aligned with physics body & angle
        this.drawShip();
        
        // Draw slingshot planning debug overlay (if any)
        this.drawSlingshotDebug();
        
        // Update gravity object glows
        this.gravityObjects.forEach(obj => {
            const glow = obj.getData('glow');
            if (glow) {
                glow.x = obj.x;
                glow.y = obj.y;
            }
        });
        
        // Update UI
        this.updateUI();
        
        // Update bullets
        this.updateBullets(delta);
    }

    drawShip() {
        if (!this.shipBody) return;
        this.shipBody.clear();

        // Move ship body to physics position
        this.shipBody.x = this.player.x;
        this.shipBody.y = this.player.y;

        // Main hull - pointed along +X
        this.shipBody.fillStyle(0x00ffff, 1);
        this.shipBody.beginPath();
        this.shipBody.moveTo(22, 0);      // nose
        this.shipBody.lineTo(-14, -9);    // rear top
        this.shipBody.lineTo(-14, 9);     // rear bottom
        this.shipBody.closePath();
        this.shipBody.fillPath();

        // Cockpit
        this.shipBody.fillStyle(0x0088aa, 1);
        this.shipBody.fillTriangle(0, -5, 0, 5, 8, 0);

        // Outline
        this.shipBody.lineStyle(2, 0xffffff, 1);
        this.shipBody.strokeTriangle(22, 0, -14, -9, -14, 9);

        // Engine glow
        this.shipBody.fillStyle(0xffaa00, 0.8);
        this.shipBody.fillEllipse(-18, 0, 6, 10);

        // Thrust flame when accelerating
        if (this.isThrusting) {
            this.shipBody.fillStyle(0xff6600, 1);
            this.shipBody.beginPath();
            this.shipBody.moveTo(-14, -7);
            this.shipBody.lineTo(-26, 0);
            this.shipBody.lineTo(-14, 7);
            this.shipBody.closePath();
            this.shipBody.fillPath();
        }

        // Side thruster flames (in ship-local frame before rotation)
        if (this.sideThrustLeft) {
            this.shipBody.fillStyle(0xffcc00, 1);
            this.shipBody.beginPath();
            this.shipBody.moveTo(-2, 9);
            this.shipBody.lineTo(-2, 15);
            this.shipBody.lineTo(4, 9);
            this.shipBody.closePath();
            this.shipBody.fillPath();
        }

        if (this.sideThrustRight) {
            this.shipBody.fillStyle(0xffcc00, 1);
            this.shipBody.beginPath();
            this.shipBody.moveTo(-2, -9);
            this.shipBody.lineTo(-2, -15);
            this.shipBody.lineTo(4, -9);
            this.shipBody.closePath();
            this.shipBody.fillPath();
        }

        // Apply rotation based on current ship angle
        this.shipBody.rotation = this.playerAngle;
    }

    drawBackground() {
        this.bg.clear();
        this.bgStars.forEach(star => {
            this.bg.fillStyle(0xffffff, star.alpha);
            this.bg.fillCircle(star.x, star.y, star.size);
        });
    }

    handleInput(delta) {
        const dt = delta / 1000;
        
        // Rotation
        const angularAccel = 4.0;
        if (this.cursors.left.isDown) {
            this.angularVelocity -= angularAccel * dt;
        }
        if (this.cursors.right.isDown) {
            this.angularVelocity += angularAccel * dt;
        }
        const maxAngularSpeed = 4.0;
        this.angularVelocity = Phaser.Math.Clamp(this.angularVelocity, -maxAngularSpeed, maxAngularSpeed);

        this.playerAngle += this.angularVelocity * dt;
        
        // Thrust (manual main engine) with fuel consumption
        if (this.cursors.up.isDown && this.fuel > 0) {
            const thrustMag = 150;
            const thrustX = Math.cos(this.playerAngle) * thrustMag;
            const thrustY = Math.sin(this.playerAngle) * thrustMag;
            this.player.body.setAcceleration(thrustX, thrustY);
            this.isThrusting = true;

            const mainFuelRate = 0.015; // keep consistent with autopilot
            const fuelUse = thrustMag * dt * mainFuelRate;
            this.fuel = Math.max(0, this.fuel - fuelUse);
        } else {
            this.player.body.setAcceleration(0, 0);
            this.isThrusting = false;
        }
        
        // Shoot
        if (Phaser.Input.Keyboard.JustDown(this.spaceKey) && this.ammo > 0) {
            this.shoot();
        }
    }

    shoot() {
        const bulletX = this.player.x + Math.cos(this.playerAngle) * 25;
        const bulletY = this.player.y + Math.sin(this.playerAngle) * 25;
        
        const bullet = this.add.circle(bulletX, bulletY, 6, 0xffff00);
        bullet.setStrokeStyle(3, 0xffffff);
        
        const speed = 600;
        bullet.vx = Math.cos(this.playerAngle) * speed + this.player.body.velocity.x;
        bullet.vy = Math.sin(this.playerAngle) * speed + this.player.body.velocity.y;
        const bulletMass = 1;
        const shipMass = 50;
        const recoilFactor = bulletMass / shipMass;
        this.player.body.velocity.x -= Math.cos(this.playerAngle) * speed * recoilFactor;
        this.player.body.velocity.y -= Math.sin(this.playerAngle) * speed * recoilFactor;
        
        this.bullets.add(bullet);
        this.ammo -= 1;
        
        // Auto-destroy after 3 seconds
        this.time.delayedCall(3000, () => {
            if (bullet.active) bullet.destroy();
        });
    }

    applyGravity(delta) {
        // Gravity from stars / black holes
        this.gravityObjects.forEach(obj => {
            const dx = obj.x - this.player.x;
            const dy = obj.y - this.player.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            if (dist > 1) {
                const gravityStrength = obj.getData('gravityStrength');
                const schwarzschildRadius = obj.getData('schwarzschildRadius');
                
                let force = gravityStrength / (dist * dist);
                
                // Increase force dramatically when close
                if (dist < schwarzschildRadius) {
                }
                
                const forceX = (dx / dist) * force;
                const forceY = (dy / dist) * force;
                
                this.player.body.velocity.x += forceX * (delta / 1000);
                this.player.body.velocity.y += forceY * (delta / 1000);
            }
        });

        // Gravity pull from Earth to make capture/landing realistic and decisive
        if (this.earth) {
            const dxE = this.earth.x - this.player.x;
            const dyE = this.earth.y - this.player.y;
            const distE = Math.sqrt(dxE * dxE + dyE * dyE);
            if (distE > 1) {
                const earthGravityStrength = 0; // still weaker than most stars/black holes but strong enough to pull us in
                const gE = earthGravityStrength / (distE * distE);
                const fxE = (dxE / distE) * gE;
                const fyE = (dyE / distE) * gE;
                this.player.body.velocity.x += fxE * (delta / 1000);
                this.player.body.velocity.y += fyE * (delta / 1000);
            }
        }
    }

    updateTime(delta) {
        let gravitationalPotential = 0;
        
        this.gravityObjects.forEach(obj => {
            const dx = obj.x - this.player.x;
            const dy = obj.y - this.player.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const mass = obj.getData('mass');
            const schwarzschildRadius = obj.getData('schwarzschildRadius');
            
            const potential = mass / Math.max(dist, schwarzschildRadius * 0.5);
            gravitationalPotential += potential;
        });
        
        // Clamp gravitational potential to avoid extreme values
        gravitationalPotential = Math.min(gravitationalPotential, 200000);
        let gravitationalDilation = 1 / Math.sqrt(1 + gravitationalPotential / 50000);
        if (!Number.isFinite(gravitationalDilation) || gravitationalDilation <= 0) {
            gravitationalDilation = 0.1;
        }
        
        const speed = Math.sqrt(
            this.player.body.velocity.x ** 2 + 
            this.player.body.velocity.y ** 2
        );
        const c = 800;
        let beta2 = (speed / c) * (speed / c);
        if (!Number.isFinite(beta2) || beta2 < 0) {
            beta2 = 0;
        }
        beta2 = Math.min(beta2, 0.99);
        const velocityDilation = Math.sqrt(1 - beta2);
        
        const timeDilation = Math.max(0.05, gravitationalDilation * velocityDilation);
        
        this.shipTime += (delta / 1000) * timeDilation;
        this.earthTime += delta / 1000;
    }

    updateUI() {
        const distToEarth = Phaser.Math.Distance.Between(
            this.player.x, this.player.y,
            this.earth.x, this.earth.y
        );

        // Compute radial/tangential velocity components relative to Earth
        const vx = this.player.body.velocity.x;
        const vy = this.player.body.velocity.y;
        const dx = this.player.x - this.earth.x;
        const dy = this.player.y - this.earth.y;

        let radialV = 0;
        let tangentialV = 0;
        if (distToEarth > 1e-3) {
            const rx = dx / distToEarth;
            const ry = dy / distToEarth;
            radialV = vx * rx + vy * ry;
            const vtX = vx - radialV * rx;
            const vtY = vy - radialV * ry;
            const tx = -ry;
            const ty = rx;
            tangentialV = vtX * tx + vtY * ty;
        }

        // Attitude error relative to Earthward (radial inward) direction
        const bearingToEarth = Math.atan2(
            this.earth.y - this.player.y,
            this.earth.x - this.player.x
        );
        const attitudeErrorRad = Phaser.Math.Angle.Wrap(bearingToEarth - this.playerAngle);
        const attitudeErrorDeg = Phaser.Math.RadToDeg(attitudeErrorRad);

        const lines = [
            `Fuel: ${Math.max(0, this.fuel).toFixed(1)}`,
            `Ammo: ${this.ammo}`,
            `Ship Time: ${this.shipTime.toFixed(1)}s`,
            `Earth Time: ${this.earthTime.toFixed(1)}s`,
            `Distance: ${distToEarth.toFixed(0)}`,
            `v_r: ${radialV.toFixed(2)}`,
            `v_tan: ${tangentialV.toFixed(2)}`,
            `AttitudeErr: ${attitudeErrorDeg.toFixed(1)}°`
        ];

        if (typeof bestEarthTime === 'number') {
            lines.push(`Best Earth Time: ${bestEarthTime.toFixed(1)}s`);
        } else {
            lines.push('Best Earth Time: --');
        }
        
        // Autopilot status
        if (this.autopilot.enabled) {
            lines.push(`Autopilot: ON [${this.autopilot.getPhaseString()}]`);
        } else {
            lines.push('Autopilot: OFF (Press A)');
        }

        this.statsText.setText(lines);

        // Clear HUD graphics before drawing overlays
        if (this.radar) {
            this.radar.clear();
        }

        // Draw autopilot control indicators
        if (this.autopilot.enabled) {
            this.drawAutopilotControls();
        }
        
        // Draw radar
        this.drawRadar();
    }
    
    drawAutopilotControls() {
        try {
            // Use cached control state from last update
            const control = this.autopilot.lastControl;
            if (!control || !this.radar) return;
            
            const indicatorX = 100;
            const indicatorY = 700;
            const arrowSize = 30;
            
            // Draw control panel background
            this.radar.fillStyle(0x000000, 0.5);
            this.radar.fillRect(indicatorX - 50, indicatorY - 50, 200, 100);
            this.radar.lineStyle(2, 0x00ffff, 1);
            this.radar.strokeRect(indicatorX - 50, indicatorY - 50, 200, 100);
            
            // Draw rotation arrows
            if (control.angularControl < -0.1) {
                // Left arrow (turning left)
                this.radar.fillStyle(0xffff00, 1);
                this.radar.fillTriangle(
                    indicatorX - arrowSize, indicatorY,
                    indicatorX, indicatorY - arrowSize/2,
                    indicatorX, indicatorY + arrowSize/2
                );
            } else if (control.angularControl > 0.1) {
                // Right arrow (turning right)
                this.radar.fillStyle(0xffff00, 1);
                this.radar.fillTriangle(
                    indicatorX + arrowSize, indicatorY,
                    indicatorX, indicatorY - arrowSize/2,
                    indicatorX, indicatorY + arrowSize/2
                );
            }
            
            // Draw thrust indicator
            if (control.thrust) {
                this.radar.fillStyle(0xff6600, 1);
                this.radar.fillTriangle(
                    indicatorX + 80, indicatorY - 20,
                    indicatorX + 80, indicatorY + 20,
                    indicatorX + 120, indicatorY
                );
            }
        } catch (error) {
            console.error('Error drawing autopilot controls:', error);
        }
    }

    drawRadar() {
        const radarX = 1050;
        const radarY = 650;
        const radarSize = 140;
        const radarRadius = radarSize / 2;
        // Local radar range in world units: ~4x the larger screen dimension.
        // For 1200x800 this is 2 * max(1200, 800) = 2400.
        const width = this.cameras.main.width;
        const height = this.cameras.main.height;
        const radarRange = 1.5 * Math.max(width, height);
        
        this.radar.clear();
        
        // Background
        this.radar.fillStyle(0x000000, 0.7);
        this.radar.fillCircle(radarX, radarY, radarRadius);
        
        // Border
        this.radar.lineStyle(2, 0x00ff00, 0.8);
        this.radar.strokeCircle(radarX, radarY, radarRadius);
        
        // Player (center)
        this.radar.fillStyle(0x00ffff, 1);
        this.radar.fillCircle(radarX, radarY, 4);

        const step = Math.PI / 18; // ~10 degrees
        const radiusEdge = radarRadius - 6;

        // Helper to draw a local radar marker: only if within radarRange, and
        // positioned proportionally to distance from the player.
        const drawLocalMarker = (tx, ty, color, size = 4) => {
            const dx = tx - this.player.x;
            const dy = ty - this.player.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > radarRange) return; // Too far: not shown on local radar

            const angle = Math.atan2(dy, dx);
            const quantizedAngle = Math.round(angle / step) * step;
            // Map distance [0, radarRange] -> [0, radiusEdge]
            const r = (dist / radarRange) * radiusEdge;
            const mx = radarX + Math.cos(quantizedAngle) * r;
            const my = radarY + Math.sin(quantizedAngle) * r;
            this.radar.fillStyle(color, 1);
            this.radar.fillCircle(mx, my, size);
        };

        // Earth direction arrow (always same length, only angle matters)
        const dxEarth = this.earth.x - this.player.x;
        const dyEarth = this.earth.y - this.player.y;
        const distEarth = Math.sqrt(dxEarth * dxEarth + dyEarth * dyEarth);
        const angleToEarth = Math.atan2(dyEarth, dxEarth);
        const quantizedAngle = Math.round(angleToEarth / step) * step;

        // Local Earth marker when within radar range
        if (distEarth <= radarRange) {
            drawLocalMarker(this.earth.x, this.earth.y, 0x0088ff, 5);
        }

        // Earth marker: global direction only (not distance-limited)
        if (distEarth > radarRange) {
            this.radar.lineStyle(3, 0x00aaff, 0.6);
            this.radar.lineBetween(
                radarX,
                radarY,
                radarX + Math.cos(quantizedAngle) * radiusEdge,
                radarY + Math.sin(quantizedAngle) * radiusEdge
            );
            const earthMarkerX = radarX + Math.cos(quantizedAngle) * radiusEdge;
            const earthMarkerY = radarY + Math.sin(quantizedAngle) * radiusEdge;
            this.radar.fillStyle(0x00aaff, 1);
            this.radar.fillCircle(earthMarkerX, earthMarkerY, 4);
        }

        // Gravity objects (stars / black holes)
        this.gravityObjects.forEach(obj => {
            const isStar = obj.getData('isStar');
            const color = isStar ? 0xffff00 : 0xaa00ff;
            drawLocalMarker(obj.x, obj.y, color, 3);
        });

        // Asteroids
        this.asteroids.children.entries.forEach(asteroid => {
            if (!asteroid.active) return;
            drawLocalMarker(asteroid.x, asteroid.y, 0xaaaaaa, 2);
        });

        // Fuel pickups
        this.fuelPickups.children.entries.forEach(fuel => {
            if (!fuel.active) return;
            drawLocalMarker(fuel.x, fuel.y, 0x00ff00, 3);
        });

        // Ammo pickups
        this.ammoPickups.children.entries.forEach(ammo => {
            if (!ammo.active) return;
            drawLocalMarker(ammo.x, ammo.y, 0xff6600, 3);
        });
    }

    updateBullets(delta) {
        const dt = delta / 1000;
        this.bullets.children.entries.forEach(bullet => {
            if (!bullet || !bullet.active) return;

            // Integrate bullet motion manually
            if (typeof bullet.vx === 'number' && typeof bullet.vy === 'number') {
                bullet.x += bullet.vx * dt;
                bullet.y += bullet.vy * dt;
            }
            
            // Check asteroid collisions
            this.asteroids.children.entries.forEach(asteroid => {
                if (!asteroid || !asteroid.active) return;
                
                const dist = Phaser.Math.Distance.Between(
                    bullet.x, bullet.y,
                    asteroid.x, asteroid.y
                );
                
                if (dist < asteroid.body.radius + 5) {
                    bullet.destroy();
                    asteroid.destroy();
                }
            });
            
            // Destroy if out of bounds
            if (bullet.x < 0 || bullet.x > this.worldWidth || 
                bullet.y < 0 || bullet.y > this.worldHeight) {
                bullet.destroy();
            }
        });
    }

    collectFuel(player, fuel) {
        fuel.destroy();
        this.fuel = Math.min(this.fuel + 30, 100);
    }

    collectAmmo(player, ammo) {
        ammo.destroy();
        this.ammo = Math.min(this.ammo + 20, 50);
    }

    loseGame() {
        if (this.gameOver) return;
        this.gameOver = true;

        // Record experiment failure if enabled
        if (experimentConfig.enabled && !experimentConfig.finished) {
            const idx = experimentConfig.angleIndex;
            experimentConfig.attempts[idx]++;
            // Show a quick failure indicator for TEST runs
            const cam = this.cameras.main;
            const failText = this.add.text(cam.width / 2, cam.height / 2, '✗', {
                fontSize: '72px',
                fill: '#f00'
            }).setOrigin(0.5).setScrollFactor(0).setDepth(2500);
            this.tweens.add({
                targets: failText,
                alpha: 0,
                duration: 250,
                onComplete: () => failText.destroy()
            });
            this.advanceExperimentTrial();
            return;
        }

        this.player.body.setVelocity(0, 0);
        
        const msg = this.add.text(600, 400, 'COLLISION!\n\nPress R to Restart', {
            fontSize: '48px',
            fill: '#f00',
            align: 'center',
            backgroundColor: '#000c',
            padding: { x: 20, y: 10 }
        }).setOrigin(0.5).setScrollFactor(0).setDepth(2000);
        
        const restartKey = this.input.keyboard.addKey('R');
        restartKey.once('down', () => {
            this.scene.restart();
        });
    }

    winGame() {
        if (this.gameOver) return;
        const vx = this.player.body.velocity.x;
        const vy = this.player.body.velocity.y;
        const speed = Math.sqrt(vx * vx + vy * vy);

        const angleToEarth = Math.atan2(
            this.earth.y - this.player.y,
            this.earth.x - this.player.x
        );
        const thrusterAngle = this.playerAngle + Math.PI;
        let angleDiff = Phaser.Math.Angle.Wrap(thrusterAngle - angleToEarth);
        angleDiff = Math.abs(angleDiff);

        const maxLandingSpeed = 100;
        const maxLandingAngle = Phaser.Math.DegToRad(10);

        if (speed > maxLandingSpeed || angleDiff > maxLandingAngle) {
            this.loseGame();
            return;
        }

        this.gameOver = true;

        // Record experiment success if enabled
        if (experimentConfig.enabled && !experimentConfig.finished) {
            const idx = experimentConfig.angleIndex;
            experimentConfig.attempts[idx]++;
            experimentConfig.successes[idx]++;
            // Show a quick success indicator for TEST runs
            const cam = this.cameras.main;
            const successText = this.add.text(cam.width / 2, cam.height / 2, '✓', {
                fontSize: '72px',
                fill: '#0f0'
            }).setOrigin(0.5).setScrollFactor(0).setDepth(2500);
            this.tweens.add({
                targets: successText,
                alpha: 0,
                duration: 250,
                onComplete: () => successText.destroy()
            });
            this.advanceExperimentTrial();
            return;
        }
        
        this.player.body.setVelocity(0, 0);
        
        const timeLost = this.earthTime - this.shipTime;

        let isNewBest = false;
        if (bestEarthTime === null || this.earthTime < bestEarthTime) {
            bestEarthTime = this.earthTime;
            isNewBest = true;
        }

        let bestLine = '';
        if (typeof bestEarthTime === 'number') {
            bestLine = `Best Earth Time: ${bestEarthTime.toFixed(1)}s`;
            if (isNewBest) {
                bestLine += ' (NEW RECORD)';
            }
        }

        const messageLines = [
            `EARTH REACHED!`,
            '',
            `Earth Time: ${this.earthTime.toFixed(1)}s`,
            `Ship Time: ${this.shipTime.toFixed(1)}s`,
            `Time Lost: ${timeLost.toFixed(1)}s`
        ];
        if (bestLine) {
            messageLines.push('', bestLine);
        }
        messageLines.push('', 'Press R to Restart');

        const msg = this.add.text(600, 400, messageLines.join('\n'), {
            fontSize: '32px',
            fill: '#0f0',
            align: 'center',
            backgroundColor: '#000c',
            padding: { x: 20, y: 10 }
        }).setOrigin(0.5).setScrollFactor(0).setDepth(2000);
        
        const restartKey = this.input.keyboard.addKey('R');
        restartKey.once('down', () => {
            this.scene.restart();
        });
    }

    advanceExperimentTrial() {
        const angles = experimentConfig.anglesDeg;
        const trialsPerAngle = experimentConfig.trialsPerAngle;

        experimentConfig.trialIndex++;
        if (experimentConfig.trialIndex >= trialsPerAngle) {
            experimentConfig.trialIndex = 0;
            experimentConfig.angleIndex++;
        }

        if (experimentConfig.angleIndex >= angles.length) {
            experimentConfig.finished = true;
            this.showExperimentResults();
            return;
        }

        this.scene.restart();
    }

    showExperimentResults() {
        const lines = ['Experiment results (success rate vs angle):'];
        for (let i = 0; i < experimentConfig.anglesDeg.length; i++) {
            const angle = experimentConfig.anglesDeg[i];
            const attempts = experimentConfig.attempts[i];
            const successes = experimentConfig.successes[i];
            const rate = attempts > 0 ? (successes / attempts) : 0;
            lines.push(
                `${angle.toFixed(0)}°: ${successes}/${attempts} ` +
                `(${(rate * 100).toFixed(0)}%)`
            );
        }

        // Overall success statistics
        let totalAttempts = 0;
        let totalSuccesses = 0;
        for (let i = 0; i < experimentConfig.anglesDeg.length; i++) {
            totalAttempts += experimentConfig.attempts[i];
            totalSuccesses += experimentConfig.successes[i];
        }
        const overallRate = totalAttempts > 0 ? (totalSuccesses / totalAttempts) : 0;
        const overallPercent = (overallRate * 100).toFixed(1);

        lines.push('');
        lines.push(`Overall: ${totalSuccesses}/${totalAttempts} (${overallPercent}%)`);
        if (lastAdoptedSuccessRate !== null) {
            const lastPercent = (lastAdoptedSuccessRate * 100).toFixed(1);
            lines.push(`Previous adopted success: ${lastPercent}%`);
        } else {
            lines.push('Previous adopted success: (none)');
        }
        lines.push('');
        lines.push('Adopt new parameters for Autopilot/Manual?');

        const text = this.add.text(600, 300, lines.join('\n'), {
            fontSize: '18px',
            fill: '#0f0',
            align: 'left',
            backgroundColor: '#000c',
            padding: { x: 20, y: 10 }
        }).setOrigin(0.5).setScrollFactor(0).setDepth(2000);

        const makeButton = (label, offsetX, handler) => {
            const btnBg = this.add.rectangle(600 + offsetX, 520, 140, 40, 0x003344, 0.9)
                .setScrollFactor(0)
                .setDepth(2001)
                .setInteractive({ useHandCursor: true });
            const btnText = this.add.text(600 + offsetX, 520, label, {
                fontSize: '18px',
                fill: '#0ff'
            }).setOrigin(0.5).setScrollFactor(0).setDepth(2002);
            btnBg.on('pointerdown', handler);
            return { btnBg, btnText };
        };

        const adoptBtn = makeButton('Adopt', -90, () => {
            defaultTuningParams = cloneTuningParams(activeTuningParams);
            lastAdoptedSuccessRate = overallRate;
            text.destroy();
            adoptBtn.btnBg.destroy();
            adoptBtn.btnText.destroy();
            keepBtn.btnBg.destroy();
            keepBtn.btnText.destroy();
            saveTuningToStorage();
            globalMode = 'MENU';
            experimentConfig.enabled = false;
            this.scene.restart();
        });

        const keepBtn = makeButton('Keep', 90, () => {
            text.destroy();
            adoptBtn.btnBg.destroy();
            adoptBtn.btnText.destroy();
            keepBtn.btnBg.destroy();
            keepBtn.btnText.destroy();
            globalMode = 'MENU';
            experimentConfig.enabled = false;
            this.scene.restart();
        });
    }
}

const config = {
    type: Phaser.AUTO,
    width: 1200,
    height: 800,
    parent: 'game-container',
    backgroundColor: '#000814',
    dom: {
        createContainer: true
    },
    physics: {
        default: 'arcade',
        arcade: {
            gravity: { y: 0 },
            debug: false
        }
    },
    scene: [GameScene]
};

const game = new Phaser.Game(config);
console.log('Game initialized');
    </script>

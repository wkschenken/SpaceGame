        // accretion disk that fades outward). Padded so the accretion disk
        // has room to bleed well outside the event-horizon radius.
        const pad = Math.ceil(radius * 2.5);
        const size = (Math.ceil(radius) + pad) * 2;
        if (this.textures.exists(key)) this.textures.remove(key);
        const tex = this.textures.createCanvas(key, size, size);
        const ctx = tex.getContext();
        const cx = size / 2, cy = size / 2;

        // Outer accretion disk: hot orange fading out to transparent, drawn
        // with an elliptical scaling to hint at a nearly-edge-on disk plane.
        const outerR = radius + pad;
        const diskGrad = ctx.createRadialGradient(
            cx, cy, radius * 1.05,
            cx, cy, outerR
        );
        diskGrad.addColorStop(0.00, 'rgba(255,220,150,0.85)');
        diskGrad.addColorStop(0.15, 'rgba(255,140,50,0.70)');
        diskGrad.addColorStop(0.45, 'rgba(220,80,20,0.35)');
        diskGrad.addColorStop(0.80, 'rgba(120,30,10,0.12)');
        diskGrad.addColorStop(1.00, 'rgba(60,10,5,0)');
        ctx.save();
        // Squish vertically to look like an inclined disk.
        ctx.translate(cx, cy);
        ctx.scale(1.0, 0.55);
        ctx.translate(-cx, -cy);
        ctx.fillStyle = diskGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, outerR, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Photon-sphere ring: thin bright annulus at ~1.02R, before painting
        // the event horizon on top.
        ctx.strokeStyle = 'rgba(255,240,200,0.95)';
        ctx.lineWidth = Math.max(1.5, radius * 0.04);
        ctx.beginPath();
        ctx.arc(cx, cy, radius * 1.02, 0, Math.PI * 2);
        ctx.stroke();

        // Event horizon: solid jet-black disk. Painted last so it occludes
        // the inner edge of the accretion disk and the photon ring behind it.
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fill();

        tex.refresh();
        return key;
    }

    generateStarTexture(key, radius) {
        // Procedurally paint a sun-like star (hot white-yellow disk with
        // granulation cells, bright limb, and a soft outer corona) into an
        // offscreen canvas. Padded so the diffuse corona has room to bleed
        // outside the star's physical radius.
        const pad = Math.ceil(radius * 0.7);
        const size = (Math.ceil(radius) + pad) * 2;
        if (this.textures.exists(key)) this.textures.remove(key);
        const tex = this.textures.createCanvas(key, size, size);
        const ctx = tex.getContext();
        const cx = size / 2, cy = size / 2;

        // Outer diffuse corona: red/orange fading to transparent.
        const outerGrad = ctx.createRadialGradient(
            cx, cy, radius * 0.95,
            cx, cy, radius + pad
        );
        outerGrad.addColorStop(0.0, 'rgba(255,180,90,0.55)');
        outerGrad.addColorStop(0.4, 'rgba(255,110,40,0.28)');
        outerGrad.addColorStop(0.75, 'rgba(200,60,20,0.10)');
        outerGrad.addColorStop(1.0, 'rgba(180,40,10,0)');
        ctx.fillStyle = outerGrad;
        ctx.fillRect(0, 0, size, size);

        // Star disk: hot white core -> yellow -> orange edge.
        const diskGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
        diskGrad.addColorStop(0.0, '#ffffee');
        diskGrad.addColorStop(0.3, '#ffee99');
        diskGrad.addColorStop(0.65, '#ffb033');
        diskGrad.addColorStop(1.0, '#ff6600');
        ctx.fillStyle = diskGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fill();

        // Granulation and hot spots, clipped to the disk.
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, radius * 0.98, 0, Math.PI * 2);
        ctx.clip();
        for (let i = 0; i < 90; i++) {
            const a = Math.random() * Math.PI * 2;
            const r = Math.random() * radius * 0.94;
            const px = cx + Math.cos(a) * r;
            const py = cy + Math.sin(a) * r;
            const sz = radius * (0.02 + Math.random() * 0.06);
            ctx.fillStyle = `rgba(200,80,10,${0.12 + Math.random() * 0.22})`;
            ctx.beginPath();
            ctx.arc(px, py, sz, 0, Math.PI * 2);
            ctx.fill();
        }
        for (let i = 0; i < 25; i++) {
            const a = Math.random() * Math.PI * 2;
            const r = Math.random() * radius * 0.9;
            const px = cx + Math.cos(a) * r;
            const py = cy + Math.sin(a) * r;
            const sz = radius * (0.015 + Math.random() * 0.03);
            ctx.fillStyle = `rgba(255,250,220,${0.4 + Math.random() * 0.4})`;
            ctx.beginPath();
            ctx.arc(px, py, sz, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();

        // Bright limb (thin highlight annulus at the very edge).
        ctx.strokeStyle = 'rgba(255,240,180,0.55)';
        ctx.lineWidth = Math.max(1, radius * 0.02);
        ctx.beginPath();
        ctx.arc(cx, cy, radius * 0.99, 0, Math.PI * 2);
        ctx.stroke();

        tex.refresh();
        return key;
    }

    initializeStartAndDestination() {
        // If a snapshot from a prior run exists and the user asked to
        // "Retry Same Seed", reuse those exact coordinates verbatim.
        if (this.replayRequested && !experimentConfig.enabled && this.worldSnapshot && this.worldSnapshot.startEarth) {
            const s = this.worldSnapshot.startEarth;
            this.startX = s.startX;
            this.startY = s.startY;
            this.earthX = s.earthX;
            this.earthY = s.earthY;
            return;
        }

        const worldSize = this.worldSize;
        const marginStart = 200;
        const marginEarth = 200;
        const minFactor = 0.8;
        const maxFactor = 1.2;
        const maxAttempts = 100;

        let attempt = 0;
        while (attempt < maxAttempts) {
            attempt++;

            const startX = Phaser.Math.Between(marginStart, worldSize - marginStart);
            const startY = Phaser.Math.Between(marginStart, worldSize - marginStart);

            const angle = Math.random() * Math.PI * 2;
            const distanceFactor = minFactor + Math.random() * (maxFactor - minFactor);
            const distance = worldSize * distanceFactor;

            const earthX = startX + Math.cos(angle) * distance;
            const earthY = startY + Math.sin(angle) * distance;

            if (
                earthX > marginEarth && earthX < worldSize - marginEarth &&
                earthY > marginEarth && earthY < worldSize - marginEarth
            ) {
                this.startX = startX;
                this.startY = startY;
                this.earthX = earthX;
                this.earthY = earthY;
                this._captureStartEarthSnapshot();
                return;
            }
        }

        // Fallback to deterministic positions if randomization fails
        this.startX = this.worldWidth * 0.25;
        this.startY = this.worldHeight * 0.5;
        this.earthX = this.worldWidth * 0.75;
        this.earthY = this.worldHeight * 0.5;
        this._captureStartEarthSnapshot();
    }

    _captureStartEarthSnapshot() {
        if (!this.worldSnapshot) this.worldSnapshot = {};
        this.worldSnapshot.startEarth = {
            startX: this.startX,
            startY: this.startY,
            earthX: this.earthX,
            earthY: this.earthY
        };
    }

    createPlayer() {
        // Start player near left side of world
        const startX = this.startX;
        const startY = this.startY;
        
        // Physics body (invisible circle for collisions & motion)
        this.player = this.add.circle(startX, startY, 15, 0x000000);
        this.player.setVisible(false);
        this.physics.add.existing(this.player);
        this.player.body.setCircle(15);
        this.player.body.setDrag(0);
        this.player.body.setMaxVelocity(400);
        this.player.body.setCollideWorldBounds(false);
        
        // Ship orientation: 0 rad points along +X (to the right). Initialize
        // pointing along the S->E baseline so the autopilot's ORIENT phase
        // completes essentially immediately at launch. This also minimizes
        // the time the star drifts while the ship is still re-orienting,
        // reducing the mismatch between the sweep's assumed launch state
        // and reality.
        this.playerAngle = Math.atan2(this.earthY - startY, this.earthX - startX);
        this.angularVelocity = 0;
        
        // Visual ship body, drawn as a sleek triangular craft
        this.shipBody = this.add.graphics();
    }

    createEarth() {
        const earthX = this.earthX;
        const earthY = this.earthY;

        // Earth radius scaled up 5x relative to the original 80.
        const earthRadius = 80 * 5;
        const earthGlowRadius = 120 * 5;

        // Physics/collision body (invisible so it doesn't render over the
        // procedural sprite, but this.earth.radius and this.earth.body remain
        // available to the planner, radar, phase logic, and overlap collider).
        this.earth = this.add.circle(earthX, earthY, earthRadius, 0x000000, 0);
        this.physics.add.existing(this.earth);
        this.earth.body.setCircle(earthRadius);
        this.earth.body.setImmovable(true);

        // Layered atmospheric halo: several concentric filled circles with
        // alpha falling off outward, giving a soft blue glow around the
        // planet. Rendered before the sprite so the sprite covers the disk.
        this.earthGlow = this.add.graphics();
        this.earthGlow.setPosition(earthX, earthY);
        const glowLayers = 6;
        for (let i = glowLayers; i >= 1; i--) {
            const t = i / glowLayers;
            const rr = earthRadius + (earthGlowRadius - earthRadius) * t;
            const a = 0.09 * (1 - i / (glowLayers + 2));
            this.earthGlow.fillStyle(0x66bbff, a);
            this.earthGlow.fillCircle(0, 0, rr);
        }

        // Procedural land/water/clouds/ice/terminator texture.
        this.generateEarthTexture('earthTex', earthRadius);
        this.earthSprite = this.add.image(earthX, earthY, 'earthTex');

        console.log('Earth created at:', earthX, earthY);
    }

    createAsteroids() {
        // Keep an empty asteroid group so other systems can safely reference it,
        // but do not spawn any actual asteroids while focusing on takeoff/landing.
        this.asteroids = this.physics.add.group();

        if (!globalEnableAsteroids) {
            return;
        }

        const worldSize = this.worldSize;
        const count = 20; // reduced density compared to original field

        for (let i = 0; i < count; i++) {
            const x = Math.random() * worldSize;
            const y = Math.random() * worldSize;
            const radius = Phaser.Math.Between(8, 18);

            const asteroid = this.add.circle(x, y, radius, 0x666666);
            this.physics.add.existing(asteroid);
            asteroid.body.setCircle(radius);
            asteroid.body.setBounce(1, 1);
            asteroid.body.setCollideWorldBounds(false);
            asteroid.body.setVelocity(
                Phaser.Math.Between(-50, 50),
                Phaser.Math.Between(-50, 50)
            );

            this.asteroids.add(asteroid);
        }
    }

    createGravityObjects() {
        this.gravityObjects = [];

        if (!globalEnableMassiveObjects) {
            return;
        }

        // Every star shares the same physical parameters.
        const Sx = this.startX;
        const Sy = this.startY;
        const Ex = this.earthX;
        const Ey = this.earthY;
        const dxSE = Ex - Sx;
        const dySE = Ey - Sy;
        const lenSE = Math.sqrt(dxSE * dxSE + dySE * dySE) || 1;

        const numStars       = 8;
        const starRadius     = 35 * 20;                 // 700
        const starMu         = 153600 * 5 * 10;         // gravitational parameter
        const starMass       = 80;
        // Clearances (all in world units).
        //   earthClear : star must never come within this radius of Earth
        //                over the gameplay horizon, so we can neglect
        //                Earth-star gravitational interactions.
        //   shipClear  : t=0 position must be at least this far from the
        //                ship's spawn (avoid spawning on top of the player).
        //   starSep    : minimum t=0 separation between any two stars, to
        //                avoid pathological close encounters that would
        //                destabilize the symplectic-Euler N-body integrator.
        const earthClear     = 10 * starRadius;         // ~ 7000
        const earthClear2    = earthClear * earthClear;
        const shipClear      = 5  * starRadius;
        const shipClear2     = shipClear * shipClear;
        const starSep        = 4  * starRadius;
        const starSep2       = starSep * starSep;

        // Straight-line Earth-clearance horizon: same generous window used
        // elsewhere for trajectory-relevant checks.
        const vCruiseClear   = (activeTuningParams && activeTuningParams.vCruise) || 200;
        const clearHorizon   = 2.0 * lenSE / vCruiseClear;

        // Gaussian sampler (Box-Muller).
        const sampleGaussian = () => {
            let u1 = Math.random();
            let u2 = Math.random();
            u1 = u1 < 1e-8 ? 1e-8 : u1;
            return Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
        };

        // Common bulk drift perpendicular to the S->E baseline (90 deg CCW),
        // magnitude 200 world-units/s. On top of this every star also gets an
        // isotropic random kick with Gaussian(mean=100, sd=50) speed. Net
        // effect: the ensemble sweeps across the trajectory corridor while
        // still having internal diffusive motion.
        const perpDriftMag = 200;
        const perpX = -dySE / lenSE;
        const perpY =  dxSE / lenSE;
        const driftVx = perpX * perpDriftMag;
        const driftVy = perpY * perpDriftMag;
        const sampleVelocity = () => {
            const a = Math.random() * Math.PI * 2;
            const speed = Math.max(1, 100 + sampleGaussian() * 50);
            return {
                vx: driftVx + Math.cos(a) * speed,
                vy: driftVy + Math.sin(a) * speed
            };
        };

        // Closed-form min distance from Earth to the straight-line ray
        // (px + vx*t, py + vy*t) for t in [0, clearHorizon]. Returns true
        // iff that minimum is >= earthClear.
        const clearsEarth = (pxStar, pyStar, vxStar, vyStar) => {
            const v2 = vxStar * vxStar + vyStar * vyStar;
            let tOpt;
            if (v2 < 1e-9) {
                tOpt = 0;
            } else {
                tOpt = -((pxStar - Ex) * vxStar + (pyStar - Ey) * vyStar) / v2;
                if (tOpt < 0) tOpt = 0;
                else if (tOpt > clearHorizon) tOpt = clearHorizon;
            }
            const rx = pxStar + vxStar * tOpt - Ex;
            const ry = pyStar + vyStar * tOpt - Ey;
            return (rx * rx + ry * ry) >= earthClear2;
        };

        // Sample a velocity that clears Earth, or fall back to a velocity
        // pointing directly away from Earth.
        const sampleVelocityClearingEarth = (posX, posY) => {
            for (let attempt = 0; attempt < 200; attempt++) {
                const v = sampleVelocity();
                if (clearsEarth(posX, posY, v.vx, v.vy)) return v;
            }
            const dxA = posX - Ex;
            const dyA = posY - Ey;
            const rA  = Math.sqrt(dxA * dxA + dyA * dyA) || 1;
            const speed = Math.max(1, 200 + sampleGaussian() * 50);
            return { vx: (dxA / rA) * speed, vy: (dyA / rA) * speed };
        };

        // Load or generate the full star list. On replay of the same seed
        // we reproduce the exact (x0, y0, vx, vy) captured last time.
        let starList;
        const snap = this.worldSnapshot && this.worldSnapshot.stars;
        const snapUsable = Array.isArray(snap) && snap.length > 0
            && snap.every(s => typeof s.vx === 'number');
        if (this.replayRequested && !experimentConfig.enabled && snapUsable) {
            starList = snap;
        } else {
            starList = [];
            const maxAttempts = 500;

            // Uniform position within a rectangle whose *area* is 23.04% of
            // the world (linear factor 0.8 * sqrt(0.8) * sqrt(0.75) * sqrt(0.6)
            // ~= 0.4800). Successive reductions from the full world:
            //   1.0 -> 0.64  (linear 0.8)
            //       -> 0.512 (linear sqrt(0.8))
            //       -> 0.384 (linear sqrt(0.75), 25% area cut)
            //       -> 0.2304 (linear sqrt(0.6), further 40% area cut)
            //
            // The box is centered on the S-E midpoint (rather than on the
            // world center) so the star cluster always straddles the ship's
            // planned corridor even when the S-E chord doesn't happen to run
            // through world center.
            //
            // Additionally, the center is pre-offset AGAINST the bulk-drift
            // direction so the ensemble mean sweeps across the corridor and
            // coincides with the S-E midpoint at roughly the moment the
            // ship (flying at ~vCruise) reaches the ~1/4 point of the
            // chord. Timing derivation: at cruise speed the ship reaches
            // the quarter point at t_q = |SE| / (4 * vCruise), so the
            // required lead-offset magnitude is
            //     perpDriftMag * t_q = perpDriftMag * |SE| / (4 * vCruise).
            // (Equivalently: half of the |SE|/(2*vCruise) offset that would
            // sync the ensemble to the midpoint at the halfway mark.) The
            // smaller lead keeps the box's world-bound clamp from saturating
            // at low vCruise while still front-loading the star density
            // toward the earlier, more decision-critical part of the run.
            //
            // The final center is clamped so the box stays fully inside the
            // world bounds; otherwise a midpoint near a world edge (or a
            // large pre-offset) would push half the box off-map and cluster
            // all stars on the map-interior side.
            const spawnShrink = 0.8 * Math.sqrt(0.8) * Math.sqrt(0.75) * Math.sqrt(0.6);
            const boxW = this.worldWidth  * spawnShrink;
            const boxH = this.worldHeight * spawnShrink;
            const tShipToQuarter = 0.25 * lenSE / vCruiseClear;
            const preOffX = -perpX * perpDriftMag * tShipToQuarter;
            const preOffY = -perpY * perpDriftMag * tShipToQuarter;
            const midX = 0.5 * (Sx + Ex) + preOffX;
            const midY = 0.5 * (Sy + Ey) + preOffY;
            const boxCenterX = Phaser.Math.Clamp(midX, boxW / 2, this.worldWidth  - boxW / 2);
            const boxCenterY = Phaser.Math.Clamp(midY, boxH / 2, this.worldHeight - boxH / 2);
            const boxMinX = boxCenterX - boxW / 2;
            const boxMinY = boxCenterY - boxH / 2;

            for (let i = 0; i < numStars; i++) {
                let placed = false;
                for (let attempt = 0; attempt < maxAttempts; attempt++) {
                    const cx = boxMinX + Math.random() * boxW;
                    const cy = boxMinY + Math.random() * boxH;

                    // Earth clearance: t=0 position must be outside the
                    // clearance disk.
                    const dxE = cx - Ex, dyE = cy - Ey;
                    if (dxE * dxE + dyE * dyE < earthClear2) continue;

                    // Ship-start clearance: don't spawn on the player.
                    const dxS = cx - Sx, dyS = cy - Sy;
                    if (dxS * dxS + dyS * dyS < shipClear2) continue;

                    // Star-star separation.
                    let overlap = false;
                    for (const s of starList) {
                        const dxSS = cx - s.x0, dySS = cy - s.y0;
                        if (dxSS * dxSS + dySS * dySS < starSep2) {
                            overlap = true; break;
                        }
                    }
                    if (overlap) continue;

                    // Velocity must also keep the trajectory clear of Earth.
                    const v = sampleVelocityClearingEarth(cx, cy);
                    starList.push({ x0: cx, y0: cy, vx: v.vx, vy: v.vy });
                    placed = true;
                    break;
                }
                if (!placed) break;
            }
            if (!this.worldSnapshot) this.worldSnapshot = {};
            this.worldSnapshot.stars = starList;
        }

        // Procedural star texture generated once; all stars share it because
        // they share physical parameters (radius / mu / mass).
        const starTexKey = 'starTex';
        this.generateStarTexture(starTexKey, starRadius);

        // Instantiate every star with identical physical parameters.
        for (const s of starList) {
            // Invisible physics/collision body: preserves obj.radius, obj.body,
            // and all planner / sweep / collision code paths.
            const obj = this.add.circle(s.x0, s.y0, starRadius, 0xffaa00, 0);
            this.physics.add.existing(obj);
            obj.body.setCircle(starRadius);
            obj.body.setImmovable(true);
            obj.setData('gravityStrength', starMu);
            obj.setData('schwarzschildRadius', starRadius * 1.5);
            obj.setData('mass', starMass);
            obj.setData('x0', s.x0);
            obj.setData('y0', s.y0);
            obj.setData('vx', s.vx);
            obj.setData('vy', s.vy);

            // Visual sprite (procedural texture).
            const sprite = this.add.image(s.x0, s.y0, starTexKey);
            obj.setData('sprite', sprite);

            // Corona / Einstein-ring / flame-tongue overlay, animated per
            // frame. Additive blend so the semi-transparent orange layers
            // brighten the underlying disk instead of darkening it.
            const corona = this.add.graphics();
            corona.setPosition(s.x0, s.y0);
            corona.setBlendMode(Phaser.BlendModes.ADD);
            obj.setData('corona', corona);
            obj.setData('coronaSeed', Math.random() * 1000);

            this.gravityObjects.push(obj);
        }
    }

    createBlackHoles() {
        // Spawn one or more black holes into the world. Each BH is pushed
        // into this.gravityObjects so the shared N-body integrator, planner,
        // and per-frame gravity update all treat it uniformly with the stars.
        // Distinguished from stars by:
        //   - Higher gravitational parameter (mu) at a smaller visible radius.
        //   - killRadius > 0 (the event horizon): trajectories that pass
        //     within this radius are terminated as fatal in the planner, and
        //     the runtime overlap collider ends the game.
        //   - A distinct procedural texture (jet-black disk + accretion disk).
        this.blackHoles = [];

        if (!globalEnableMassiveObjects) {
            return;
        }

        const Sx = this.startX;
        const Sy = this.startY;
        const Ex = this.earthX;
        const Ey = this.earthY;
        const dxSE = Ex - Sx;
        const dySE = Ey - Sy;
        const lenSE = Math.sqrt(dxSE * dxSE + dySE * dySE) || 1;

        const numBlackHoles  = 1;
        const bhRadius       = 280;                 // visible event-horizon radius
        // ~2x a star's mu (stars: 7.68e6) but concentrated inside a tighter
        // radius, producing a much steeper gravity well near the BH.
        const bhMu           = 15000000;
        const bhMass         = 200;
        // Distances the BH must respect at t=0.
        const earthClear     = 12 * bhRadius;       // ~3360
        const earthClear2    = earthClear * earthClear;
        const shipClear      = 8  * bhRadius;       // ~2240
        const shipClear2     = shipClear * shipClear;
        // Keep BHs comfortably away from any existing star so the planner's
        // sim doesn't have to deal with two intersecting gravity wells.
        const starSep        = 6  * bhRadius;
        const starSep2       = starSep * starSep;

        const vCruiseClear   = (activeTuningParams && activeTuningParams.vCruise) || 200;
        const clearHorizon   = 2.0 * lenSE / vCruiseClear;

        const sampleGaussian = () => {
            let u1 = Math.random();
            const u2 = Math.random();
            u1 = u1 < 1e-8 ? 1e-8 : u1;
            return Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
        };
        const sampleVelocity = () => {
            const a = Math.random() * Math.PI * 2;
            const speed = Math.max(1, 150 + sampleGaussian() * 40);
            return { vx: Math.cos(a) * speed, vy: Math.sin(a) * speed };
        };
        const clearsEarth = (px, py, vxB, vyB) => {
            const relX = px - Ex, relY = py - Ey;
            const relVX = vxB, relVY = vyB;
            const vv = relVX * relVX + relVY * relVY;
            let tStar = 0;
            if (vv > 1e-9) {
                tStar = -(relX * relVX + relY * relVY) / vv;
                tStar = Math.max(0, Math.min(clearHorizon, tStar));
            }
            const cx = relX + relVX * tStar;
            const cy = relY + relVY * tStar;
            return (cx * cx + cy * cy) >= earthClear2;
        };
        const sampleVelocityClearingEarth = (px, py) => {
            for (let k = 0; k < 40; k++) {
                const v = sampleVelocity();
                if (clearsEarth(px, py, v.vx, v.vy)) return v;
            }
            return { vx: 0, vy: 0 };
        };

        // Existing star positions at t=0 (avoid overlapping them).
        const starPositions = (this.gravityObjects || []).map(o => ({
            x: (typeof o.getData('x0') === 'number') ? o.getData('x0') : o.x,
            y: (typeof o.getData('y0') === 'number') ? o.getData('y0') : o.y
        }));

        // Sample BH placements, or replay from snapshot on same-seed retry.
        let bhList;
        const snap = this.worldSnapshot && this.worldSnapshot.blackHoles;
        const snapUsable = Array.isArray(snap) && snap.length > 0
            && snap.every(b => typeof b.vx === 'number');
        if (this.replayRequested && !experimentConfig.enabled && snapUsable) {
            bhList = snap;
        } else {
            bhList = [];
            const maxAttempts = 500;

            // Reuse the star sampling box: same 23.04%-of-world shrink, same
            // S-E-midpoint centering, same drift-lead pre-offset (based on
            // the *star* ensemble's bulk drift, since the BH gets sampled
            // into whatever region the stars occupy). Note the BH's own
            // velocity is isotropic (no bulk drift), so the offset just
            // co-locates the BH with the star cluster at t=0; it doesn't
            // itself sweep the BH toward the S-E midpoint.
            const spawnShrink = 0.8 * Math.sqrt(0.8) * Math.sqrt(0.75) * Math.sqrt(0.6);
            const boxW = this.worldWidth  * spawnShrink;
            const boxH = this.worldHeight * spawnShrink;
            const starPerpDriftMag = 200;                    // matches createGravityObjects
            const perpX = -dySE / lenSE;
            const perpY =  dxSE / lenSE;
            const tShipToQuarter = 0.25 * lenSE / vCruiseClear;
            const preOffX = -perpX * starPerpDriftMag * tShipToQuarter;
            const preOffY = -perpY * starPerpDriftMag * tShipToQuarter;
            const midX = 0.5 * (Sx + Ex) + preOffX;
            const midY = 0.5 * (Sy + Ey) + preOffY;
            const boxCenterX = Phaser.Math.Clamp(midX, boxW / 2, this.worldWidth  - boxW / 2);
            const boxCenterY = Phaser.Math.Clamp(midY, boxH / 2, this.worldHeight - boxH / 2);
            const boxMinX = boxCenterX - boxW / 2;
            const boxMinY = boxCenterY - boxH / 2;

            for (let i = 0; i < numBlackHoles; i++) {
                let placed = false;
                for (let attempt = 0; attempt < maxAttempts; attempt++) {
                    const cx = boxMinX + Math.random() * boxW;
                    const cy = boxMinY + Math.random() * boxH;

                    const dxS = cx - Sx, dyS = cy - Sy;
                    if (dxS * dxS + dyS * dyS < shipClear2) continue;
                    const dxE = cx - Ex, dyE = cy - Ey;
                    if (dxE * dxE + dyE * dyE < earthClear2) continue;

                    let overlap = false;
                    for (const p of starPositions) {
                        const dx = cx - p.x, dy = cy - p.y;
                        if (dx * dx + dy * dy < starSep2) { overlap = true; break; }
                    }
                    if (overlap) continue;
                    for (const b of bhList) {
                        const dx = cx - b.x0, dy = cy - b.y0;
                        if (dx * dx + dy * dy < starSep2) { overlap = true; break; }
                    }
                    if (overlap) continue;

                    const v = sampleVelocityClearingEarth(cx, cy);
                    bhList.push({ x0: cx, y0: cy, vx: v.vx, vy: v.vy });
                    placed = true;
                    break;
                }
                if (!placed) break;
            }
            if (!this.worldSnapshot) this.worldSnapshot = {};
            this.worldSnapshot.blackHoles = bhList;
        }

        // Procedural black-hole texture (shared across all BHs).
        const bhTexKey = 'blackHoleTex';
        this.generateBlackHoleTexture(bhTexKey, bhRadius);

        for (const b of bhList) {
            const obj = this.add.circle(b.x0, b.y0, bhRadius, 0x000000, 0);
            this.physics.add.existing(obj);
            obj.body.setCircle(bhRadius);
            obj.body.setImmovable(true);
            obj.setData('gravityStrength', bhMu);
            obj.setData('schwarzschildRadius', bhRadius);
            obj.setData('mass', bhMass);
            // killRadius: contact with anything inside this radius is fatal.
            // Read by the planner sim and by the runtime overlap collider.
            obj.setData('killRadius', bhRadius);
            obj.setData('isBlackHole', true);
            obj.setData('x0', b.x0);
            obj.setData('y0', b.y0);
            obj.setData('vx', b.vx);
            obj.setData('vy', b.vy);

            const sprite = this.add.image(b.x0, b.y0, bhTexKey);
            obj.setData('sprite', sprite);

            // Rotating accretion-disk brightness overlay (animated per frame
            // in the shared gravityObjects loop). Additive blend.
            const overlay = this.add.graphics();
            overlay.setPosition(b.x0, b.y0);
            overlay.setBlendMode(Phaser.BlendModes.ADD);
            obj.setData('accretionOverlay', overlay);
            obj.setData('accretionSeed', Math.random() * 1000);

            this.gravityObjects.push(obj);
            this.blackHoles.push(obj);
        }
    }

    startStarMotion() {
        // Apply stored velocities to each gravity object's physics body so
        // Phaser advances their positions each frame. Idempotent (guarded by
        // this.starMotionStarted).
        if (this.starMotionStarted) return;
        if (!this.gravityObjects || this.gravityObjects.length === 0) return;
        for (const obj of this.gravityObjects) {
            const vx = obj.getData('vx');
            const vy = obj.getData('vy');
            if (typeof vx === 'number' && typeof vy === 'number' && obj.body) {
                obj.body.setVelocity(vx, vy);
            }
        }
        this.starMotionStarted = true;
    }

    updateStarGravity(deltaMs) {
        // Per-frame N-body update: accumulate pairwise gravitational
        // accelerations between every pair of massive objects (stars) and
        // apply them to each star's Phaser body velocity. Phaser then
        // advances each star's position from its (now-updated) velocity.
        // Runs only after startStarMotion (i.e., after the sweep completes,
        // or immediately in MANUAL mode). Mirrors the N-body loop inside
        // simulateForAngle so runtime motion tracks what the sweep planned.
        if (!this.starMotionStarted) return;
        const stars = this.gravityObjects;
        if (!stars || stars.length < 2) return;

        const dt = deltaMs / 1000;
        const N = stars.length;

        // Precompute mu, x, y per star (avoid repeated getData calls).
        const sx = new Array(N);
        const sy = new Array(N);
        const mu = new Array(N);
        for (let i = 0; i < N; i++) {
            sx[i] = stars[i].x;
            sy[i] = stars[i].y;
            mu[i] = stars[i].getData('gravityStrength') || 0;
        }

        // Symmetric pairwise sum: accel on i from j uses mu[j], and by
        // Newton's third law the accel on j from i uses mu[i] along the
        // opposite direction.
        const ax = new Array(N).fill(0);
        const ay = new Array(N).fill(0);
        for (let i = 0; i < N; i++) {
            for (let j = i + 1; j < N; j++) {
                const dxij = sx[j] - sx[i];
                const dyij = sy[j] - sy[i];
                const r2 = dxij * dxij + dyij * dyij;
                const r  = Math.sqrt(r2);
                if (r > 1) {
                    const gj = mu[j] / r2;
                    const gi = mu[i] / r2;
                    const ux = dxij / r;
                    const uy = dyij / r;
                    ax[i] += ux * gj;
                    ay[i] += uy * gj;
                    ax[j] -= ux * gi;
                    ay[j] -= uy * gi;
                }
            }
        }

        // Apply velocity changes. (Positions are integrated by Phaser from
        // body.velocity on the next physics step.)
        for (let i = 0; i < N; i++) {
            const body = stars[i].body;
            if (!body) continue;
            body.velocity.x += ax[i] * dt;
            body.velocity.y += ay[i] * dt;
        }
    }

    createPickups() {
        // Create empty pickup groups so collision handlers still work, but do not
        // spawn any fuel or ammo tokens during guidance tuning.
        this.fuelPickups = this.physics.add.group();
        this.ammoPickups = this.physics.add.group();

        if (!globalEnableTokens) {
            return;
        }

        const worldSize = this.worldSize;

        const fuelCount = 6;  // reduced density
        const ammoCount = 6;  // reduced density

        for (let i = 0; i < fuelCount; i++) {
            const x = Math.random() * worldSize;
            const y = Math.random() * worldSize;
            const fuel = this.add.rectangle(x, y, 10, 14, 0x00ff00);
            this.physics.add.existing(fuel);
            fuel.body.setImmovable(true);
            this.fuelPickups.add(fuel);
        }

        for (let i = 0; i < ammoCount; i++) {
            const x = Math.random() * worldSize;
            const y = Math.random() * worldSize;
            const ammo = this.add.rectangle(x, y, 10, 10, 0xffff00);
            this.physics.add.existing(ammo);
            ammo.body.setImmovable(true);
            this.ammoPickups.add(ammo);
        }
    }

    // Planner-status banner: screen-fixed top-center text that lingers a
    // few seconds then fades. Used to surface the chord-check result in
    // AUTOPILOT mode ("straight line cleared" vs "not safe, computing
    // slingshot"). Destroys any previous banner so successive planner
    // calls (e.g. on scene restart) don't stack.
    _showPlannerBanner(message, colorHex) {
        if (this._plannerBanner) {
            this._plannerBanner.destroy();
            this._plannerBanner = null;
        }
        const camW = this.cameras.main.width;
        const banner = this.add.text(camW / 2, 110, message, {
            fontSize: '22px',
            fill: colorHex || '#66ff88',
            backgroundColor: '#000c',
            padding: { x: 18, y: 10 },
            fontFamily: 'monospace',
            align: 'center'
        }).setOrigin(0.5, 0).setScrollFactor(0).setDepth(2000);
        this._plannerBanner = banner;
        this.tweens.add({
            targets: banner,
            alpha: 0,
            delay: 2500,
            duration: 1000,
            onComplete: () => {
                if (this._plannerBanner === banner) this._plannerBanner = null;
                banner.destroy();
            }
        });
    }

    // Rolling-average estimate of how long the next sweep will take (seconds),
    // used as the pre-roll horizon so the sweep's t=0 star state matches
    // what will exist in the world at plan hand-off. Falls back to a fixed
    // default before any sweeps have completed on this scene instance.
    _getPlanTimeEstimate() {
        if (RECENT_PLAN_TIMES_SEC.length === 0) {
            return DEFAULT_PLAN_TIME_ESTIMATE_SEC;
        }
        let s = 0;
        for (const t of RECENT_PLAN_TIMES_SEC) s += t;
        return s / RECENT_PLAN_TIMES_SEC.length;
    }

    // Advance the given (starX, starY, starVX, starVY) arrays forward by
    // preRollSec seconds using the same pairwise-gravity + symplectic-Euler
    // integrator as the ship trajectory sim. Ship is NOT part of this loop
    // (during the real sweep the ship is being station-kept, so it exerts
    // no gravity of consequence and its own motion is trivial to predict).
    // Mutates the arrays in place.
    _preRollStarsInPlace(masses, starX, starY, starVX, starVY, preRollSec, dt) {
        if (preRollSec <= 0) return;
        const N = masses.length;
        const starAX = new Array(N);
        const starAY = new Array(N);
        const steps = Math.max(1, Math.ceil(preRollSec / dt));
        const stepDt = preRollSec / steps;
        for (let step = 0; step < steps; step++) {
            for (let i = 0; i < N; i++) { starAX[i] = 0; starAY[i] = 0; }
            for (let i = 0; i < N; i++) {
                for (let j = i + 1; j < N; j++) {
                    const dxij = starX[j] - starX[i];
                    const dyij = starY[j] - starY[i];
                    const r2ij = dxij * dxij + dyij * dyij;
                    const rij  = Math.sqrt(r2ij);
                    if (rij > 1) {
                        const gj = masses[j].mu / r2ij;
                        const gi = masses[i].mu / r2ij;
                        const ux = dxij / rij;
                        const uy = dyij / rij;
                        starAX[i] += ux * gj;
                        starAY[i] += uy * gj;
                        starAX[j] -= ux * gi;
                        starAY[j] -= uy * gi;
                    }
                }
            }
            for (let i = 0; i < N; i++) {
                starVX[i] += starAX[i] * stepDt;
                starVY[i] += starAY[i] * stepDt;
                starX[i]  += starVX[i] * stepDt;
                starY[i]  += starVY[i] * stepDt;
            }
        }
    }

    // Build the per-run trajectory-simulator context used by both the
    // straight-line fast-path check and the slingshot sweep.
    //
    // opts:
    //   preRollSec: seconds to fast-forward the star ensemble before it
    //     becomes the sweep's t=0 state. Set to the estimated planning
    //     wall-time so the sweep optimizes against the world state that
    //     will actually exist at hand-off.
    //   useLiveShipState: if true, snapshot the player's current position
    //     and velocity as the sim's initial ship state and pre-roll it
    //     linearly (constant velocity, since station-keeping is cancelling
    //     gravity during the pre-roll window). If false, the sim defaults
    //     to (Sx, Sy) at rest as before.
    //
    // Returns null if the world doesn't yet have valid inputs.
    _buildTrajectorySimContext(opts = {}) {
        if (!this.gravityObjects || this.gravityObjects.length === 0) return null;
        const preRollSec = (typeof opts.preRollSec === 'number' && opts.preRollSec > 0)
            ? opts.preRollSec : 0;
        const useLiveShipState = !!opts.useLiveShipState;

        // Snapshot LIVE star state from Phaser bodies. Once startStarMotion
        // has fired this is the ground-truth of "where the star cluster is
        // right now"; before it fires (initial planning) it degenerates to
        // the spawn state, which is fine.
        const masses = this.gravityObjects
            .map(o => {
                const bv = (o.body && o.body.velocity) ? o.body.velocity : { x: 0, y: 0 };
                return {
                    obj: o,
                    mu: o.getData('gravityStrength'),
                    x0: o.x,
                    y0: o.y,
                    vx: bv.x || 0,
                    vy: bv.y || 0,
                    killR: (typeof o.getData('killRadius') === 'number') ? o.getData('killRadius') : 0
                };
            })
            .filter(m => typeof m.mu === 'number' && m.mu > 0);
        if (masses.length === 0) return null;

        const Sx = this.startX, Sy = this.startY;
        const Ex = this.earthX, Ey = this.earthY;
        const dxSE = Ex - Sx, dySE = Ey - Sy;
        const lenSE = Math.sqrt(dxSE * dxSE + dySE * dySE);
        if (lenSE < 1e-3) return null;
        const uxBase = dxSE / lenSE, uyBase = dySE / lenSE;

        const vCruise = (activeTuningParams && activeTuningParams.vCruise) || 250;
        if (vCruise <= 0) return null;

        const dt          = 0.04;
        const maxTime     = 2 * lenSE / vCruise;
        const maxSteps    = Math.floor(maxTime / dt);
        const thrustForce = currentMainThrustForce();
        const exhaustVel  = currentExhaustVelocity();

        // Snapshot / pre-roll ship state. Under station-keeping the ship
        // coasts in a gravity-cancelled frame, so its motion during the
        // pre-roll window is exactly (pos + vel * dt), i.e. a straight line.
        let initShipX = Sx, initShipY = Sy, initShipVX = 0, initShipVY = 0;
        if (useLiveShipState && this.player && this.player.body) {
            initShipX = this.player.x;
            initShipY = this.player.y;
            initShipVX = this.player.body.velocity.x || 0;
            initShipVY = this.player.body.velocity.y || 0;
        }

        // Pre-roll stars in place under full mutual gravity.
        if (preRollSec > 0) {
            const N = masses.length;
            const starX = new Array(N), starY = new Array(N);
            const starVX = new Array(N), starVY = new Array(N);
            for (let i = 0; i < N; i++) {
                starX[i] = masses[i].x0;   starY[i] = masses[i].y0;
                starVX[i] = masses[i].vx;  starVY[i] = masses[i].vy;
            }
            this._preRollStarsInPlace(masses, starX, starY, starVX, starVY, preRollSec, dt);
            for (let i = 0; i < N; i++) {
                masses[i].x0 = starX[i];   masses[i].y0 = starY[i];
                masses[i].vx = starVX[i];  masses[i].vy = starVY[i];
            }
            // Pre-roll ship linearly (station-keeping = zero net force).
            initShipX += initShipVX * preRollSec;
            initShipY += initShipVY * preRollSec;
        }

        // Earth's gravitational parameter as used by applyGravity (live
        // physics): earthGravityStrength = 40000 * 5. The sim historically
        // omitted this and treated Earth as a purely geometric target, which
        // biased ballistic-coast timing and gravitational deflection near
        // the target. Passed through ctx so _simulateShipTrajectoryNBody
        // can add it to the per-step force accumulation.
        const earthMu = 40000 * 5;
        // Autopilot angular acceleration (rad/s^2) for the ORIENT bang-bang
        // schedule. Used by the sim to model the ORIENT delay before BOOST
        // begins: the ship coasts under gravity only for
        //   tOrient = 2 * sqrt(|angleOffset| / angularAccel)
        // seconds after t=0 before the main engine ignites. Live autopilot
        // pays this delay every hand-off; without it the sim's timeline is
        // systematically ahead of reality by 0.3-1.0 s.
        const angularAccel = (this.autopilot && this.autopilot.angularAccel) || 3.0;

        return {
            Sx, Sy, Ex, Ey,
            dxSE, dySE, lenSE,
            uxBase, uyBase,
            vCruise,
            vCruise2: vCruise * vCruise,
            masses,
            earthRadius: 80 * 5,        // matches createEarth
            earthMu,
            angularAccel,
            dt, maxSteps, maxTime,
            thrustForce,
            fuelBurnRate: thrustForce / exhaustVel,
            initialFuel: INITIAL_FUEL_MASS,
            dryMass: SHIP_DRY_MASS,
            initShip: { x: initShipX, y: initShipY, vx: initShipVX, vy: initShipVY },
            preRollSec
        };
    }

    // Full N-body ship-trajectory simulator. Departs from S at rest, thrusts
    // along (uxBase, uyBase) rotated by angleOffset until reaching vCruise
    // or exhausting fuel, then coasts. Every step:
    //   (a) accumulates star-on-ship gravity + tracks closest approach,
    //   (b) accumulates pairwise star-on-star gravity (full N-body),
    //   (c) symplectic-Euler integrates ship and all stars,
    //   (d) checks for Earth arrival, S-E baseline re-crossing, or BH kill.
    // Returns the same result shape used by the slingshot sweep so both
    // callers can consume it uniformly.
    _simulateShipTrajectoryNBody(angleOffset, ctx) {
        const {
            Sx, Sy, Ex, Ey,
            dxSE, dySE,
            uxBase, uyBase,
            vCruise, vCruise2,
            masses,
            earthRadius,
            dt, maxSteps, maxTime,
            thrustForce, fuelBurnRate, initialFuel, dryMass
        } = ctx;
        // Earth-gravity mu and autopilot angularAccel are optional for
        // backward compat; default the earthMu to 0 (old behaviour) and
        // angularAccel to 3.0 if the ctx wasn't built by
        // _buildTrajectorySimContext (e.g. the compare-test straight-line
        // ctx). New builders always populate them.
        const earthMu = (typeof ctx.earthMu === 'number') ? ctx.earthMu : 0;
        const angularAccel = (typeof ctx.angularAccel === 'number' && ctx.angularAccel > 0)
            ? ctx.angularAccel : 3.0;
        // ORIENT-phase delay: live autopilot must rotate to the requested
        // heading before firing the main engine. The bang-bang schedule
        // takes tOrient = 2 * sqrt(|angleOffset| / angularAccel) seconds
        // (see AutopilotController's ORIENT case). During this window the
        // ship coasts under gravity only; boosting is inhibited.
        const tOrient = 2 * Math.sqrt(Math.abs(angleOffset) / Math.max(angularAccel, 1e-3));

        // Initial ship state defaults to rest-at-S but callers can override
        // via ctx.initShip = { x, y, vx, vy } to plan from an arbitrary
        // launch state (used by the pre-rolled sweep and by in-flight
        // replanning where the ship is already coasting at cruise speed).
        const init = ctx.initShip || { x: Sx, y: Sy, vx: 0, vy: 0 };
        let x = init.x;
        let y = init.y;
        const cosA = Math.cos(angleOffset);
        const sinA = Math.sin(angleOffset);
        const dirX = uxBase * cosA - uyBase * sinA;
        const dirY = uxBase * sinA + uyBase * cosA;
        let vx = init.vx;
        let vy = init.vy;
        let fuel = initialFuel;
        // If the initial velocity is already at or past cruise, skip BOOST
        // entirely and go straight to ballistic coast -- avoids over-burning
        // fuel when the sim is invoked as a replanning refinement on a ship
        // that's already at speed. Note: `boosting` here just gates the
        // future eligibility; the ORIENT-phase check below (t < tOrient)
        // separately inhibits thrust even when boosting=true.
        let boosting = (vx * vx + vy * vy) < vCruise2;

        const N = masses.length;
        const starX  = new Array(N);
        const starY  = new Array(N);
        const starVX = new Array(N);
        const starVY = new Array(N);
        const starAX = new Array(N);
        const starAY = new Array(N);
        for (let i = 0; i < N; i++) {
            starX[i]  = masses[i].x0;
            starY[i]  = masses[i].y0;
            starVX[i] = masses[i].vx;
            starVY[i] = masses[i].vy;
        }

        const baselineSign = (px, py) => (px - Sx) * dySE - (py - Sy) * dxSE;

        let t = 0;
        let minDist2 = Number.POSITIVE_INFINITY;
        let periX = x;
        let periY = y;
        let periIndex = 0;
        let closestObj = null;

        let prevSign = baselineSign(x, y);
        let crossings = 0;
        let bestCrossX = null;
        let bestCrossY = null;
        let bestCrossT = null;
        let bestDistToEarth = Number.POSITIVE_INFINITY;
        let stopT = null;

        const recordEvery = 5;
        const trajectoryPoints = [{ x, y }];

        for (let step = 0; step < maxSteps; step++) {
            let ax = 0;
            let ay = 0;
            let killed = false;

            // BOOST is inhibited during the ORIENT window (t < tOrient) --
            // live autopilot spends this time rotating the ship, not firing
            // the main engine. After tOrient the standard boosting rule
            // (thrust until speed >= vCruise or fuel runs out) applies.
            if (boosting && t >= tOrient) {
                const mass = dryMass + fuel;
                const Fx = dirX * thrustForce;
                const Fy = dirY * thrustForce;
                const aRel = relativisticThrustAccel(Fx, Fy, mass, vx, vy);
                ax += aRel.ax;
                ay += aRel.ay;
                fuel -= fuelBurnRate * dt;
                if (fuel <= 0) { fuel = 0; boosting = false; }
            }

            for (let i = 0; i < N; i++) {
                const dxCS = starX[i] - x;
                const dyCS = starY[i] - y;
                const r2 = dxCS * dxCS + dyCS * dyCS;
                const r = Math.sqrt(r2);
                if (r > 1) {
                    const g = masses[i].mu / r2;
                    ax += (dxCS / r) * g;
                    ay += (dyCS / r) * g;
                }
                if (r2 < minDist2) {
                    minDist2 = r2;
                    periX = x;
                    periY = y;
                    periIndex = trajectoryPoints.length - 1;
                    closestObj = masses[i].obj;
                }
                if (masses[i].killR > 0 && r <= masses[i].killR) {
                    killed = true;
                }
            }

            // Earth's gravitational pull on the ship. Live physics
            // (applyGravity) includes this every frame; the sim used to
            // ignore it, biasing ballistic-coast time and final-approach
            // deflection. earthMu = 0 for legacy ctx builders (e.g. the
            // compare-test straight-line ctx) leaves the old behaviour
            // intact.
            if (earthMu > 0) {
                const dxE = Ex - x;
                const dyE = Ey - y;
                const r2E = dxE * dxE + dyE * dyE;
                const rE = Math.sqrt(r2E);
                if (rE > 1) {
                    const gE = earthMu / r2E;
                    ax += (dxE / rE) * gE;
                    ay += (dyE / rE) * gE;
                }
            }
            if (killed) {
                trajectoryPoints.push({ x, y });
                return {
                    hit: false,
                    miss: true,
                    trajectoryPoints,
                    periX, periY, periIndex,
                    minDistToStar: Math.sqrt(minDist2),
                    closestObj,
                    killedByBlackHole: true
                };
            }

            for (let i = 0; i < N; i++) { starAX[i] = 0; starAY[i] = 0; }
            for (let i = 0; i < N; i++) {
                for (let j = i + 1; j < N; j++) {
                    const dxij = starX[j] - starX[i];
                    const dyij = starY[j] - starY[i];
                    const r2ij = dxij * dxij + dyij * dyij;
                    const rij  = Math.sqrt(r2ij);
                    if (rij > 1) {
                        const gj = masses[j].mu / r2ij;
                        const gi = masses[i].mu / r2ij;
                        const ux = dxij / rij;
                        const uy = dyij / rij;
                        starAX[i] += ux * gj;
                        starAY[i] += uy * gj;
                        starAX[j] -= ux * gi;
                        starAY[j] -= uy * gi;
                    }
                }
            }

            vx += ax * dt;
            vy += ay * dt;
            if (boosting && (vx * vx + vy * vy) >= vCruise2) {
                boosting = false;
            }
            for (let i = 0; i < N; i++) {
                starVX[i] += starAX[i] * dt;
                starVY[i] += starAY[i] * dt;
                starX[i]  += starVX[i] * dt;
                starY[i]  += starVY[i] * dt;
            }

            x += vx * dt;
            y += vy * dt;
            t += dt;

            if ((step + 1) % recordEvery === 0) {
                trajectoryPoints.push({ x, y });
            }

            const dxE = x - Ex;
            const dyE = y - Ey;
            const distE = Math.sqrt(dxE * dxE + dyE * dyE);
            if (distE <= earthRadius) {
                trajectoryPoints.push({ x, y });
                return {
                    hit: true,
                    miss: false,
                    crossX: x, crossY: y, crossTime: t,
                    distToEarth: distE,
                    periX, periY, periIndex,
                    trajectoryPoints,
                    minDistToStar: Math.sqrt(minDist2),
                    closestObj
                };
            }

            const s = baselineSign(x, y);
            if (t > dt * 2 && prevSign !== 0 && s !== 0 && Math.sign(s) !== Math.sign(prevSign)) {
                crossings++;
                if (distE < bestDistToEarth) {
                    bestDistToEarth = distE;
                    bestCrossX = x;
                    bestCrossY = y;
                    bestCrossT = t;
                }
                if (crossings === 1 && stopT === null) {
                    const coastDist = 2000;
                    const coastByTime = 0.4 * maxTime;
                    const coastByDist = coastDist / Math.max(1, vCruise);
                    stopT = t + Math.max(coastByTime, coastByDist);
                }
            }
            prevSign = s;

            if (stopT !== null && t >= stopT) break;
        }

        if (bestCrossX !== null) {
            trajectoryPoints.push({ x, y });
            return {
                hit: false,
                miss: false,
                crossX: bestCrossX, crossY: bestCrossY, crossTime: bestCrossT,
                distToEarth: bestDistToEarth,
                periX, periY, periIndex,
                trajectoryPoints,
                minDistToStar: Math.sqrt(minDist2),
                closestObj
            };
        }

        trajectoryPoints.push({ x, y });
        return {
            hit: false,
            miss: true,
            trajectoryPoints,
            periX, periY, periIndex,
            minDistToStar: Math.sqrt(minDist2),
            closestObj
        };
    }

    // Fast-path chord-clearance test for the straight-line planner. Runs the
    // full N-body integrator (same physics as the slingshot sweep) with the
    // ship departing straight along the S->E baseline (angleOffset = 0).
    // Returns true iff:
    //   (a) the simulated ship actually reaches Earth (result.hit === true),
    //   (b) the ship never comes within (starR + shipR + margin) of any
    //       star's evolving center over the whole trajectory.
    // This drops both of the previous approximations (constant-vCruise ship
    // motion and linear star motion) in favor of the same simulation the
    // slingshot sweep uses on every candidate, so the fast-path verdict is
    // consistent with what the sweep would find for the same heading.
    _straightLineClearsStars() {
        const ctx = this._buildTrajectorySimContext();
        if (!ctx) return true;  // no massive objects to worry about

        const result = this._simulateShipTrajectoryNBody(0, ctx);
        if (!result || result.miss || !result.hit) return false;

        // Minimum-clearance filter. minDistToStar is center-to-center; every
        // mass in ctx.masses has a Phaser radius on its .obj. Use the max
        // radius across the ensemble as a conservative "starR" bound so a
        // single scalar threshold covers stars and BHs alike.
        const shipR = 15;
        const margin = 20;
        let maxObjRadius = 0;
        for (const m of ctx.masses) {
            const r = (m.obj && typeof m.obj.radius === 'number') ? m.obj.radius : 0;
            if (r > maxObjRadius) maxObjRadius = r;
        }
        const threshold = maxObjRadius + shipR + margin;
        return result.minDistToStar >= threshold;
    }

    // Build a synthetic straight-line "slingshot plan" so the compare-test
    // straight-line leg can reuse the entire autopilot code path
    // (BOOST / CRUISE / BRAKE + cross-track PID) with a straight reference
    // trajectory instead of a curved one.
    _buildStraightLinePlan() {
        const Sx = this.startX, Sy = this.startY;
        const Ex = this.earthX, Ey = this.earthY;
        const dx = Ex - Sx, dy = Ey - Sy;
        const len = Math.max(1e-6, Math.sqrt(dx * dx + dy * dy));
        const ux = dx / len, uy = dy / len;      // S->E unit vector
        const tx = -uy, ty = ux;                 // 90 deg CCW (tangent)

        // Dense straight-line polyline so getSlingshotPathFrame's O(N)
        // nearest-segment walk gives fine-grained cross-track error.
        const numSegs = 100;
        const trajectoryPoints = [];
        for (let i = 0; i <= numSegs; i++) {
            const t = i / numSegs;
            trajectoryPoints.push({ x: Sx + dx * t, y: Sy + dy * t });
        }

        return {
            startX: Sx, startY: Sy,
            earthX: Ex, earthY: Ey,
            baseUx: ux, baseUy: uy,
            object: null,
            impactParameter: 0,
            deflectionAngle: 0,
            dirX: ux, dirY: uy,
            tangentX: tx, tangentY: ty,
            outDirX: ux, outDirY: uy,
            trajectoryPoints,
            periIndex: 0
        };
    }

    refineSlingshotPlanNumerically() {
        // Initialize the incremental numerical sweep state. The actual work is
        // performed in updateSlingshotSweep() so we can display progress and
        // avoid blocking the main thread.

        // Create the debug graphics layer up front so the S->E baseline,
        // sweep preview, and final red plan all have somewhere to render.
        // (Stale per-scene references are already cleared in create().)
        this.slingshotDebug = this.add.graphics();
        this.slingshotDebug.setDepth(500);

        // Default autopilot planner behavior: first check whether the direct
        // S->E chord clears every star (by ship-radius + margin). If it does,
        // install a synthesized straight-line plan and skip the numerical
        // slingshot sweep entirely -- straight-line flight is faster,
        // cheaper in fuel, and lower in time dilation whenever it's safe.
        // Only when the chord clips a star do we fall through and run the
        // sweep to find a curved slingshot trajectory.
        //
        // Exception: the slingshot leg of the compare-ensemble test bypasses
        // the chord shortcut so that leg *always* runs the slingshot sweep,
        // preserving the slingshot-vs-straight comparison. The straight leg
        // uses the normal shortcut and marks itself as a "fallback" if the
        // chord happened to clip a star.
        const isCompareSlingshotLeg = this.mode === 'COMPARE' && compareTestState
            && compareTestState.phase === 'slingshot';
        this._compareLegUsedFallback = false;
        if (!isCompareSlingshotLeg) {
            const clear = this._straightLineClearsStars();
            if (this.mode === 'AUTOPILOT') {
                if (clear) {
                    this._showPlannerBanner('Straight line path has been cleared', '#66ff88');
                } else {
                    this._showPlannerBanner('Straight line trajectory not safe. Calculating slingshot...', '#ffcc66');
                }
            }
            if (clear) {
                this.slingshotPlan = this._buildStraightLinePlan();
                this.slingshotSweepActive = false;
                this.slingshotSweepFailed = false;
                // If a prior failed sweep left station-keeping engaged
                // (in-place replan scenario), release it now so the ship
                // starts flying the just-installed straight-line plan
                // instead of continuing to hover.
                this._stationKeepingActive = false;
                return;
            }
            if (this.mode === 'COMPARE' && compareTestState
                && compareTestState.phase === 'straight') {
                this._compareLegUsedFallback = true;
            }
        }

        if (!this.gravityObjects || this.gravityObjects.length === 0) {
            return;
        }

        // Start the world clock (star motion + evolution) at sweep-start so
        // stars are actively drifting under mutual gravity for the whole
        // planning window. Combined with the station-keeping block below,
        // this makes the "ship computing while stars move" model literal.
        this.startStarMotion();

        // Engage station-keeping on the ship: it stays in its current
        // (position, velocity) state during the sweep by cancelling
        // gravitational forces. See applyGravity + update() for the actual
        // freeze; here we just flip the flag. Fuel accumulator is NOT
        // reset here so it accrues cumulatively across fail-retune-replan
        // cycles (reset only happens once at scene create).
        this._stationKeepingActive = true;
        // Snapshot the sweep-start wall-clock so we can measure how long
        // planning actually took at hand-off.
        this._sweepStartWallMs = (typeof performance !== 'undefined' && performance.now)
            ? performance.now()
            : Date.now();

        // Pre-roll the star ensemble by the estimated wall-clock planning
        // time so the sweep's t=0 state matches the world's actual state at
        // hand-off. useLiveShipState=true so if we're replanning mid-flight
        // the ship's current (position, velocity) becomes the sim's initial
        // condition. On the very first plan the ship is at rest at S and
        // this degenerates to the previous (Sx, Sy, 0, 0) initial state.
        this._lastPlanTimeEstimateSec = this._getPlanTimeEstimate();
        const ctx = this._buildTrajectorySimContext({
            preRollSec: this._lastPlanTimeEstimateSec,
            useLiveShipState: true
        });
        if (!ctx) return;
        // Wall time (ms) that simCtx.masses currently represents. Set to
        // the estimated hand-off wall time at sweep-start. If the sweep
        // overshoots this projection (i.e., planning takes longer than
        // estimated), updateSlingshotSweep will incrementally advance
        // simCtx.masses forward in-place so every candidate is always
        // scored against a not-yet-past star projection instead of a
        // stale pre-roll snapshot.
        this._simCtxProjectedWallMs = this._sweepStartWallMs
            + this._lastPlanTimeEstimateSec * 1000;
        const {
            Sx, Sy, Ex, Ey,
            dxSE, dySE, lenSE,
            uxBase, uyBase,
            vCruise,
            masses,
            maxTime
        } = ctx;

        // Adaptive angle sweep. Instead of a fixed +/- range we expand
        // outward from 0 in each direction until the simulated trajectory
        // no longer intercepts the S->E baseline (miss). Successful
        // candidates are collected and post-filtered for sun-radius safety.
        const dAngleDeg = 0.025;
        const dAngleRad = Phaser.Math.DegToRad(dAngleDeg);

        this.slingshotSweepActive = true;
        this.slingshotSweepMode = 'coarse';     // switch to 'fine' after coarse pass
        this.slingshotSweepAngle = 0;           // current signed test angle
        this.slingshotSweepDirection = +1;      // +1 growing positive, -1 growing negative
        this.slingshotSweepStep = dAngleRad;
        this.slingshotSweepResults = [];        // successful (miss:false) candidates
        this.slingshotSweepMaxAbsAngle = 0;     // largest |angle| reached, for progress display
        this.slingshotSweepPosBest = null;      // best coarse candidate on + cone
        this.slingshotSweepNegBest = null;      // best coarse candidate on - cone
        this.slingshotSweepFineAngle = 0;
        this.slingshotSweepFineEndAngle = 0;
        this.slingshotSweepFineStep = 0;
        this.slingshotSweepFineBest = null;
        // Consecutive-miss tolerance per direction. A single miss (e.g. from
        // a trajectory that gets flung off by the star and never crosses back
        // in time) must NOT prematurely terminate that side of the sweep.
        // Sized geometrically: dAngleRad * missTolerance * distSStar ~=
        // starRadius. That is, we allow enough missed angular steps to span
        // roughly one star radius (as an arc) at the star's distance from S,
        // so isolated non-crossings inside the star's shadow don't kill the
        // sweep prematurely. Floored at 5 for degeneracies (no star, very
        // near star).
        this.slingshotSweepConsecMisses = 0;
        let missTol = 10;
        if (this.gravityObjects && this.gravityObjects[0]) {
            const star = this.gravityObjects[0];
            const dxStar = star.x - Sx;
            const dyStar = star.y - Sy;
            const distSStar = Math.sqrt(dxStar * dxStar + dyStar * dyStar);
            const starRadius = star.radius || 0;
            if (distSStar > 1 && starRadius > 0 && dAngleRad > 0) {
                missTol = Math.round(starRadius / (dAngleRad * distSStar));
            }
        }
        this.slingshotSweepMissTolerance = Math.max(5, missTol);

        // Cache geometry and parameters for use in updateSlingshotSweep.
        // sunRadius is the geometric radius of the star; used to reject
        // trajectories that clip the star.
        let sunRadius = 0;
        if (this.gravityObjects && this.gravityObjects[0]) {
            const star = this.gravityObjects[0];
            sunRadius = star.radius || 0;
        }
        this.slingshotSweepData = {
            Sx, Sy, Ex, Ey,
            dxSE, dySE, lenSE,
            uxBase, uyBase,
            vCruise,
            masses,
            sunRadius,
            // Earth radius in the planner must match the scaled physical
            // Earth radius used in createEarth (80 * 5).
            earthRadius: 80 * 5,
            lineHitThreshold: 0.5 * (80 * 5),
            dt: 0.04,
            maxTime,
            // Full pre-rolled ctx: updateSlingshotSweep hands this directly
            // to _simulateShipTrajectoryNBody so every candidate is scored
            // against the star state that will exist at hand-off.
            simCtx: ctx
        };

        // Only one graphics layer during the sweep: the "current" line
        // showing the trajectory presently being tested. Previously-tested
        // trajectories are not retained on screen.
        if (!this.slingshotSweepCurrentGraphics) {
            this.slingshotSweepCurrentGraphics = this.add.graphics();
            this.slingshotSweepCurrentGraphics.setDepth(499);
        }
        this.slingshotSweepCurrentGraphics.clear();
        this.slingshotSweepLastResult = null;

        // Create or update the on-screen sweep status text (bottom of screen).
        const cam = this.cameras.main;
        const cx = cam.width / 2;
        const cy = cam.height - 40;
        if (!this.slingshotSweepText) {
            this.slingshotSweepText = this.add.text(cx, cy, 'Computing slingshot...', {
                fontSize: '20px',
                fill: '#ff0'
            }).setOrigin(0.5).setScrollFactor(0).setDepth(3002);
        } else {
            this.slingshotSweepText.setText('Computing slingshot...');
        }
        this.slingshotSweepText.setVisible(true);
    }

    setupFineSweepAroundWinner() {
        // Called once the coarse sweep completes. Splits coarse results into
        // the two "cones" (positive-angle and negative-angle sides of the
        // ship's initial S->E heading) and filters each cone to trajectories
        // that do not clip any star (with a 5% safety margin over each
        // star's physical radius).
        // Picks each cone's best by minimum Euclidean distToEarth (i.e.
        // whose baseline crossing lies closest to Earth's center), then
        // compares the two cones' bests by expected transit time (crossTime)
        // and picks the smaller as the winner. Finally, initializes a fine
        // linear sweep around the winner's angle at one-tenth the coarse
        // step size to hone the final trajectory even closer to Earth.
        const results = this.slingshotSweepResults || [];
        if (results.length === 0) {
            return;
        }

        // Star-clip threshold with a 5% safety margin over the star's
        // physical radius, so live-gameplay star drift (from N-body deflection)
        // can't turn a barely-safe planned trajectory into a real clip.
        const sunRadius = this.slingshotSweepData.sunRadius || 0;
        const clipRadius = sunRadius * 1.05;

        const isValid = (res) => {
            if (!res || res.miss) return false;
            if (typeof res.crossX !== 'number' || typeof res.crossY !== 'number') return false;
            if ((res.minDistToStar || 0) <= clipRadius) return false;
            return true;
        };

        // Best per cone by minimum Euclidean distToEarth.
        let posBest = null;
        let negBest = null;
        for (const r of results) {
            if (!isValid(r.result)) continue;
            const cand = { angle: r.angle, result: r.result };
            if (r.angle >= 0) {
                if (!posBest || r.result.distToEarth < posBest.result.distToEarth) {
                    posBest = cand;
                }
            } else {
                if (!negBest || r.result.distToEarth < negBest.result.distToEarth) {
                    negBest = cand;
                }
            }
        }

        this.slingshotSweepPosBest = posBest;
        this.slingshotSweepNegBest = negBest;

        // Pick the winner cone. Priority:
        //   1. Cones whose best coarse intercept already lies inside the
        //      10%-earthRadius circle around Earth beat cones that don't.
        //   2. Among cones that both make the circle, smaller crossTime wins.
        //   3. If neither cone makes the circle, pick the cone with the
        //      smaller distToEarth so the fine sweep has the best chance
        //      of pulling the intercept inside the circle.
        const circleTol = 0.1 * (this.slingshotSweepData.earthRadius || 0);
        const posT = (posBest && typeof posBest.result.crossTime === 'number')
            ? posBest.result.crossTime : Number.POSITIVE_INFINITY;
        const negT = (negBest && typeof negBest.result.crossTime === 'number')
            ? negBest.result.crossTime : Number.POSITIVE_INFINITY;
        const posD = posBest ? posBest.result.distToEarth : Number.POSITIVE_INFINITY;
        const negD = negBest ? negBest.result.distToEarth : Number.POSITIVE_INFINITY;
        const posInCircle = posBest && posD <= circleTol;
        const negInCircle = negBest && negD <= circleTol;

        let winner = null;
        if (posInCircle && negInCircle) {
            winner = (posT <= negT) ? posBest : negBest;
        } else if (posInCircle) {
            winner = posBest;
        } else if (negInCircle) {
            winner = negBest;
        } else if (posBest && negBest) {
            winner = (posD <= negD) ? posBest : negBest;
        } else {
            winner = posBest || negBest;
        }
        if (!winner) {
            return; // no valid candidates in either cone
        }

        // Set up the fine linear sweep centered on the winner's angle.
        // Range: +/- one coarse step; step size: one-tenth the coarse step.
        // This tests 20 intermediate angles between the winner's coarse
        // neighbours and keeps the one with the smallest distToEarth.
        const coarseStep = this.slingshotSweepStep;
        const fineStep = coarseStep / 10;
        this.slingshotSweepFineStep = fineStep;
        this.slingshotSweepFineAngle = winner.angle - coarseStep;
        this.slingshotSweepFineEndAngle = winner.angle + coarseStep;
        this.slingshotSweepFineBest = winner;   // start with the winner as fallback
        this.slingshotSweepMode = 'fine';
    }

    updateSlingshotSweep(dtFrame) {
        if (!this.slingshotSweepActive) {
            return;
        }

        const data = this.slingshotSweepData;
        if (!data) {
            this.slingshotSweepActive = false;
            if (this.slingshotSweepText) {
                this.slingshotSweepText.setVisible(false);
            }
            return;
        }

        const {
            Sx, Sy, Ex, Ey,
            dxSE, dySE, lenSE,
            uxBase, uyBase,
            vCruise,
            masses,
            earthRadius,
            lineHitThreshold,
            dt,
            maxTime
        } = data;

        const maxSteps = Math.floor(maxTime / dt);

        // Thrust / fuel parameters (constant across all candidates because
        // Isp is a tuning parameter, not a per-trajectory quantity).
        const thrustForce   = currentMainThrustForce();
        const exhaustVel    = currentExhaustVelocity();
        const fuelBurnRate  = thrustForce / exhaustVel;
        const initialFuel   = INITIAL_FUEL_MASS;
        const dryMass       = SHIP_DRY_MASS;
        const vCruise2      = vCruise * vCruise;   // squared-speed threshold

        // Use the pre-rolled ctx captured at sweep-start (with estimated
        // planning-latency compensation already baked into the star state).
        // Falls back to a fresh no-pre-roll ctx if for any reason the stored
        // one isn't present (defensive; shouldn't occur in normal flow).
        const simCtx = data.simCtx || {
            Sx, Sy, Ex, Ey, dxSE, dySE, uxBase, uyBase,
            vCruise, vCruise2,
            masses, earthRadius,
            dt, maxSteps, maxTime,
            thrustForce, fuelBurnRate, initialFuel, dryMass,
            initShip: { x: Sx, y: Sy, vx: 0, vy: 0 }
        };

        // Adaptive pre-roll correction: if the sweep has overshot the
        // T_plan_est projection captured at sweep-start, advance
        // simCtx.masses in-place so candidates evaluated this frame are
        // scored against a projection that hasn't already been passed by
        // the real world. Without this, an underestimated T_plan_est
        // leaves every candidate scored against a stale pre-roll, and
        // the plan installed at hand-off systematically diverges from
        // the real trajectory.
        //
        // We advance from the previously projected wall time to "now"
        // rather than to the true (unknown) hand-off wall time, then
        // re-anchor _simCtxProjectedWallMs to now. Effectively simCtx
        // asymptotes to live star state when planning drags on. The
        // hand-off mini-sweep does the final live-state refinement.
        if (simCtx.masses && this._simCtxProjectedWallMs != null) {
            const nowMs = (typeof performance !== 'undefined' && performance.now)
                ? performance.now()
                : Date.now();
            if (nowMs > this._simCtxProjectedWallMs) {
                const advanceSec = (nowMs - this._simCtxProjectedWallMs) / 1000;
                if (advanceSec > 0) {
                    const N = simCtx.masses.length;
                    const sX = new Array(N), sY = new Array(N);
                    const sVX = new Array(N), sVY = new Array(N);
                    for (let i = 0; i < N; i++) {
                        sX[i] = simCtx.masses[i].x0;
                        sY[i] = simCtx.masses[i].y0;
                        sVX[i] = simCtx.masses[i].vx;
                        sVY[i] = simCtx.masses[i].vy;
                    }
                    this._preRollStarsInPlace(
                        simCtx.masses, sX, sY, sVX, sVY, advanceSec, dt
                    );
                    for (let i = 0; i < N; i++) {
                        simCtx.masses[i].x0 = sX[i];
                        simCtx.masses[i].y0 = sY[i];
                        simCtx.masses[i].vx = sVX[i];
                        simCtx.masses[i].vy = sVY[i];
                    }
                    this._simCtxProjectedWallMs = nowMs;
                }
            }
        }

        const simulateForAngle = (angleOffset) =>
            this._simulateShipTrajectoryNBody(angleOffset, simCtx);

        // Convergence tolerance: 10% of Earth's radius, measured as
        // Euclidean distance from the trajectory's S->E baseline crossing
        // to Earth's center. This is the "small circle around Earth" the
        // final chosen crossing should fall inside.
        const circleTol = 0.1 * this.slingshotSweepData.earthRadius;

        // Star-clip validity filter used during the fine sweep. Same 5%

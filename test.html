<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Race - Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            color: white;
        }
        #game-container {
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.5);
        }
        #error-log {
            color: red;
            margin-top: 20px;
            padding: 10px;
            background: #222;
            max-width: 800px;
            max-height: 200px;
            overflow-y: auto;
        }
        #status {
            color: lime;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="status">Loading game...</div>
    <div id="game-container"></div>
    <div id="error-log"></div>
    
    <script>
        // Error logging
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            const errorLog = document.getElementById('error-log');
            errorLog.innerHTML += `<p><strong>Error:</strong> ${msg}<br>Line: ${lineNo}, Column: ${columnNo}<br>${error ? error.stack : ''}</p>`;
            return false;
        };
        
        console.log('Starting to load Phaser...');
        document.getElementById('status').textContent = 'Loading Phaser library...';
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js" 
            onload="console.log('Phaser loaded'); document.getElementById('status').textContent = 'Phaser loaded, loading game...';"
            onerror="console.error('Failed to load Phaser'); document.getElementById('status').textContent = 'ERROR: Failed to load Phaser';">
    </script>
    <script src="src/GameScene.js" 
            onload="console.log('GameScene loaded');"
            onerror="console.error('Failed to load GameScene'); document.getElementById('status').textContent = 'ERROR: Failed to load GameScene.js';">
    </script>
    <script src="src/main.js" 
            onload="console.log('main.js loaded'); document.getElementById('status').textContent = 'Game started!';"
            onerror="console.error('Failed to load main.js'); document.getElementById('status').textContent = 'ERROR: Failed to load main.js';">
    </script>
</body>
</html>

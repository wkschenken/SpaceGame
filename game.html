<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Race - Relativistic Journey</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
        }
        #game-container {
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.5);
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script>
class GameScene extends Phaser.Scene {
    constructor() {
        super({ key: 'GameScene' });
    }

    preload() {
        const graphics = this.make.graphics({ x: 0, y: 0, add: false });
        graphics.fillStyle(0xffffff, 1);
        graphics.fillCircle(4, 4, 4);
        graphics.generateTexture('particle', 8, 8);
        graphics.destroy();
    }

    create() {
        this.screenWidth = this.cameras.main.width;
        this.screenHeight = this.cameras.main.height;
        
        this.worldSize = Math.sqrt(this.screenWidth * this.screenHeight / 0.05);
        this.worldSize = Math.round(this.worldSize);

        this.physics.world.setBounds(0, 0, this.worldSize, this.worldSize);

        this.shipTime = 0;
        this.earthTime = 0;
        this.fuel = 100;
        this.ammo = 50;
        this.maxFuel = 100;
        this.maxAmmo = 50;
        this.gameWon = false;
        this.gameLost = false;

        this.createStarfield();
        this.createPlayer();
        this.createEarth();
        this.createAsteroids();
        this.createGravityObjects();
        this.createPickups();
        this.setupCamera();
        this.createUI();
        this.createRadar();
        this.setupControls();
        this.setupCollisions();

        this.bullets = this.physics.add.group();
    }

    createStarfield() {
        this.starfield = this.add.graphics();
        this.starfield.setScrollFactor(0);
        this.stars = [];
        for (let i = 0; i < 300; i++) {
            this.stars.push({
                x: Phaser.Math.Between(0, this.screenWidth),
                y: Phaser.Math.Between(0, this.screenHeight),
                radius: Phaser.Math.FloatBetween(0.5, 2),
                alpha: Phaser.Math.FloatBetween(0.3, 1)
            });
        }
    }

    createPlayer() {
        const startX = Phaser.Math.Between(this.worldSize * 0.1, this.worldSize * 0.3);
        const startY = Phaser.Math.Between(this.worldSize * 0.3, this.worldSize * 0.7);
        
        this.player = this.add.graphics();
        this.player.x = startX;
        this.player.y = startY;
        
        this.physics.add.existing(this.player);
        this.player.body.setCircle(15);
        this.player.body.setDamping(true);
        this.player.body.setDrag(0.98);
        this.player.body.setMaxVelocity(400);
        this.player.body.setCollideWorldBounds(true);
        
        this.playerRotation = 0;
        
        this.thrustParticles = this.add.particles(0, 0, 'particle');
        this.thrustEmitter = this.thrustParticles.createEmitter({
            speed: { min: 50, max: 100 },
            scale: { start: 0.6, end: 0 },
            alpha: { start: 0.8, end: 0 },
            lifespan: 300,
            blendMode: 'ADD',
            frequency: 20,
            quantity: 2,
            on: false
        });
    }

    createEarth() {
        const minDist = this.worldSize * 0.8;
        let earthX, earthY, dist;
        
        do {
            earthX = Phaser.Math.Between(this.worldSize * 0.6, this.worldSize * 0.9);
            earthY = Phaser.Math.Between(this.worldSize * 0.3, this.worldSize * 0.7);
            dist = Phaser.Math.Distance.Between(this.player.x, this.player.y, earthX, earthY);
        } while (dist < minDist);
        
        this.earthContainer = this.add.container(earthX, earthY);
        
        const earthGlow = this.add.circle(0, 0, 55, 0x0088ff, 0.15);
        const earthOuter = this.add.circle(0, 0, 45, 0x0077be);
        const earthCore = this.add.circle(0, 0, 40, 0x0099dd);
        
        const cloudGraphics = this.add.graphics();
        cloudGraphics.fillStyle(0xffffff, 0.3);
        for (let i = 0; i < 8; i++) {
            const angle = (i / 8) * Math.PI * 2;
            const radius = 35;
            const x = Math.cos(angle) * radius * 0.8;
            const y = Math.sin(angle) * radius * 0.5;
            cloudGraphics.fillCircle(x, y, 10);
        }
        
        this.earthContainer.add([earthGlow, earthOuter, earthCore, cloudGraphics]);
        
        this.physics.add.existing(this.earthContainer);
        this.earthContainer.body.setCircle(45);
        this.earthContainer.body.setImmovable(true);
        
        this.earth = this.earthContainer;
    }

    createAsteroids() {
        this.asteroids = this.physics.add.group();
        
        for (let i = 0; i < 50; i++) {
            const x = Phaser.Math.Between(0, this.worldSize);
            const y = Phaser.Math.Between(0, this.worldSize);
            
            if (Phaser.Math.Distance.Between(x, y, this.player.x, this.player.y) < 300) {
                continue;
            }
            if (Phaser.Math.Distance.Between(x, y, this.earth.x, this.earth.y) < 200) {
                continue;
            }
            
            const size = Phaser.Math.Between(8, 18);
            const asteroid = this.add.graphics();
            asteroid.x = x;
            asteroid.y = y;
            
            asteroid.fillStyle(0x8b7355, 1);
            const points = Phaser.Math.Between(6, 10);
            asteroid.beginPath();
            for (let j = 0; j < points; j++) {
                const angle = (j / points) * Math.PI * 2;
                const radius = size * Phaser.Math.FloatBetween(0.8, 1.2);
                const px = Math.cos(angle) * radius;
                const py = Math.sin(angle) * radius;
                if (j === 0) {
                    asteroid.moveTo(px, py);
                } else {
                    asteroid.lineTo(px, py);
                }
            }
            asteroid.closePath();
            asteroid.fillPath();
            
            asteroid.fillStyle(0x6b5335, 1);
            for (let j = 0; j < 3; j++) {
                const cx = Phaser.Math.Between(-size/2, size/2);
                const cy = Phaser.Math.Between(-size/2, size/2);
                asteroid.fillCircle(cx, cy, size * 0.2);
            }
            
            this.physics.add.existing(asteroid);
            asteroid.body.setCircle(size);
            asteroid.setData('size', size);
            
            const vx = Phaser.Math.Between(-30, 30);
            const vy = Phaser.Math.Between(-30, 30);
            asteroid.body.setVelocity(vx, vy);
            asteroid.body.setBounce(1, 1);
            asteroid.body.setCollideWorldBounds(true);
            
            this.asteroids.add(asteroid);
        }
    }

    createGravityObjects() {
        this.gravityObjects = [];

        for (let i = 0; i < 8; i++) {
            const x = Phaser.Math.Between(this.worldSize * 0.2, this.worldSize * 0.8);
            const y = Phaser.Math.Between(this.worldSize * 0.2, this.worldSize * 0.8);
            
            if (Phaser.Math.Distance.Between(x, y, this.player.x, this.player.y) < 400) {
                continue;
            }
            if (Phaser.Math.Distance.Between(x, y, this.earth.x, this.earth.y) < 400) {
                continue;
            }
            
            const isStar = Math.random() > 0.4;
            const radius = isStar ? 50 : 35;
            const mass = isStar ? 100000 : 250000;
            const gravityStrength = isStar ? 80000 : 200000;
            const schwarzschildRadius = isStar ? radius * 2 : radius * 4;
            const timeDilationFactor = isStar ? 0.5 : 0.8;
            
            const container = this.add.container(x, y);
            
            if (isStar) {
                const outerGlow = this.add.circle(0, 0, radius * 2.5, 0xffff00, 0.05);
                const midGlow = this.add.circle(0, 0, radius * 1.8, 0xffff00, 0.15);
                const innerGlow = this.add.circle(0, 0, radius * 1.3, 0xffdd00, 0.4);
                const core = this.add.circle(0, 0, radius, 0xffff00);
                const brightCore = this.add.circle(0, 0, radius * 0.6, 0xffffff, 0.8);
                
                container.add([outerGlow, midGlow, innerGlow, core, brightCore]);
            } else {
                const eventHorizon = this.add.circle(0, 0, radius, 0x000000);
                const accretionDisk = this.add.ellipse(0, 0, radius * 3, radius * 1.2, 0x8800ff, 0.4);
                const innerDisk = this.add.ellipse(0, 0, radius * 2, radius * 0.8, 0xaa00ff, 0.6);
                const darkGlow = this.add.circle(0, 0, radius * 2, 0x4a0080, 0.2);
                
                container.add([darkGlow, accretionDisk, innerDisk, eventHorizon]);
            }
            
            this.physics.add.existing(container);
            container.body.setCircle(radius);
            container.body.setImmovable(true);
            
            container.setData('gravityStrength', gravityStrength);
            container.setData('timeDilationFactor', timeDilationFactor);
            container.setData('isStar', isStar);
            container.setData('radius', radius);
            container.setData('mass', mass);
            container.setData('schwarzschildRadius', schwarzschildRadius);
            
            this.gravityObjects.push(container);
        }
    }

    createPickups() {
        this.fuelPickups = this.physics.add.group();
        this.ammoPickups = this.physics.add.group();

        for (let i = 0; i < 15; i++) {
            const x = Phaser.Math.Between(100, this.worldSize - 100);
            const y = Phaser.Math.Between(100, this.worldSize - 100);
            
            const fuel = this.add.star(x, y, 5, 10, 15, 0x00ff00);
            fuel.setStrokeStyle(2, 0x00aa00);
            this.physics.add.existing(fuel);
            fuel.body.setCircle(15);
            this.fuelPickups.add(fuel);
        }

        for (let i = 0; i < 15; i++) {
            const x = Phaser.Math.Between(100, this.worldSize - 100);
            const y = Phaser.Math.Between(100, this.worldSize - 100);
            
            const ammo = this.add.star(x, y, 5, 10, 15, 0xff6600);
            ammo.setStrokeStyle(2, 0xcc4400);
            this.physics.add.existing(ammo);
            ammo.body.setCircle(15);
            this.ammoPickups.add(ammo);
        }
    }

    setupCamera() {
        this.cameras.main.startFollow(this.player, true, 0.1, 0.1);
        this.cameras.main.setBounds(0, 0, this.worldSize, this.worldSize);
    }

    createUI() {
        this.uiText = this.add.text(10, 10, '', {
            fontSize: '16px',
            fill: '#00ff00',
            fontFamily: 'Courier New',
            backgroundColor: '#000000aa',
            padding: { x: 10, y: 5 }
        });
        this.uiText.setScrollFactor(0);
        this.uiText.setDepth(1000);

        this.instructionsText = this.add.text(this.screenWidth / 2, 10, 
            'Arrow Keys: Move | Space: Shoot | Reach Earth!', {
            fontSize: '16px',
            fill: '#ffffff',
            fontFamily: 'Courier New',
            backgroundColor: '#000000aa',
            padding: { x: 10, y: 5 }
        });
        this.instructionsText.setOrigin(0.5, 0);
        this.instructionsText.setScrollFactor(0);
        this.instructionsText.setDepth(1000);
    }

    createRadar() {
        const radarSize = 150;
        const radarX = this.screenWidth - radarSize - 10;
        const radarY = this.screenHeight - radarSize - 10;
        
        this.radarGraphics = this.add.graphics();
        this.radarGraphics.setScrollFactor(0);
        this.radarGraphics.setDepth(1000);
        
        this.radarX = radarX;
        this.radarY = radarY;
        this.radarSize = radarSize;
        this.radarRange = Math.max(this.screenWidth, this.screenHeight) * 2;
    }

    setupControls() {
        this.cursors = this.input.keyboard.createCursorKeys();
        this.spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
    }

    setupCollisions() {
        this.physics.add.overlap(this.player, this.earth, this.reachEarth, null, this);
        this.physics.add.collider(this.player, this.asteroids, this.hitAsteroid, null, this);
        this.physics.add.overlap(this.player, this.fuelPickups, this.collectFuel, null, this);
        this.physics.add.overlap(this.player, this.ammoPickups, this.collectAmmo, null, this);
    }

    update(time, delta) {
        if (this.gameWon || this.gameLost) {
            return;
        }

        this.drawStarfield();
        this.drawPlayer();
        this.handleInput(delta);
        this.applyGravity(delta);
        this.updateTime(delta);
        this.updateUI();
        this.updateRadar();
        this.checkBulletCollisions();
        this.updateBullets();
    }

    drawStarfield() {
        this.starfield.clear();
        this.stars.forEach(star => {
            this.starfield.fillStyle(0xffffff, star.alpha);
            this.starfield.fillCircle(star.x, star.y, star.radius);
        });
    }

    drawPlayer() {
        this.player.clear();
        
        this.player.fillStyle(0x00ffff, 1);
        this.player.beginPath();
        this.player.moveTo(15, 0);
        this.player.lineTo(-10, -8);
        this.player.lineTo(-10, 8);
        this.player.closePath();
        this.player.fillPath();
        
        this.player.fillStyle(0x0088aa, 1);
        this.player.fillTriangle(-10, -5, -10, 5, -5, 0);
        
        this.player.lineStyle(2, 0x00ffff, 1);
        this.player.strokeTriangle(15, 0, -10, -8, -10, 8);
        
        this.player.rotation = this.playerRotation;
    }

    handleInput(delta) {
        const rotationSpeed = 0.003 * delta;
        const acceleration = 0.3;

        if (this.cursors.left.isDown) {
            this.playerRotation -= rotationSpeed;
        }
        if (this.cursors.right.isDown) {
            this.playerRotation += rotationSpeed;
        }

        if (this.cursors.up.isDown && this.fuel > 0) {
            const thrustX = Math.cos(this.playerRotation) * acceleration;
            const thrustY = Math.sin(this.playerRotation) * acceleration;
            this.player.body.setAcceleration(thrustX * 1000, thrustY * 1000);
            this.fuel -= 0.02;
            
            const exhaustX = this.player.x - Math.cos(this.playerRotation) * 12;
            const exhaustY = this.player.y - Math.sin(this.playerRotation) * 12;
            this.thrustParticles.setPosition(exhaustX, exhaustY);
            this.thrustEmitter.setSpeed({
                min: 50 - Math.cos(this.playerRotation) * 50,
                max: 100 - Math.cos(this.playerRotation) * 50
            });
            this.thrustEmitter.setAngle({
                min: Phaser.Math.RadToDeg(this.playerRotation) + 170,
                max: Phaser.Math.RadToDeg(this.playerRotation) + 190
            });
            if (!this.thrustEmitter.on) {
                this.thrustEmitter.start();
            }
        } else {
            this.player.body.setAcceleration(0, 0);
            if (this.thrustEmitter.on) {
                this.thrustEmitter.stop();
            }
        }

        if (Phaser.Input.Keyboard.JustDown(this.spaceKey)) {
            this.shoot();
        }
    }

    shoot() {
        if (this.ammo <= 0) return;

        const spawnX = this.player.x + Math.cos(this.playerRotation) * 20;
        const spawnY = this.player.y + Math.sin(this.playerRotation) * 20;
        
        const bullet = this.add.circle(spawnX, spawnY, 5, 0xff3300);
        bullet.setStrokeStyle(2, 0xff6600);
        
        this.physics.add.existing(bullet);
        bullet.body.setCircle(5);
        bullet.body.setCollideWorldBounds(false);
        
        const bulletSpeed = 600;
        const bulletVelX = Math.cos(this.playerRotation) * bulletSpeed + this.player.body.velocity.x;
        const bulletVelY = Math.sin(this.playerRotation) * bulletSpeed + this.player.body.velocity.y;
        
        bullet.body.setVelocity(bulletVelX, bulletVelY);
        
        this.bullets.add(bullet);
        this.ammo -= 1;

        this.time.delayedCall(4000, () => {
            if (bullet && bullet.active) {
                bullet.destroy();
            }
        });
    }

    applyGravity(delta) {
        this.gravityObjects.forEach(obj => {
            const dx = obj.x - this.player.x;
            const dy = obj.y - this.player.y;
            const distSq = dx * dx + dy * dy;
            const dist = Math.sqrt(distSq);
            
            if (dist > 1) {
                const radius = obj.getData('radius');
                const schwarzschildRadius = obj.getData('schwarzschildRadius');
                const gravityStrength = obj.getData('gravityStrength');
                
                const effectiveRadius = Math.max(dist, radius);
                const gravityFalloff = gravityStrength / (effectiveRadius * effectiveRadius);
                
                let force = gravityFalloff;
                
                if (dist < schwarzschildRadius) {
                    const proximityFactor = 1 - (dist / schwarzschildRadius);
                    force *= (1 + proximityFactor * 5);
                }
                
                const forceX = (dx / dist) * force;
                const forceY = (dy / dist) * force;
                
                this.player.body.velocity.x += forceX * (delta / 1000);
                this.player.body.velocity.y += forceY * (delta / 1000);
                
                const speed = Math.sqrt(
                    this.player.body.velocity.x ** 2 + 
                    this.player.body.velocity.y ** 2
                );
                const perpX = -dy / dist;
                const perpY = dx / dist;
                const tangentialVel = this.player.body.velocity.x * perpX + this.player.body.velocity.y * perpY;
                
                if (dist < schwarzschildRadius * 1.5 && Math.abs(tangentialVel) > 50) {
                    const frameDragging = (gravityStrength / (dist * dist)) * 0.00015;
                    this.player.body.velocity.x += perpX * frameDragging * (delta / 1000) * 100;
                    this.player.body.velocity.y += perpY * frameDragging * (delta / 1000) * 100;
                }
            }
        });
    }

    updateTime(delta) {
        let gravitationalPotential = 0;
        
        this.gravityObjects.forEach(obj => {
            const dx = obj.x - this.player.x;
            const dy = obj.y - this.player.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const mass = obj.getData('mass');
            const schwarzschildRadius = obj.getData('schwarzschildRadius');
            
            const potential = mass / Math.max(dist, schwarzschildRadius * 0.5);
            gravitationalPotential += potential;
        });
        
        const gravitationalDilation = 1 / Math.sqrt(1 + gravitationalPotential / 50000);
        
        const speed = Math.sqrt(
            this.player.body.velocity.x ** 2 + 
            this.player.body.velocity.y ** 2
        );
        const maxSpeed = 400;
        const c = 500;
        const velocityDilation = Math.sqrt(1 - (speed / c) ** 2);
        
        const timeDilationEffect = gravitationalDilation * velocityDilation;
        const clampedDilation = Math.max(0.05, Math.min(1.0, timeDilationEffect));

        this.shipTime += (delta / 1000) * clampedDilation;
        this.earthTime += delta / 1000;
    }

    updateUI() {
        const distToEarth = Phaser.Math.Distance.Between(
            this.player.x, this.player.y,
            this.earth.x, this.earth.y
        );

        this.uiText.setText([
            `Fuel: ${this.fuel.toFixed(1)}`,
            `Ammo: ${this.ammo}`,
            `Ship Time: ${this.shipTime.toFixed(1)}s`,
            `Earth Time: ${this.earthTime.toFixed(1)}s`,
            `Distance: ${distToEarth.toFixed(0)}`
        ]);
    }

    updateRadar() {
        this.radarGraphics.clear();
        
        this.radarGraphics.fillStyle(0x000000, 0.7);
        this.radarGraphics.fillRoundedRect(
            this.radarX - 5, 
            this.radarY - 5, 
            this.radarSize + 10, 
            this.radarSize + 10, 
            5
        );
        
        this.radarGraphics.lineStyle(2, 0x00ff00, 0.8);
        this.radarGraphics.strokeCircle(
            this.radarX + this.radarSize / 2,
            this.radarY + this.radarSize / 2,
            this.radarSize / 2 - 5
        );
        
        this.radarGraphics.lineStyle(1, 0x00ff00, 0.3);
        for (let i = 0; i < 4; i++) {
            const angle = (i / 4) * Math.PI * 2;
            const cx = this.radarX + this.radarSize / 2;
            const cy = this.radarY + this.radarSize / 2;
            const r = this.radarSize / 2 - 5;
            this.radarGraphics.lineBetween(
                cx, cy,
                cx + Math.cos(angle) * r,
                cy + Math.sin(angle) * r
            );
        }
        
        const centerX = this.radarX + this.radarSize / 2;
        const centerY = this.radarY + this.radarSize / 2;
        
        this.radarGraphics.fillStyle(0x00ffff, 1);
        this.radarGraphics.fillCircle(centerX, centerY, 3);
        
        const angleToEarth = Math.atan2(
            this.earth.y - this.player.y,
            this.earth.x - this.player.x
        );
        const quantizedAngle = Math.round(angleToEarth / (Math.PI / 18)) * (Math.PI / 18);
        
        const distToEarth = Phaser.Math.Distance.Between(
            this.player.x, this.player.y,
            this.earth.x, this.earth.y
        );
        const radarDist = Math.min((distToEarth / this.radarRange) * (this.radarSize / 2 - 10), this.radarSize / 2 - 10);
        
        const earthRadarX = centerX + Math.cos(quantizedAngle) * radarDist;
        const earthRadarY = centerY + Math.sin(quantizedAngle) * radarDist;
        
        this.radarGraphics.lineStyle(3, 0x00aaff, 0.6);
        this.radarGraphics.lineBetween(
            centerX,
            centerY,
            centerX + Math.cos(quantizedAngle) * (this.radarSize / 2 - 5),
            centerY + Math.sin(quantizedAngle) * (this.radarSize / 2 - 5)
        );
        
        this.radarGraphics.fillStyle(0x0099dd, 1);
        this.radarGraphics.fillCircle(earthRadarX, earthRadarY, 5);
        this.radarGraphics.lineStyle(2, 0x00aaff, 0.8);
        this.radarGraphics.strokeCircle(earthRadarX, earthRadarY, 5);
        
        this.asteroids.children.entries.forEach(asteroid => {
            if (!asteroid.active) return;
            
            const dist = Phaser.Math.Distance.Between(
                this.player.x, this.player.y,
                asteroid.x, asteroid.y
            );
            
            if (dist < this.radarRange) {
                const angle = Math.atan2(
                    asteroid.y - this.player.y,
                    asteroid.x - this.player.x
                );
                const radarDist = (dist / this.radarRange) * (this.radarSize / 2 - 10);
                const rx = centerX + Math.cos(angle) * radarDist;
                const ry = centerY + Math.sin(angle) * radarDist;
                
                this.radarGraphics.fillStyle(0x8b7355, 0.8);
                this.radarGraphics.fillCircle(rx, ry, 2);
            }
        });
        
        this.gravityObjects.forEach(obj => {
            const dist = Phaser.Math.Distance.Between(
                this.player.x, this.player.y,
                obj.x, obj.y
            );
            
            if (dist < this.radarRange) {
                const angle = Math.atan2(
                    obj.y - this.player.y,
                    obj.x - this.player.x
                );
                const radarDist = (dist / this.radarRange) * (this.radarSize / 2 - 10);
                const rx = centerX + Math.cos(angle) * radarDist;
                const ry = centerY + Math.sin(angle) * radarDist;
                
                const isStar = obj.getData('isStar');
                const color = isStar ? 0xffff00 : 0x8800ff;
                this.radarGraphics.fillStyle(color, 0.9);
                this.radarGraphics.fillCircle(rx, ry, 4);
            }
        });
    }

    checkBulletCollisions() {
        this.bullets.children.entries.forEach(bullet => {
            if (!bullet || !bullet.active) return;

            this.asteroids.children.entries.forEach(asteroid => {
                if (!asteroid || !asteroid.active) return;

                const dist = Phaser.Math.Distance.Between(
                    bullet.x, bullet.y,
                    asteroid.x, asteroid.y
                );

                if (dist < asteroid.getData('size') + 5) {
                    bullet.destroy();
                    asteroid.destroy();
                }
            });
        });
    }

    updateBullets() {
        this.bullets.children.entries.forEach(bullet => {
            if (!bullet || !bullet.active) return;
            
            if (bullet.x < 0 || bullet.x > this.worldSize || 
                bullet.y < 0 || bullet.y > this.worldSize) {
                bullet.destroy();
            }
        });
    }

    collectFuel(player, fuel) {
        fuel.destroy();
        this.fuel = Math.min(this.fuel + 30, this.maxFuel);
    }

    collectAmmo(player, ammo) {
        ammo.destroy();
        this.ammo = Math.min(this.ammo + 20, this.maxAmmo);
    }

    hitAsteroid(player, asteroid) {
        if (this.gameLost) return;
        
        this.gameLost = true;
        this.player.body.setVelocity(0, 0);
        
        const message = this.add.text(this.screenWidth / 2, this.screenHeight / 2, 
            'COLLISION!\\nPress R to Restart', {
            fontSize: '48px',
            fill: '#ff0000',
            fontFamily: 'Courier New',
            align: 'center',
            backgroundColor: '#000000cc',
            padding: { x: 20, y: 10 }
        });
        message.setOrigin(0.5);
        message.setScrollFactor(0);
        message.setDepth(2000);

        const restartKey = this.input.keyboard.addKey('R');
        restartKey.once('down', () => {
            restartKey.destroy();
            this.scene.restart();
        });
    }

    reachEarth() {
        if (this.gameWon) return;
        
        this.gameWon = true;
        this.player.body.setVelocity(0, 0);
        
        const timeDiff = this.earthTime - this.shipTime;
        
        const message = this.add.text(this.screenWidth / 2, this.screenHeight / 2, 
            `EARTH REACHED!\\n\\nEarth Time: ${this.earthTime.toFixed(1)}s\\nShip Time: ${this.shipTime.toFixed(1)}s\\nTime Dilation: ${timeDiff.toFixed(1)}s\\n\\nPress R to Restart`, {
            fontSize: '32px',
            fill: '#00ff00',
            fontFamily: 'Courier New',
            align: 'center',
            backgroundColor: '#000000cc',
            padding: { x: 20, y: 10 }
        });
        message.setOrigin(0.5);
        message.setScrollFactor(0);
        message.setDepth(2000);

        const restartKey = this.input.keyboard.addKey('R');
        restartKey.once('down', () => {
            restartKey.destroy();
            this.scene.restart();
        });
    }

    shutdown() {
        if (this.thrustParticles) {
            this.thrustParticles.destroy();
        }
        if (this.bullets) {
            this.bullets.clear(true, true);
        }
        if (this.asteroids) {
            this.asteroids.clear(true, true);
        }
        if (this.fuelPickups) {
            this.fuelPickups.clear(true, true);
        }
        if (this.ammoPickups) {
            this.ammoPickups.clear(true, true);
        }
        this.input.keyboard.removeAllKeys();
    }
}

const config = {
    type: Phaser.AUTO,
    width: 1200,
    height: 800,
    parent: 'game-container',
    backgroundColor: '#000814',
    physics: {
        default: 'arcade',
        arcade: {
            gravity: { y: 0 },
            debug: false
        }
    },
    scene: [GameScene]
};

const game = new Phaser.Game(config);
    </script>
